<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>HQL — جدول رده‌بندی عمومی</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/jalaali-js/dist/jalaali.min.js"></script>

  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --line: #e2e8f0;
      --primary: #2563eb;
      --purple: #7c3aed;
      --gold: #f59e0b;
      --silver: #64748b;
      --bronze: #d97706;
      --shadow: 0 10px 30px rgba(15,23,42,.06);
      --radius: 16px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: linear-gradient(135deg, #f8fafc, #eef4ff);
      color: var(--text);
      font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, Tahoma, sans-serif;
      min-height: 100vh;
      padding: 16px 12px 40px;
    }

    .app { max-width: 950px; margin: auto; }
    
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding: 12px 18px;
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(10px);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    
    .brand { display: flex; align-items: center; gap: 12px; }
    .logo {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--primary), var(--purple));
      color: #fff;
      font-size: 22px;
      flex-shrink: 0;
    }
    .brand h1 { font-size: 18px; margin: 0; font-weight: 800; }
    
    .btn-back {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      padding: 8px 16px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 13px;
      text-decoration: none;
      flex-shrink: 0;
    }

    .card {
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
    }

    .header-box { text-align: center; margin-bottom: 20px; }
    .header-box h2 { font-size: 20px; font-weight: 800; margin: 0 0 6px; }
    .header-box p { color: var(--muted); font-size: 13px; margin: 0; }

    .month-badge {
      display: inline-block;
      background: #dbeafe;
      color: #1e40af;
      padding: 4px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      margin-top: 8px;
    }

    /* Podium Cards for Top 3 Fixes */
    .podium {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 24px;
      align-items: stretch;
    }
    .podium-card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px 10px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 130px;
    }
    .podium-card.first { border-color: #fde68a; background: linear-gradient(180deg, #fffdf2, #fff); }
    .podium-card.second { border-color: #e2e8f0; }
    .podium-card.third { border-color: #fed7aa; background: linear-gradient(180deg, #fffaf2, #fff); }
    
    .podium-badge {
      font-size: 24px;
      line-height: 1;
      margin-bottom: 6px;
    }

    .podium-name {
      font-weight: 700;
      font-size: 13px;
      margin-bottom: 4px;
      width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--text);
    }
    .podium-val { font-weight: 800; color: var(--primary); font-size: 15px; line-height: 1.2; }
    .podium-sub { color: var(--muted); font-size: 11px; margin-top: 2px; }

    /* Table Styles */
    table { width: 100%; border-collapse: collapse; white-space: nowrap; }
    th, td { text-align: right; padding: 12px; border-bottom: 1px solid var(--line); font-size: 13px; }
    th { color: var(--muted); font-weight: 600; background: #fafafa; }
    .scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 12px; border: 1px solid var(--line); }

    .rank {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 12px;
      background: #f1f5f9;
      color: var(--muted);
    }
    .user-name { font-weight: 700; color: var(--text); }
    .calories-val { font-weight: 800; color: var(--primary); }

    .empty, .loading { text-align: center; padding: 30px; color: var(--muted); font-weight: 500; }
    .hidden { display: none !important; }
    .footer { text-align: center; color: var(--muted); font-size: 12px; padding: 20px 0 10px; }
    
    @media(max-width: 600px) {
      .podium { grid-template-columns: 1fr; }
      .podium-card { min-height: auto; padding: 12px; }
    }
  </style>
</head>
<body>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="logo">🏆</div>
      <div><h1>جدول رده‌بندی عمومی</h1></div>
    </div>
    <a href="" class="btn-back">بازگشت به خانه</a>
  </header>

  <main class="card">
    <div class="header-box">
      <h2>رتبه‌بندی کالری‌سوزی کاربران</h2>
      <p>محاسبه شده بر اساس مجموع کالری دویده شده از ابتدای ماه جاری</p>
      <div id="monthBadge" class="month-badge">در حال محاسبه...</div>
    </div>

    <!-- Top 3 Podium Container -->
    <div id="podiumWrapper" class="podium hidden"></div>

    <div id="loading" class="loading">در حال دریافت و پردازش اطلاعات...</div>

    <div id="leaderboardWrapper" class="scroll hidden">
      <table>
        <thead>
          <tr>
            <th style="width: 50px; text-align: center;">رتبه</th>
            <th>کاربر</th>
            <th>کالری سوزانده‌شده (ماه)</th>
            <th>مسافت دویده شده</th>
            <th>روزهای ثبت‌شده</th>
          </tr>
        </thead>
        <tbody id="leaderboardBody"></tbody>
      </table>
    </div>
  </main>

  <footer class="footer">HQL Public Leaderboard • v2.2.1</footer>
</div>
<script>
const SUPABASE_URL = "https://igvhuwxqljtxtpikebcq.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_rwuDqMKTGOmUXpZZTWDcFg_Pmvrr67v";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const PERSIAN_MONTHS = ["فروردین", "اردیبهشت", "خرداد", "تیر", "مرداد", "شهریور", "مهر", "آبان", "آذر", "دی", "بهمن", "اسفند"];
const fmt = (n, d=0) => Number(n||0).toLocaleString("fa-IR", {maximumFractionDigits: d});

function getJalaliMonthStartISO() {
  const now = new Date();
  const jNow = jalaali.toJalaali(now.getFullYear(), now.getMonth() + 1, now.getDate());
  document.getElementById("monthBadge").textContent = `ماه جاری: ${PERSIAN_MONTHS[jNow.jm - 1]} ${jNow.jy}`;
  const gStart = jalaali.toGregorian(jNow.jy, jNow.jm, 1);
  return `${gStart.gy}-${String(gStart.gm).padStart(2,'0')}-${String(gStart.gd).padStart(2,'0')}`;
}

async function loadLeaderboard() {
  const monthStartISO = getJalaliMonthStartISO();
  try {
    const { data, error } = await sb.rpc("get_monthly_leaderboard", { month_start_date: monthStartISO });
    if (error) throw error;
    
    const formattedData = (data || []).map(u => ({
      name: u.display_name || "کاربر بدون نام",
      calories: u.total_calories || 0,
      km: u.total_km || 0,
      days: u.days_count || 0
    }));
    
    renderLeaderboard(formattedData);
  } catch (err) {
    console.error(err);
    document.getElementById("loading").textContent = "خطا در بارگذاری اطلاعات عمومی.";
  }
}

function renderLeaderboard(users) {
  document.getElementById("loading").classList.add("hidden");
  const podWrap = document.getElementById("podiumWrapper");
  const boardWrap = document.getElementById("leaderboardWrapper");
  const tbody = document.getElementById("leaderboardBody");
  
  if (!users.length) {
    boardWrap.classList.remove("hidden");
    tbody.innerHTML = `<tr><td colspan="5" class="empty">هیچ داده‌ای برای این ماه ثبت نشده است.</td></tr>`;
    return;
  }

  // Render Podium for Top 3 Users
  if (users.length > 0) {
    podWrap.classList.remove("hidden");
    let podHtml = "";
    
    const topThree = users.slice(0, 3);
    const classes = ["first", "second", "third"];
    const badges = ["🥇", "🥈", "🥉"];

    topThree.forEach((u, idx) => {
      podHtml += `
        <div class="podium-card ${classes[idx]}">
          <div class="podium-badge">${badges[idx]}</div>
          <div class="podium-name">${u.name}</div>
          <div class="podium-val">${fmt(u.calories)} کالری</div>
          <div class="podium-sub">${fmt(u.km, 1)} کیلومتر</div>
        </div>
      `;
    });
    podWrap.innerHTML = podHtml;
  }

  // Render Full Table
  boardWrap.classList.remove("hidden");
  tbody.innerHTML = users.map((u, index) => {
    const rank = index + 1;
    return `
      <tr>
        <td style="text-align: center;"><span class="rank">${rank}</span></td>
        <td class="user-name">${u.name}</td>
        <td class="calories-val">${fmt(u.calories)} کالری</td>
        <td>${fmt(u.km, 2)} کیلومتر</td>
        <td>${fmt(u.days)} روز</td>
      </tr>
    `;
  }).join("");
}

document.addEventListener("DOMContentLoaded", loadLeaderboard);
</script>
</body>
</html>
