<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>HQL — جدول رده‌بندی عمومی</title>
  
  <!-- Persian Font: Vazirmatn -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/jalaali-js/dist/jalaali.min.js"></script>

  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --line: #e2e8f0;
      --primary: #2563eb;
      --purple: #7c3aed;
      --gold: #f59e0b;
      --silver: #64748b;
      --bronze: #d97706;
      --shadow: 0 10px 30px rgba(15,23,42,.06);
      --radius: 16px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: linear-gradient(135deg, #f8fafc, #eef4ff);
      color: var(--text);
      font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, Tahoma, sans-serif;
      min-height: 100vh;
      padding: 20px 12px 40px;
    }

    .app { max-width: 950px; margin: auto; }
    
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding: 12px 18px;
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(10px);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    
    .brand { display: flex; align-items: center; gap: 12px; }
    .logo {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--primary), var(--purple));
      color: #fff;
      font-size: 22px;
    }
    .brand h1 { font-size: 18px; margin: 0; font-weight: 800; }
    
    .btn-back {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      padding: 9px 18px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 13px;
      text-decoration: none;
      transition: all 0.2s;
    }
    .btn-back:hover { background: #f1f5f9; }

    .card {
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
    }

    .header-box { text-align: center; margin-bottom: 24px; }
    .header-box h2 { font-size: 22px; font-weight: 800; margin: 0 0 6px; }
    .header-box p { color: var(--muted); font-size: 13px; margin: 0; }

    .month-badge {
      display: inline-block;
      background: #dbeafe;
      color: #1e40af;
      padding: 5px 16px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      margin-top: 10px;
    }

    /* Podium Cards for Top 3 */
    .podium {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }
    .podium-card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px;
      text-align: center;
      position: relative;
    }
    .podium-card.first { border-color: #fde68a; background: linear-gradient(180deg, #fffdf5, #fff); }
    .podium-card.second { border-color: #e2e8f0; }
    .podium-card.third { border-color: #fed7aa; background: linear-gradient(180deg, #fffaf5, #fff); }
    
    .podium-badge {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 14px;
      margin: 0 auto 8px;
    }
    .first .podium-badge { background: #fef3c7; color: var(--gold); }
    .second .podium-badge { background: #f1f5f9; color: var(--silver); }
    .third .podium-badge { background: #ffedd5; color: var(--bronze); }

    .podium-name { font-weight: 700; font-size: 14px; margin-bottom: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .podium-val { font-weight: 800; color: var(--primary); font-size: 16px; }

    /* Table Styles */
    table { width: 100%; border-collapse: collapse; white-space: nowrap; }
    th, td { text-align: right; padding: 14px; border-bottom: 1px solid var(--line); font-size: 13px; }
    th { color: var(--muted); font-weight: 600; background: #fafafa; }
    .scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 12px; border: 1px solid var(--line); }

    .rank {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 12px;
      background: #f1f5f9;
      color: var(--muted);
    }
    .user-name { font-weight: 700; color: var(--text); }
    .calories-val { font-weight: 800; color: var(--primary); }

    .empty, .loading { text-align: center; padding: 40px; color: var(--muted); font-weight: 500; }
    .hidden { display: none !important; }
    .footer { text-align: center; color: var(--muted); font-size: 12px; padding: 25px 0 10px; }
    
    @media(max-width: 600px) {
      .podium { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="logo">🏆</div>
      <div><h1>جدول رده‌بندی عمومی</h1></div>
    </div>
    <a href="index.html" class="btn-back">بازگشت به برنامه</a>
  </header>

  <main class="card">
    <div class="header-box">
      <h2>رتبه‌بندی کالری‌سوزی کاربران</h2>
      <p>محاسبه شده بر اساس مجموع کالری دویده شده از ابتدای ماه جاری</p>
      <div id="monthBadge" class="month-badge">در حال محاسبه...</div>
    </div>

    <!-- Top 3 Podium Cards Container -->
    <div id="podiumWrapper" class="podium hidden"></div>

    <div id="loading" class="loading">در حال دریافت و پردازش اطلاعات کاربران...</div>

    <div id="leaderboardWrapper" class="scroll hidden">
      <table>
        <thead>
          <tr>
            <th style="width: 60px; text-align: center;">رتبه</th>
            <th>کاربر</th>
            <th>کالری سوزانده‌شده (ماه)</th>
            <th>مسافت دویده شده</th>
            <th>روزهای ثبت‌شده</th>
          </tr>
        </thead>
        <tbody id="leaderboardBody"></tbody>
      </table>
    </div>
  </main>

  <footer class="footer">HQL Public Leaderboard • v2.2.1</footer>
</div>
<script>
  /* =========================================================
     1) SUPABASE CONFIGURATION
  ========================================================= */
  const SUPABASE_URL = "https://igvhuwxqljtxtpikebcq.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_rwuDqMKTGOmUXpZZTWDcFg_Pmvrr67v";
  
  // استفاده از supabaseClient به جای supabase برای جلوگیری از Uncaught SyntaxError
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function getCurrentJalaliMonthInfo() {
    const now = new Date();
    const gYear = now.getFullYear();
    const gMonth = now.getMonth() + 1;
    const gDay = now.getDate();
    
    const jDate = jalaali.toJalaali(gYear, gMonth, gDay);
    const monthNames = [
      "فروردین", "اردیبهشت", "خرداد", "تیر", "مرداد", "شهریور",
      "مهر", "آبان", "آذر", "دی", "بهمن", "اسفند"
    ];
    
    return {
      year: jDate.jy,
      month: jDate.jm,
      monthName: monthNames[jDate.jm - 1]
    };
  }

  function toPersianDigits(n) {
    if (n === null || n === undefined) return '۰';
    const farsiDigits = ['۰', '۱', '۲', '۳', '۴', '۵', '۶', '۷', '۸', '۹'];
    return n.toString().replace(/\d/g, x => farsiDigits[x]);
  }

  async function loadLeaderboard() {
    const loadingEl = document.getElementById('loading');
    const monthBadgeEl = document.getElementById('monthBadge');
    const podiumEl = document.getElementById('podiumWrapper');
    const leaderboardWrapperEl = document.getElementById('leaderboardWrapper');
    const leaderboardBodyEl = document.getElementById('leaderboardBody');

    try {
      const currentMonth = getCurrentJalaliMonthInfo();
      monthBadgeEl.innerText = `کارکرد ماه ${currentMonth.monthName} ${toPersianDigits(currentMonth.year)}`;

      // دریافت پروفایل‌ها
      const { data: profiles, error: profErr } = await supabaseClient
        .from('profiles')
        .select('id, display_name');

      if (profErr) throw profErr;

      const profileMap = {};
      (profiles || []).forEach(p => {
        profileMap[p.id] = p.display_name || 'کاربر بدون نام';
      });

      // دریافت رکوردهای روزانه
      const { data: logs, error: logsErr } = await supabaseClient
        .from('daily_logs')
        .select('user_id, log_date, calories, km');

      if (logsErr) throw logsErr;

      if (!logs || logs.length === 0) {
        loadingEl.innerText = 'هنوز داده‌ای برای این ماه ثبت نشده است.';
        return;
      }

      // فیلتر کردن داده‌ها بر اساس ماه جاری شمسی
      const currentMonthLogs = logs.filter(item => {
        if (!item.log_date) return false;
        const d = new Date(item.log_date);
        const j = jalaali.toJalaali(d.getFullYear(), d.getMonth() + 1, d.getDate());
        return j.jy === currentMonth.year && j.jm === currentMonth.month;
      });

      if (currentMonthLogs.length === 0) {
        loadingEl.innerText = 'هنوز داده‌ای برای این ماه ثبت نشده است.';
        return;
      }

      // تجمیع آمار بر اساس کاربر
      const userStats = {};
      currentMonthLogs.forEach(item => {
        const userId = item.user_id;
        const userName = profileMap[userId] || 'کاربر ناشناس';
        
        if (!userStats[userId]) {
          userStats[userId] = { 
            name: userName, 
            totalCalories: 0, 
            totalDistance: 0, 
            loggedDays: 0 
          };
        }
        userStats[userId].totalCalories += Number(item.calories || 0);
        userStats[userId].totalDistance += Number(item.km || 0);
        userStats[userId].loggedDays += 1;
      });

      // مرتب‌سازی بر اساس مجموع کالری نزولی
      const sortedUsers = Object.values(userStats)
        .sort((a, b) => b.totalCalories - a.totalCalories);

      loadingEl.classList.add('hidden');

      // سکوی ۳ نفر برتر
      const top3 = sortedUsers.slice(0, 3);
      const ranks = ['first', 'second', 'third'];
      const rankLabels = ['🥇 مقام اول', '🥈 مقام دوم', '🥉 مقام سوم'];

      podiumEl.innerHTML = top3.map((u, i) => `
        <div class="podium-card ${ranks[i]}">
          <div class="podium-badge">${rankLabels[i]}</div>
          <div class="podium-name">${u.name}</div>
          <div class="podium-val">${toPersianDigits(Math.round(u.totalCalories).toLocaleString())} کالری</div>
        </div>
      `).join('');
      
      podiumEl.classList.remove('hidden');

      // جدول کامل رده‌بندی
      leaderboardBodyEl.innerHTML = sortedUsers.map((u, index) => `
        <tr>
          <td style="text-align: center;"><span class="rank">${toPersianDigits(index + 1)}</span></td>
          <td class="user-name">${u.name}</td>
          <td class="calories-val">${toPersianDigits(Math.round(u.totalCalories).toLocaleString())} kcal</td>
          <td>${toPersianDigits(u.totalDistance.toFixed(1))} کیلومتر</td>
          <td>${toPersianDigits(u.loggedDays)} روز</td>
        </tr>
      `).join('');

      leaderboardWrapperEl.classList.remove('hidden');

    } catch (err) {
      console.error('Leaderboard Fetch Error:', err);
      loadingEl.innerText = 'خطا در بارگیری اطلاعات. لطفاً کنسول را بررسی کنید.';
    }
  }

  document.addEventListener('DOMContentLoaded', loadLeaderboard);
</script>
</body>
</html>
