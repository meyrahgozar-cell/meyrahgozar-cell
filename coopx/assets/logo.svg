<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="تعاونی مسکن مپنا هوایی">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fd4fb"/>
      <stop offset=".55" stop-color="#5fc4e8"/>
      <stop offset="1" stop-color="#37d4c9"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1a2b"/>
      <stop offset="1" stop-color="#102a41"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="64" height="64" rx="17" fill="url(#bg)"/>

  <!-- roof / chevron -->
  <path d="M13.5 34.5 L32 15.5 L50.5 34.5"
        fill="none" stroke="url(#ink)" stroke-width="5.4"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- dot inside the roof -->
  <circle cx="32" cy="36.4" r="3.2" fill="url(#ink)"/>

  <!-- base bar (plinth) -->
  <rect x="19.5" y="46" width="25" height="4.4" rx="2.2" fill="url(#ink)"/>
</svg>