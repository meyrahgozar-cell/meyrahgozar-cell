"fa":"خدایا، از هر گناهی که در آن به امانتم خیانت کردم، یا با انجامش به خویشتن ستم روا داشتم، یا با آن، گویی برای سوزاندنِ تن خویش هیزم فراهم آوردم، آمرزش می‌خواهم."},{"id":4,"ar":"أَوْ قَدَّمْتُ فِيهِ لَذَّتِي، أَوْ آثَرْتُ فِيهِ شَهْوَتِي، أَوْ سَعَيْتُ فِيهِ لِغَيْرِي،","fa":"یا در آن، لذت خود را پیش انداختم، یا خواهش نفسم را برگزیدم، یا برای کسی جز خودم در آن کوشیدم."},{"id":5,"ar":"أَوِ اسْتَغْوَيْتُ إِلَيْهِ مَنْ تَبِعَنِي، أَوْ كَايَدْتُ فِيهِ مَنْ مَنَعَنِي، أَوْ قَهَرْتُ عَلَيْهِ مَنْ عَادَانِي، أَوْ غَلَبْتُ عَلَيْهِ بِفَضْلِ حِيلَتِي،","fa":"یا کسانی را که از من پیروی می‌کردند به سوی آن فریفتم، یا با کسی که مرا از آن بازمی‌داشت نیرنگ ورزیدم، یا در آن بر کسی که با من دشمنی می‌کرد چیره شدم، یا با حیله و چاره‌گریِ خود بر آن دست یافتم."},{"id":6,"ar":"أَوْ أَحَلْتُ عَلَيْكَ مَوْلَايَ فَلَمْ تَغْلِبْنِي عَلَى فِعْلِي، إِذْ كُنْتَ كَارِهًا لِمَعْصِيَتِي فَحَلُمْتَ عَنِّي، لَكِنْ سَبَقَ عِلْمُكَ فِيَّ بِفِعْلِي ذَلِكَ،","fa":"یا کار را به تو واگذاشتم، ای مولای من، اما تو مرا در انجام آن به زور بازنداشتی؛ با آنکه از نافرمانی‌ام ناخشنود بودی، در حقم بردباری کردی؛ هرچند از پیش می‌دانستی که آن کار را انجام خواهم داد."},{"id":7,"ar":"لَمْ تُدْخِلْنِي يَا رَبِّ فِيهِ جَبْرًا، وَلَمْ تَحْمِلْنِي عَلَيْهِ قَهْرًا، وَلَمْ تَظْلِمْنِي فِيهِ شَيْئًا، فَأَسْتَغْفِرُكَ لَهُ وَلِجَمِيعِ ذُنُوبِي.","fa":"مرا، ای پروردگارم، به جبر در آن وارد نکردی و به زور به آن واندی؛ و در این باره هیچ ستمی بر من روا نداشتی. پس برای آن و برای همهٔ گناهانم از تو آمرزش می‌خواهم."},{"id":8,"ar":"اللَّهُمَّ إِنِّي أَسْتَغْفِرُكَ لِكُلِّ ذَنْبٍ تُبْتُ إِلَيْكَ مِنْهُ وَأَقْدَمْتُ عَلَى فِعْلِهِ، فَاسْتَحْيَيْتُ مِنْكَ وَأَنَا عَلَيْهِ، وَرَهِبْتُكَ وَأَنَا فِيهِ تَعَاطَيْتُهُ وَعُدْتُ إِلَيْهِ.","fa":"خدایا، از هر گناهی که از آن به درگاهت توبه کردم، اما دوباره به انجامش روی آوردم، آمرزش می‌خواهم؛ در حالی که هنگام ارتکابش از تو شرم داشتم و از تو بیم می‌بردم، با این همه بدان دست زدم و بار دیگر به سویش بازگشتم."},{"id":9,"ar":"اللَّهُمَّ إِنِّي أَسْتَغْفِرُكَ لِكُلِّ ذَنْبٍ كَتَبْتَهُ عَلَيَّ بِسَبَبِ خَيْرٍ أَرَدْتُ بِهِ وَجْهَكَ فَخَالَطَنِي فِيهِ سِوَاكَ، وَشَارَكَكَ فِعْلِي مَا لَا يَخْلُصُ لَكَ، أَوْ وَجَبَ عَلَيَّ مَا أَرَدْتُ بِهِ سِوَاكَ، وَكَثِيرٌ مِنْ فِعْلِي مَا يَكُونُ كَذَلِكَ.","fa":"خدایا، از هر گناهی که به سببِ کار نیکی که با آن رضای تو را می‌جستم بر من نوشته شد، آمرزش می‌خواهم؛ کاری که در آن، غیرِ تو با نیّتم درآمیخت و چیزی را در کردارم با تو شریک ساختم که خالصانه برای تو نبود؛ یا کاری بر من لازم شد که در انجامش کسی جز تو را قصد کرده بودم. و بسیاری از کارهایم چنین است."},{"id":10,"ar":"اللَّهُمَّ إِنِّي أَسْتَغْفِرُكَ لِكُلِّ ذَنْبٍ تَوَرَّكَ عَلَيَّ بِسَبَبِ عَهْدٍ عَاهَدْتُكَ عَلَيْهِ، أَوْ عَقْدٍ عَقَدْتُهُ لَكَ، أَوْ ذِمَّةٍ وَاثَقْتُ بِهَا مِنْ أَجْلِكَ لِأَحَدٍ مِنْ خَلْقِكَ، ثُمَّ نَقَضْتُ ذَلِكَ مِنْ غَيْرِ ضَرُورَةٍ لَزِمَتْنِي فِيهِ، بَلِ اسْتَزَلَّنِي إِلَيْهِ عَنِ الْوَفَاءِ بِهِ الْأَشَرُ، وَمَنَعَنِي عَنْ رِعَايَتِهِ الْبَطَرُ.","fa":"خدایا، از هر گناهی که پیامدش به سببِ عهدی که با تو بستم، پیمانی که به خاطر تو منعقد کردم، یا تعهدی که به پاس تو در برابر یکی از آفریدگانت سپردم بر عهده‌ام سنگینی کرد، آمرزش می‌خواهم؛ سپس بی‌آنکه ضرورتی مرا به شکستن آن وادارد، آن را شکستم. سرمستی مرا از وفای به آن لغزاند و غرور و ناسپاسی‌ام از پاسداشتش بازداشت."},{"id":11,"ar":"اللَّهُمَّ إِنِّي أَسْتَغْفِرُكَ لِكُلِّ ذَنْبٍ رَهِبْتُ فِيهِ مِنْ عِبَادِكَ، وَخِفْتُ فِيهِ غَيْرَكَ، وَاسْتَحْيَيْتُ فِيهِ مِنْ خَلْقِكَ، ثُمَّ أَفْضَيْتُ بِهِ فِعْلِي إِلَيْكَ.","fa":"خدایا، از هر گناهی که در آن از بندگانت هراسیدم، از کسی جز تو ترسیدم و از آفریدگانت شرم کردم، سپس آن را با کردار خویش در پیشگاه تو آشکار ساختم، آمرزش می‌خواهم."},{"id":12,"ar":"اللَّهُمَّ إِنِّي أَسْتَغْفِرُكَ لِكُلِّ ذَنْبٍ أَقْدَمْتُ عَلَيْهِ وَأَنَا مُسْتَيْقِنٌ أَنَّكَ تُعَاقِبُ عَلَى ارْتِكَابِهِ فَارْتَكَبْتُهُ.","fa":"خدایا، از هر گناهی که با آگاهی از اینکه تو به سبب ارتکابش کیفرم می‌دهی، به آن دست یازیدم و با این همه مرتکبش شدم، آمرزش می‌خواهم."},{"id":13,"ar":"اللَّهُمَّ إِنِّي أَسْتَغْفِرُكَ لِكُلِّ ذَنْبٍ قَدَّمْتُ فِيهِ شَهْوَتِي عَلَى طَاعَتِكَ، وَآثَرْتُ مَحَبَّتِي عَلَى أَمْرِكَ، وَأَرْضَيْتُ فِيهِ نَفْسِي بِسَخَطِكَ، وَقَدْ نَهَيْتَنِي عَنْهُ بِنَهْيِكَ، وَتَقَدَّمْتَ إِلَيَّ فِيهِ بِإِعْذَارِكَ، وَاحْتَجَجْتَ عَلَيَّ فِيهِ بِوَعِيدِكَ.","fa":"خدایا، از هر گناهی که در آن خواهش نفسم را بر طاعت تو مقدم داشتم، محبت و خواستِ خود را بر فرمانت ترجیح دادم و با ناخشنودیِ تو، نفسم را خشنود ساختم؛ حال آنکه مرا از آن نهی کرده بودی، از پیش با هشدارهایت جای عذر برایم نگذاشته بودی و با تهدیدت حجت را بر من تمام کرده بودی، آمرزش می‌خواهم."},{"id":14,"ar":"اللَّهُمَّ إِنِّي أَسْتَغْفِرُكَ لِكُلِّ ذَنْبٍ عَلِمْتُهُ مِنْ نَفْسِي، أَوْ ذَهَلْتُهُ، أَوْ نَسِيتُهُ، أَوْ تَعَمَّدْتُهُ، أَوْ أَخْطَأْتُهُ، مِمَّا لَا أَشُكُّ أَنَّكَ سَائِلِي عَنْهُ، وَأَنَّ نَفْسِي مُرْتَهَنَةٌ بِهِ لَدَيْكَ، وَإِنْ كُنْتُ قَدْ نَسِيتُهُ أَوْ غَفَلْتُ نَفْسِي عَنْهُ.","fa":"خدایا، از هر گناهی که خود از آن آگاه بودم، یا از آن غفلت کردم، یا فراموشش کردم، یا عمداً مرتکبش شدم، یا سهواً در آن افتادم، آمرزش می‌خواهم؛ گناهی که بی‌گمان درباره‌اش از من بازخواست خواهی کرد و جانم نزد تو در گروِ آن است، هرچند آن را فراموش کرده یا از آن غافل مانده باشم."},{"id":15,"ar":"اللَّهُمَّ إِنِّي أَسْتَغْفِرُكَ لِكُلِّ ذَنْبٍ وَاجَهْتُكَ بِهِ وَقَدْ أَيْقَنْتُ أَنَّكَ تَرَانِي، وَأَغْفَلْتُ أَنْ أَتُوبَ إِلَيْكَ مِنْهُ، أَوْ نَسِيتُ أَنْ أَتُوبَ إِلَيْكَ مِنْهُ، أَوْ نَسِيتُ أَنْ أَسْتَغْفِرَكَ لَهُ.","fa":"خدایا، از هر گناهی که با یقین به اینکه تو مرا می‌بینی، آشکارا در برابر تو مرتکب شدم و سپس از توبه کردن از آن غفلت ورزیدم، یا توبه از آن را فراموش کردم، یا از تو آمرزش خواستن برایش را از یاد بردم، آمرزش می‌خواهم."},{"id":16,"ar":"اللَّهُمَّ إِنِّي أَسْتَغْفِرُكَ لِكُلِّ ذَنْبٍ دَخَلْتُ فِيهِ وَأَحْسَنْتُ ظَنِّي بِكَ أَنْ لَا تُعَذِّبَنِي عَلَيْهِ وَأَنَّكَ تَكْفِينِي مِنْهُ.","fa":"خدایا، از هر گناهی که مرتکب شدم در حالی که به تو گمان نیک داشتم و می‌پنداشتم مرا به سبب آن عذاب نخواهی کرد و خودت مرا از پیامدش کفایت خواهی کرد، آمرزش می‌خواهم."},{"id":17,"ar":"اللَّهُمَّ إِنِّي أَسْتَغْفِرُكَ لِكُلِّ ذَنْبٍ اسْتَوْجَبْتُ بِهِ مِنْكَ رَدَّ الدُّعَاءِ، وَحِرْمَانَ الْإِجَابَةِ، وَخَيْبَةَ الطَّمَعِ، وَانْفِسَاخَ الرَّجَاءِ.","fa":"خدایا، از هر گناهی که به سبب آن سزاوارِ بازگردانده‌شدنِ دعایم، محرومیت از اجابت، ناکامیِ امید و گسستنِ رشتهٔ آرزو شدم، آمرزش می‌خواهم."},{"id":18,"ar":"اللَّهُمَّ إِنِّي أَسْتَغْفِرُكَ لِكُلِّ ذَنْبٍ يُعَقِّبُ الْحَسْرَةَ، وَيُورِثُ النَّدَامَةَ، وَيَحْبِسُ الرِّزْقَ، وَيَرُدُّ الدُّعَاءَ.","fa":"خدایا، از هر گناهی که حسرت می‌آورد، پشیمانی به بار می‌آورد، روزی را بازمی‌دارد و دعا را بازمی‌گرداند، آمرزش می‌خواهم."},{"id":19,"ar":"اللَّهُمَّ إِنِّي أَسْتَغْفِرُكَ لِكُلِّ ذَنْبٍ يُورِثُ الْأَسْقَامَ، وَيُعَقِّبُ الضَّنَى، وَيُوجِبُ النِّقَمَ، وَيَكُونُ آخِرُهُ حَسْرَةً وَنَدَامَةً.","fa":"خدایا، از هر گناهی که بیماری‌ها را در پی دارد، فرسودگی و رنجوری می‌آورد، موجبِ فرود آمدنِ کیفرها می‌شود و پایانش حسرت و پشیمانی است، آمرزش می‌خواهم."},{"id":20,"ar":"اللَّهُمَّ إِنِّي أَسْتَغْفِرُكَ لِكُلِّ ذَنْبٍ مَدَحْتُهُ بِلِسَانِي، أَوْ هَشَّتْ إِلَيْهِ نَفْسِي، أَوِ اكْتَسَبْتُهُ بِيَدِي وَهُوَ عِنْدَكَ قَبِيحٌ تُعَاقِبُ عَلَى مِثْلِهِ، وَتَمْقُتُ مَنْ عَمِلَهُ.","fa":"خدایا، از هر گناهی که با زبانم ستایشش کردم، یا جانم مشتاقانه به سویش گرایید، یا با دست خود به آن دست یازیدم، آمرزش می‌خواهم؛ حال آنکه نزد تو زشت است، بر همانندش کیفر می‌دهی و از مرتکبش بیزاری."},{"id":21,"ar":"اللَّهُمَّ إِنِّي أَسْتَغْفِرُكَ لِكُلِّ ذَنْبٍ خَلَوْتُ بِهِ فِي لَيْلٍ أَوْ نَهَارٍ حَيْثُ لَا يَرَانِي أَحَدٌ مِنْ خَلْقِكَ، فَمِلْتُ فِيهِ مِنْ تَرْكِهِ بِخَوْفِكَ إِلَى ارْتِكَابِهِ بِحُسْنِ الظَّنِّ بِكَ، فَسَوَّلَتْ لِي نَفْسِي الْإِقْدَامَ عَلَيْهِ فَوَاقَعْتُهُ وَأَنَا عَارِفٌ بِمَعْصِيَتِي لَكَ فِيهِ.","fa":"خدایا، از هر گناهی که در شب یا روز، در خلوت و جایی که هیچ‌یک از آفریدگانت مرا نمی‌دید، مرتکب شدم، آمرزش می‌خواهم؛ گناهی که در آن، به جای ترک آن از بیم تو، به سبب خوش‌گمانی به تو به سوی ارتکابش متمایل شدم؛ نفسم ارتکابش را در نظرم آراست و با آنکه می‌دانستم در آن نافرمانی‌ات می‌کنم، مرتکبش شدم."},{"id":22,"ar":"اللَّهُمَّ إِنِّي أَسْتَغْفِرُكَ لِكُلِّ ذَنْبٍ اسْتَقْلَلْتُهُ أَوِ اسْتَصْغَرْتُهُ، أَوِ اسْتَعْظَمْتُهُ وَتَوَرَّطْتُ فِيهِ.","fa":"خدایا، از هر گناهی که آن را اندک یا ناچیز شمردم، یا بزرگی‌اش را دریافتم و با این همه در آن گرفتار شدم، آمرزش می‌خواهم."},{"id":23,"ar":"اللَّهُمَّ إِنِّي أَسْتَغْفِرُكَ لِكُلِّ ذَنْبٍ مَالَأْتُ فِيهِ عَلَى أَحَدٍ مِنْ بَرِيَّتِكَ،","fa":"خدایا، از هر گناهی که در آن با کسی بر ضدّ یکی از آفریدگانت همدست شدم، آمرزش می‌خواهم."},{"id":24,"ar":"أَوْ زَيَّنْتُهُ لِنَفْسِي، أَوْ أَوْمَأْتُ بِهِ إِلَى غَيْرِي وَدَلَلْتُ عَلَيْهِ سِوَايَ، أَوْ أَصْرَرْتُ عَلَيْهِ بِعَمْدِي، أَوْ أَقَمْتُ عَلَيْهِ بِحِيلَتِي.","fa":"یا آن را در نظر خود آراستم، یا با اشاره آن را به دیگری نشان دادم و کسانی جز خودم را به سویش راهنمایی کردم، یا آگاهانه بر آن پافشاری ورزیدم، یا با چاره‌گریِ خود آن را پابرجا نگه داشتم."},{"id":25,"ar":"اللَّهُمَّ إِنِّي أَسْتَغْفِرُكَ لِكُلِّ ذَنْبٍ اسْتَعَنْتُ عَلَيْهِ بِحِيلَتِي بِشَيْءٍ مِمَّا يُرَادُ بِهِ وَجْهُكَ، أَوْ يُسْتَظْهَرُ بِمِثْلِهِ عَلَى طَاعَتِكَ، أَوْ يُتَقَرَّبُ بِمِثْلِهِ إِلَيْكَ، وَوَارَيْتُ عَنِ النَّاسِ وَلَبَّسْتُ فِيهِ كَأَنِّي أُرِيدُكَ بِحِيلَتِي، وَالْمُرَادُ بِهِ مَعْصِيَتُكَ، وَالْهَوَى فِيهِ مُتَصَرِّفٌ عَلَى غَيْرِ طَاعَتِكَ.","fa":"خدایا، از هر گناهی که برای انجامش با نیرنگِ خود از چیزی مدد گرفتم که با آن رضای تو خواسته می‌شود، یا به یاریِ همانندش برای طاعت تو نیرو می‌گیرند، یا با آن به تو نزدیک می‌شوند، آمرزش می‌خواهم؛ و آن را از مردم پوشاندم و چنان وانمود کردم که گویی با این تدبیر تو را می‌جویم، حال آنکه مقصودم نافرمانیِ تو بود و هوای نفس در آن، نه طاعت تو، فرمان می‌راند."},{"id":26,"ar":"اللَّهُمَّ إِنِّي أَسْتَغْفِرُكَ لِكُلِّ ذَنْبٍ كَتَبْتَهُ عَلَيَّ بِسَبَبِ عُجْبٍ كَانَ بِنَفْسِي، أَوْ رِيَاءٍ، أَوْ سُمْعَةٍ، أَوْ خُيَلَاءَ، أَوْ فَرَحٍ، أَوْ مَرَحٍ، أَوْ أَشَرٍ،","fa":"خدایا، از هر گناهی که به سببِ خودپسندیِ درونم، ریا، آوازه‌طلبی، تکبّر و خودنمایی، شادمانیِ مغرورانه، سرخوشیِ بی‌مهار، سرمستی یا ناسپاسیِ نعمت بر من نوشته شد، آمرزش می‌خواهم؛"},{"id":27,"ar":"أَوْ بَطَرٍ، أَوْ حِقْدٍ، أَوْ حَمِيَّةٍ، أَوْ غَضَبٍ، أَوْ رِضًى، أَوْ شُحٍّ، أَوْ بُخْلٍ، أَوْ ظُلْمٍ، أَوْ خِيَانَةٍ، أَوْ سِرْقَةٍ، أَوْ كِذْبٍ،","fa":"یا به سببِ کینه، تعصب، خشم، خشنودی، آزمندی، بخل، ستم، خیانت، دزدی یا دروغ، آمرزش می‌خواهم؛"},{"id":28,"ar":"أَوْ لَهْوٍ، أَوْ لَعِبٍ، أَوْ نَوْعٍ مِنْ أَنْوَاعِ مَا يُكْتَسَبُ بِمِثْلِهِ الذُّنُوبُ وَيَكُونُ بِاجْتِرَاحِهِ الْعَطَبُ.","fa":"یا به سببِ سرگرمیِ غافل‌کننده، بازی، یا هر یک از کارهایی که ارتکابِ همانندشان گناه می‌آفریند و مایهٔ هلاکت می‌شود، آمرزش می‌خواهم."},{"id":29,"ar":"اللَّهُمَّ إِنِّي أَسْتَغْفِرُكَ لِكُلِّ ذَنْبٍ سَبَقَ فِي عِلْمِكَ أَنِّي فَاعِلُهُ، فَدَخَلْتُ فِيهِ بِشَهْوَتِي، وَاجْتَرَحْتُهُ بِإِرَادَتِي، وَقَارَفْتُهُ بِمَحَبَّتِي وَلَذَّتِي وَمَشِيَّتِي، وَشِئْتُهُ إِذْ شِئْتَ أَنْ أَشَاءَهُ، وَأَرَدْتُهُ إِذْ أَرَدْتَ أَنْ أُرِيدَهُ، فَعَمِلْتُهُ إِذْ كَانَ فِي قَدِيمِ تَقْدِيرِكَ وَنَافِذِ عِلْمِكَ أَنِّي فَاعِلُهُ، لَمْ تُدْخِلْنِي فِيهِ جَبْرًا، وَلَمْ تَحْمِلْنِي عَلَيْهِ قَهْرًا،","fa":"خدایا، از هر گناهی که در علمِ پیشین تو مقرر بود آن را انجام دهم، آمرزش می‌خواهم؛ با خواهشِ خویش به سویش رفتم، به ارادهٔ خود مرتکبش شدم و از روی محبت و لذت و خواستِ خویش به آن دست زدم. آن را خواستم، آن‌گاه که تو خواسته بودی من آن را بخواهم؛ اراده‌اش کردم، آن‌گاه که تو اراده کرده بودی من اراده‌اش کنم؛ و انجامش دادم، چون در تقدیرِ دیرین و علمِ نافذ تو چنین بود که آن را انجام دهم. با این همه، مرا به جبر وارد آن نکردی و به زور به آن واندی."},{"id":30,"ar":"وَلَمْ تَظْلِمْنِي فِيهِ شَيْئًا، فَأَسْتَغْفِرُكَ لَهُ وَلِكُلِّ ذَنْبٍ جَرَى بِهِ عِلْمُكَ عَلَيَّ وَفِيَّ إِلَى آخِرِ عُمْرِي.","fa":"و در این باره هیچ ستمی بر من روا نداشتی. پس برای آن و برای هر گناهی که علم تو درباره‌ام و در حقم، تا پایان عمرم، به آن تعلق گرفته است، از تو آمرزش می‌خواهم."},{"id":31,"ar":"اللَّهُمَّ إِنِّي أَسْتَغْفِرُكَ لِكُلِّ ذَنْبٍ مَالَ بِسَخَطِي فِيهِ عَنْ رِضَاكَ، وَمَالَتْ نَفْسِي إِلَى رِضَاكَ فَسَخِطْتُهُ، أَوْ رَهِبْتُ فِيهِ سِوَاكَ،","fa":"خدایا، از هر گناهی که در آن، با ناخشنودیِ خویش از رضای تو روی گرداندم، و نفسم به سوی خشنودیِ تو گرایید ولی من از آن ناخشنود شدم، یا در آن از کسی جز تو ترسیدم، آمرزش می‌خواهم؛"},{"id":32,"ar":"أَوْ عَادَيْتُ فِيهِ أَوْلِيَاءَكَ، أَوْ وَالَيْتُ فِيهِ أَعْدَاءَكَ، أَوِ اخْتَرْتُهُمْ عَلَى أَصْفِيَائِكَ، أَوْ خَذَلْتُ فِيهِ أَحِبَّاءَكَ، أَوْ قَصَّرْتُ فِيهِ عَنْ رِضَاكَ يَا خَيْرَ الْغَافِرِينَ.","fa":"یا به سبب آن با دوستانت دشمنی ورزیدم، یا با دشمنانت دوستی کردم، یا آنان را بر برگزیدگانت ترجیح دادم، یا دوستدارانت را تنها گذاشتم، یا از جلبِ خشنودی‌ات کوتاهی کردم، ای بهترینِ آمرزندگان."},{"id":33,"ar":"اللَّهُمَّ إِنِّي أَسْتَغْفِرُكَ لِكُلِّ ذَنْبٍ تُبْتُ إِلَيْكَ مِنْهُ ثُمَّ عُدْتُ فِيهِ.","fa":"خدایا، از هر گناهی که از آن به درگاهت توبه کردم و سپس دوباره مرتکبش شدم، آمرزش می‌خواهم."},{"id":34,"ar":"وَأَسْتَغْفِرُكَ لِمَا أَعْطَيْتُكَ مِنْ نَفْسِي ثُمَّ لَمْ أَفِ بِهِ.","fa":"و برای آنچه از جانبِ خود به تو وعده دادم و سپس به آن وفا نکردم، از تو آمرزش می‌خواهم."},{"id":35,"ar":"وَأَسْتَغْفِرُكَ لِلنِّعْمَةِ الَّتِي أَنْعَمْتَ بِهَا عَلَيَّ فَقَوِيتُ بِهَا عَلَى مَعْصِيَتِكَ.","fa":"و برای نعمتی که بر من ارزانی داشتی و من با آن بر نافرمانی‌ات نیرو گرفتم، از تو آمرزش می‌خواهم."},{"id":36,"ar":"وَأَسْتَغْفِرُكَ لِكُلِّ خَيْرٍ أَرَدْتُ بِهِ وَجْهَكَ فَخَالَطَنِي مَا لَيْسَ لَكَ.","fa":"و برای هر کار نیکی که با آن رضای تو را می‌جستم، اما نیتی جز رضای تو در آن با من درآمیخت، از تو آمرزش می‌خواهم."},{"id":37,"ar":"وَأَسْتَغْفِرُكَ لِمَا دَعَانِي إِلَيْهِ الرُّخَصُ فِيمَا اشْتَبَهَ عَلَيَّ مِمَّا هُوَ عِنْدَكَ حَرَامٌ.","fa":"و از تو آمرزش می‌خواهم برای گناهانی که آسان‌گیری و پیروی از رخصت‌ها مرا به سویشان کشاند، در اموری که برایم مشتبه بود، حال آنکه نزد تو حرام بود."},{"id":38,"ar":"وَأَسْتَغْفِرُكَ لِلذُّنُوبِ الَّتِي لَا يَعْلَمُهَا غَيْرُكَ، وَلَا يَطَّلِعُ عَلَيْهَا سِوَاكَ، وَلَا يَحْتَمِلُهَا إِلَّا حِلْمُكَ، وَلَا يَسَعُهَا إِلَّا عَفْوُكَ.","fa":"و از تو آمرزش می‌خواهم برای گناهانی که جز تو کسی از آنها آگاه نیست، جز تو کسی بر آنها اشراف ندارد، جز بردباریِ تو تابِ تحملشان را ندارد و جز عفوِ تو گنجایششان را ندارد."},{"id":39,"ar":"وَأَسْتَغْفِرُكَ وَأَتُوبُ إِلَيْكَ مِنْ مَظَالِمَ كَثِيرَةٍ لِعِبَادِكَ قِبَلِي يَا رَبِّ، فَلَمْ أَسْتَطِعْ رَدَّهَا عَلَيْهِمْ وَتَحْلِيلَهَا مِنْهُمْ، أَوْ شَهِدُوا فَاسْتَحْيَيْتُ مِنِ اسْتِحْلَالِهِمْ وَالطَّلَبِ إِلَيْهِمْ وَإِعْلَامِهِمْ ذَلِكَ،","fa":"و از تو آمرزش می‌خواهم و به سوی تو توبه می‌کنم از ستم‌های بسیاری که بر بندگانت روا داشته‌ام، ای پروردگارم؛ نتوانستم حقوقشان را به آنان بازگردانم و از ایشان حلالیت بطلبم؛ یا آنان خود شاهدِ آن بودند و من از اینکه از آنان حلالیت بخواهم، از ایشان درخواستِ گذشت کنم و ماجرا را به آگاهی‌شان برسانم، شرم کردم؛"},{"id":40,"ar":"وَأَنْتَ الْقَادِرُ عَلَى أَنْ تَسْتَوْهِبَنِي مِنْهُمْ وَتُرْضِيَهُمْ عَنِّي كَيْفَ شِئْتَ وَبِمَا شِئْتَ، يَا أَرْحَمَ الرَّاحِمِينَ، وَأَحْكَمَ الْحَاكِمِينَ، وَخَيْرَ الْغَافِرِينَ.","fa":"و تو توانایی که از آنان برایم بخشایش بخواهی و به هرگونه و با هر وسیله که بخواهی، ایشان را از من خشنود سازی؛ ای مهربان‌ترینِ مهربانان، حکیم‌ترینِ داوران و بهترینِ آمرزندگان."},{"id":41,"ar":"اللَّهُمَّ إِنَّ اسْتِغْفَارِي إِيَّاكَ مَعَ الْإِصْرَارِ لُؤْمٌ، وَتَرْكِيَ الِاسْتِغْفَارَ مَعَ مَعْرِفَتِي بِسَعَةِ جُودِكَ وَرَحْمَتِكَ عَجْزٌ.","fa":"خدایا، آمرزش خواستن از تو در حالی که بر گناه پافشاری می‌کنم، فرومایگی است؛ و ترکِ استغفار، با آنکه گستردگیِ جود و رحمتت را می‌شناسم، ناتوانی است."},{"id":42,"ar":"فَكَمْ تَتَحَبَّبُ إِلَيَّ يَا رَبِّ وَأَنْتَ الْغَنِيُّ عَنِّي، وَكَمْ أَتَبَغَّضُ إِلَيْكَ وَأَنَا الْفَقِيرُ إِلَيْكَ وَإِلَى رَحْمَتِكَ.","fa":"چه بسیار که تو، ای پروردگارم، با من مهر می‌ورزی، در حالی که از من بی‌نیازی؛ و چه بسیار که من خود را نزد تو منفور می‌سازم، با آنکه به تو و رحمتت سخت نیازمندم."},{"id":43,"ar":"فَيَا مَنْ وَعَدَ فَوَفَى، وَأَوْعَدَ فَعَفَا، اغْفِرْ لِي خَطَايَايَ، وَاغْفِرْ وَارْحَمْ وَأَنْتَ خَيْرُ الرَّاحِمِينَ.","fa":"پس ای آن‌که وعده دادی و وفا کردی، و بیم دادی و عفو فرمودی، خطاهایم را بیامرز؛ بیامرز و رحمت آور، که تو بهترینِ رحم‌کنندگانی."}]'),WE={او:"یا",فيه:"در آن",اني:"که من",اللهم:"خدایا",استغفرك:"از تو آمرزش می‌خواهم",ذنب:"گناه",من:"از",لكل:"برای هر",على:"بر",به:"به آن",عليه:"بر او",علي:"بر من",نفسي:"خود / جان من",اليك:"به سوی تو",ان:"که",اليه:"به سوی آن",منه:"از آن",واستغفرك:"و از تو آمرزش می‌خواهم",يا:"ای",وانا:"و من",ما:"آنچه",لا:"نه",عن:"از",فعلي:"کردار من",اذ:"آنگاه که",علمك:"دا
