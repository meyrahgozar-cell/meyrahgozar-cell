<!-- ── app shell ───────────────────────────────────────────────── -->
<div class="shell" id="shell" hidden>
  <aside class="rail" id="rail" aria-label="اصلی">
    <div class="rail__top">
      <a class="brand" href="#/home" aria-label="خانهٔ ریل">
        <span class="brand__mark"><svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="17" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="32" cy="32" r="5" fill="currentColor"/><path d="M32 8v6M32 50v6M8 32h6M50 32h6" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></span>
        <span class="brand__text"><strong>ریل</strong><em>مستندی از یک زندگی</em></span>
      </a>
      <button class="icon-btn rail__close" data-action="close-rail" aria-label="بستن منو"><svg class="ico"><use href="#i-close"/></svg></button>
    </div>

    <button class="new-frame" data-action="new-frame">
      <svg class="ico"><use href="#i-plus"/></svg><span>قاب تازه</span><kbd>N</kbd>
    </button>

    <nav class="nav" id="nav">
      <p class="nav__label">روایت</p>
      <a class="nav__item" href="#/home" data-nav="home"><svg class="ico"><use href="#i-home"/></svg><span>نمای کلی</span></a>
      <a class="nav__item" href="#/timeline" data-nav="timeline"><svg class="ico"><use href="#i-reel"/></svg><span>خط زمان</span><span class="nav__count" id="countFrames"></span></a>
      <a class="nav__item" href="#/gallery" data-nav="gallery"><svg class="ico"><use href="#i-grid"/></svg><span>آلبوم</span></a>
      <a class="nav__item" href="#/calendar" data-nav="calendar"><svg class="ico"><use href="#i-calendar"/></svg><span>تقویم</span></a>
      <p class="nav__label">تأمل</p>
      <a class="nav__item" href="#/threads" data-nav="threads"><svg class="ico"><use href="#i-threads"/></svg><span>رشته‌ها</span></a>
      <a class="nav__item" href="#/insights" data-nav="insights"><svg class="ico"><use href="#i-chart"/></svg><span>بینش</span></a>
      <a class="nav__item" href="#/places" data-nav="places"><svg class="ico"><use href="#i-pin"/></svg><span>مکان‌ها</span></a>
      <p class="nav__label">گنجینه</p>
      <a class="nav__item" href="#/settings" data-nav="settings"><svg class="ico"><use href="#i-settings"/></svg><span>تنظیمات</span></a>
    </nav>

    <div class="rail__foot">
      <div class="sync" id="syncChip" title="منبع داده">
        <span class="dot"></span><span class="sync__text">در حال اتصال…</span>
      </div>
      <button class="userchip" id="userChip" data-action="open-user-menu">
        <span class="avatar avatar--sm" id="railAvatar">ر</span>
        <span class="userchip__meta"><strong id="railName">مهمان</strong><em id="railMeta">گنجینهٔ محلی</em></span>
        <svg class="ico"><use href="#i-chevron-down"/></svg>
      </button>
    </div>
  </aside>
  <div class="rail-scrim" id="railScrim" data-action="close-rail"></div>

  <main class="main" id="main">
    <header class="topbar" id="topbar">
      <button class="icon-btn rail__open" data-action="open-rail" aria-label="باز کردن منو"><svg class="ico"><use href="#i-menu"/></svg></button>
      <div class="topbar__titles">
        <h1 class="topbar__title" id="pageTitle">نمای کلی</h1>
        <p class="topbar__sub" id="pageSub"></p>
      </div>
      <div class="topbar__actions" id="pageActions">
        <button class="searchbtn" data-action="open-search" aria-label="جست‌وجو">
          <svg class="ico"><use href="#i-search"/></svg><span>جست‌وجو در روایت</span><kbd>⌘K</kbd>
        </button>
        <button class="icon-btn" data-action="toggle-theme" aria-label="تغییر پوسته" id="themeBtn"><svg class="ico"><use href="#i-moon"/></svg></button>
        <button class="icon-btn" data-action="open-search" aria-label="جست‌وجو" id="mobileSearchBtn"><svg class="ico"><use href="#i-search"/></svg></button>
        <button class="btn btn--primary btn--sm hide-sm" data-action="new-frame"><svg class="ico"><use href="#i-plus"/></svg>قاب</button>
      </div>
    </header>
    <div class="view" id="view" tabindex="-1"></div>
  </main>

  <nav class="tabbar" aria-label="بخش‌ها">
    <a href="#/home" data-nav="home"><svg class="ico"><use href="#i-home"/></svg><span>خانه</span></a>

    <a href="#/insights" data-nav="insights"><svg class="ico"><use href="#i-chart"/></svg><span>بینش</span></a>
  </nav>
</div>
