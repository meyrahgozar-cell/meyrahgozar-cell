<!DOCTYPE html>
<html lang="fa" dir="ltr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub File Manager</title>

    <!-- CodeMirror 5 (dark theme + core) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/dialog/dialog.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/search/matchesonscrollbar.min.css" />

    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            background: #0a0a12;
            color: #e0e0ff;
            min-height: 100vh;
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #141420; }
        ::-webkit-scrollbar-thumb { background: #2a2a3a; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #3a3a4a; }

        header {
            padding: 14px 20px;
            background: #11111b;
            border-bottom: 1px solid #222;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        header form {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            flex: 1;
        }
        header input {
            background: #1a1a2e;
            border: 1px solid #2a2a3a;
            color: #e0e0ff;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 14px;
            min-width: 180px;
        }
        header input:focus {
            outline: none;
            border-color: #00f0ff;
            box-shadow: 0 0 0 3px #00f0ff22;
        }
        header button {
            background: transparent;
            border: 1px solid #00f0ff;
            color: #00f0ff;
            padding: 8px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: background .2s;
            white-space: nowrap;
        }
        header button:hover { background: #00f0ff22; }
        header button:disabled { opacity: .5; cursor: not-allowed; }

        .status { font-size: 13px; color: #888; margin-left: auto; white-space: nowrap; }
        .status.ok { color: #00ff9f; }
        .status.err { color: #ff4d6d; }
        .status.loading { color: #ffd93d; }

        .path {
            padding: 10px 20px;
            font-family: ui-monospace, "Cascadia Code", monospace;
            font-size: 13px;
            color: #00f0ff;
            border-bottom: 1px solid #1a1a2a;
            background: #0d0d18;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }
        .path .crumb { color: #888; cursor: pointer; transition: color .2s; }
        .path .crumb:hover { color: #00f0ff; }
        .path .sep { color: #333; user-select: none; }

        .toolbar {
            padding: 10px 20px;
            display: none;
            gap: 10px;
            border-bottom: 1px solid #1a1a2a;
            background: #0d0d18;
            flex-wrap: wrap;
            align-items: center;
        }
        .toolbar button {
            background: transparent;
            border: 1px solid #2a2a3a;
            color: #c0c0e0;
            padding: 6px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: all .2s;
        }
        .toolbar button:hover {
            border-color: #00f0ff;
            color: #00f0ff;
            background: #00f0ff11;
        }
        .toolbar button.primary {
            background: #00f0ff;
            border-color: #00f0ff;
            color: #0a0a12;
        }
        .toolbar button.primary:hover {
            background: #00d4e8;
            border-color: #00d4e8;
        }
        .toolbar .count { font-size: 12px; color: #666; margin-left: 4px; }
        .toolbar .spacer { flex: 1; }

        .upload-area {
            margin: 16px 20px 8px;
            border: 2px dashed #2a2a3a;
            border-radius: 12px;
            padding: 28px;
            text-align: center;
            color: #666;
            cursor: pointer;
            transition: all .3s;
            display: none;
            background: #0d0d18;
        }
        .upload-area:hover { border-color: #444; background: #11111f; }
        .upload-area.drag {
            border-color: #00f0ff;
            background: #00f0ff11;
            color: #00f0ff;
        }
        .upload-area .icon { font-size: 32px; display: block; margin-bottom: 6px; }
        .upload-area .sub { font-size: 12px; color: #555; margin-top: 4px; }

        .files {
            padding: 16px 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 14px;
        }
        .card {
            background: #141420;
            border: 1px solid #22223a;
            border-radius: 12px;
            padding: 18px 10px 14px;
            text-align: center;
            cursor: pointer;
            position: relative;
            transition: all .25s;
            user-select: none;
        }
        .card:hover {
            border-color: #00f0ff;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 240, 255, 0.06);
        }
        .card .icon-big { font-size: 32px; line-height: 1.2; }
        .card .name {
            font-size: 13px;
            word-break: break-all;
            margin-top: 8px;
            font-weight: 500;
            color: #e0e0ff;
        }
        .card .meta { font-size: 11px; color: #777; margin-top: 4px; }
        .card .del,
        .card .open-browser {
            position: absolute;
            top: 6px;
            background: #1a1a2e;
            border: 1px solid #2a2a3a;
            color: #c0c0e0;
            width: 26px;
            height: 26px;
            border-radius: 6px;
            font-size: 13px;
            display: none;
            cursor: pointer;
            align-items: center;
            justify-content: center;
            transition: all .2s;
            z-index: 2;
        }
        .card .del { right: 6px; border-color: #ff4d6d; color: #ff4d6d; }
        .card .del:hover { background: #ff4d6d22; }
        .card .open-browser { right: 36px; border-color: #00f0ff; color: #00f0ff; }
        .card .open-browser:hover { background: #00f0ff22; }
        .card:hover .del,
        .card:hover .open-browser { display: flex; }
        .card .ext-badge {
            position: absolute;
            bottom: 6px;
            right: 6px;
            font-size: 9px;
            background: #1a1a2e;
            padding: 2px 6px;
            border-radius: 4px;
            color: #555;
            text-transform: uppercase;
            letter-spacing: .3px;
        }
        .card.folder .icon-big {
            filter: drop-shadow(0 2px 4px rgba(0, 240, 255, 0.1));
        }

        .context-menu {
            position: fixed;
            background: #1a1a2e;
            border: 1px solid #2a2a3a;
            border-radius: 8px;
            padding: 6px 0;
            min-width: 190px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, .8);
            z-index: 9999;
            display: none;
            backdrop-filter: blur(8px);
        }
        .context-menu .item {
            padding: 8px 16px;
            color: #c0c0e0;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background .15s;
        }
        .context-menu .item:hover {
            background: #00f0ff22;
            color: #e0e0ff;
        }
        .context-menu .item.danger { color: #ff4d6d; }
        .context-menu .item.danger:hover { background: #ff4d6d22; }
        .context-menu .sep {
            height: 1px;
            background: #2a2a3a;
            margin: 4px 8px;
        }

        .msg {
            padding: 60px 20px;
            text-align: center;
            color: #555;
            font-size: 15px;
        }
        .msg .emoji { font-size: 40px; display: block; margin-bottom: 12px; }

        /* ─── Editor Overlay ─── */
        .editor-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .82);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .editor-overlay.open { display: flex; }

        .editor-modal {
            background: #11111f;
            border: 1px solid #2a2a3a;
            border-radius: 16px;
            width: 100%;
            max-width: 1100px;
            height: min(92vh, 860px);
            display: flex;
            flex-direction: column;
            box-shadow: 0 24px 80px rgba(0, 0, 0, .85);
            overflow: hidden;
        }

        .editor-header {
            padding: 12px 18px;
            border-bottom: 1px solid #1a1a2a;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
            background: #0d0d18;
        }
        .editor-header .file-icon { font-size: 20px; }
        .editor-header .file-name {
            font-weight: 600;
            font-size: 14px;
            color: #e0e0ff;
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .editor-header .file-path {
            font-size: 11px;
            color: #555;
            font-family: ui-monospace, monospace;
            max-width: 220px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .editor-header .editor-status {
            font-size: 11px;
            color: #888;
            padding: 3px 10px;
            border-radius: 12px;
            background: #1a1a2e;
            white-space: nowrap;
        }
        .editor-header .editor-status.saved { color: #00ff9f; }
        .editor-header .editor-status.dirty { color: #ffd93d; }
        .editor-header .editor-status.error { color: #ff4d6d; }
        .editor-header .editor-status.loading { color: #ffd93d; }
        .editor-header .close-btn {
            background: none;
            border: none;
            color: #666;
            font-size: 22px;
            cursor: pointer;
            padding: 0 6px;
            line-height: 1;
            transition: color .2s;
        }
        .editor-header .close-btn:hover { color: #ff4d6d; }

        .editor-body {
            flex: 1;
            position: relative;
            background: #0a0a12;
            overflow: hidden;
            min-height: 0;
        }
        /* CodeMirror fills the body */
        .editor-body .CodeMirror {
            height: 100% !important;
            font-family: "JetBrains Mono", "Fira Code", "Cascadia Code", ui-monospace, monospace;
            font-size: 14px;
            line-height: 1.55;
            background: #0a0a12;
        }
        .editor-body .CodeMirror-gutters {
            background: #0a0a12;
            border-right: 1px solid #1a1a2a;
        }
        .editor-body .CodeMirror-linenumber { color: #444; }
        .editor-body .CodeMirror-cursor { border-left: 2px solid #00f0ff; }
        .editor-body .CodeMirror-selected { background: #00f0ff33 !important; }
        .editor-body .CodeMirror-focused .CodeMirror-selected { background: #00f0ff44 !important; }

        .editor-footer {
            padding: 10px 18px;
            border-top: 1px solid #1a1a2a;
            display: flex;
            gap: 12px;
            flex-shrink: 0;
            background: #0d0d18;
            flex-wrap: wrap;
            align-items: center;
        }
        .editor-footer .info {
            font-size: 12px;
            color: #555;
            flex: 1;
        }
        .editor-footer .info span { color: #888; }
        .editor-footer button {
            padding: 6px 18px;
            border-radius: 6px;
            border: 1px solid #2a2a3a;
            background: transparent;
            color: #c0c0e0;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all .2s;
        }
        .editor-footer button:hover {
            border-color: #00f0ff;
            color: #00f0ff;
        }
        .editor-footer button.primary {
            background: #00f0ff;
            border-color: #00f0ff;
            color: #0a0a12;
        }
        .editor-footer button.primary:hover {
            background: #00d4e8;
            border-color: #00d4e8;
        }
        .editor-footer button.primary:disabled {
            opacity: .4;
            cursor: not-allowed;
        }
        .editor-footer .hint {
            font-size: 11px;
            color: #444;
            margin-left: 8px;
        }

        @media (max-width: 640px) {
            header form input { min-width: 120px; width: 100%; }
            .files {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
                gap: 10px;
                padding: 12px;
            }
            .editor-modal {
                height: 100vh;
                max-height: 100vh;
                border-radius: 0;
            }
            .editor-overlay { padding: 0; }
            .editor-header .file-path { max-width: 80px; }
            .card .del, .card .open-browser {
                width: 22px; height: 22px; font-size: 11px; display: flex;
            }
            .card .open-browser { right: 32px; }
        }
    </style>
</head>
<body>

    <header>
        <form id="auth" autocomplete="off">
            <input id="repo" type="text" value="meyrahgozar-cell/meyrahgozar-cell" placeholder="owner/repo" />
            <input id="token" type="password" placeholder="GitHub Token (repo scope)" autocomplete="new-password" />
            <button type="button" id="connectBtn">Connect</button>
        </form>
        <div class="status" id="status">Not connected</div>
    </header>

    <div class="path" id="path"></div>

    <div class="toolbar" id="toolbar">
        <button type="button" class="primary" id="uploadBtn">📤 Upload</button>
        <button type="button" id="newFileBtn">📄 New File</button>
        <button type="button" id="newFolder">📁 New Folder</button>
        <button type="button" id="refreshBtn">⟳ Refresh</button>
        <input type="file" id="fileInput" multiple hidden />
        <span class="count" id="fileCount"></span>
        <span class="spacer"></span>
        <span style="font-size:12px;color:#555" id="branchLabel">main</span>
    </div>

    <div class="upload-area" id="drop">
        <span class="icon">📂</span>
        Drop files here or click to upload
        <div class="sub">Supports multiple files · Binary & text</div>
    </div>

    <div class="files" id="files"></div>
    <div class="msg" id="msg"><span class="emoji">🔑</span>Enter owner/repo + token and click Connect</div>

    <div class="context-menu" id="contextMenu">
        <div class="item" data-action="open">📂 Open / Edit</div>
        <div class="item" data-action="download">⬇️ Download</div>
        <div class="item" data-action="rename">✏️ Rename</div>
        <div class="item" data-action="copyPath">📋 Copy Path</div>
        <div class="item" data-action="copyRaw">🔗 Copy Raw URL</div>
        <div class="sep"></div>
        <div class="item danger" data-action="delete">🗑️ Delete</div>
    </div>

    <!-- Editor Modal -->
    <div class="editor-overlay" id="editorOverlay">
        <div class="editor-modal">
            <div class="editor-header">
                <span class="file-icon" id="edIcon">📄</span>
                <span class="file-name" id="edFileName">file</span>
                <span class="file-path" id="edFilePath"></span>
                <span class="editor-status" id="edStatus">● saved</span>
                <button class="close-btn" id="edClose" title="Close (Esc)">✕</button>
            </div>
            <div class="editor-body" id="edBody">
                <!-- CodeMirror will be injected here -->
            </div>
            <div class="editor-footer">
                <div class="info">
                    <span id="edLines">0</span> lines · <span id="edSize">0</span> B
                    <span class="hint">Ctrl/Cmd + S to save · Esc to close</span>
                </div>
                <button id="edCancel">Cancel</button>
                <button class="primary" id="edSave">💾 Save</button>
            </div>
        </div>
    </div>

    <!-- CodeMirror core + modes + search -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/markdown/markdown.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/shell/shell.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/yaml/yaml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/sql/sql.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/search/search.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/search/searchcursor.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/search/jump-to-line.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/dialog/dialog.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/selection/active-line.min.js"></script>

    <script>
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  STATE
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const state = {
            owner: 'meyrahgozar-cell',
            repo: 'meyrahgozar-cell',
            token: '',
            path: '',
            branch: 'main',
            connected: false,
        };

        let editorFile = null; // { path, sha, name, content, savedContent }
        let cm = null;         // CodeMirror instance

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  DOM REFS
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const $ = id => document.getElementById(id);
        const repoInput   = $('repo');
        const tokenInput  = $('token');
        const statusEl    = $('status');
        const pathEl      = $('path');
        const filesEl     = $('files');
        const msgEl       = $('msg');
        const toolbar     = $('toolbar');
        const drop        = $('drop');
        const fileInput   = $('fileInput');
        const fileCount   = $('fileCount');
        const branchLabel = $('branchLabel');
        const connectBtn  = $('connectBtn');

        const edOverlay = $('editorOverlay');
        const edIcon    = $('edIcon');
        const edFileName= $('edFileName');
        const edFilePath= $('edFilePath');
        const edStatus  = $('edStatus');
        const edClose   = $('edClose');
        const edCancel  = $('edCancel');
        const edSave    = $('edSave');
        const edLines   = $('edLines');
        const edSize    = $('edSize');
        const edBody    = $('edBody');

        const contextMenu = $('contextMenu');

        const savedToken = localStorage.getItem('fm_token');
        if (savedToken) tokenInput.value = savedToken;

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  UTF-8 SAFE BASE64 (GitHub API)
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function decodeBase64UTF8(b64) {
            // GitHub returns base64 with possible newlines
            const cleaned = b64.replace(/\n/g, '');
            const binary = atob(cleaned);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) {
                bytes[i] = binary.charCodeAt(i);
            }
            return new TextDecoder('utf-8').decode(bytes);
        }

        function encodeBase64UTF8(str) {
            const bytes = new TextEncoder().encode(str);
            let binary = '';
            for (let i = 0; i < bytes.length; i++) {
                binary += String.fromCharCode(bytes[i]);
            }
            return btoa(binary);
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  GITHUB API
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function apiUrl(path) {
            return `https://api.github.com/repos/${state.owner}/${state.repo}${path}`;
        }

        async function api(method, path, body) {
            const url = apiUrl(path);
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 15000);

            const opts = {
                method,
                headers: {
                    Accept: 'application/vnd.github.v3+json',
                    Authorization: `token ${state.token}`,
                    'Content-Type': 'application/json',
                    'User-Agent': 'GitHub-File-Manager/2.0',
                },
                signal: controller.signal,
            };
            if (body) opts.body = JSON.stringify(body);

            try {
                const res = await fetch(url, opts);
                clearTimeout(timeout);
                if (res.status === 204) return null;
                const data = await res.json().catch(() => ({}));
                if (!res.ok) {
                    throw new Error(data.message || `HTTP ${res.status}`);
                }
                return data;
            } catch (err) {
                clearTimeout(timeout);
                if (err.name === 'AbortError') {
                    throw new Error('Request timed out. Check network / token.');
                }
                throw err;
            }
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  CONNECT
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        async function connect() {
            const repoVal = repoInput.value.trim();
            const token = tokenInput.value.trim();

            if (!repoVal.includes('/') || !token) {
                setStatus('Please fill both fields', 'err');
                alert('Please fill both fields (owner/repo and token)');
                return;
            }

            const [owner, repo] = repoVal.split('/');
            state.owner = owner;
            state.repo = repo;
            state.token = token;
            state.path = '';

            connectBtn.disabled = true;
            connectBtn.textContent = 'Connecting…';
            setStatus('Connecting…', 'loading');

            try {
                const info = await api('GET', '');
                state.branch = info.default_branch || 'main';
                state.connected = true;
                localStorage.setItem('fm_token', token);
                setStatus(`✓ Connected: ${info.full_name}`, 'ok');
                toolbar.style.display = 'flex';
                drop.style.display = 'block';
                msgEl.style.display = 'none';
                branchLabel.textContent = state.branch;
                await load();
            } catch (err) {
                console.error('Connection error:', err);
                setStatus('✗ Failed: ' + err.message, 'err');
                alert('Connection failed: ' + err.message + '\n\nMake sure:\n• Token has "repo" scope\n• Repo exists and is accessible');
                state.connected = false;
            } finally {
                connectBtn.disabled = false;
                connectBtn.textContent = 'Connect';
            }
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  LOAD DIRECTORY
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        async function load() {
            if (!state.connected) return;
            filesEl.innerHTML = '';
            pathEl.innerHTML = buildPathCrumbs();

            try {
                const data = await api('GET', `/contents/${state.path}?ref=${state.branch}`);
                const items = Array.isArray(data) ? data : [data];
                items.sort((a, b) => {
                    if (a.type === b.type) return a.name.localeCompare(b.name);
                    return a.type === 'dir' ? -1 : 1;
                });

                if (state.path) {
                    const back = makeCard('..', '⬅️', 'folder', null, true);
                    back.onclick = () => {
                        const parts = state.path.split('/');
                        parts.pop();
                        state.path = parts.join('/');
                        load();
                    };
                    filesEl.appendChild(back);
                }

                let fileCountNum = 0;
                items.forEach(item => {
                    const isDir = item.type === 'dir';
                    const icon = getFileIcon(item.name, isDir);
                    const meta = isDir ? 'Folder' : formatSize(item.size);
                    const card = makeCard(item.name, icon, isDir ? 'folder' : 'file', meta);
                    const ext = item.name.includes('.') ? item.name.split('.').pop().toLowerCase() : '';

                    card.dataset.path = item.path;
                    card.dataset.sha  = item.sha;
                    card.dataset.type = item.type;
                    card.dataset.name = item.name;
                    if (item.download_url) card.dataset.download = item.download_url;

                    // Delete button
                    const delBtn = document.createElement('button');
                    delBtn.className = 'del';
                    delBtn.textContent = '✕';
                    delBtn.title = 'Delete';
                    delBtn.onclick = async e => {
                        e.stopPropagation();
                        if (!confirm(`Delete "${item.name}"?`)) return;
                        try {
                            await api('DELETE', `/contents/${item.path}`, {
                                message: `Delete ${item.name}`,
                                sha: item.sha,
                                branch: state.branch,
                            });
                            load();
                        } catch (err) {
                            alert('Delete failed: ' + err.message);
                        }
                    };
                    card.appendChild(delBtn);

                    // Open in browser (github.io style – useful for static sites)
                    if (!isDir) {
                        const browserBtn = document.createElement('button');
                        browserBtn.className = 'open-browser';
                        browserBtn.textContent = '🌐';
                        browserBtn.title = 'Open as GitHub Pages (if enabled)';
                        browserBtn.onclick = e => {
                            e.stopPropagation();
                            const baseUrl = `https://${state.owner}.github.io/${state.repo}/`;
                            window.open(baseUrl + item.path, '_blank');
                        };
                        card.appendChild(browserBtn);
                    }

                    if (!isDir && ext) {
                        const badge = document.createElement('span');
                        badge.className = 'ext-badge';
                        badge.textContent = ext;
                        card.appendChild(badge);
                    }

                    card.onclick = () => {
                        if (isDir) {
                            state.path = item.path;
                            load();
                        } else {
                            openFile(item);
                        }
                    };

                    card.addEventListener('contextmenu', e => {
                        e.preventDefault();
                        e.stopPropagation();
                        showContextMenu(e.clientX, e.clientY, item, card);
                    });

                    filesEl.appendChild(card);
                    fileCountNum++;
                });

                fileCount.textContent = fileCountNum + ' item' + (fileCountNum !== 1 ? 's' : '');
                if (items.length === 0 && state.path) {
                    const empty = document.createElement('div');
                    empty.className = 'msg';
                    empty.innerHTML = '<span class="emoji">📭</span>This folder is empty';
                    empty.style.padding = '40px 20px';
                    filesEl.appendChild(empty);
                }
            } catch (e) {
                console.error('Load error:', e);
                filesEl.innerHTML = `<div class="msg"><span class="emoji">⚠️</span>${e.message}</div>`;
            }
        }

        function buildPathCrumbs() {
            const parts = state.path.split('/').filter(Boolean);
            let html = `<span class="crumb" data-path="">📁 root</span>`;
            let cur = '';
            parts.forEach((p, i) => {
                cur += (cur ? '/' : '') + p;
                const isLast = i === parts.length - 1;
                html += `<span class="sep"> / </span>`;
                if (isLast) {
                    html += `<span class="crumb" style="color:#e0e0ff">${p}</span>`;
                } else {
                    html += `<span class="crumb" data-path="${cur}">${p}</span>`;
                }
            });
            setTimeout(() => {
                pathEl.querySelectorAll('.crumb[data-path]').forEach(el => {
                    el.onclick = () => {
                        state.path = el.dataset.path;
                        load();
                    };
                });
            }, 0);
            return html;
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  FILE ICONS & HELPERS
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function getFileIcon(name, isDir) {
            if (isDir) return '📁';
            const ext = name.split('.').pop().toLowerCase();
            const map = {
                html: '🌐', htm: '🌐', css: '🎨', scss: '🎨', less: '🎨',
                js: '⚡', mjs: '⚡', jsx: '⚡', ts: '🔷', tsx: '🔷',
                json: '📋', md: '📝', markdown: '📝', txt: '📄',
                xml: '📰', svg: '🖼️',
                png: '🖼️', jpg: '🖼️', jpeg: '🖼️', gif: '🖼️', webp: '🖼️', ico: '🖼️',
                pdf: '📕', zip: '📦', tar: '📦', gz: '📦', rar: '📦',
                py: '🐍', rb: '💎', php: '🐘', go: '🐹', rs: '🦀',
                c: '⚙️', cpp: '⚙️', h: '⚙️', hpp: '⚙️',
                sh: '🐚', bash: '🐚', zsh: '🐚',
                yml: '📜', yaml: '📜', toml: '📜',
                lock: '🔒', gitignore: '🙈', env: '🔐',
                vue: '🟢', sql: '🗄️', log: '📜'
            };
            return map[ext] || '📄';
        }

        function formatSize(b) {
            if (b == null || b === 0) return '0 B';
            if (b < 1024) return b + ' B';
            if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
            return (b / 1048576).toFixed(1) + ' MB';
        }

        function makeCard(name, icon, type, meta) {
            const card = document.createElement('div');
            card.className = 'card' + (type === 'folder' ? ' folder' : '');
            card.innerHTML = `
                <div class="icon-big">${icon}</div>
                <div class="name">${escapeHtml(name)}</div>
                ${meta ? `<div class="meta">${meta}</div>` : ''}
            `;
            return card;
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  CONTEXT MENU
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        let contextTarget = null;

        function showContextMenu(x, y, item, card) {
            contextTarget = { item, card };
            contextMenu.style.display = 'block';
            contextMenu.style.left = x + 'px';
            contextMenu.style.top  = y + 'px';

            // Keep inside viewport
            requestAnimationFrame(() => {
                const rect = contextMenu.getBoundingClientRect();
                if (rect.right > window.innerWidth) {
                    contextMenu.style.left = (x - rect.width) + 'px';
                }
                if (rect.bottom > window.innerHeight) {
                    contextMenu.style.top = (y - rect.height) + 'px';
                }
            });
        }

        function hideContextMenu() {
            contextMenu.style.display = 'none';
            contextTarget = null;
        }

        document.addEventListener('click', hideContextMenu);
        document.addEventListener('contextmenu', e => {
            if (!e.target.closest('.card') && !e.target.closest('.context-menu')) {
                hideContextMenu();
            }
        });

        contextMenu.addEventListener('click', async e => {
            const action = e.target.closest('.item')?.dataset.action;
            if (!action || !contextTarget) return;
            hideContextMenu();

            const { item } = contextTarget;
            switch (action) {
                case 'open':
                    if (item.type === 'dir') {
                        state.path = item.path;
                        load();
                    } else {
                        openFile(item);
                    }
                    break;
                case 'download':
                    if (item.download_url) {
                        window.open(item.download_url, '_blank');
                    } else {
                        alert('Download URL not available.');
                    }
                    break;
                case 'rename':
                    if (item.type === 'dir') {
                        alert('Renaming folders is not supported via the Contents API.');
                        return;
                    }
                    const newName = prompt('Enter new name:', item.name);
                    if (newName && newName.trim() && newName !== item.name) {
                        await renameItem(item, newName.trim());
                    }
                    break;
                case 'copyPath':
                    copyToClipboard(item.path);
                    break;
                case 'copyRaw':
                    if (item.download_url) {
                        copyToClipboard(item.download_url);
                    } else {
                        alert('Raw URL not available.');
                    }
                    break;
                case 'delete':
                    if (confirm(`Delete "${item.name}"?`)) {
                        try {
                            await api('DELETE', `/contents/${item.path}`, {
                                message: `Delete ${item.name}`,
                                sha: item.sha,
                                branch: state.branch,
                            });
                            load();
                        } catch (err) {
                            alert('Delete failed: ' + err.message);
                        }
                    }
                    break;
            }
        });

        function copyToClipboard(text) {
            if (navigator.clipboard) {
                navigator.clipboard.writeText(text).then(() => {
                    setStatus('Copied to clipboard', 'ok');
                    setTimeout(() => {
                        if (state.connected) setStatus(`✓ Connected: ${state.owner}/${state.repo}`, 'ok');
                    }, 1500);
                });
            } else {
                const input = document.createElement('input');
                input.value = text;
                document.body.appendChild(input);
                input.select();
                document.execCommand('copy');
                input.remove();
                alert('Path copied!');
            }
        }

        async function renameItem(item, newName) {
            const oldPath = item.path;
            const dir = oldPath.includes('/') ? oldPath.substring(0, oldPath.lastIndexOf('/') + 1) : '';
            const newPath = dir + newName;

            try {
                const data = await api('GET', `/contents/${oldPath}?ref=${state.branch}`);
                await api('PUT', `/contents/${newPath}`, {
                    message: `Rename ${item.name} → ${newName}`,
                    content: data.content, // already base64
                    branch: state.branch,
                });
                await api('DELETE', `/contents/${oldPath}`, {
                    message: `Remove old file after rename`,
                    sha: item.sha,
                    branch: state.branch,
                });
                load();
            } catch (err) {
                alert('Rename failed: ' + err.message);
            }
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  TEXT FILE DETECTION
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const TEXT_EXTS = new Set([
            'html', 'htm', 'css', 'scss', 'less', 'js', 'mjs', 'cjs', 'jsx', 'ts', 'tsx',
            'json', 'xml', 'svg', 'txt', 'md', 'markdown', 'yml', 'yaml', 'toml',
            'sh', 'bash', 'zsh', 'py', 'rb', 'php', 'go', 'rs', 'c', 'cpp', 'h', 'hpp',
            'vue', 'sql', 'log', 'env', 'gitignore', 'lock', 'conf', 'config', 'ini', 'cfg',
            'dockerfile', 'makefile', 'editorconfig', 'prettierrc', 'eslintrc'
        ]);

        function isTextFile(name) {
            const lower = name.toLowerCase();
            if (TEXT_EXTS.has(lower)) return true; // files without extension like Dockerfile
            const ext = lower.includes('.') ? lower.split('.').pop() : '';
            return TEXT_EXTS.has(ext);
        }

        function getCodeMirrorMode(name) {
            const ext = name.split('.').pop().toLowerCase();
            const map = {
                js: 'javascript', mjs: 'javascript', cjs: 'javascript', jsx: 'jsx',
                ts: 'javascript', tsx: 'javascript',
                css: 'css', scss: 'css', less: 'css',
                html: 'htmlmixed', htm: 'htmlmixed',
                xml: 'xml', svg: 'xml',
                md: 'markdown', markdown: 'markdown',
                py: 'python',
                sh: 'shell', bash: 'shell', zsh: 'shell',
                yml: 'yaml', yaml: 'yaml',
                json: { name: 'javascript', json: true },
                sql: 'sql'
            };
            return map[ext] || 'text/plain';
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  OPEN FILE → CODEMIRROR EDITOR
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        async function openFile(item) {
            if (!isTextFile(item.name)) {
                if (item.download_url) {
                    window.open(item.download_url, '_blank');
                } else {
                    alert('This file type cannot be edited here. Use Download.');
                }
                return;
            }

            setEditorStatus('Loading…', 'loading');
            try {
                const data = await api('GET', `/contents/${item.path}?ref=${state.branch}`);
                // GitHub sometimes returns content without encoding field, but always base64 for files
                let content = '';
                if (data.encoding === 'base64' || data.content) {
                    content = decodeBase64UTF8(data.content || '');
                } else {
                    content = data.content || '';
                }

                editorFile = {
                    path: item.path,
                    sha: data.sha,
                    name: item.name,
                    content,
                    savedContent: content,
                };
                openEditor(content);
                setEditorStatus('● saved', 'saved');
            } catch (e) {
                console.error('Open file error:', e);
                alert('Failed to load file: ' + e.message);
                setEditorStatus('✕ error', 'error');
            }
        }

        function openEditor(content) {
            edIcon.textContent = getFileIcon(editorFile.name, false);
            edFileName.textContent = editorFile.name;
            edFilePath.textContent = editorFile.path;

            // Clear previous instance
            if (cm) {
                cm.toTextArea(); // cleanup if any
                cm = null;
            }
            edBody.innerHTML = '';

            // Create textarea for CodeMirror
            const ta = document.createElement('textarea');
            ta.value = content;
            edBody.appendChild(ta);

            cm = CodeMirror.fromTextArea(ta, {
                mode: getCodeMirrorMode(editorFile.name),
                theme: 'material-darker',
                lineNumbers: true,
                lineWrapping: true,
                indentUnit: 2,
                tabSize: 2,
                indentWithTabs: false,
                matchBrackets: true,
                autoCloseBrackets: true,
                styleActiveLine: true,
                extraKeys: {
                    'Ctrl-S': function () { saveFile(); },
                    'Cmd-S': function () { saveFile(); },
                    'Esc': function () { closeEditor(); },
                    'Ctrl-F': 'findPersistent',
                    'Cmd-F': 'findPersistent',
                }
            });

            // Make sure it fills the container
            setTimeout(() => cm.refresh(), 50);
            setTimeout(() => cm.refresh(), 200);

            // Dirty tracking
            cm.on('change', () => {
                const current = cm.getValue();
                const dirty = current !== editorFile.savedContent;
                setEditorStatus(dirty ? '● unsaved' : '● saved', dirty ? 'dirty' : 'saved');
                updateEditorInfo();
            });

            updateEditorInfo();
            edOverlay.classList.add('open');
            cm.focus();
        }

        function closeEditor() {
            if (editorFile && cm) {
                const current = cm.getValue();
                if (current !== editorFile.savedContent) {
                    if (!confirm('You have unsaved changes. Discard them?')) return;
                }
            }
            edOverlay.classList.remove('open');
            if (cm) {
                cm.toTextArea();
                cm = null;
            }
            editorFile = null;
            edBody.innerHTML = '';
        }

        function setEditorStatus(text, type) {
            edStatus.textContent = text;
            edStatus.className = 'editor-status' + (type ? ' ' + type : '');
        }

        function updateEditorInfo() {
            if (!cm) return;
            const content = cm.getValue();
            const lines = content.split('\n').length;
            const size = new Blob([content]).size;
            edLines.textContent = lines;
            edSize.textContent = formatSize(size);
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  SAVE FILE
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        async function saveFile() {
            if (!editorFile || !cm) return;
            const content = cm.getValue();
            if (content === editorFile.savedContent) {
                setEditorStatus('● no changes', 'saved');
                return;
            }

            const base64 = encodeBase64UTF8(content);
            edSave.disabled = true;
            setEditorStatus('Saving…', 'loading');
            try {
                const result = await api('PUT', `/contents/${editorFile.path}`, {
                    message: `Update ${editorFile.name}`,
                    content: base64,
                    sha: editorFile.sha,
                    branch: state.branch,
                });
                editorFile.savedContent = content;
                // GitHub returns the new content object with new sha
                if (result && result.content && result.content.sha) {
                    editorFile.sha = result.content.sha;
                } else {
                    // fallback: re-fetch
                    const data = await api('GET', `/contents/${editorFile.path}?ref=${state.branch}`);
                    editorFile.sha = data.sha;
                }
                setEditorStatus('● saved ✓', 'saved');
                load(); // refresh list (size may change)
            } catch (e) {
                console.error('Save error:', e);
                setEditorStatus('✕ save failed', 'error');
                alert('Save failed: ' + e.message);
            } finally {
                edSave.disabled = false;
            }
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  UPLOAD
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const r = new FileReader();
                r.onload = () => {
                    // data URL → pure base64
                    const result = r.result;
                    resolve(result.split(',')[1]);
                };
                r.onerror = reject;
                r.readAsDataURL(file);
            });
        }

        async function uploadFiles(files) {
            if (!files.length) return;
            setStatus('Uploading…', 'loading');
            let ok = 0, fail = 0;
            for (const file of files) {
                try {
                    const base64 = await fileToBase64(file);
                    const path = state.path ? `${state.path}/${file.name}` : file.name;
                    let sha = undefined;
                    try {
                        const exist = await api('GET', `/contents/${path}?ref=${state.branch}`);
                        sha = exist.sha;
                    } catch (_) { /* new file */ }

                    await api('PUT', `/contents/${path}`, {
                        message: `Upload ${file.name}`,
                        content: base64,
                        sha,
                        branch: state.branch,
                    });
                    ok++;
                } catch (e) {
                    console.error('Upload error:', e);
                    alert(`Failed to upload "${file.name}": ${e.message}`);
                    fail++;
                }
            }
            load();
            setStatus(fail ? `Upload finished (${ok} ok, ${fail} failed)` : 'Upload complete', fail ? 'err' : 'ok');
            setTimeout(() => {
                if (state.connected) setStatus(`✓ Connected: ${state.owner}/${state.repo}`, 'ok');
            }, 2500);
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  NEW FOLDER / NEW FILE
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        async function newFolder() {
            const name = prompt('Enter folder name:');
            if (!name || !name.trim()) return;
            const clean = name.trim().replace(/[\\/]/g, '-');
            const path = state.path ? `${state.path}/${clean}/.gitkeep` : `${clean}/.gitkeep`;
            try {
                await api('PUT', `/contents/${path}`, {
                    message: `Create folder ${clean}`,
                    content: encodeBase64UTF8(''),
                    branch: state.branch,
                });
                load();
            } catch (e) {
                console.error('New folder error:', e);
                alert('Failed to create folder: ' + e.message);
            }
        }

        async function newFile() {
            const name = prompt('Enter new file name (e.g. index.html or notes.md):');
            if (!name || !name.trim()) return;
            const clean = name.trim().replace(/[\\/]/g, '-');
            if (!clean) return;

            const path = state.path ? `${state.path}/${clean}` : clean;

            // Check existence
            try {
                await api('GET', `/contents/${path}?ref=${state.branch}`);
                if (!confirm(`"${clean}" already exists. Open it instead?`)) return;
                const item = { path, name: clean, type: 'file' };
                // We need sha – fetch properly
                const data = await api('GET', `/contents/${path}?ref=${state.branch}`);
                openFile({ ...item, sha: data.sha, download_url: data.download_url });
                return;
            } catch (_) { /* does not exist – good */ }

            try {
                // Create empty file
                await api('PUT', `/contents/${path}`, {
                    message: `Create ${clean}`,
                    content: encodeBase64UTF8(''),
                    branch: state.branch,
                });
                // Open it for editing
                const data = await api('GET', `/contents/${path}?ref=${state.branch}`);
                openFile({
                    path: data.path,
                    name: data.name,
                    sha: data.sha,
                    type: 'file',
                    download_url: data.download_url
                });
            } catch (e) {
                console.error('New file error:', e);
                alert('Failed to create file: ' + e.message);
            }
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  HELPERS
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function setStatus(text, type) {
            statusEl.textContent = text;
            statusEl.className = 'status' + (type ? ' ' + type : '');
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  EVENT BINDING
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        connectBtn.addEventListener('click', connect);
        repoInput.addEventListener('keydown', e => { if (e.key === 'Enter') connect(); });
        tokenInput.addEventListener('keydown', e => { if (e.key === 'Enter') connect(); });

        $('uploadBtn').onclick = () => fileInput.click();
        fileInput.onchange = e => {
            if (e.target.files.length) {
                uploadFiles([...e.target.files]);
                e.target.value = '';
            }
        };

        $('newFolder').onclick = newFolder;
        $('newFileBtn').onclick = newFile;
        $('refreshBtn').onclick = load;

        drop.onclick = () => fileInput.click();
        drop.ondragover = e => {
            e.preventDefault();
            drop.classList.add('drag');
        };
        drop.ondragleave = () => drop.classList.remove('drag');
        drop.ondrop = e => {
            e.preventDefault();
            drop.classList.remove('drag');
            if (e.dataTransfer.files.length) {
                uploadFiles([...e.dataTransfer.files]);
            }
        };

        edClose.addEventListener('click', closeEditor);
        edCancel.addEventListener('click', closeEditor);
        edSave.addEventListener('click', saveFile);
        edOverlay.addEventListener('click', e => {
            if (e.target === edOverlay) closeEditor();
        });

        document.addEventListener('keydown', e => {
            if (e.key === 'Escape' && editorFile) closeEditor();
        });

        // Resize CodeMirror when window resizes while open
        window.addEventListener('resize', () => {
            if (cm && edOverlay.classList.contains('open')) {
                cm.refresh();
            }
        });

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  AUTO-CONNECT
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        if (savedToken) {
            setTimeout(connect, 400);
        }
    </script>
</body>
</html>
