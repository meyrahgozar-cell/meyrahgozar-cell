<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub File Manager</title>
    <style>
        /* ─── Reset & base ─── */
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            font-family: system-ui, -apple-system, sans-serif;
            background: #0a0a12;
            color: #e0e0ff;
            min-height: 100vh;
        }

        /* ─── Scrollbar ─── */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #141420;
        }
        ::-webkit-scrollbar-thumb {
            background: #2a2a3a;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3a3a4a;
        }

        /* ─── Header ─── */
        header {
            padding: 14px 20px;
            background: #11111b;
            border-bottom: 1px solid #222;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        header form {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            flex: 1;
        }
        header input {
            background: #1a1a2e;
            border: 1px solid #2a2a3a;
            color: #e0e0ff;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 14px;
            transition: border .2s;
            min-width: 180px;
        }
        header input:focus {
            outline: none;
            border-color: #00f0ff;
            box-shadow: 0 0 0 3px #00f0ff22;
        }
        header input::placeholder {
            color: #555;
        }
        header button {
            background: transparent;
            border: 1px solid #00f0ff;
            color: #00f0ff;
            padding: 8px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: background .2s;
            white-space: nowrap;
        }
        header button:hover {
            background: #00f0ff22;
        }
        header button:disabled {
            opacity: .5;
            cursor: not-allowed;
        }
        .status {
            font-size: 13px;
            color: #888;
            margin-left: auto;
            white-space: nowrap;
        }
        .status.ok {
            color: #00ff9f;
        }
        .status.err {
            color: #ff4d6d;
        }
        .status.loading {
            color: #ffd93d;
        }

        /* ─── Path bar ─── */
        .path {
            padding: 10px 20px;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 13px;
            color: #00f0ff;
            border-bottom: 1px solid #1a1a2a;
            background: #0d0d18;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .path .crumb {
            color: #888;
            cursor: pointer;
            transition: color .2s;
        }
        .path .crumb:hover {
            color: #00f0ff;
        }
        .path .sep {
            color: #333;
            user-select: none;
        }

        /* ─── Toolbar ─── */
        .toolbar {
            padding: 10px 20px;
            display: none;
            gap: 10px;
            border-bottom: 1px solid #1a1a2a;
            background: #0d0d18;
            flex-wrap: wrap;
            align-items: center;
        }
        .toolbar button {
            background: transparent;
            border: 1px solid #2a2a3a;
            color: #c0c0e0;
            padding: 6px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: all .2s;
        }
        .toolbar button:hover {
            border-color: #00f0ff;
            color: #00f0ff;
            background: #00f0ff11;
        }
        .toolbar button.primary {
            background: #00f0ff;
            border-color: #00f0ff;
            color: #0a0a12;
        }
        .toolbar button.primary:hover {
            background: #00d4e8;
            border-color: #00d4e8;
        }
        .toolbar .count {
            font-size: 12px;
            color: #666;
            margin-left: 4px;
        }
        .toolbar .spacer {
            flex: 1;
        }

        /* ─── Drop area ─── */
        .upload-area {
            margin: 16px 20px 8px;
            border: 2px dashed #2a2a3a;
            border-radius: 12px;
            padding: 28px;
            text-align: center;
            color: #666;
            cursor: pointer;
            transition: all .3s;
            display: none;
            background: #0d0d18;
        }
        .upload-area:hover {
            border-color: #444;
            background: #11111f;
        }
        .upload-area.drag {
            border-color: #00f0ff;
            background: #00f0ff11;
        }
        .upload-area .icon {
            font-size: 32px;
            display: block;
            margin-bottom: 6px;
        }
        .upload-area .sub {
            font-size: 12px;
            color: #555;
            margin-top: 4px;
        }

        /* ─── File grid ─── */
        .files {
            padding: 16px 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 14px;
        }
        .card {
            background: #141420;
            border: 1px solid #22223a;
            border-radius: 12px;
            padding: 18px 10px 14px;
            text-align: center;
            cursor: pointer;
            position: relative;
            transition: all .25s;
            user-select: none;
        }
        .card:hover {
            border-color: #00f0ff;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 240, 255, 0.06);
        }
        .card .icon-big {
            font-size: 32px;
            line-height: 1.2;
        }
        .card .name {
            font-size: 13px;
            word-break: break-all;
            margin-top: 8px;
            font-weight: 500;
            color: #e0e0ff;
        }
        .card .meta {
            font-size: 11px;
            color: #777;
            margin-top: 4px;
        }
        .card .del {
            position: absolute;
            top: 6px;
            right: 6px;
            background: #2a0a0a;
            border: 1px solid #ff4d6d;
            color: #ff4d6d;
            width: 26px;
            height: 26px;
            border-radius: 6px;
            font-size: 13px;
            display: none;
            cursor: pointer;
            align-items: center;
            justify-content: center;
            transition: background .2s;
            z-index: 2;
        }
        .card .del:hover {
            background: #ff4d6d22;
        }
        .card:hover .del {
            display: flex;
        }
        .card .ext-badge {
            position: absolute;
            bottom: 6px;
            right: 6px;
            font-size: 9px;
            background: #1a1a2e;
            padding: 2px 6px;
            border-radius: 4px;
            color: #555;
            text-transform: uppercase;
            letter-spacing: .3px;
        }
        .card.folder .icon-big {
            filter: drop-shadow(0 2px 4px rgba(0, 240, 255, 0.1));
        }

        /* ─── Message ─── */
        .msg {
            padding: 60px 20px;
            text-align: center;
            color: #555;
            font-size: 15px;
        }
        .msg .emoji {
            font-size: 40px;
            display: block;
            margin-bottom: 12px;
        }

        /* ─── Editor Modal ─── */
        .editor-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .78);
            backdrop-filter: blur(6px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeIn .2s ease;
        }
        .editor-overlay.open {
            display: flex;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(.97);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .editor-modal {
            background: #11111f;
            border: 1px solid #2a2a3a;
            border-radius: 16px;
            width: 100%;
            max-width: 920px;
            height: min(90vh, 800px);
            display: flex;
            flex-direction: column;
            box-shadow: 0 24px 80px rgba(0, 0, 0, .8);
            overflow: hidden;
        }

        .editor-header {
            padding: 12px 20px;
            border-bottom: 1px solid #1a1a2a;
            display: flex;
            align-items: center;
            gap: 14px;
            flex-shrink: 0;
            background: #0d0d18;
        }
        .editor-header .file-icon {
            font-size: 20px;
        }
        .editor-header .file-name {
            font-weight: 600;
            font-size: 14px;
            color: #e0e0ff;
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .editor-header .file-path {
            font-size: 11px;
            color: #555;
            font-family: monospace;
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .editor-header .editor-status {
            font-size: 11px;
            color: #888;
            padding: 2px 10px;
            border-radius: 12px;
            background: #1a1a2e;
        }
        .editor-header .editor-status.saved {
            color: #00ff9f;
        }
        .editor-header .editor-status.dirty {
            color: #ffd93d;
        }
        .editor-header .editor-status.error {
            color: #ff4d6d;
        }
        .editor-header .close-btn {
            background: none;
            border: none;
            color: #666;
            font-size: 24px;
            cursor: pointer;
            padding: 0 6px;
            line-height: 1;
            transition: color .2s;
        }
        .editor-header .close-btn:hover {
            color: #ff4d6d;
        }

        .editor-body {
            flex: 1;
            position: relative;
            overflow: auto;
            background: #0a0a12;
            min-height: 0;
        }

        .editor-wrap {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
            font-size: 14px;
            line-height: 1.6;
            background: #0a0a12;
        }

        .line-gutter {
            flex-shrink: 0;
            width: 44px;
            background: #0a0a12;
            color: #444;
            text-align: right;
            padding: 12px 10px 12px 0;
            user-select: none;
            overflow: hidden;
            border-right: 1px solid #1a1a2a;
            font-size: 13px;
            line-height: 1.6;
            font-family: inherit;
            position: sticky;
            left: 0;
            top: 0;
            height: 100%;
            z-index: 2;
        }
        .line-gutter .ln {
            display: block;
            padding-right: 4px;
        }

        .code-container {
            flex: 1;
            position: relative;
            overflow: auto;
            min-height: 100%;
        }

        .code-container pre {
            margin: 0;
            padding: 12px 16px;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: inherit;
            font-size: 14px;
            line-height: 1.6;
            color: #e0e0ff;
            background: transparent;
            min-height: 100%;
            pointer-events: none;
            position: absolute;
            inset: 0;
            z-index: 1;
        }
        .code-container pre .token {
            pointer-events: none;
        }
        .code-container pre .kw {
            color: #ff79c6;
        }
        .code-container pre .str {
            color: #f1fa8c;
        }
        .code-container pre .cmt {
            color: #6272a4;
            font-style: italic;
        }
        .code-container pre .fn {
            color: #50fa7b;
        }
        .code-container pre .num {
            color: #bd93f9;
        }
        .code-container pre .op {
            color: #ff79c6;
        }
        .code-container pre .cls {
            color: #8be9fd;
        }
        .code-container pre .tag {
            color: #ff79c6;
        }
        .code-container pre .attr {
            color: #50fa7b;
        }
        .code-container pre .val {
            color: #f1fa8c;
        }
        .code-container pre .prop {
            color: #8be9fd;
        }
        .code-container pre .bool {
            color: #bd93f9;
        }
        .code-container pre .null {
            color: #ff5555;
        }

        .code-container textarea {
            position: absolute;
            inset: 0;
            margin: 0;
            padding: 12px 16px;
            font-family: inherit;
            font-size: 14px;
            line-height: 1.6;
            color: transparent;
            background: transparent;
            border: none;
            outline: none;
            resize: none;
            white-space: pre-wrap;
            word-wrap: break-word;
            caret-color: #e0e0ff;
            overflow: auto;
            width: 100%;
            height: 100%;
            tab-size: 2;
            z-index: 3;
            letter-spacing: 0;
            text-shadow: 0 0 0 rgba(0, 0, 0, 0);
        }
        .code-container textarea::selection {
            background: #00f0ff33;
            color: transparent;
        }
        .code-container textarea:focus {
            outline: none;
        }

        .editor-footer {
            padding: 10px 20px;
            border-top: 1px solid #1a1a2a;
            display: flex;
            gap: 12px;
            flex-shrink: 0;
            background: #0d0d18;
            flex-wrap: wrap;
            align-items: center;
        }
        .editor-footer .info {
            font-size: 12px;
            color: #555;
            flex: 1;
        }
        .editor-footer .info span {
            color: #888;
        }
        .editor-footer button {
            padding: 6px 18px;
            border-radius: 6px;
            border: 1px solid #2a2a3a;
            background: transparent;
            color: #c0c0e0;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all .2s;
        }
        .editor-footer button:hover {
            border-color: #00f0ff;
            color: #00f0ff;
        }
        .editor-footer button.primary {
            background: #00f0ff;
            border-color: #00f0ff;
            color: #0a0a12;
        }
        .editor-footer button.primary:hover {
            background: #00d4e8;
            border-color: #00d4e8;
        }
        .editor-footer button.primary:disabled {
            opacity: .4;
            cursor: not-allowed;
        }

        /* ─── Responsive ─── */
        @media (max-width: 640px) {
            header form input {
                min-width: 120px;
                width: 100%;
            }
            .files {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
                gap: 10px;
                padding: 12px;
            }
            .editor-modal {
                height: 100vh;
                max-height: 100vh;
                border-radius: 0;
            }
            .editor-overlay {
                padding: 0;
            }
            .editor-header .file-path {
                max-width: 80px;
            }
            .line-gutter {
                width: 32px;
                font-size: 11px;
                padding: 10px 6px 10px 0;
            }
            .code-container pre,
            .code-container textarea {
                font-size: 12px;
                padding: 10px 12px;
            }
            .card .del {
                display: flex;
                width: 22px;
                height: 22px;
                font-size: 11px;
            }
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- ─── HEADER ─── -->
    <header>
        <form id="auth" autocomplete="off">
            <input id="repo" type="text" value="meyrahgozar-cell/meyrahgozar-cell" placeholder="owner/repo" autocomplete="off" />
            <input id="token" type="password" placeholder="GitHub Token" autocomplete="new-password" />
            <button type="button" id="connectBtn">Connect</button>
        </form>
        <div class="status" id="status">Not connected</div>
    </header>

    <!-- ─── PATH ─── -->
    <div class="path" id="path"></div>

    <!-- ─── TOOLBAR ─── -->
    <div class="toolbar" id="toolbar">
        <button type="button" class="primary" id="uploadBtn">📤 Upload</button>
        <button type="button" id="newFolder">📁 New Folder</button>
        <button type="button" id="refreshBtn">⟳ Refresh</button>
        <input type="file" id="fileInput" multiple hidden />
        <span class="count" id="fileCount"></span>
        <span class="spacer"></span>
        <span style="font-size:12px;color:#555" id="branchLabel">main</span>
    </div>

    <!-- ─── DROP ZONE ─── -->
    <div class="upload-area" id="drop">
        <span class="icon">📂</span>
        Drop files here or click to upload
        <div class="sub">Supports multiple files</div>
    </div>

    <!-- ─── FILE GRID ─── -->
    <div class="files" id="files"></div>
    <div class="msg" id="msg"><span class="emoji">🔑</span>Enter your token and click Connect</div>

    <!-- ─── EDITOR OVERLAY ─── -->
    <div class="editor-overlay" id="editorOverlay">
        <div class="editor-modal">
            <div class="editor-header">
                <span class="file-icon" id="edIcon">📄</span>
                <span class="file-name" id="edFileName">file.html</span>
                <span class="file-path" id="edFilePath">path/to/file</span>
                <span class="editor-status" id="edStatus">● saved</span>
                <button class="close-btn" id="edClose">✕</button>
            </div>
            <div class="editor-body" id="edBody">
                <div class="editor-wrap">
                    <div class="line-gutter" id="lineGutter"></div>
                    <div class="code-container" id="codeContainer">
                        <pre id="codePre"><code id="codeHighlight"></code></pre>
                        <textarea id="codeEditor" spellcheck="false" autofocus></textarea>
                    </div>
                </div>
            </div>
            <div class="editor-footer">
                <div class="info" id="edInfo"><span id="edLines">0</span> lines · <span id="edSize">0</span> B</div>
                <button id="edCancel">Cancel</button>
                <button class="primary" id="edSave">💾 Save</button>
            </div>
        </div>
    </div>

    <script>
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  STATE
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const state = {
            owner: 'meyrahgozar-cell',
            repo: 'meyrahgozar-cell',
            token: '',
            path: '',
            branch: 'main',
            connected: false,
        };

        const editor = {
            file: null,
            dirty: false,
            savedContent: '',
            isOpen: false,
        };

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  DOM REFS
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const $ = id => document.getElementById(id);
        const repoInput = $('repo');
        const tokenInput = $('token');
        const statusEl = $('status');
        const pathEl = $('path');
        const filesEl = $('files');
        const msgEl = $('msg');
        const toolbar = $('toolbar');
        const drop = $('drop');
        const fileInput = $('fileInput');
        const fileCount = $('fileCount');
        const branchLabel = $('branchLabel');
        const connectBtn = $('connectBtn');

        const edOverlay = $('editorOverlay');
        const edIcon = $('edIcon');
        const edFileName = $('edFileName');
        const edFilePath = $('edFilePath');
        const edStatus = $('edStatus');
        const edClose = $('edClose');
        const edCancel = $('edCancel');
        const edSave = $('edSave');
        const edInfo = $('edInfo');
        const edLines = $('edLines');
        const edSize = $('edSize');
        const edEditor = $('codeEditor');
        const edPre = $('codeHighlight');
        const edGutter = $('lineGutter');

        const savedToken = localStorage.getItem('fm_token');
        if (savedToken) tokenInput.value = savedToken;

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  GITHUB API - with retry logic and better timeout
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function apiUrl(path) {
            return `https://api.github.com/repos/${state.owner}/${state.repo}${path}`;
        }

        async function api(method, path, body, retries = 2) {
            const url = apiUrl(path);

            for (let attempt = 0; attempt <= retries; attempt++) {
                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), 10000);

                const opts = {
                    method,
                    headers: {
                        Accept: 'application/vnd.github.v3+json',
                        Authorization: `token ${state.token}`,
                        'Content-Type': 'application/json',
                        'User-Agent': 'GitHub-File-Manager/1.0',
                    },
                    signal: controller.signal,
                };
                if (body) opts.body = JSON.stringify(body);

                try {
                    const res = await fetch(url, opts);
                    clearTimeout(timeout);
                    if (res.status === 204) return null;
                    const data = await res.json();
                    if (!res.ok) {
                        throw new Error(data.message || `HTTP ${res.status}`);
                    }
                    return data;
                } catch (err) {
                    clearTimeout(timeout);
                    if (err.name === 'AbortError') {
                        if (attempt < retries) {
                            console.log(`Retry ${attempt + 1}/${retries} for ${path}`);
                            await new Promise(r => setTimeout(r, 1000 * (attempt + 1)));
                            continue;
                        }
                        throw new Error('Connection timeout. Please check your internet and try again.');
                    }
                    if (attempt < retries && err.message.includes('network')) {
                        console.log(`Retry ${attempt + 1}/${retries} for ${path}`);
                        await new Promise(r => setTimeout(r, 1000 * (attempt + 1)));
                        continue;
                    }
                    throw err;
                }
            }
            throw new Error('Max retries exceeded');
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  CONNECT
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        async function connect() {
            const repoVal = repoInput.value.trim();
            const token = tokenInput.value.trim();

            if (!repoVal.includes('/') || !token) {
                setStatus('Please fill both fields', 'err');
                alert('Please fill both fields (owner/repo and token)');
                return;
            }

            const [owner, repo] = repoVal.split('/');
            state.owner = owner;
            state.repo = repo;
            state.token = token;
            state.path = '';

            connectBtn.disabled = true;
            connectBtn.textContent = 'Connecting…';
            setStatus('Connecting…', 'loading');

            try {
                // Test with a simple GET request to verify token
                const info = await api('GET', '', null, 3);
                state.branch = info.default_branch || 'main';
                state.connected = true;
                localStorage.setItem('fm_token', token);
                setStatus(`✓ Connected: ${info.full_name}`, 'ok');
                toolbar.style.display = 'flex';
                drop.style.display = 'block';
                msgEl.style.display = 'none';
                branchLabel.textContent = state.branch;
                await load();
            } catch (err) {
                console.error('Connection error:', err);
                setStatus('✗ Failed: ' + err.message, 'err');
                alert('Connection failed: ' + err.message + '\n\nMake sure:\n• Token has repo scope\n• Repo exists and is public/accessible');
                state.connected = false;
            } finally {
                connectBtn.disabled = false;
                connectBtn.textContent = 'Connect';
            }
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  LOAD DIRECTORY
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        async function load() {
            if (!state.connected) return;
            filesEl.innerHTML = '';
            pathEl.innerHTML = buildPathCrumbs();

            try {
                const data = await api('GET', `/contents/${state.path}?ref=${state.branch}`);
                const items = Array.isArray(data) ? data : [data];
                items.sort((a, b) => {
                    if (a.type === b.type) return a.name.localeCompare(b.name);
                    return a.type === 'dir' ? -1 : 1;
                });

                if (state.path) {
                    const back = makeCard('..', '⬅️', 'folder', null, true);
                    back.onclick = () => {
                        const parts = state.path.split('/');
                        parts.pop();
                        state.path = parts.join('/');
                        load();
                    };
                    filesEl.appendChild(back);
                }

                let fileCountNum = 0;
                items.forEach(item => {
                    const isDir = item.type === 'dir';
                    const icon = getFileIcon(item.name, isDir);
                    const meta = isDir ? 'Folder' : formatSize(item.size);
                    const card = makeCard(item.name, icon, isDir ? 'folder' : 'file', meta);
                    const ext = item.name.split('.').pop().toLowerCase();

                    const delBtn = document.createElement('button');
                    delBtn.className = 'del';
                    delBtn.textContent = '✕';
                    delBtn.title = 'Delete';
                    delBtn.onclick = async e => {
                        e.stopPropagation();
                        if (!confirm(`Delete "${item.name}"?`)) return;
                        try {
                            await api('DELETE', `/contents/${item.path}`, {
                                message: `Delete ${item.name}`,
                                sha: item.sha,
                                branch: state.branch,
                            });
                            load();
                        } catch (err) {
                            alert('Delete failed: ' + err.message);
                        }
                    };
                    card.appendChild(delBtn);

                    if (!isDir) {
                        const badge = document.createElement('span');
                        badge.className = 'ext-badge';
                        badge.textContent = ext || 'file';
                        card.appendChild(badge);
                    }

                    card.onclick = () => {
                        if (isDir) {
                            state.path = item.path;
                            load();
                        } else {
                            openFile(item);
                        }
                    };

                    filesEl.appendChild(card);
                    fileCountNum++;
                });

                fileCount.textContent = fileCountNum + ' item' + (fileCountNum !== 1 ? 's' : '');
                if (items.length === 0 && state.path) {
                    const empty = document.createElement('div');
                    empty.className = 'msg';
                    empty.innerHTML = '<span class="emoji">📭</span>This folder is empty';
                    empty.style.padding = '40px 20px';
                    filesEl.appendChild(empty);
                }
            } catch (e) {
                console.error('Load error:', e);
                filesEl.innerHTML = `<div class="msg"><span class="emoji">⚠️</span>${e.message}</div>`;
            }
        }

        function buildPathCrumbs() {
            const parts = state.path.split('/').filter(Boolean);
            let html = `<span class="crumb" data-path="">📁 root</span>`;
            let cur = '';
            parts.forEach((p, i) => {
                cur += (cur ? '/' : '') + p;
                const isLast = i === parts.length - 1;
                html += `<span class="sep"> / </span>`;
                if (isLast) {
                    html += `<span class="crumb" style="color:#e0e0ff">${p}</span>`;
                } else {
                    html += `<span class="crumb" data-path="${cur}">${p}</span>`;
                }
            });
            setTimeout(() => {
                pathEl.querySelectorAll('.crumb[data-path]').forEach(el => {
                    el.onclick = () => {
                        state.path = el.dataset.path;
                        load();
                    };
                });
            }, 0);
            return html;
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  FILE ICONS
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function getFileIcon(name, isDir) {
            if (isDir) return '📁';
            const ext = name.split('.').pop().toLowerCase();
            const map = {
                html: '🌐',
                css: '🎨',
                js: '⚡',
                json: '📋',
                md: '📝',
                txt: '📄',
                xml: '📰',
                svg: '🖼️',
                png: '🖼️',
                jpg: '🖼️',
                jpeg: '🖼️',
                gif: '🖼️',
                ico: '🖼️',
                webp: '🖼️',
                pdf: '📕',
                zip: '📦',
                tar: '📦',
                gz: '📦',
                rar: '📦',
                py: '🐍',
                rb: '💎',
                php: '🐘',
                go: '🐹',
                rs: '🦀',
                c: '⚙️',
                cpp: '⚙️',
                h: '⚙️',
                sh: '🐚',
                yml: '📜',
                yaml: '📜',
                toml: '📜',
                lock: '🔒',
                gitignore: '🙈',
                env: '🔐',
                vue: '🟢',
                ts: '🔷',
                tsx: '🔷',
                jsx: '⚡',
                scss: '🎨',
                less: '🎨',
                sql: '🗄️',
            };
            return map[ext] || '📄';
        }

        function formatSize(b) {
            if (!b) return '';
            if (b < 1024) return b + ' B';
            if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
            return (b / 1048576).toFixed(1) + ' MB';
        }

        function makeCard(name, icon, type, meta, isBack) {
            const card = document.createElement('div');
            card.className = 'card' + (type === 'folder' ? ' folder' : '');
            card.innerHTML = `
            <div class="icon-big">${icon}</div>
            <div class="name">${name}</div>
            ${meta ? `<div class="meta">${meta}</div>` : ''}
          `;
            return card;
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  OPEN FILE → EDITOR
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const TEXT_EXTS = new Set([
            'html', 'htm', 'css', 'js', 'mjs', 'json', 'xml', 'svg', 'txt',
            'md', 'markdown', 'yml', 'yaml', 'toml', 'sh', 'bash', 'zsh',
            'py', 'rb', 'php', 'go', 'rs', 'c', 'cpp', 'h', 'hpp', 'vue',
            'ts', 'tsx', 'jsx', 'scss', 'less', 'sql', 'log', 'env',
            'gitignore', 'lock', 'conf', 'config', 'ini', 'cfg'
        ]);

        function isTextFile(name) {
            const ext = name.split('.').pop().toLowerCase();
            return TEXT_EXTS.has(ext);
        }

        async function openFile(item) {
            if (!isTextFile(item.name)) {
                if (item.download_url) {
                    window.open(item.download_url, '_blank');
                } else {
                    alert('This file type cannot be previewed.');
                }
                return;
            }

            setEditorStatus('loading…', 'loading');
            try {
                const data = await api('GET', `/contents/${item.path}?ref=${state.branch}`);
                const content = atob(data.content);
                editor.file = {
                    path: item.path,
                    sha: data.sha,
                    name: item.name,
                    content: content,
                    size: data.size || content.length,
                };
                editor.savedContent = content;
                editor.dirty = false;
                openEditor();
                setEditorContent(content);
                setEditorStatus('● saved', 'saved');
            } catch (e) {
                console.error('Open file error:', e);
                alert('Failed to load file: ' + e.message);
            }
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  EDITOR UI
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function openEditor() {
            const f = editor.file;
            edIcon.textContent = getFileIcon(f.name, false);
            edFileName.textContent = f.name;
            edFilePath.textContent = f.path;
            edOverlay.classList.add('open');
            editor.isOpen = true;
            setTimeout(() => {
                edEditor.focus();
                edEditor.scrollTop = 0;
            }, 50);
        }

        function closeEditor() {
            if (editor.dirty) {
                if (!confirm('You have unsaved changes. Discard them?')) return;
            }
            edOverlay.classList.remove('open');
            editor.isOpen = false;
            editor.file = null;
            editor.dirty = false;
        }

        function setEditorContent(content) {
            edEditor.value = content;
            edPre.textContent = content;
            updateLineNumbers();
            updateEditorInfo();
            highlightSyntax();
            edEditor.scrollTop = 0;
            edPre.parentElement.scrollTop = 0;
        }

        function setEditorStatus(text, type) {
            edStatus.textContent = text;
            edStatus.className = 'editor-status' + (type ? ' ' + type : '');
        }

        function updateLineNumbers() {
            const lines = edEditor.value.split('\n');
            const count = lines.length;
            edGutter.innerHTML = '';
            for (let i = 1; i <= count; i++) {
                const span = document.createElement('span');
                span.className = 'ln';
                span.textContent = i;
                edGutter.appendChild(span);
            }
            edLines.textContent = count;
        }

        function updateEditorInfo() {
            const size = new Blob([edEditor.value]).size;
            edSize.textContent = formatSize(size);
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  SYNTAX HIGHLIGHTER
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function highlightSyntax() {
            const code = edEditor.value;
            const ext = editor.file ? editor.file.name.split('.').pop().toLowerCase() : 'txt';
            let html = '';
            if (ext === 'html' || ext === 'htm') {
                html = highlightHTML(code);
            } else if (ext === 'css') {
                html = highlightCSS(code);
            } else if (ext === 'js' || ext === 'mjs' || ext === 'ts' || ext === 'jsx' || ext === 'tsx') {
                html = highlightJS(code);
            } else if (ext === 'json') {
                html = highlightJSON(code);
            } else if (ext === 'xml' || ext === 'svg') {
                html = highlightXML(code);
            } else {
                html = escapeHTML(code);
            }
            edPre.innerHTML = html;
        }

        function escapeHTML(str) {
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        function wrapToken(text, cls) {
            return `<span class="token ${cls}">${escapeHTML(text)}</span>`;
        }

        function highlightHTML(code) {
            let out = '';
            let i = 0;
            const len = code.length;
            while (i < len) {
                const ch = code[i];
                if (ch === '<') {
                    if (code[i + 1] === '/') {
                        let j = i + 2;
                        while (j < len && code[j] !== '>') j++;
                        const tag = code.slice(i, j + 1);
                        out += wrapToken(tag, 'tag');
                        i = j + 1;
                    } else if (code[i + 1] === '!') {
                        let j = i + 2;
                        if (code.slice(i, i + 4) === '<!--') {
                            while (j < len && !(code[j - 2] === '-' && code[j - 1] === '-')) j++;
                            const cmt = code.slice(i, j + 1);
                            out += wrapToken(cmt, 'cmt');
                            i = j + 1;
                        } else {
                            while (j < len && code[j] !== '>') j++;
                            const doctype = code.slice(i, j + 1);
                            out += wrapToken(doctype, 'tag');
                            i = j + 1;
                        }
                    } else {
                        let j = i + 1;
                        while (j < len && code[j] !== '>' && code[j] !== ' ') j++;
                        const tagName = code.slice(i, j);
                        out += wrapToken(tagName, 'tag');
                        i = j;
                        while (i < len && code[i] !== '>') {
                            if (code[i] === ' ') {
                                out += ' ';
                                i++;
                                continue;
                            }
                            let aStart = i;
                            while (i < len && code[i] !== '=' && code[i] !== ' ' && code[i] !== '>') i++;
                            const attrName = code.slice(aStart, i);
                            out += wrapToken(attrName, 'attr');
                            if (code[i] === '=') {
                                out += '=';
                                i++;
                                const quote = code[i];
                                if (quote === '"' || quote === "'") {
                                    out += quote;
                                    i++;
                                    let vStart = i;
                                    while (i < len && code[i] !== quote) i++;
                                    const val = code.slice(vStart, i);
                                    out += wrapToken(val, 'val');
                                    out += quote;
                                    i++;
                                } else {
                                    let vStart = i;
                                    while (i < len && code[i] !== ' ' && code[i] !== '>') i++;
                                    const val = code.slice(vStart, i);
                                    out += wrapToken(val, 'val');
                                }
                            }
                        }
                        if (i < len && code[i] === '>') {
                            out += wrapToken('>', 'tag');
                            i++;
                        }
                    }
                } else {
                    let j = i;
                    while (j < len && code[j] !== '<') j++;
                    const text = code.slice(i, j);
                    out += escapeHTML(text);
                    i = j;
                }
            }
            return out;
        }

        function highlightCSS(code) {
            const tokens = code.split(/(\/\*[\s\S]*?\*\/|#[\w-]+|\.[\w-]+|@[\w-]+|[\{\}])/g);
            return tokens.map(t => {
                if (t.startsWith('/*') && t.endsWith('*/')) return wrapToken(t, 'cmt');
                if (/^#[\w-]+$/.test(t)) return wrapToken(t, 'cls');
                if (/^\.[\w-]+$/.test(t)) return wrapToken(t, 'cls');
                if (/^@[\w-]+$/.test(t)) return wrapToken(t, 'kw');
                if (/^[\{\}]$/.test(t)) return wrapToken(t, 'op');
                return escapeHTML(t);
            }).join('');
        }

        function highlightJS(code) {
            const keywords = ['const', 'let', 'var', 'function', 'return', 'if', 'else', 'for', 'while', 'do', 'switch',
                'case', 'break', 'continue', 'try', 'catch', 'finally', 'throw', 'new', 'this', 'class', 'extends',
                'super', 'import', 'export', 'default', 'from', 'async', 'await', 'yield', 'of', 'in', 'typeof',
                'instanceof', 'void', 'delete', 'null', 'undefined', 'true', 'false', 'NaN', 'Infinity'
            ];
            const kwSet = new Set(keywords);
            let out = '';
            let i = 0;
            const len = code.length;
            while (i < len) {
                const ch = code[i];
                if (ch === '"' || ch === "'" || ch === '`') {
                    const quote = ch;
                    let j = i + 1;
                    while (j < len && code[j] !== quote) {
                        if (code[j] === '\\') j += 2;
                        else j++;
                    }
                    const str = code.slice(i, j + 1);
                    out += wrapToken(str, 'str');
                    i = j + 1;
                    continue;
                }
                if (ch === '/' && (code[i + 1] === '/' || code[i + 1] === '*')) {
                    if (code[i + 1] === '/') {
                        let j = i + 2;
                        while (j < len && code[j] !== '\n') j++;
                        const cmt = code.slice(i, j);
                        out += wrapToken(cmt, 'cmt');
                        i = j;
                        continue;
                    } else {
                        let j = i + 2;
                        while (j < len && !(code[j - 1] === '*' && code[j] === '/')) j++;
                        const cmt = code.slice(i, j + 1);
                        out += wrapToken(cmt, 'cmt');
                        i = j + 1;
                        continue;
                    }
                }
                if (/[0-9]/.test(ch)) {
                    let j = i;
                    while (j < len && /[0-9.]/.test(code[j])) j++;
                    const num = code.slice(i, j);
                    out += wrapToken(num, 'num');
                    i = j;
                    continue;
                }
                if (/[a-zA-Z_$]/.test(ch)) {
                    let j = i;
                    while (j < len && /[a-zA-Z0-9_$]/.test(code[j])) j++;
                    const word = code.slice(i, j);
                    if (kwSet.has(word)) out += wrapToken(word, 'kw');
                    else if (/^[A-Z]/.test(word)) out += wrapToken(word, 'cls');
                    else out += escapeHTML(word);
                    i = j;
                    continue;
                }
                if (/[+\-*/%&|^!~=<>?]/.test(ch)) {
                    let j = i;
                    while (j < len && /[+\-*/%&|^!~=<>?]/.test(code[j])) j++;
                    const op = code.slice(i, j);
                    out += wrapToken(op, 'op');
                    i = j;
                    continue;
                }
                out += escapeHTML(ch);
                i++;
            }
            return out;
        }

        function highlightJSON(code) {
            let out = '';
            let i = 0;
            const len = code.length;
            while (i < len) {
                const ch = code[i];
                if (ch === '"') {
                    let j = i + 1;
                    while (j < len && code[j] !== '"') {
                        if (code[j] === '\\') j += 2;
                        else j++;
                    }
                    const str = code.slice(i, j + 1);
                    out += wrapToken(str, 'str');
                    i = j + 1;
                    continue;
                }
                if (/[0-9]/.test(ch)) {
                    let j = i;
                    while (j < len && /[0-9.eE+-]/.test(code[j])) j++;
                    const num = code.slice(i, j);
                    out += wrapToken(num, 'num');
                    i = j;
                    continue;
                }
                if (/[a-zA-Z]/.test(ch)) {
                    let j = i;
                    while (j < len && /[a-zA-Z]/.test(code[j])) j++;
                    const word = code.slice(i, j);
                    if (word === 'true' || word === 'false') out += wrapToken(word, 'bool');
                    else if (word === 'null') out += wrapToken(word, 'null');
                    else out += escapeHTML(word);
                    i = j;
                    continue;
                }
                if (/[{}[\],:]/.test(ch)) {
                    out += wrapToken(ch, 'op');
                    i++;
                    continue;
                }
                out += escapeHTML(ch);
                i++;
            }
            return out;
        }

        function highlightXML(code) {
            let out = '';
            let i = 0;
            const len = code.length;
            while (i < len) {
                if (code[i] === '<') {
                    let j = i + 1;
                    while (j < len && code[j] !== '>') j++;
                    const tag = code.slice(i, j + 1);
                    out += wrapToken(tag, 'tag');
                    i = j + 1;
                } else {
                    let j = i;
                    while (j < len && code[j] !== '<') j++;
                    const text = code.slice(i, j);
                    out += escapeHTML(text);
                    i = j;
                }
            }
            return out;
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  EDITOR EVENTS
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        edEditor.addEventListener('input', () => {
            const content = edEditor.value;
            const isDirty = content !== editor.savedContent;
            editor.dirty = isDirty;
            setEditorStatus(isDirty ? '● unsaved' : '● saved', isDirty ? 'dirty' : 'saved');
            updateLineNumbers();
            updateEditorInfo();
            highlightSyntax();
            edPre.parentElement.scrollTop = edEditor.scrollTop;
        });

        edEditor.addEventListener('scroll', () => {
            edPre.parentElement.scrollTop = edEditor.scrollTop;
        });

        edEditor.addEventListener('keydown', e => {
            if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                e.preventDefault();
                saveFile();
            }
            if (e.key === 'Tab') {
                e.preventDefault();
                const start = edEditor.selectionStart;
                const end = edEditor.selectionEnd;
                edEditor.value = edEditor.value.substring(0, start) + '  ' + edEditor.value.substring(end);
                edEditor.selectionStart = edEditor.selectionEnd = start + 2;
                edEditor.dispatchEvent(new Event('input'));
            }
        });

        edClose.addEventListener('click', closeEditor);
        edCancel.addEventListener('click', closeEditor);
        edOverlay.addEventListener('click', e => {
            if (e.target === edOverlay) closeEditor();
        });
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape' && editor.isOpen) closeEditor();
        });

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  SAVE FILE
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        async function saveFile() {
            if (!editor.file) return;
            if (!editor.dirty) {
                setEditorStatus('● no changes', 'saved');
                return;
            }
            const content = edEditor.value;
            const base64 = btoa(unescape(encodeURIComponent(content)));
            edSave.disabled = true;
            setEditorStatus('Saving…', 'loading');
            try {
                await api('PUT', `/contents/${editor.file.path}`, {
                    message: `Update ${editor.file.name}`,
                    content: base64,
                    sha: editor.file.sha,
                    branch: state.branch,
                });
                editor.savedContent = content;
                editor.dirty = false;
                const data = await api('GET', `/contents/${editor.file.path}?ref=${state.branch}`);
                editor.file.sha = data.sha;
                editor.file.size = data.size || content.length;
                setEditorStatus('● saved ✓', 'saved');
                load();
            } catch (e) {
                console.error('Save error:', e);
                setEditorStatus('✕ save failed', 'error');
                alert('Save failed: ' + e.message);
            } finally {
                edSave.disabled = false;
            }
        }

        edSave.addEventListener('click', saveFile);

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  UPLOAD
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const r = new FileReader();
                r.onload = () => resolve(r.result.split(',')[1]);
                r.onerror = reject;
                r.readAsDataURL(file);
            });
        }

        async function uploadFiles(files) {
            if (!files.length) return;
            for (const file of files) {
                try {
                    const base64 = await fileToBase64(file);
                    const path = state.path ? state.path + '/' + file.name : file.name;
                    let sha = null;
                    try {
                        const exist = await api('GET', `/contents/${path}?ref=${state.branch}`);
                        sha = exist.sha;
                    } catch (_) {}
                    await api('PUT', `/contents/${path}`, {
                        message: `Upload ${file.name}`,
                        content: base64,
                        sha: sha || undefined,
                        branch: state.branch,
                    });
                } catch (e) {
                    console.error('Upload error:', e);
                    alert(`Failed to upload "${file.name}": ${e.message}`);
                }
            }
            load();
            setStatus('Upload complete', 'ok');
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  NEW FOLDER
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        async function newFolder() {
            const name = prompt('Enter folder name:');
            if (!name || !name.trim()) return;
            const clean = name.trim();
            const path = state.path ? state.path + '/' + clean + '/.gitkeep' : clean + '/.gitkeep';
            try {
                await api('PUT', `/contents/${path}`, {
                    message: `Create folder ${clean}`,
                    content: btoa(''),
                    branch: state.branch,
                });
                load();
            } catch (e) {
                console.error('New folder error:', e);
                alert('Failed to create folder: ' + e.message);
            }
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  HELPERS
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function setStatus(text, type) {
            statusEl.textContent = text;
            statusEl.className = 'status' + (type ? ' ' + type : '');
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  EVENT BINDING
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        connectBtn.addEventListener('click', connect);
        repoInput.addEventListener('keydown', e => { if (e.key === 'Enter') connect(); });
        tokenInput.addEventListener('keydown', e => { if (e.key === 'Enter') connect(); });

        $('uploadBtn').onclick = () => fileInput.click();
        fileInput.onchange = e => {
            if (e.target.files.length) {
                uploadFiles(e.target.files);
                e.target.value = '';
            }
        };

        $('newFolder').onclick = newFolder;
        $('refreshBtn').onclick = load;

        drop.onclick = () => fileInput.click();
        drop.ondragover = e => {
            e.preventDefault();
            drop.classList.add('drag');
        };
        drop.ondragleave = () => drop.classList.remove('drag');
        drop.ondrop = e => {
            e.preventDefault();
            drop.classList.remove('drag');
            if (e.dataTransfer.files.length) {
                uploadFiles(e.dataTransfer.files);
            }
        };

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  AUTO-CONNECT
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        if (savedToken) {
            setTimeout(connect, 100);
        }
    </script>
</body>
</html>
