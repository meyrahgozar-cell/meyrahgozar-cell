<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub File Manager</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            font-family: system-ui, -apple-system, sans-serif;
            background: #0a0a12;
            color: #e0e0ff;
            min-height: 100vh;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #141420;
        }
        ::-webkit-scrollbar-thumb {
            background: #2a2a3a;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3a3a4a;
        }

        header {
            padding: 14px 20px;
            background: #11111b;
            border-bottom: 1px solid #222;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        header form {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            flex: 1;
        }
        header input {
            background: #1a1a2e;
            border: 1px solid #2a2a3a;
            color: #e0e0ff;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 14px;
            min-width: 180px;
        }
        header input:focus {
            outline: none;
            border-color: #00f0ff;
            box-shadow: 0 0 0 3px #00f0ff22;
        }
        header button {
            background: transparent;
            border: 1px solid #00f0ff;
            color: #00f0ff;
            padding: 8px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: background .2s;
            white-space: nowrap;
        }
        header button:hover {
            background: #00f0ff22;
        }
        header button:disabled {
            opacity: .5;
            cursor: not-allowed;
        }
        .status {
            font-size: 13px;
            color: #888;
            margin-left: auto;
            white-space: nowrap;
        }
        .status.ok {
            color: #00ff9f;
        }
        .status.err {
            color: #ff4d6d;
        }
        .status.loading {
            color: #ffd93d;
        }

        .path {
            padding: 10px 20px;
            font-family: monospace;
            font-size: 13px;
            color: #00f0ff;
            border-bottom: 1px solid #1a1a2a;
            background: #0d0d18;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .path .crumb {
            color: #888;
            cursor: pointer;
            transition: color .2s;
        }
        .path .crumb:hover {
            color: #00f0ff;
        }
        .path .sep {
            color: #333;
            user-select: none;
        }

        .toolbar {
            padding: 10px 20px;
            display: none;
            gap: 10px;
            border-bottom: 1px solid #1a1a2a;
            background: #0d0d18;
            flex-wrap: wrap;
            align-items: center;
        }
        .toolbar button {
            background: transparent;
            border: 1px solid #2a2a3a;
            color: #c0c0e0;
            padding: 6px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: all .2s;
        }
        .toolbar button:hover {
            border-color: #00f0ff;
            color: #00f0ff;
            background: #00f0ff11;
        }
        .toolbar button.primary {
            background: #00f0ff;
            border-color: #00f0ff;
            color: #0a0a12;
        }
        .toolbar button.primary:hover {
            background: #00d4e8;
            border-color: #00d4e8;
        }
        .toolbar .count {
            font-size: 12px;
            color: #666;
            margin-left: 4px;
        }
        .toolbar .spacer {
            flex: 1;
        }

        .upload-area {
            margin: 16px 20px 8px;
            border: 2px dashed #2a2a3a;
            border-radius: 12px;
            padding: 28px;
            text-align: center;
            color: #666;
            cursor: pointer;
            transition: all .3s;
            display: none;
            background: #0d0d18;
        }
        .upload-area:hover {
            border-color: #444;
            background: #11111f;
        }
        .upload-area.drag {
            border-color: #00f0ff;
            background: #00f0ff11;
        }
        .upload-area .icon {
            font-size: 32px;
            display: block;
            margin-bottom: 6px;
        }
        .upload-area .sub {
            font-size: 12px;
            color: #555;
            margin-top: 4px;
        }

        .files {
            padding: 16px 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 14px;
        }
        .card {
            background: #141420;
            border: 1px solid #22223a;
            border-radius: 12px;
            padding: 18px 10px 14px;
            text-align: center;
            cursor: pointer;
            position: relative;
            transition: all .25s;
            user-select: none;
        }
        .card:hover {
            border-color: #00f0ff;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 240, 255, 0.06);
        }
        .card .icon-big {
            font-size: 32px;
            line-height: 1.2;
        }
        .card .name {
            font-size: 13px;
            word-break: break-all;
            margin-top: 8px;
            font-weight: 500;
            color: #e0e0ff;
        }
        .card .meta {
            font-size: 11px;
            color: #777;
            margin-top: 4px;
        }
        .card .del,
        .card .open-browser {
            position: absolute;
            top: 6px;
            background: #1a1a2e;
            border: 1px solid #2a2a3a;
            color: #c0c0e0;
            width: 26px;
            height: 26px;
            border-radius: 6px;
            font-size: 13px;
            display: none;
            cursor: pointer;
            align-items: center;
            justify-content: center;
            transition: all .2s;
            z-index: 2;
        }
        .card .del {
            right: 6px;
            border-color: #ff4d6d;
            color: #ff4d6d;
        }
        .card .del:hover {
            background: #ff4d6d22;
        }
        .card .open-browser {
            right: 36px;
            border-color: #00f0ff;
            color: #00f0ff;
        }
        .card .open-browser:hover {
            background: #00f0ff22;
        }
        .card:hover .del,
        .card:hover .open-browser {
            display: flex;
        }
        .card .ext-badge {
            position: absolute;
            bottom: 6px;
            right: 6px;
            font-size: 9px;
            background: #1a1a2e;
            padding: 2px 6px;
            border-radius: 4px;
            color: #555;
            text-transform: uppercase;
            letter-spacing: .3px;
        }
        .card.folder .icon-big {
            filter: drop-shadow(0 2px 4px rgba(0, 240, 255, 0.1));
        }

        .context-menu {
            position: fixed;
            background: #1a1a2e;
            border: 1px solid #2a2a3a;
            border-radius: 8px;
            padding: 6px 0;
            min-width: 180px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, .8);
            z-index: 9999;
            display: none;
            backdrop-filter: blur(8px);
        }
        .context-menu .item {
            padding: 8px 16px;
            color: #c0c0e0;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background .15s;
        }
        .context-menu .item:hover {
            background: #00f0ff22;
            color: #e0e0ff;
        }
        .context-menu .item.danger {
            color: #ff4d6d;
        }
        .context-menu .item.danger:hover {
            background: #ff4d6d22;
        }
        .context-menu .sep {
            height: 1px;
            background: #2a2a3a;
            margin: 4px 8px;
        }

        .msg {
            padding: 60px 20px;
            text-align: center;
            color: #555;
            font-size: 15px;
        }
        .msg .emoji {
            font-size: 40px;
            display: block;
            margin-bottom: 12px;
        }

        /* ─── Editor ─── */
        .editor-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .78);
            backdrop-filter: blur(6px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .editor-overlay.open {
            display: flex;
        }

        .editor-modal {
            background: #11111f;
            border: 1px solid #2a2a3a;
            border-radius: 16px;
            width: 100%;
            max-width: 920px;
            height: min(90vh, 800px);
            display: flex;
            flex-direction: column;
            box-shadow: 0 24px 80px rgba(0, 0, 0, .8);
            overflow: hidden;
        }

        .editor-header {
            padding: 12px 20px;
            border-bottom: 1px solid #1a1a2a;
            display: flex;
            align-items: center;
            gap: 14px;
            flex-shrink: 0;
            background: #0d0d18;
        }
        .editor-header .file-icon {
            font-size: 20px;
        }
        .editor-header .file-name {
            font-weight: 600;
            font-size: 14px;
            color: #e0e0ff;
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .editor-header .file-path {
            font-size: 11px;
            color: #555;
            font-family: monospace;
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .editor-header .editor-status {
            font-size: 11px;
            color: #888;
            padding: 2px 10px;
            border-radius: 12px;
            background: #1a1a2e;
        }
        .editor-header .editor-status.saved {
            color: #00ff9f;
        }
        .editor-header .editor-status.dirty {
            color: #ffd93d;
        }
        .editor-header .editor-status.error {
            color: #ff4d6d;
        }
        .editor-header .close-btn {
            background: none;
            border: none;
            color: #666;
            font-size: 24px;
            cursor: pointer;
            padding: 0 6px;
            line-height: 1;
            transition: color .2s;
        }
        .editor-header .close-btn:hover {
            color: #ff4d6d;
        }

        .editor-body {
            flex: 1;
            position: relative;
            background: #0a0a12;
            overflow: hidden;
        }

        /* Editor container: line numbers + textarea, both scroll together */
        .editor-scroll {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: auto;
            background: #0a0a12;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 14px;
            line-height: 1.6;
            padding-left: 44px;
            /* space for line numbers */
        }
        .editor-scroll .line-numbers {
            position: absolute;
            top: 0;
            left: 0;
            width: 44px;
            height: 100%;
            background: #0a0a12;
            color: #444;
            text-align: right;
            padding: 12px 10px 12px 0;
            user-select: none;
            overflow: hidden;
            border-right: 1px solid #1a1a2a;
            font-size: 13px;
            line-height: 1.6;
            font-family: inherit;
            pointer-events: none;
            z-index: 2;
        }
        .editor-scroll .line-numbers .ln {
            display: block;
            padding-right: 4px;
        }
        .editor-scroll textarea {
            margin: 0;
            padding: 12px 16px;
            font-family: inherit;
            font-size: 14px;
            line-height: 1.6;
            color: #e0e0ff;
            background: transparent;
            border: none;
            outline: none;
            resize: none;
            white-space: pre-wrap;
            word-wrap: break-word;
            caret-color: #e0e0ff;
            overflow: visible;
            /* scroll is handled by the container */
            width: 100%;
            min-height: 100%;
            height: 100%;
            tab-size: 2;
            z-index: 1;
            letter-spacing: 0;
            box-sizing: border-box;
            position: relative;
            display: block;
        }
        .editor-scroll textarea::selection {
            background: #00f0ff33;
        }
        .editor-scroll textarea:focus {
            outline: none;
        }

        /* Hide scrollbar on the container to avoid double scrollbars, but allow scrolling */
        .editor-scroll::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .editor-scroll::-webkit-scrollbar-track {
            background: #141420;
        }
        .editor-scroll::-webkit-scrollbar-thumb {
            background: #2a2a3a;
            border-radius: 4px;
        }
        .editor-scroll::-webkit-scrollbar-thumb:hover {
            background: #3a3a4a;
        }

        .editor-footer {
            padding: 10px 20px;
            border-top: 1px solid #1a1a2a;
            display: flex;
            gap: 12px;
            flex-shrink: 0;
            background: #0d0d18;
            flex-wrap: wrap;
            align-items: center;
        }
        .editor-footer .info {
            font-size: 12px;
            color: #555;
            flex: 1;
        }
        .editor-footer .info span {
            color: #888;
        }
        .editor-footer button {
            padding: 6px 18px;
            border-radius: 6px;
            border: 1px solid #2a2a3a;
            background: transparent;
            color: #c0c0e0;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all .2s;
        }
        .editor-footer button:hover {
            border-color: #00f0ff;
            color: #00f0ff;
        }
        .editor-footer button.primary {
            background: #00f0ff;
            border-color: #00f0ff;
            color: #0a0a12;
        }
        .editor-footer button.primary:hover {
            background: #00d4e8;
            border-color: #00d4e8;
        }
        .editor-footer button.primary:disabled {
            opacity: .4;
            cursor: not-allowed;
        }

        @media (max-width: 640px) {
            header form input {
                min-width: 120px;
                width: 100%;
            }
            .files {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
                gap: 10px;
                padding: 12px;
            }
            .editor-modal {
                height: 100vh;
                max-height: 100vh;
                border-radius: 0;
            }
            .editor-overlay {
                padding: 0;
            }
            .editor-header .file-path {
                max-width: 80px;
            }
            .editor-scroll {
                padding-left: 32px;
                font-size: 12px;
            }
            .editor-scroll .line-numbers {
                width: 32px;
                font-size: 11px;
                padding: 10px 6px 10px 0;
            }
            .editor-scroll textarea {
                font-size: 12px;
                padding: 10px 12px;
            }
            .card .del,
            .card .open-browser {
                width: 22px;
                height: 22px;
                font-size: 11px;
                display: flex;
            }
            .card .open-browser {
                right: 32px;
            }
        }
    </style>
</head>
<body>

    <header>
        <form id="auth" autocomplete="off">
            <input id="repo" type="text" value="meyrahgozar-cell/meyrahgozar-cell" placeholder="owner/repo" />
            <input id="token" type="password" placeholder="GitHub Token" autocomplete="new-password" />
            <button type="button" id="connectBtn">Connect</button>
        </form>
        <div class="status" id="status">Not connected</div>
    </header>

    <div class="path" id="path"></div>

    <div class="toolbar" id="toolbar">
        <button type="button" class="primary" id="uploadBtn">📤 Upload</button>
        <button type="button" id="newFolder">📁 New Folder</button>
        <button type="button" id="refreshBtn">⟳ Refresh</button>
        <input type="file" id="fileInput" multiple hidden />
        <span class="count" id="fileCount"></span>
        <span class="spacer"></span>
        <span style="font-size:12px;color:#555" id="branchLabel">main</span>
    </div>

    <div class="upload-area" id="drop">
        <span class="icon">📂</span>
        Drop files here or click to upload
        <div class="sub">Supports multiple files</div>
    </div>

    <div class="files" id="files"></div>
    <div class="msg" id="msg"><span class="emoji">🔑</span>Enter your token and click Connect</div>

    <div class="context-menu" id="contextMenu">
        <div class="item" data-action="open">📂 Open</div>
        <div class="item" data-action="download">⬇️ Download</div>
        <div class="item" data-action="rename">✏️ Rename</div>
        <div class="item" data-action="copyPath">📋 Copy Path</div>
        <div class="sep"></div>
        <div class="item danger" data-action="delete">🗑️ Delete</div>
    </div>

    <!-- Editor Modal -->
    <div class="editor-overlay" id="editorOverlay">
        <div class="editor-modal">
            <div class="editor-header">
                <span class="file-icon" id="edIcon">📄</span>
                <span class="file-name" id="edFileName">file.html</span>
                <span class="file-path" id="edFilePath">path/to/file</span>
                <span class="editor-status" id="edStatus">● saved</span>
                <button class="close-btn" id="edClose">✕</button>
            </div>
            <div class="editor-body" id="edBody">
                <div class="editor-scroll" id="editorScroll">
                    <div class="line-numbers" id="lineNumbers"></div>
                    <textarea id="codeEditor" spellcheck="false" autofocus></textarea>
                </div>
            </div>
            <div class="editor-footer">
                <div class="info" id="edInfo"><span id="edLines">0</span> lines · <span id="edSize">0</span> B</div>
                <button id="edCancel">Cancel</button>
                <button class="primary" id="edSave">💾 Save</button>
            </div>
        </div>
    </div>

    <script>
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  STATE
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const state = {
            owner: 'meyrahgozar-cell',
            repo: 'meyrahgozar-cell',
            token: '',
            path: '',
            branch: 'main',
            connected: false,
        };

        let editorFile = null; // { path, sha, name, content, savedContent }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  DOM REFS
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const $ = id => document.getElementById(id);
        const repoInput = $('repo');
        const tokenInput = $('token');
        const statusEl = $('status');
        const pathEl = $('path');
        const filesEl = $('files');
        const msgEl = $('msg');
        const toolbar = $('toolbar');
        const drop = $('drop');
        const fileInput = $('fileInput');
        const fileCount = $('fileCount');
        const branchLabel = $('branchLabel');
        const connectBtn = $('connectBtn');

        const edOverlay = $('editorOverlay');
        const edIcon = $('edIcon');
        const edFileName = $('edFileName');
        const edFilePath = $('edFilePath');
        const edStatus = $('edStatus');
        const edClose = $('edClose');
        const edCancel = $('edCancel');
        const edSave = $('edSave');
        const edInfo = $('edInfo');
        const edLines = $('edLines');
        const edSize = $('edSize');
        const edEditor = $('codeEditor');
        const lineNumbers = $('lineNumbers');
        const editorScroll = $('editorScroll');

        const contextMenu = $('contextMenu');

        const savedToken = localStorage.getItem('fm_token');
        if (savedToken) tokenInput.value = savedToken;

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  GITHUB API
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function apiUrl(path) {
            return `https://api.github.com/repos/${state.owner}/${state.repo}${path}`;
        }

        async function api(method, path, body) {
            const url = apiUrl(path);
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 10000);

            const opts = {
                method,
                headers: {
                    Accept: 'application/vnd.github.v3+json',
                    Authorization: `token ${state.token}`,
                    'Content-Type': 'application/json',
                    'User-Agent': 'GitHub-File-Manager/1.0',
                },
                signal: controller.signal,
            };
            if (body) opts.body = JSON.stringify(body);

            try {
                const res = await fetch(url, opts);
                clearTimeout(timeout);
                if (res.status === 204) return null;
                const data = await res.json();
                if (!res.ok) {
                    throw new Error(data.message || `HTTP ${res.status}`);
                }
                return data;
            } catch (err) {
                clearTimeout(timeout);
                if (err.name === 'AbortError') {
                    throw new Error('Request timed out. Please check your network.');
                }
                throw err;
            }
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  CONNECT
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        async function connect() {
            const repoVal = repoInput.value.trim();
            const token = tokenInput.value.trim();

            if (!repoVal.includes('/') || !token) {
                setStatus('Please fill both fields', 'err');
                alert('Please fill both fields (owner/repo and token)');
                return;
            }

            const [owner, repo] = repoVal.split('/');
            state.owner = owner;
            state.repo = repo;
            state.token = token;
            state.path = '';

            connectBtn.disabled = true;
            connectBtn.textContent = 'Connecting…';
            setStatus('Connecting…', 'loading');

            try {
                const info = await api('GET', '');
                state.branch = info.default_branch || 'main';
                state.connected = true;
                localStorage.setItem('fm_token', token);
                setStatus(`✓ Connected: ${info.full_name}`, 'ok');
                toolbar.style.display = 'flex';
                drop.style.display = 'block';
                msgEl.style.display = 'none';
                branchLabel.textContent = state.branch;
                await load();
            } catch (err) {
                console.error('Connection error:', err);
                setStatus('✗ Failed: ' + err.message, 'err');
                alert('Connection failed: ' + err.message + '\n\nMake sure:\n• Token has repo scope\n• Repo exists and is accessible');
                state.connected = false;
            } finally {
                connectBtn.disabled = false;
                connectBtn.textContent = 'Connect';
            }
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  LOAD DIRECTORY
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        async function load() {
            if (!state.connected) return;
            filesEl.innerHTML = '';
            pathEl.innerHTML = buildPathCrumbs();

            try {
                const data = await api('GET', `/contents/${state.path}?ref=${state.branch}`);
                const items = Array.isArray(data) ? data : [data];
                items.sort((a, b) => {
                    if (a.type === b.type) return a.name.localeCompare(b.name);
                    return a.type === 'dir' ? -1 : 1;
                });

                if (state.path) {
                    const back = makeCard('..', '⬅️', 'folder', null, true);
                    back.onclick = () => {
                        const parts = state.path.split('/');
                        parts.pop();
                        state.path = parts.join('/');
                        load();
                    };
                    filesEl.appendChild(back);
                }

                let fileCountNum = 0;
                items.forEach(item => {
                    const isDir = item.type === 'dir';
                    const icon = getFileIcon(item.name, isDir);
                    const meta = isDir ? 'Folder' : formatSize(item.size);
                    const card = makeCard(item.name, icon, isDir ? 'folder' : 'file', meta);
                    const ext = item.name.split('.').pop().toLowerCase();

                    card.dataset.path = item.path;
                    card.dataset.sha = item.sha;
                    card.dataset.type = item.type;
                    card.dataset.name = item.name;

                    // Delete
                    const delBtn = document.createElement('button');
                    delBtn.className = 'del';
                    delBtn.textContent = '✕';
                    delBtn.title = 'Delete';
                    delBtn.onclick = async e => {
                        e.stopPropagation();
                        if (!confirm(`Delete "${item.name}"?`)) return;
                        try {
                            await api('DELETE', `/contents/${item.path}`, {
                                message: `Delete ${item.name}`,
                                sha: item.sha,
                                branch: state.branch,
                            });
                            load();
                        } catch (err) {
                            alert('Delete failed: ' + err.message);
                        }
                    };
                    card.appendChild(delBtn);

                    // Open in browser
                    if (!isDir) {
                        const browserBtn = document.createElement('button');
                        browserBtn.className = 'open-browser';
                        browserBtn.textContent = '🌐';
                        browserBtn.title = 'Open in browser';
                        browserBtn.onclick = e => {
                            e.stopPropagation();
                            const baseUrl = `https://${state.owner}.github.io/${state.repo}/`;
                            const fullUrl = baseUrl + item.path;
                            window.open(fullUrl, '_blank');
                        };
                        card.appendChild(browserBtn);
                    }

                    if (!isDir) {
                        const badge = document.createElement('span');
                        badge.className = 'ext-badge';
                        badge.textContent = ext || 'file';
                        card.appendChild(badge);
                    }

                    card.onclick = () => {
                        if (isDir) {
                            state.path = item.path;
                            load();
                        } else {
                            openFile(item);
                        }
                    };

                    card.addEventListener('contextmenu', e => {
                        e.preventDefault();
                        e.stopPropagation();
                        showContextMenu(e.clientX, e.clientY, item, card);
                    });

                    filesEl.appendChild(card);
                    fileCountNum++;
                });

                fileCount.textContent = fileCountNum + ' item' + (fileCountNum !== 1 ? 's' : '');
                if (items.length === 0 && state.path) {
                    const empty = document.createElement('div');
                    empty.className = 'msg';
                    empty.innerHTML = '<span class="emoji">📭</span>This folder is empty';
                    empty.style.padding = '40px 20px';
                    filesEl.appendChild(empty);
                }
            } catch (e) {
                console.error('Load error:', e);
                filesEl.innerHTML = `<div class="msg"><span class="emoji">⚠️</span>${e.message}</div>`;
            }
        }

        function buildPathCrumbs() {
            const parts = state.path.split('/').filter(Boolean);
            let html = `<span class="crumb" data-path="">📁 root</span>`;
            let cur = '';
            parts.forEach((p, i) => {
                cur += (cur ? '/' : '') + p;
                const isLast = i === parts.length - 1;
                html += `<span class="sep"> / </span>`;
                if (isLast) {
                    html += `<span class="crumb" style="color:#e0e0ff">${p}</span>`;
                } else {
                    html += `<span class="crumb" data-path="${cur}">${p}</span>`;
                }
            });
            setTimeout(() => {
                pathEl.querySelectorAll('.crumb[data-path]').forEach(el => {
                    el.onclick = () => {
                        state.path = el.dataset.path;
                        load();
                    };
                });
            }, 0);
            return html;
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  FILE ICONS
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function getFileIcon(name, isDir) {
            if (isDir) return '📁';
            const ext = name.split('.').pop().toLowerCase();
            const map = {
                html: '🌐',
                css: '🎨',
                js: '⚡',
                json: '📋',
                md: '📝',
                txt: '📄',
                xml: '📰',
                svg: '🖼️',
                png: '🖼️',
                jpg: '🖼️',
                jpeg: '🖼️',
                gif: '🖼️',
                ico: '🖼️',
                webp: '🖼️',
                pdf: '📕',
                zip: '📦',
                tar: '📦',
                gz: '📦',
                rar: '📦',
                py: '🐍',
                rb: '💎',
                php: '🐘',
                go: '🐹',
                rs: '🦀',
                c: '⚙️',
                cpp: '⚙️',
                h: '⚙️',
                sh: '🐚',
                yml: '📜',
                yaml: '📜',
                toml: '📜',
                lock: '🔒',
                gitignore: '🙈',
                env: '🔐',
                vue: '🟢',
                ts: '🔷',
                tsx: '🔷',
                jsx: '⚡',
                scss: '🎨',
                less: '🎨',
                sql: '🗄️',
            };
            return map[ext] || '📄';
        }

        function formatSize(b) {
            if (!b) return '';
            if (b < 1024) return b + ' B';
            if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
            return (b / 1048576).toFixed(1) + ' MB';
        }

        function makeCard(name, icon, type, meta, isBack) {
            const card = document.createElement('div');
            card.className = 'card' + (type === 'folder' ? ' folder' : '');
            card.innerHTML = `
            <div class="icon-big">${icon}</div>
            <div class="name">${name}</div>
            ${meta ? `<div class="meta">${meta}</div>` : ''}
          `;
            return card;
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  CONTEXT MENU
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        let contextTarget = null;

        function showContextMenu(x, y, item, card) {
            contextTarget = { item, card };
            contextMenu.style.display = 'block';
            contextMenu.style.left = x + 'px';
            contextMenu.style.top = y + 'px';

            const rect = contextMenu.getBoundingClientRect();
            if (rect.right > window.innerWidth) {
                contextMenu.style.left = (x - rect.width) + 'px';
            }
            if (rect.bottom > window.innerHeight) {
                contextMenu.style.top = (y - rect.height) + 'px';
            }
        }

        function hideContextMenu() {
            contextMenu.style.display = 'none';
            contextTarget = null;
        }

        document.addEventListener('click', hideContextMenu);

        contextMenu.addEventListener('click', async e => {
            const action = e.target.closest('.item')?.dataset.action;
            if (!action || !contextTarget) return;
            hideContextMenu();

            const { item, card } = contextTarget;
            switch (action) {
                case 'open':
                    if (item.type === 'dir') {
                        state.path = item.path;
                        load();
                    } else {
                        openFile(item);
                    }
                    break;
                case 'download':
                    if (item.download_url) {
                        window.open(item.download_url, '_blank');
                    } else {
                        alert('Download not available.');
                    }
                    break;
                case 'rename':
                    const newName = prompt('Enter new name:', item.name);
                    if (newName && newName !== item.name) {
                        await renameItem(item, newName);
                    }
                    break;
                case 'copyPath':
                    const fullPath = item.path;
                    if (navigator.clipboard) {
                        await navigator.clipboard.writeText(fullPath);
                        alert('Path copied!');
                    } else {
                        const input = document.createElement('input');
                        input.value = fullPath;
                        document.body.appendChild(input);
                        input.select();
                        document.execCommand('copy');
                        input.remove();
                        alert('Path copied!');
                    }
                    break;
                case 'delete':
                    if (confirm(`Delete "${item.name}"?`)) {
                        try {
                            await api('DELETE', `/contents/${item.path}`, {
                                message: `Delete ${item.name}`,
                                sha: item.sha,
                                branch: state.branch,
                            });
                            load();
                        } catch (err) {
                            alert('Delete failed: ' + err.message);
                        }
                    }
                    break;
            }
        });

        async function renameItem(item, newName) {
            const oldPath = item.path;
            const dir = oldPath.substring(0, oldPath.lastIndexOf('/') + 1);
            const newPath = dir + newName;

            if (item.type === 'dir') {
                alert('Renaming folders is not supported.');
                return;
            }

            try {
                const data = await api('GET', `/contents/${oldPath}?ref=${state.branch}`);
                const content = data.content;
                await api('PUT', `/contents/${newPath}`, {
                    message: `Rename ${item.name} to ${newName}`,
                    content: content,
                    branch: state.branch,
                });
                await api('DELETE', `/contents/${oldPath}`, {
                    message: `Delete old file after rename`,
                    sha: item.sha,
                    branch: state.branch,
                });
                load();
            } catch (err) {
                alert('Rename failed: ' + err.message);
            }
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  OPEN FILE → EDITOR (simple scroll‑sync)
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const TEXT_EXTS = new Set([
            'html', 'htm', 'css', 'js', 'mjs', 'json', 'xml', 'svg', 'txt',
            'md', 'markdown', 'yml', 'yaml', 'toml', 'sh', 'bash', 'zsh',
            'py', 'rb', 'php', 'go', 'rs', 'c', 'cpp', 'h', 'hpp', 'vue',
            'ts', 'tsx', 'jsx', 'scss', 'less', 'sql', 'log', 'env',
            'gitignore', 'lock', 'conf', 'config', 'ini', 'cfg'
        ]);

        function isTextFile(name) {
            const ext = name.split('.').pop().toLowerCase();
            return TEXT_EXTS.has(ext);
        }

        async function openFile(item) {
            if (!isTextFile(item.name)) {
                if (item.download_url) {
                    window.open(item.download_url, '_blank');
                } else {
                    alert('This file type cannot be previewed.');
                }
                return;
            }

            setEditorStatus('loading…', 'loading');
            try {
                const data = await api('GET', `/contents/${item.path}?ref=${state.branch}`);
                const content = atob(data.content);
                editorFile = {
                    path: item.path,
                    sha: data.sha,
                    name: item.name,
                    content: content,
                    savedContent: content,
                };
                openEditor(content);
                setEditorStatus('● saved', 'saved');
            } catch (e) {
                console.error('Open file error:', e);
                alert('Failed to load file: ' + e.message);
            }
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  EDITOR UI (with scroll sync)
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function openEditor(content) {
            edIcon.textContent = getFileIcon(editorFile.name, false);
            edFileName.textContent = editorFile.name;
            edFilePath.textContent = editorFile.path;

            // Set textarea content
            edEditor.value = content;
            updateLineNumbers();
            updateEditorInfo();

            // Show overlay
            edOverlay.classList.add('open');

            // Reset scroll
            editorScroll.scrollTop = 0;

            // Focus
            setTimeout(() => {
                edEditor.focus();
            }, 50);

            // Listen to input for dirty state and line numbers
            edEditor.oninput = function() {
                const current = edEditor.value;
                const dirty = current !== editorFile.savedContent;
                setEditorStatus(dirty ? '● unsaved' : '● saved', dirty ? 'dirty' : 'saved');
                updateLineNumbers();
                updateEditorInfo();
            };

            // Sync line numbers with scroll
            editorScroll.onscroll = function() {
                // lineNumbers is positioned absolute, so it doesn't scroll automatically.
                // We need to move it with the scroll: we can adjust its position.
                // Actually, it's inside the scroll container, but it's positioned absolute relative to the container,
                // so it stays fixed. We want it to scroll with the content.
                // Better: we set lineNumbers as a child with position: relative and let it scroll normally?
                // But then it would scroll horizontally too. We can set overflow-x: hidden.
                // Let's change the approach: put lineNumbers as a separate element that moves with scroll.
                // Instead, we'll use the fact that the container scrolls, and we want the line numbers to stick to the left
                // but stay at the same scrollTop. So we set its position to absolute and update its top offset.
                // Actually, we can just set lineNumbers to position: sticky; left: 0; top: 0; and it will stick to the top
                // but scroll with the container vertically. That's perfect.
                // Let's adjust the CSS: .line-numbers { position: sticky; left: 0; top: 0; }
                // But we already have position: absolute. Change to sticky.
                // We'll do that in the CSS.
            };
        }

        function closeEditor() {
            if (editorFile) {
                const current = edEditor.value;
                if (current !== editorFile.savedContent) {
                    if (!confirm('You have unsaved changes. Discard them?')) return;
                }
            }
            edOverlay.classList.remove('open');
            editorFile = null;
            edEditor.oninput = null;
            editorScroll.onscroll = null;
            lineNumbers.innerHTML = '';
        }

        function setEditorStatus(text, type) {
            edStatus.textContent = text;
            edStatus.className = 'editor-status' + (type ? ' ' + type : '');
        }

        function updateLineNumbers() {
            const lines = edEditor.value.split('\n');
            const count = lines.length;
            lineNumbers.innerHTML = '';
            for (let i = 1; i <= count; i++) {
                const span = document.createElement('span');
                span.className = 'ln';
                span.textContent = i;
                lineNumbers.appendChild(span);
            }
            edLines.textContent = count;
        }

        function updateEditorInfo() {
            const content = edEditor.value;
            const size = new Blob([content]).size;
            edSize.textContent = formatSize(size);
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  SAVE FILE
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        async function saveFile() {
            if (!editorFile) return;
            const content = edEditor.value;
            if (content === editorFile.savedContent) {
                setEditorStatus('● no changes', 'saved');
                return;
            }

            const base64 = btoa(unescape(encodeURIComponent(content)));
            edSave.disabled = true;
            setEditorStatus('Saving…', 'loading');
            try {
                await api('PUT', `/contents/${editorFile.path}`, {
                    message: `Update ${editorFile.name}`,
                    content: base64,
                    sha: editorFile.sha,
                    branch: state.branch,
                });
                editorFile.savedContent = content;
                const data = await api('GET', `/contents/${editorFile.path}?ref=${state.branch}`);
                editorFile.sha = data.sha;
                setEditorStatus('● saved ✓', 'saved');
                load();
            } catch (e) {
                console.error('Save error:', e);
                setEditorStatus('✕ save failed', 'error');
                alert('Save failed: ' + e.message);
            } finally {
                edSave.disabled = false;
            }
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  UPLOAD
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const r = new FileReader();
                r.onload = () => resolve(r.result.split(',')[1]);
                r.onerror = reject;
                r.readAsDataURL(file);
            });
        }

        async function uploadFiles(files) {
            if (!files.length) return;
            for (const file of files) {
                try {
                    const base64 = await fileToBase64(file);
                    const path = state.path ? state.path + '/' + file.name : file.name;
                    let sha = null;
                    try {
                        const exist = await api('GET', `/contents/${path}?ref=${state.branch}`);
                        sha = exist.sha;
                    } catch (_) {}
                    await api('PUT', `/contents/${path}`, {
                        message: `Upload ${file.name}`,
                        content: base64,
                        sha: sha || undefined,
                        branch: state.branch,
                    });
                } catch (e) {
                    console.error('Upload error:', e);
                    alert(`Failed to upload "${file.name}": ${e.message}`);
                }
            }
            load();
            setStatus('Upload complete', 'ok');
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  NEW FOLDER
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        async function newFolder() {
            const name = prompt('Enter folder name:');
            if (!name || !name.trim()) return;
            const clean = name.trim();
            const path = state.path ? state.path + '/' + clean + '/.gitkeep' : clean + '/.gitkeep';
            try {
                await api('PUT', `/contents/${path}`, {
                    message: `Create folder ${clean}`,
                    content: btoa(''),
                    branch: state.branch,
                });
                load();
            } catch (e) {
                console.error('New folder error:', e);
                alert('Failed to create folder: ' + e.message);
            }
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  HELPERS
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function setStatus(text, type) {
            statusEl.textContent = text;
            statusEl.className = 'status' + (type ? ' ' + type : '');
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  EVENT BINDING
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        connectBtn.addEventListener('click', connect);
        repoInput.addEventListener('keydown', e => { if (e.key === 'Enter') connect(); });
        tokenInput.addEventListener('keydown', e => { if (e.key === 'Enter') connect(); });

        $('uploadBtn').onclick = () => fileInput.click();
        fileInput.onchange = e => {
            if (e.target.files.length) {
                uploadFiles(e.target.files);
                e.target.value = '';
            }
        };

        $('newFolder').onclick = newFolder;
        $('refreshBtn').onclick = load;

        drop.onclick = () => fileInput.click();
        drop.ondragover = e => {
            e.preventDefault();
            drop.classList.add('drag');
        };
        drop.ondragleave = () => drop.classList.remove('drag');
        drop.ondrop = e => {
            e.preventDefault();
            drop.classList.remove('drag');
            if (e.dataTransfer.files.length) {
                uploadFiles(e.dataTransfer.files);
            }
        };

        edClose.addEventListener('click', closeEditor);
        edCancel.addEventListener('click', closeEditor);
        edSave.addEventListener('click', saveFile);
        edOverlay.addEventListener('click', e => {
            if (e.target === edOverlay) closeEditor();
        });
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape' && editorFile) closeEditor();
        });

        // Tab key support and Ctrl+S
        edEditor.addEventListener('keydown', function(e) {
            if (e.key === 'Tab') {
                e.preventDefault();
                const start = this.selectionStart;
                const end = this.selectionEnd;
                this.value = this.value.substring(0, start) + '  ' + this.value.substring(end);
                this.selectionStart = this.selectionEnd = start + 2;
                this.dispatchEvent(new Event('input'));
            }
            if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                e.preventDefault();
                saveFile();
            }
        });

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  AUTO-CONNECT
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        if (savedToken) {
            setTimeout(connect, 300);
        }
    </script>
</body>
</html>
