<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تست مستقیم + پروکسی جایگزین</title>
    <style>
        body { font-family: Tahoma, sans-serif; max-width: 700px; margin: 20px auto; padding: 15px; }
        input, button { padding: 8px 12px; font-size: 14px; margin: 5px; }
        .box { background: #f4f4f4; padding: 15px; border-radius: 8px; margin-top: 15px; white-space: pre-wrap; }
        .status { color: #333; margin: 10px 0; }
        .btn-group { display: flex; gap: 10px; flex-wrap: wrap; }
        .danger { background: #e67e22; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>📖 تست تفسیر روان جاوید</h2>
    <p><strong>سوره:</strong> <input type="number" id="surah" value="2" min="1" max="114"> 
       <strong>آیه:</strong> <input type="number" id="ayah" value="63" min="1"></p>
    
    <div class="btn-group">
        <button id="directBtn" class="danger">🚀 تست مستقیم (نیاز به افزونه CORS)</button>
        <button id="proxyBtn">🌐 تست با پروکسی (corsproxy)</button>
    </div>
    
    <div id="status" class="status">وضعیت: منتظر دستور شما...</div>
    <div id="result" class="box">نتیجه تفسیر اینجا نمایش داده میشود...</div>

    <script>
        const surahInp = document.getElementById('surah');
        const ayahInp = document.getElementById('ayah');
        const statusDiv = document.getElementById('status');
        const resultDiv = document.getElementById('result');

        function setStatus(msg, isError = false) {
            statusDiv.textContent = msg;
            statusDiv.style.color = isError ? 'red' : '#2c3e50';
        }

        function showResult(text) {
            if (text) {
                resultDiv.textContent = text;
                resultDiv.style.background = '#eafaf1';
            } else {
                resultDiv.textContent = '❌ تفسیر پیدا نشد یا خطا رخ داد.';
                resultDiv.style.background = '#fdedec';
            }
        }

        // تابع استخراج متن تفسیر از HTML خام
        function extractTafsir(html) {
            // الگوی دقیق برای عبارت "تفسیر روان جاوید"
            const match = html.match(/تفسیر روان جاوید\s*\(ثقفی تهرانی\)\s*(.*?)(?=\nتفسیر|\Z)/s);
            if (match && match[1]) {
                return match[1].trim().replace(/\s+/g, ' ').substring(0, 3000);
            }
            return null;
        }

        // تابع اصلی برای دریافت
        async function fetchTafsir(url, methodName) {
            setStatus(`⏳ در حال دریافت با روش "${methodName}" ...`);
            resultDiv.style.background = '#f4f4f4';
            
            try {
                const response = await fetch(url, {
                    signal: AbortSignal.timeout(15000)
                });
                
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const html = await response.text();
                
                const tafsir = extractTafsir(html);
                if (tafsir) {
                    setStatus(`✅ دریافت شد با روش "${methodName}"`);
                    showResult(tafsir);
                } else {
                    setStatus(`⚠️ متن پیدا نشد (ساختار سایت تغییر کرده؟)`, true);
                    showResult(null);
                }
            } catch (err) {
                setStatus(`❌ خطا: ${err.message}`, true);
                showResult(null);
            }
        }

        // --- دکمه ۱: تست مستقیم (فقط با افزونه CORS) ---
        document.getElementById('directBtn').addEventListener('click', () => {
            const s = surahInp.value.trim();
            const a = ayahInp.value.trim();
            if (!s || !a) return alert('شماره را وارد کنید');
            
            const directUrl = `https://wiki.ahlolbait.com/%D8%A2%DB%8C%D9%87_${a}_%D8%B3%D9%88%D8%B1%D9%87_${s}#!tafsir/%D8%B1%D9%88%D8%A7%D9%86+%D8%AC%D8%A7%D9%88%DB%8C%D8%AF`;
            fetchTafsir(directUrl, 'مستقیم (نیاز به افزونه)');
        });

        // --- دکمه ۲: تست با پروکسی corsproxy.io (بدون افزونه) ---
        document.getElementById('proxyBtn').addEventListener('click', () => {
            const s = surahInp.value.trim();
            const a = ayahInp.value.trim();
            if (!s || !a) return alert('شماره را وارد کنید');

            const targetUrl = `https://wiki.ahlolbait.com/%D8%A2%DB%8C%D9%87_${a}_%D8%B3%D9%88%D8%B1%D9%87_${s}#!tafsir/%D8%B1%D9%88%D8%A7%D9%86+%D8%AC%D8%A7%D9%88%DB%8C%D8%AF`;
            const proxyUrl = `https://corsproxy.io/?url=${encodeURIComponent(targetUrl)}`;
            
            fetchTafsir(proxyUrl, 'پروکسی corsproxy.io');
        });

        // --- اجرای پیشفرض با پروکسی برای آیه ۶۳ سوره ۲ ---
        window.onload = () => {
            document.getElementById('proxyBtn').click();
        };
    </script>
</body>
</html>
