<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="icon" type="image/png" href="images/favicon.png">
<link rel="apple-touch-icon" href="images/favicon.png">
<title>HQL | پنل ادمین</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/jalaali-js@1.2.8/dist/jalaali.min.js"></script>
<style>
:root {
  --bg: #05060a;
  --card: #0d1019;
  --card2: #131722;
  --border: rgba(180, 100, 255, 0.18);
  --text: #f0f2ff;
  --muted: #8b92b0;
  --neon: #b44cff;
  --neon2: #00f0ff;
  --positive: #00ff9d;
  --negative: #ff4d6d;
  --radius: 16px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  min-height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: "Vazirmatn", sans-serif;
}
body {
  background:
    radial-gradient(ellipse 80% 50% at 20% -10%, rgba(180, 76, 255, 0.12), transparent),
    radial-gradient(ellipse 60% 40% at 90% 10%, rgba(0, 240, 255, 0.06), transparent),
    var(--bg);
  min-height: 100vh;
}
button, select { font: inherit; color: inherit; border: none; background: none; cursor: pointer; }
.hidden { display: none !important; }
.page { max-width: 800px; margin: 0 auto; padding: 14px 14px 80px; }
.header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
.brand {
  font-size: 20px; font-weight: 800;
  background: linear-gradient(90deg, #b44cff, #00f0ff);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.icon-btn {
  width: 40px; height: 40px; border-radius: 11px;
  background: var(--card); border: 1px solid var(--border);
  display: grid; place-items: center; font-size: 16px;
}
.page-title { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
.page-sub { font-size: 13px; color: var(--muted); margin-bottom: 16px; }
.badge {
  display: inline-block; font-size: 11px; font-weight: 700;
  padding: 4px 10px; border-radius: 99px;
  background: rgba(180, 76, 255, 0.2);
  border: 1px solid rgba(180, 100, 255, 0.35);
  color: var(--neon2); margin-bottom: 14px;
}
.month-bar { display: flex; gap: 10px; margin-bottom: 16px; }
.select {
  flex: 1; height: 44px; padding: 0 12px; border-radius: 12px;
  border: 1px solid var(--border); background: var(--card); outline: none; appearance: none;
}
.card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 16px; margin-bottom: 14px;
}
.card-title { font-size: 15px; font-weight: 700; margin-bottom: 2px; }
.card-sub { font-size: 12px; color: var(--muted); margin-bottom: 14px; }
.user-list { display: grid; gap: 8px; }
.user-row {
  display: flex; align-items: center; gap: 12px;
  padding: 12px; border-radius: 12px;
  background: var(--card2); border: 1px solid var(--border);
  cursor: pointer; transition: 0.15s; text-align: right; width: 100%;
}
.user-row:hover, .user-row.active {
  border-color: rgba(180, 76, 255, 0.45);
  box-shadow: 0 0 14px rgba(180, 76, 255, 0.12);
}
.avatar {
  width: 36px; height: 36px; border-radius: 50%; object-fit: cover;
  border: 1px solid rgba(180, 100, 255, 0.35); background: var(--card);
  flex-shrink: 0;
}
.avatar-fb {
  width: 36px; height: 36px; border-radius: 50%;
  display: grid; place-items: center; font-weight: 700; font-size: 14px;
  background: linear-gradient(145deg, rgba(180,76,255,0.25), rgba(0,240,255,0.1));
  border: 1px solid rgba(180, 100, 255, 0.3); flex-shrink: 0;
}
.user-meta { flex: 1; min-width: 0; }
.user-name { font-weight: 700; font-size: 14px; }
.user-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
.user-score { font-weight: 800; color: var(--neon2); font-size: 15px; }
.summary {
  display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 14px;
}
@media (min-width: 640px) { .summary { grid-template-columns: repeat(4, 1fr); } }
.stat {
  background: var(--card2); border: 1px solid var(--border);
  border-radius: 14px; padding: 14px; text-align: center;
}
.stat-label { font-size: 11px; color: var(--muted); margin-bottom: 6px; }
.stat-value { font-size: 22px; font-weight: 800; }
.stat-value.pos { color: var(--positive); }
.stat-value.neg { color: var(--negative); }
.habit-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 13px; gap: 10px;
}
.habit-row:last-child { border-bottom: none; }
.habit-name { font-weight: 600; }
.habit-nums { display: flex; gap: 14px; color: var(--muted); font-size: 12px; text-align: center; }
.habit-nums b { display: block; color: var(--text); font-size: 14px; }
.empty, .loading, .deny {
  text-align: center; padding: 40px 16px; color: var(--muted); font-size: 14px;
}
.deny { color: var(--negative); }
.back-user {
  margin-bottom: 12px; font-size: 13px; color: var(--neon2);
  display: inline-flex; align-items: center; gap: 6px;
}
</style>
</head>
<body>
<div class="page">
  <header class="header">
    <div class="brand">HQL</div>
    <button class="icon-btn" id="backBtn" title="بازگشت">←</button>
  </header>

  <div id="denyBox" class="deny hidden">دسترسی ادمین نداری.</div>

  <div id="appBox" class="hidden">
    <div class="badge">ADMIN</div>
    <h1 class="page-title">پنل ادمین</h1>
    <p class="page-sub">آمار کاربران در ماه انتخاب‌شده</p>

    <div class="month-bar">
      <select id="yearSelect" class="select"></select>
      <select id="monthSelect" class="select"></select>
    </div>

    <div id="listView">
      <div class="card">
        <div class="card-title">کاربران</div>
        <div class="card-sub">برای جزئیات روی هر نفر بزن</div>
        <div class="user-list" id="userList"><div class="loading">در حال بارگذاری...</div></div>
      </div>
    </div>

    <div id="detailView" class="hidden">
      <button class="back-user" id="backToList">← بازگشت به لیست</button>
      <div id="detailContent"></div>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://zlvsmjhwyzfdecfyhxal.supabase.co";
const SUPABASE_KEY = "sb_publishable_dwpPjAJGmMQbwXdqLeeQ4Q_CSEca0cm";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
});

const J_MONTHS = ["فروردین","اردیبهشت","خرداد","تیر","مرداد","شهریور","مهر","آبان","آذر","دی","بهمن","اسفند"];
const START_YEAR = 1405;
const HABIT_LABELS = {
  water: "💧 آب", sleep: "🌙 خواب", instagram: "📱 اینستا", sun: "☀️ آفتاب",
  solitude: "🧘 خلوت", reading: "📖 مطالعه", sugar: "🍬 قند", dinner: "🍽️ شام", exercise: "🏃 ورزش"
};

let currentUser = null;
let selectedYear = null;
let selectedMonth = null;
let usersCache = [];

function fa(v) {
  return String(v).replace(/\d/g, d => "۰۱۲۳۴۵۶۷۸۹"[d]);
}
function scoreText(v) {
  const n = Number(v || 0);
  let s = Number.isInteger(n) ? String(n) : n.toFixed(2).replace(/0+$/, "").replace(/\.$/, "");
  return fa(s);
}
function isoDate(d) {
  return d.toISOString().slice(0, 10);
}
function jalaliRange(jy, jm) {
  const startG = jalaali.toGregorian(jy, jm, 1);
  const days = jalaali.jalaaliMonthLength(jy, jm);
  const endG = jalaali.toGregorian(jy, jm, days);
  return {
    start: isoDate(new Date(Date.UTC(startG.gy, startG.gm - 1, startG.gd))),
    end: isoDate(new Date(Date.UTC(endG.gy, endG.gm - 1, endG.gd))),
    days
  };
}
function avatarHtml(name) {
  const letter = (name && name.trim()[0]) || "?";
  const src = name ? "images/" + encodeURIComponent(String(name).trim()) + ".png" : null;
  if (!src) return `<div class="avatar-fb">${letter}</div>`;
  return `<img class="avatar" src="${src}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'"><div class="avatar-fb" style="display:none">${letter}</div>`;
}

document.getElementById("backBtn").onclick = () => location.href = "index.html";
document.getElementById("backToList").onclick = () => {
  document.getElementById("detailView").classList.add("hidden");
  document.getElementById("listView").classList.remove("hidden");
};

async function init() {
  const r = await db.auth.getSession();
  if (!r.data.session) {
    location.href = "index.html";
    return;
  }
  currentUser = r.data.session.user;

  const prof = await db.from("profiles").select("is_admin, display_name").eq("id", currentUser.id).maybeSingle();
  if (prof.error || !prof.data || !prof.data.is_admin) {
    document.getElementById("denyBox").classList.remove("hidden");
    return;
  }

  document.getElementById("appBox").classList.remove("hidden");
  initMonthPicker();
  await loadUsers();
}

function initMonthPicker() {
  const now = new Date();
  const j = jalaali.toJalaali(now.getFullYear(), now.getMonth() + 1, now.getDate());
  selectedYear = j.jy;
  selectedMonth = j.jm;

  const yearSel = document.getElementById("yearSelect");
  const monthSel = document.getElementById("monthSelect");
  yearSel.innerHTML = "";
  for (let y = START_YEAR; y <= j.jy; y++) {
    const opt = document.createElement("option");
    opt.value = y;
    opt.textContent = fa(y);
    if (y === selectedYear) opt.selected = true;
    yearSel.appendChild(opt);
  }
  monthSel.innerHTML = "";
  J_MONTHS.forEach((name, i) => {
    const opt = document.createElement("option");
    opt.value = i + 1;
    opt.textContent = name;
    if (i + 1 === selectedMonth) opt.selected = true;
    monthSel.appendChild(opt);
  });
  yearSel.onchange = () => { selectedYear = Number(yearSel.value); loadUsers(); };
  monthSel.onchange = () => { selectedMonth = Number(monthSel.value); loadUsers(); };
}

async function loadUsers() {
  const list = document.getElementById("userList");
  list.innerHTML = `<div class="loading">در حال بارگذاری...</div>`;
  document.getElementById("detailView").classList.add("hidden");
  document.getElementById("listView").classList.remove("hidden");

  const range = jalaliRange(selectedYear, selectedMonth);
  const now = new Date();
  const jNow = jalaali.toJalaali(now.getFullYear(), now.getMonth() + 1, now.getDate());
  let completedDays = range.days;
  if (selectedYear === jNow.jy && selectedMonth === jNow.jm) {
    completedDays = Math.max(0, jNow.jd - 1);
  }

  let boardEnd = range.end;
  if (selectedYear === jNow.jy && selectedMonth === jNow.jm && completedDays > 0) {
    const g = jalaali.toGregorian(selectedYear, selectedMonth, completedDays);
    boardEnd = isoDate(new Date(Date.UTC(g.gy, g.gm - 1, g.gd)));
  }

  try {
    const [boardRes, profilesRes] = await Promise.all([
      db.rpc("get_monthly_leaderboard", { p_start: range.start, p_end: boardEnd }),
      db.from("profiles").select("id, display_name, is_admin")
    ]);

    const board = boardRes.data || [];
    const profiles = profilesRes.data || [];
    const byId = Object.fromEntries(profiles.map(p => [p.id, p]));

    // merge all profiles with board scores
    const scoreMap = Object.fromEntries(board.map(b => [b.user_id, b]));
    usersCache = profiles.map(p => {
      const b = scoreMap[p.id];
      const total = b ? Number(b.total_score) || 0 : 0;
      const avg = completedDays > 0 ? total / completedDays : 0;
      return {
        id: p.id,
        display_name: p.display_name || "کاربر",
        is_admin: !!p.is_admin,
        total,
        avg: Math.round(avg * 100) / 100,
        completedDays
      };
    }).sort((a, b) => b.avg - a.avg || b.total - a.total);

    if (!usersCache.length) {
      list.innerHTML = `<div class="empty">کاربری نیست</div>`;
      return;
    }

    list.innerHTML = usersCache.map(u => `
      <button class="user-row" data-id="${u.id}">
        ${avatarHtml(u.display_name)}
        <div class="user-meta">
          <div class="user-name">${u.display_name}${u.is_admin ? " · admin" : ""}</div>
          <div class="user-sub">مجموع ${scoreText(u.total)} · میانگین ${scoreText(u.avg)}</div>
        </div>
        <div class="user-score">${scoreText(u.avg)}</div>
      </button>
    `).join("");

    list.querySelectorAll(".user-row").forEach(btn => {
      btn.onclick = () => openUser(btn.dataset.id);
    });
  } catch (e) {
    list.innerHTML = `<div class="empty">خطا: ${e.message}</div>`;
  }
}

async function openUser(userId) {
  const u = usersCache.find(x => x.id === userId);
  if (!u) return;

  document.getElementById("listView").classList.add("hidden");
  document.getElementById("detailView").classList.remove("hidden");
  const box = document.getElementById("detailContent");
  box.innerHTML = `<div class="loading">در حال بارگذاری آمار ${u.display_name}...</div>`;

  const range = jalaliRange(selectedYear, selectedMonth);

  try {
    const [logsRes, exRes, mtRes] = await Promise.all([
      db.from("daily_logs").select("item_type, score, log_date, value").eq("user_id", userId).gte("log_date", range.start).lte("log_date", range.end),
      db.from("exercise_logs").select("score, log_date, total_km, weight_kg, aerobic_minutes, running_km").eq("user_id", userId).gte("log_date", range.start).lte("log_date", range.end),
      db.from("mountain_trips").select("trip_date").eq("user_id", userId).gte("trip_date", range.start).lte("trip_date", range.end)
    ]);

    if (logsRes.error) throw logsRes.error;
    if (exRes.error) throw exRes.error;

    const logs = logsRes.data || [];
    const ex = exRes.data || [];
    const mt = mtRes.data || [];

    const totalScore = logs.reduce((s, r) => s + (Number(r.score) || 0), 0)
      + ex.reduce((s, r) => s + (Number(r.score) || 0), 0);
    const totalKm = ex.reduce((s, r) => s + (Number(r.total_km) || 0), 0);
    const activeDays = new Set([
      ...logs.map(r => r.log_date),
      ...ex.map(r => r.log_date)
    ]).size;

    const habitMap = {};
    logs.forEach(r => {
      if (!habitMap[r.item_type]) habitMap[r.item_type] = { count: 0, total: 0 };
      habitMap[r.item_type].count++;
      habitMap[r.item_type].total += Number(r.score) || 0;
    });
    if (ex.length) {
      habitMap.exercise = {
        count: ex.length,
        total: ex.reduce((s, r) => s + (Number(r.score) || 0), 0)
      };
    }

    const order = ["water","sleep","instagram","sun","solitude","reading","sugar","dinner","exercise"];
    const habitsHtml = order.filter(k => habitMap[k]).map(k => {
      const h = habitMap[k];
      const avg = h.count ? h.total / h.count : 0;
      return `<div class="habit-row">
        <div class="habit-name">${HABIT_LABELS[k] || k}</div>
        <div class="habit-nums">
          <div><b>${fa(h.count)}</b>روز</div>
          <div><b>${scoreText(h.total)}</b>مجموع</div>
          <div><b>${scoreText(avg)}</b>میانگین</div>
        </div>
      </div>`;
    }).join("") || `<div class="empty">عادتی ثبت نشده</div>`;

    box.innerHTML = `
      <div class="card">
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px">
          ${avatarHtml(u.display_name)}
          <div>
            <div class="card-title" style="margin:0">${u.display_name}</div>
            <div class="card-sub" style="margin:0">جزئیات ماه انتخاب‌شده</div>
          </div>
        </div>
        <div class="summary">
          <div class="stat"><div class="stat-label">امتیاز کل</div><div class="stat-value ${totalScore>0?"pos":totalScore<0?"neg":""}">${scoreText(totalScore)}</div></div>
          <div class="stat"><div class="stat-label">روز فعال</div><div class="stat-value">${fa(activeDays)}</div></div>
          <div class="stat"><div class="stat-label">کیلومتر</div><div class="stat-value">${scoreText(Math.round(totalKm*100)/100)}</div></div>
          <div class="stat"><div class="stat-label">کوه</div><div class="stat-value">${fa(mt.length)} / ۳</div></div>
        </div>
      </div>
      <div class="card">
        <div class="card-title">عادت‌ها</div>
        <div class="card-sub">تعداد روز · مجموع · میانگین</div>
        ${habitsHtml}
      </div>
    `;
  } catch (e) {
    box.innerHTML = `<div class="empty">خطا: ${e.message}<br><small>اگر RLS ادمین را ندادی، آمار دیگران خوانده نمی‌شود.</small></div>`;
  }
}

db.auth.onAuthStateChange((event, session) => {
  if (!session) location.href = "index.html";
});

init();
</script>
</body>
</html>
