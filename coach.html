<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=yes">
  <link rel="icon" type="image/png" href="images/favicon.png">
  <title>HQL | چوب استاد</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #05060a;
      --card: #0d1019;
      --card2: #131722;
      --border: rgba(180, 100, 255, 0.18);
      --text: #f0f2ff;
      --muted: #8b92b0;
      --neon: #b44cff;
      --neon2: #00f0ff;
      --positive: #00ff9d;
      --radius: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background:
        radial-gradient(ellipse 70% 40% at 10% 0%, rgba(180,76,255,0.12), transparent),
        radial-gradient(ellipse 50% 30% at 100% 20%, rgba(0,240,255,0.06), transparent),
        var(--bg);
      color: var(--text);
      font-family: "Vazirmatn", sans-serif;
    }
    .page { max-width: 720px; margin: 0 auto; padding: 16px 14px 100px; }
    .page-title { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
    .page-sub { font-size: 13px; color: var(--muted); margin-bottom: 18px; line-height: 1.5; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 12px;
    }
    .card-title { font-size: 14px; font-weight: 700; margin-bottom: 10px; }
    .hidden { display: none !important; }
    .user-chip {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; border-radius: 12px;
      border: 1px solid var(--border); background: var(--card2);
      cursor: pointer; margin-bottom: 8px;
      transition: border-color .15s, background .15s;
    }
    .user-chip:hover, .user-chip.active {
      border-color: rgba(180,76,255,0.5);
      background: rgba(180,76,255,0.1);
    }
    .user-chip .name { font-weight: 700; flex: 1; }
    .avatar {
      width: 36px; height: 36px; border-radius: 50%;
      background: #fff; object-fit: cover;
      border: 1px solid rgba(180,100,255,0.35);
    }
    .avatar-fb {
      width: 36px; height: 36px; border-radius: 50%;
      display: grid; place-items: center; font-weight: 800; font-size: 13px;
      background: linear-gradient(145deg, rgba(180,76,255,0.4), rgba(0,240,255,0.25));
    }
    .topic-btn {
      display: flex; align-items: center; gap: 8px;
      width: 100%; padding: 12px 14px; margin-bottom: 10px;
      border-radius: 12px; border: 1px dashed rgba(180,100,255,0.35);
      background: rgba(180,76,255,0.06); color: var(--text);
      font: inherit; font-weight: 700; cursor: pointer;
    }
    .topic-btn .t-ico { font-size: 20px; }
    .topic-btn .t-label { flex: 1; text-align: right; }
    .topic-btn .t-hint { font-size: 11px; color: var(--muted); font-weight: 500; }
    textarea {
      width: 100%; min-height: 100px; resize: vertical;
      border-radius: 12px; border: 1px solid var(--border);
      background: var(--card2); color: var(--text);
      padding: 12px; font: inherit; line-height: 1.5;
      margin-bottom: 10px;
    }
    textarea:focus { outline: none; border-color: var(--neon); }
    .send-btn {
      width: 100%; height: 46px; border: none; border-radius: 12px;
      font: inherit; font-weight: 800; cursor: pointer; color: var(--text);
      background: linear-gradient(135deg, rgba(180,76,255,0.45), rgba(0,240,255,0.2));
      border: 1px solid rgba(180,76,255,0.4);
    }
    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .note {
      padding: 12px; border-radius: 12px; background: var(--card2);
      border: 1px solid var(--border); margin-bottom: 8px;
    }
    .note-meta {
      display: flex; justify-content: space-between; gap: 8px;
      font-size: 11px; color: var(--muted); margin-bottom: 6px;
    }
    .note-topic {
      color: var(--neon2); font-weight: 700;
    }
    .note-body { font-size: 13px; line-height: 1.55; white-space: pre-wrap; }
    .empty { text-align: center; color: var(--muted); padding: 20px; font-size: 13px; }
    .deny {
      text-align: center; padding: 40px 16px; color: var(--muted);
    }
    /* picker overlay */
    .picker-overlay {
      position: fixed; inset: 0; z-index: 10000;
      background: rgba(5,6,10,0.75);
      backdrop-filter: blur(6px);
      display: flex; align-items: flex-end; justify-content: center;
      padding: 12px;
    }
    .picker-sheet {
      width: min(480px, 100%);
      max-height: 78vh;
      overflow-y: auto;
      background: linear-gradient(165deg, #161a28, #0a0d16);
      border: 1px solid rgba(180,100,255,0.4);
      border-radius: 20px 20px 16px 16px;
      padding: 16px 14px 20px;
      box-shadow: 0 0 40px rgba(180,76,255,0.25);
    }
    .picker-title {
      font-size: 16px; font-weight: 800; margin-bottom: 4px; text-align: center;
    }
    .picker-sub {
      font-size: 12px; color: var(--muted); text-align: center; margin-bottom: 14px;
    }
    .picker-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .picker-item {
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      padding: 14px 8px; border-radius: 14px;
      border: 1px solid var(--border); background: var(--card2);
      cursor: pointer; font-size: 11px; font-weight: 700; color: var(--text);
      transition: border-color .15s, transform .12s, box-shadow .15s;
    }
    .picker-item:hover, .picker-item:active {
      border-color: rgba(0,240,255,0.45);
      box-shadow: 0 0 14px rgba(0,240,255,0.15);
      transform: scale(1.03);
    }
    .picker-item .p-ico { font-size: 24px; }
    .picker-close {
      width: 100%; margin-top: 12px; height: 42px; border-radius: 12px;
      border: 1px solid var(--border); background: var(--card);
      color: var(--text); font-weight: 700; cursor: pointer;
    }
    .toast {
      position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
      background: var(--card2); border: 1px solid var(--border);
      padding: 10px 18px; border-radius: 12px; font-size: 13px;
      z-index: 11000; opacity: 0; transition: opacity .2s;
      pointer-events: none;
    }
    .toast.show { opacity: 1; }
    .layout-admin { display: grid; gap: 12px; }
    @media (min-width: 640px) {
      .layout-admin { grid-template-columns: 1fr 1.2fr; align-items: start; }
    }
  </style>
</head>
<body>
  <div class="page">
    <h1 class="page-title">چوب استاد</h1>
    <p class="page-sub" id="pageSub">یادداشت مربی روی عادت‌ها — مثل چوب استاد، کوتاه و اثرگذار.</p>

    <div id="denyBox" class="deny hidden">برای دیدن این صفحه وارد شو.</div>

    <div id="appBox" class="hidden">
      <!-- کاربر عادی: فقط یادداشت‌های خودش -->
      <div id="userView" class="hidden">
        <div class="card">
          <div class="card-title">پیام‌های استاد برای تو</div>
          <div id="myNotes"><div class="empty">در حال بارگذاری...</div></div>
        </div>
      </div>

      <!-- ادمین -->
      <div id="adminView" class="hidden">
        <div class="layout-admin">
          <div class="card">
            <div class="card-title">انتخاب شاگرد</div>
            <div id="userList"><div class="empty">...</div></div>
          </div>
          <div>
            <div class="card">
              <div class="card-title">یادداشت جدید</div>
              <div id="selectedUserLabel" class="page-sub" style="margin-bottom:10px">اول یک نفر را انتخاب کن</div>
              <button type="button" class="topic-btn" id="openTopicPicker">
                <span class="t-ico" id="topicIco">🎯</span>
                <span class="t-label">
                  <span id="topicLabel">انتخاب موضوع</span>
                  <div class="t-hint">مثلاً خواب، آب، ورزش...</div>
                </span>
                <span>▾</span>
              </button>
              <textarea id="noteBody" placeholder="نکتهٔ کوتاه و روشن بنویس..."></textarea>
              <button type="button" class="send-btn" id="sendNote" disabled>ثبت چوب استاد</button>
            </div>
            <div class="card">
              <div class="card-title">سابقه برای این شاگرد</div>
              <div id="adminNotes"><div class="empty">کسی انتخاب نشده</div></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <script>
  const SUPABASE_URL = "https://zlvsmjhwyzfdecfyhxal.supabase.co";
  const SUPABASE_KEY = "sb_publishable_dwpPjAJGmMQbwXdqLeeQ4Q_CSEca0cm";
  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
  });

  const TOPICS = [
    { id: "sleep", icon: "😴", title: "خواب" },
    { id: "water", icon: "💧", title: "آب" },
    { id: "exercise", icon: "🏃", title: "ورزش" },
    { id: "reading", icon: "📖", title: "کتاب" },
    { id: "sugar", icon: "🍬", title: "قند" },
    { id: "instagram", icon: "📱", title: "اینستاگرام" },
    { id: "sun", icon: "☀️", title: "آفتاب" },
    { id: "solitude", icon: "🧘", title: "خلوت" },
    { id: "dinner", icon: "🍽️", title: "شام" },
    { id: "mountain", icon: "⛰️", title: "کوه" },
    { id: "weight", icon: "⚖️", title: "وزن" },
    { id: "discipline", icon: "🔥", title: "نظم" },
    { id: "general", icon: "💬", title: "عمومی" }
  ];

  let currentUser = null;
  let isAdmin = false;
  let selectedUserId = null;
  let selectedUserName = "";
  let selectedTopic = null;

  function toast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    setTimeout(() => el.classList.remove("show"), 2200);
  }

  function topicInfo(id) {
    return TOPICS.find(t => t.id === id) || { id, icon: "•", title: id };
  }

  function avatarHtml(name) {
    const n = (name || "؟").trim();
    const src = "images/" + n + ".png";
    return `<img class="avatar" src="${src}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'"><div class="avatar-fb" style="display:none">${n.slice(0,1)}</div>`;
  }

  function formatTime(iso) {
    try {
      const d = new Date(iso);
      return d.toLocaleString("fa-IR", { dateStyle: "medium", timeStyle: "short" });
    } catch { return iso; }
  }

  function renderNotes(list, container) {
    if (!list || !list.length) {
      container.innerHTML = `<div class="empty">هنوز یادداشتی نیست</div>`;
      return;
    }
    container.innerHTML = list.map(n => {
      const t = topicInfo(n.topic);
      return `<div class="note">
        <div class="note-meta">
          <span class="note-topic">${t.icon} ${t.title}</span>
          <span>${formatTime(n.created_at)}</span>
        </div>
        <div class="note-body">${escapeHtml(n.body)}</div>
      </div>`;
    }).join("");
  }

  function escapeHtml(s) {
    return String(s || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function openTopicPicker() {
    if (!selectedUserId) {
      toast("اول شاگرد را انتخاب کن");
      return;
    }
    const overlay = document.createElement("div");
    overlay.className = "picker-overlay";
    overlay.innerHTML = `
      <div class="picker-sheet">
        <div class="picker-title">موضوع یادداشت</div>
        <div class="picker-sub">روی چه چیزی می‌خواهی چوب بزنی؟</div>
        <div class="picker-grid">
          ${TOPICS.map(t => `
            <button type="button" class="picker-item" data-topic="${t.id}">
              <span class="p-ico">${t.icon}</span>
              <span>${t.title}</span>
            </button>`).join("")}
        </div>
        <button type="button" class="picker-close">بستن</button>
      </div>`;
    const close = () => overlay.remove();
    overlay.addEventListener("click", e => { if (e.target === overlay) close(); });
    overlay.querySelector(".picker-close").onclick = close;
    overlay.querySelectorAll("[data-topic]").forEach(btn => {
      btn.onclick = () => {
        selectedTopic = btn.dataset.topic;
        const t = topicInfo(selectedTopic);
        document.getElementById("topicIco").textContent = t.icon;
        document.getElementById("topicLabel").textContent = t.title;
        document.getElementById("sendNote").disabled = !selectedUserId || !selectedTopic;
        close();
      };
    });
    document.body.appendChild(overlay);
  }

  async function loadUsers() {
    const box = document.getElementById("userList");
    const { data, error } = await db.from("profiles").select("id, display_name").order("display_name");
    if (error) {
      box.innerHTML = `<div class="empty">خطا: ${error.message}</div>`;
      return;
    }
    const list = (data || []).filter(u => u.id !== currentUser.id);
    if (!list.length) {
      box.innerHTML = `<div class="empty">کاربری نیست</div>`;
      return;
    }
    box.innerHTML = list.map(u => {
      const name = u.display_name || "کاربر";
      return `<div class="user-chip" data-uid="${u.id}" data-name="${escapeHtml(name)}">
        ${avatarHtml(name)}
        <span class="name">${escapeHtml(name)}</span>
      </div>`;
    }).join("");
    box.querySelectorAll(".user-chip").forEach(chip => {
      chip.onclick = () => {
        box.querySelectorAll(".user-chip").forEach(c => c.classList.remove("active"));
        chip.classList.add("active");
        selectedUserId = chip.dataset.uid;
        selectedUserName = chip.dataset.name || "کاربر";
        document.getElementById("selectedUserLabel").textContent = "شاگرد: " + selectedUserName;
        document.getElementById("sendNote").disabled = !selectedTopic;
        loadAdminNotes();
      };
    });
  }

  async function loadAdminNotes() {
    const box = document.getElementById("adminNotes");
    if (!selectedUserId) {
      box.innerHTML = `<div class="empty">کسی انتخاب نشده</div>`;
      return;
    }
    const { data, error } = await db.from("coach_notes")
      .select("id, topic, body, created_at")
      .eq("user_id", selectedUserId)
      .order("created_at", { ascending: false })
      .limit(40);
    if (error) {
      box.innerHTML = `<div class="empty">${error.message}</div>`;
      return;
    }
    renderNotes(data, box);
  }

  async function loadMyNotes() {
    const box = document.getElementById("myNotes");
    const { data, error } = await db.from("coach_notes")
      .select("id, topic, body, created_at")
      .eq("user_id", currentUser.id)
      .order("created_at", { ascending: false })
      .limit(50);
    if (error) {
      box.innerHTML = `<div class="empty">${error.message}</div>`;
      return;
    }
    renderNotes(data, box);
  }

  async function sendNote() {
    const body = (document.getElementById("noteBody").value || "").trim();
    if (!selectedUserId || !selectedTopic || !body) {
      toast("موضوع، شاگرد و متن لازم است");
      return;
    }
    const btn = document.getElementById("sendNote");
    btn.disabled = true;
    const { error } = await db.from("coach_notes").insert({
      admin_id: currentUser.id,
      user_id: selectedUserId,
      topic: selectedTopic,
      body
    });
    btn.disabled = false;
    if (error) {
      toast("خطا: " + error.message);
      return;
    }
    document.getElementById("noteBody").value = "";
    toast("ثبت شد ✓");
    loadAdminNotes();
  }

  async function init() {
    let r = await db.auth.getSession();
    if (!r.data.session) {
      document.getElementById("denyBox").classList.remove("hidden");
      if (typeof hqlNavSetAdmin === "function") hqlNavSetAdmin(false);
      return;
    }
    currentUser = r.data.session.user;
    const prof = await db.from("profiles").select("is_admin, display_name").eq("id", currentUser.id).maybeSingle();
    isAdmin = !!(prof.data && prof.data.is_admin);
    if (typeof hqlNavSetAdmin === "function") hqlNavSetAdmin(isAdmin);

    document.getElementById("appBox").classList.remove("hidden");
    document.getElementById("denyBox").classList.add("hidden");

    if (isAdmin) {
      document.getElementById("pageSub").textContent =
        "به‌عنوان استاد، روی هر عادت یک نکتهٔ کوتاه بگذار. شاگرد در همین صفحه می‌بیند.";
      document.getElementById("adminView").classList.remove("hidden");
      document.getElementById("openTopicPicker").onclick = openTopicPicker;
      document.getElementById("sendNote").onclick = sendNote;
      await loadUsers();
    } else {
      document.getElementById("pageSub").textContent =
        "اینجا بازخوردهای استاد روی عادت‌هایت را می‌بینی.";
      document.getElementById("userView").classList.remove("hidden");
      await loadMyNotes();
    }
  }

  db.auth.onAuthStateChange((event) => {
    if (event === "SIGNED_OUT") location.href = "index.html";
  });

  init();
  </script>
  <script src="nav.js"></script>
</body>
</html>
