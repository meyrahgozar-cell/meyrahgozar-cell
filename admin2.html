<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="icon" type="image/png" href="images/favicon.png">
<link rel="apple-touch-icon" href="images/favicon.png">
<title>HQL | پنل ادمین</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/jalaali-js@1.2.8/dist/jalaali.min.js"></script>
<style>
:root {
  --bg: #05060a;
  --card: #0d1019;
  --card2: #131722;
  --border: rgba(180, 100, 255, 0.18);
  --text: #f0f2ff;
  --muted: #8b92b0;
  --neon: #b44cff;
  --neon2: #00f0ff;
  --positive: #00ff9d;
  --negative: #ff4d6d;
  --radius: 16px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  min-height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: "Vazirmatn", sans-serif;
}
body {
  background:
    radial-gradient(ellipse 80% 50% at 20% -10%, rgba(180, 76, 255, 0.12), transparent),
    radial-gradient(ellipse 60% 40% at 90% 10%, rgba(0, 240, 255, 0.06), transparent),
    var(--bg);
  min-height: 100vh;
}
button, select { font: inherit; color: inherit; border: none; background: none; cursor: pointer; }
.hidden { display: none !important; }
.page { max-width: 800px; margin: 0 auto; padding: 14px 14px 80px; }
.header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
.brand {
  font-size: 20px; font-weight: 800;
  background: linear-gradient(90deg, #b44cff, #00f0ff);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.icon-btn {
  width: 40px; height: 40px; border-radius: 11px;
  background: var(--card); border: 1px solid var(--border);
  display: grid; place-items: center; font-size: 16px;
}
.page-title { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
.page-sub { font-size: 13px; color: var(--muted); margin-bottom: 16px; }
.badge {
  display: inline-block; font-size: 11px; font-weight: 700;
  padding: 4px 10px; border-radius: 99px;
  background: rgba(180, 76, 255, 0.2);
  border: 1px solid rgba(180, 100, 255, 0.35);
  color: var(--neon2); margin-bottom: 14px;
}
.month-bar { display: flex; gap: 10px; margin-bottom: 16px; }
.select {
  flex: 1; height: 44px; padding: 0 12px; border-radius: 12px;
  border: 1px solid var(--border); background: var(--card); outline: none; appearance: none;
}
.card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 16px; margin-bottom: 14px;
}
.card-title { font-size: 15px; font-weight: 700; margin-bottom: 2px; }
.card-sub { font-size: 12px; color: var(--muted); margin-bottom: 14px; }
.user-list { display: grid; gap: 8px; }
.user-row {
  display: flex; align-items: center; gap: 12px;
  padding: 12px; border-radius: 12px;
  background: var(--card2); border: 1px solid var(--border);
  cursor: pointer; transition: 0.15s; text-align: right; width: 100%;
}
.user-row:hover, .user-row.active {
  border-color: rgba(180, 76, 255, 0.45);
  box-shadow: 0 0 14px rgba(180, 76, 255, 0.12);
}
.avatar {
  width: 36px; height: 36px; border-radius: 50%; object-fit: cover;
  border: 1px solid rgba(180, 100, 255, 0.35); background: #fff;
  flex-shrink: 0;
}
.avatar-fb {
  width: 36px; height: 36px; border-radius: 50%;
  display: grid; place-items: center; font-weight: 700; font-size: 14px;
  background: linear-gradient(145deg, rgba(180,76,255,0.25), rgba(0,240,255,0.1));
  border: 1px solid rgba(180, 100, 255, 0.3); flex-shrink: 0;
}
.user-meta { flex: 1; min-width: 0; }
.user-name { font-weight: 700; font-size: 14px; }
.user-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
.user-score { font-weight: 800; color: var(--neon2); font-size: 15px; }
.summary {
  display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 14px;
}
@media (min-width: 640px) { .summary { grid-template-columns: repeat(4, 1fr); } }
.stat {
  background: var(--card2); border: 1px solid var(--border);
  border-radius: 14px; padding: 14px; text-align: center;
}
.stat-label { font-size: 11px; color: var(--muted); margin-bottom: 6px; }
.stat-value { font-size: 22px; font-weight: 800; }
.stat-value.pos { color: var(--positive); }
.stat-value.neg { color: var(--negative); }
.habit-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 13px; gap: 10px;
}
.habit-row:last-child { border-bottom: none; }
.habit-name { font-weight: 600; }
.habit-nums { display: flex; gap: 14px; color: var(--muted); font-size: 12px; text-align: center; }
.habit-nums b { display: block; color: var(--text); font-size: 14px; }
.empty, .loading, .deny {
  text-align: center; padding: 40px 16px; color: var(--muted); font-size: 14px;
}
.deny { color: var(--negative); }
.back-user {
  margin-bottom: 12px; font-size: 13px; color: var(--neon2);
  display: inline-flex; align-items: center; gap: 6px;
}

.chart-wrap {
  width: 100%;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  padding-bottom: 4px;
}
.chart {
  display: flex;
  align-items: flex-end;
  gap: 3px;
  height: 150px;
  padding-top: 12px;
  min-width: 100%;
}
.chart.dense {
  gap: 2px;
}
.chart.dense .bar {
  max-width: 10px;
  border-radius: 3px 3px 1px 1px;
}
.chart.dense .bar-label {
  font-size: 8px;
  transform: rotate(-55deg);
  transform-origin: center top;
  margin-top: 6px;
  height: 18px;
}
.bar-wrap {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  height: 100%;
  justify-content: flex-end;
  gap: 4px;
  min-width: 0;
  position: relative;
}
.bar {
  width: 100%;
  max-width: 14px;
  border-radius: 4px 4px 2px 2px;
  background: linear-gradient(180deg, #b44cff, #5a2db0);
  min-height: 2px;
  transition: height 0.4s cubic-bezier(.22,1,.36,1);
}
.bar.positive { background: linear-gradient(180deg, #00ff9d, #00a86b); }
.bar.negative { background: linear-gradient(180deg, #ff4d6d, #b03040); }
.bar.zero { background: var(--card); border: 1px solid var(--border); min-height: 2px; opacity: 0.5; }
.bar-label {
  font-size: 9px;
  color: var(--muted);
  white-space: nowrap;
}
.bar-wrap.best .bar {
  box-shadow: 0 0 10px rgba(255, 215, 0, 0.45);
}
.bar-wrap.best .bar-label { color: #ffd700; font-weight: 700; }


.day-modal-overlay {
  position: fixed; inset: 0; z-index: 9999;
  background: rgba(5,6,10,0.78);
  backdrop-filter: blur(8px);
  display: flex; align-items: center; justify-content: center;
  padding: 16px;
  animation: fadeIn .2s ease;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.day-modal {
  width: 100%; max-width: 380px; max-height: 85vh; overflow-y: auto;
  background: linear-gradient(160deg, #141828, #0a0d16);
  border: 1px solid rgba(180,100,255,0.5);
  border-radius: 18px;
  box-shadow: 0 0 32px rgba(180,76,255,0.4), 0 0 64px rgba(0,240,255,0.12);
  padding: 20px 18px 16px;
  animation: modalPop .28s cubic-bezier(.22,1,.36,1);
}
@keyframes modalPop {
  from { transform: scale(.92) translateY(12px); opacity: 0; }
  to { transform: scale(1) translateY(0); opacity: 1; }
}
.day-modal-header { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.day-modal-title {
  font-size: 16px; font-weight: 800;
  background: linear-gradient(90deg,#b44cff,#00f0ff);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.day-modal-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
.day-modal-close {
  width: 32px; height: 32px; border-radius: 10px;
  background: var(--card2); border: 1px solid var(--border);
  display: grid; place-items: center; color: var(--muted); flex-shrink: 0;
}
.day-modal-total {
  text-align: center; padding: 14px; margin-bottom: 12px;
  border-radius: 14px;
  background: rgba(180,76,255,0.1);
  border: 1px solid rgba(180,100,255,0.3);
}
.day-modal-total-label { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
.day-modal-total-value { font-size: 30px; font-weight: 800; }
.day-modal-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 11px 2px; border-bottom: 1px solid var(--border); font-size: 13px;
}
.day-modal-row:last-child { border-bottom: none; }
.day-modal-row-name { font-weight: 600; }
.day-modal-row-val { font-weight: 700; color: var(--neon2); }
.day-modal-row-val.pos { color: var(--positive); }
.day-modal-row-val.neg { color: var(--negative); }
.bar-wrap { cursor: pointer; -webkit-tap-highlight-color: transparent; }
.bar-wrap:active .bar { filter: brightness(1.3); }

.bar.timely {
  background: linear-gradient(180deg, #00ff9d, #00a86b) !important;
  box-shadow: 0 0 10px rgba(0, 255, 157, 0.35);
}
.bar.late {
  background: linear-gradient(180deg, #ffc14d, #e8950a) !important;
  box-shadow: 0 0 10px rgba(255, 180, 50, 0.4);
}
.bar.future {
  background: rgba(139, 146, 176, 0.25) !important;
  min-height: 3px !important;
  box-shadow: none;
  opacity: 0.4;
}
.bar.missed {
  background: linear-gradient(180deg, #ff4d6d, #8b2035) !important;
  box-shadow: 0 0 8px rgba(255, 77, 109, 0.35);
  opacity: 0.85;
  min-height: 6px !important;
}
.bar-wrap.missed .bar-label { color: #ff4d6d; }






.settings-card { margin-top: 28px; }
.settings-card .card-title { margin-bottom: 4px; }
.settings-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin: 12px 0 14px;
}
@media (max-width: 520px) {
  .settings-row { grid-template-columns: 1fr; }
}
.settings-field label {
  display: block;
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 6px;
}
.settings-field input {
  width: 100%;
  height: 44px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--card2);
  color: var(--text);
  padding: 0 12px;
  font-size: 15px;
  font-weight: 700;
  direction: ltr;
  text-align: left;
}
.settings-field input:focus {
  outline: none;
  border-color: var(--neon);
  box-shadow: 0 0 0 2px rgba(180, 76, 255, 0.15);
}
.settings-field textarea {
  width: 100%;
  min-height: 96px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--card2);
  color: var(--text);
  padding: 10px 12px;
  font-size: 14px;
  font-weight: 600;
  line-height: 1.7;
  direction: rtl;
  text-align: right;
  resize: vertical;
  font-family: inherit;
}
.settings-field textarea:focus {
  outline: none;
  border-color: var(--neon);
  box-shadow: 0 0 0 2px rgba(180, 76, 255, 0.15);
}
.settings-save {
  width: 100%;
  height: 44px;
  border-radius: 12px;
  border: 1px solid rgba(180, 76, 255, 0.4);
  background: linear-gradient(135deg, rgba(180,76,255,0.25), rgba(0,240,255,0.12));
  font-weight: 800;
  color: var(--text);
  cursor: pointer;
}
.settings-save:active { transform: scale(0.98); }
.settings-msg {
  font-size: 12px;
  color: var(--muted);
  margin-top: 8px;
  min-height: 18px;
}
.settings-msg.ok { color: var(--positive, #00ff9d); }
.settings-msg.err { color: var(--negative, #ff4d6d); }


.habit-pct {
  font-size: 18px;
  font-weight: 800;
  min-width: 3.4em;
  text-align: right;
  direction: rtl;
  unicode-bidi: isolate;
  flex-shrink: 0;
}
.habit-pct.hi { color: var(--positive); text-shadow: 0 0 12px rgba(0,255,157,0.35); }
.habit-pct.mid { color: #ffc857; text-shadow: 0 0 12px rgba(255,200,87,0.3); }
.habit-pct.lo { color: var(--negative); text-shadow: 0 0 12px rgba(255,77,109,0.3); }
.habit-item { border-bottom: 1px solid var(--border); }
.habit-item:last-child { border-bottom: none; }
.habit-item .habit-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 12px 0 6px;
  cursor: pointer;
  user-select: none;
  border-bottom: none;
}
.habit-item .habit-chevron {
  color: var(--muted);
  font-size: 12px;
  transition: transform .2s;
  flex-shrink: 0;
}
.habit-item.open .habit-chevron {
  transform: rotate(-90deg);
  color: var(--neon2);
}
.habit-item .habit-name {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  font-weight: 600;
  flex: 1;
  min-width: 0;
}
.habit-bar-track {
  height: 8px;
  background: var(--card2);
  border-radius: 6px;
  overflow: visible;
  margin: 0 0 8px;
  position: relative;
  direction: rtl;
}
.habit-bar-fill {
  height: 100%;
  width: 100%;
  border-radius: 6px;
  transform: scaleX(0);
  transform-origin: right center;
  will-change: transform;
}
.habit-bar-fill.hi { background: linear-gradient(270deg, #00ff9d, #00a86b); box-shadow: 0 0 12px rgba(0,255,157,0.45); }
.habit-bar-fill.mid { background: linear-gradient(270deg, #ffc857, #c49212); box-shadow: 0 0 12px rgba(255,200,87,0.4); }
.habit-bar-fill.lo { background: linear-gradient(270deg, #ff4d6d, #b03040); box-shadow: 0 0 12px rgba(255,77,109,0.4); }
.habit-detail {
  max-height: 0;
  overflow: hidden;
  opacity: 0;
  transition: max-height .28s ease, opacity .22s ease, padding .22s ease;
  padding: 0 2px;
  font-size: 12px;
  color: var(--muted);
  line-height: 1.7;
}
.habit-item.open .habit-detail {
  max-height: 160px;
  opacity: 1;
  padding: 0 2px 12px;
}
.habit-detail-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px 12px;
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 12px;
}
.habit-detail-grid b { color: var(--text); font-weight: 700; }
.habit-detail-formula {
  grid-column: 1 / -1;
  font-size: 11px;
  direction: rtl;
  unicode-bidi: isolate;
}
.habit-spark {
  position: absolute;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  pointer-events: none;
  z-index: 3;
  box-shadow: 0 0 6px currentColor;
}

</style>


</head>
<body>
<div class="page">
  <div id="denyBox" class="deny hidden">دسترسی ادمین نداری.</div>

  <div id="appBox" class="hidden">
    <div class="badge">ADMIN</div>
    <h1 class="page-title">پنل ادمین</h1>
    <p class="page-sub">آمار کاربران در ماه انتخاب‌شده</p>

    <div class="month-bar">
      <select id="yearSelect" class="select"></select>
      <select id="monthSelect" class="select"></select>
    </div>

    <div id="listView">
      <div class="card">
        <div class="card-title">کاربران</div>
        <div class="card-sub">برای جزئیات روی هر نفر بزن</div>
        <div class="user-list" id="userList"><div class="loading">در حال بارگذاری...</div></div>
      </div>
    </div>

    <div id="detailView" class="hidden">
      <button class="back-user" id="backToList">← بازگشت به لیست</button>
      <div id="detailContent"></div>
    </div>


    <div class="card settings-card" id="kmSettingsCard">
      <div class="card-title">ضریب امتیاز کیلومتر (زن / مرد)</div>
      <div class="card-sub">روی کالری مؤثر ورزش اعمال می‌شود: calories × ضریب — سپس همان پله‌های امتیاز</div>
      <div class="settings-row">
        <div class="settings-field">
          <label for="factorMale">ضریب مرد (پیش‌فرض ۱)</label>
          <input type="number" id="factorMale" step="0.01" min="0.1" max="5" value="1">
        </div>
        <div class="settings-field">
          <label for="factorFemale">ضریب زن (پیش‌فرض ۱.۱۵)</label>
          <input type="number" id="factorFemale" step="0.01" min="0.1" max="5" value="1.15">
        </div>
      </div>
      <button type="button" class="settings-save" id="saveKmFactors">ذخیره ضرایب</button>
      <div class="settings-msg" id="settingsMsg"></div>
    </div>

    <div class="card settings-card" id="weeklyWordCard">
      <div class="card-title">سخن هفته</div>
      <div class="card-sub">این متن در بالای همهٔ صفحات برای کاربران نمایش داده می‌شود</div>
      <div class="settings-field" style="margin:12px 0 14px">
        <label for="weeklyWordInput">متن سخن هفته</label>
        <textarea id="weeklyWordInput" rows="4" placeholder="جملهٔ هفته را اینجا بنویس..."></textarea>
      </div>
      <button type="button" class="settings-save" id="saveWeeklyWord">ذخیره سخن هفته</button>
      <div class="settings-msg" id="weeklyWordMsg"></div>
    </div>

  </div>
</div>

<script>
const SUPABASE_URL = "https://zlvsmjhwyzfdecfyhxal.supabase.co";
const SUPABASE_KEY = "sb_publishable_dwpPjAJGmMQbwXdqLeeQ4Q_CSEca0cm";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
});

const J_MONTHS = ["فروردین","اردیبهشت","خرداد","تیر","مرداد","شهریور","مهر","آبان","آذر","دی","بهمن","اسفند"];
const START_YEAR = 1405;
const HABIT_LABELS = {
  water: "💧 آب", sleep: "🌙 خواب", instagram: "📱 اینستا", sun: "☀️ آفتاب",
  solitude: "🧘 خلوت", reading: "📖 مطالعه", sugar: "🍬 قند", dinner: "🍽️ شام", exercise: "🏃 ورزش", discipline: "✅ نظم"
};
const HABIT_MAX = {
  water: 1.5, sleep: 2, instagram: 1.5, sun: 1.5, solitude: 1.5,
  reading: 1, sugar: 2, dinner: 2, exercise: 2, discipline: 1
};

let currentUser = null;
let selectedYear = null;
let selectedMonth = null;
let usersCache = [];
let dayDetailsCache = {};
let detailUserName = '';

function fa(v) {
  return String(v).replace(/\d/g, d => "۰۱۲۳۴۵۶۷۸۹"[d]);
}
function scoreText(v) {
  const n = Number(v || 0);
  let s = Number.isInteger(n) ? String(n) : n.toFixed(2).replace(/0+$/, "").replace(/\.$/, "");
  return fa(s);
}
function isoDate(d) {
  return d.toISOString().slice(0, 10);
}
function jalaliRange(jy, jm) {
  const startG = jalaali.toGregorian(jy, jm, 1);
  const days = jalaali.jalaaliMonthLength(jy, jm);
  const endG = jalaali.toGregorian(jy, jm, days);
  return {
    start: isoDate(new Date(Date.UTC(startG.gy, startG.gm - 1, startG.gd))),
    end: isoDate(new Date(Date.UTC(endG.gy, endG.gm - 1, endG.gd))),
    days
  };
}
function avatarHtml(name) {
  const letter = (name && name.trim()[0]) || "?";
  const src = name ? "images/" + encodeURIComponent(String(name).trim()) + ".png" : null;
  if (!src) return `<div class="avatar-fb">${letter}</div>`;
  return `<img class="avatar" src="${src}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'"><div class="avatar-fb" style="display:none">${letter}</div>`;
}

/* backBtn removed — glass nav */
document.getElementById("backToList").onclick = () => {
  document.getElementById("detailView").classList.add("hidden");
  document.getElementById("listView").classList.remove("hidden");
};

async function init() {
  let r = await db.auth.getSession();
  if (!r.data.session) {
    await new Promise(res => setTimeout(res, 150));
    r = await db.auth.getSession();
    if (!r.data.session) {
      location.href = "index.html";
      return;
    }
  }
  currentUser = r.data.session.user;

  const prof = await db.from("profiles").select("is_admin, display_name").eq("id", currentUser.id).maybeSingle();
  if (prof.error || !prof.data || !prof.data.is_admin) {
    document.getElementById("denyBox").classList.remove("hidden");
    return;
  }

  document.getElementById("appBox").classList.remove("hidden");
  if (typeof hqlNavSetAdmin === "function") hqlNavSetAdmin(true);
  loadKmFactors();
  const saveBtn = document.getElementById("saveKmFactors");
  if (saveBtn) saveBtn.onclick = saveKmFactors;

  loadWeeklyWord();
  const saveWordBtn = document.getElementById("saveWeeklyWord");
  if (saveWordBtn) saveWordBtn.onclick = saveWeeklyWord;

  initMonthPicker();
  await loadUsers();
  // deep link از صفحه گزارش: admin.html?u=USER_ID
  const params = new URLSearchParams(location.search);
  const deepU = params.get("u");
  if (deepU) {
    await openUser(deepU);
    // اگر کاربر در کش نبود، بعد از لیست باز هم تلاش نکن — openUser خودش هندل می‌کند
  }
}

function initMonthPicker() {
  const now = new Date();
  const j = jalaali.toJalaali(now.getFullYear(), now.getMonth() + 1, now.getDate());
  selectedYear = j.jy;
  selectedMonth = j.jm;

  const yearSel = document.getElementById("yearSelect");
  const monthSel = document.getElementById("monthSelect");
  yearSel.innerHTML = "";
  for (let y = START_YEAR; y <= j.jy; y++) {
    const opt = document.createElement("option");
    opt.value = y;
    opt.textContent = fa(y);
    if (y === selectedYear) opt.selected = true;
    yearSel.appendChild(opt);
  }
  monthSel.innerHTML = "";
  J_MONTHS.forEach((name, i) => {
    const opt = document.createElement("option");
    opt.value = i + 1;
    opt.textContent = name;
    if (i + 1 === selectedMonth) opt.selected = true;
    monthSel.appendChild(opt);
  });
  yearSel.onchange = () => { selectedYear = Number(yearSel.value); loadUsers(); };
  monthSel.onchange = () => { selectedMonth = Number(monthSel.value); loadUsers(); };
}

async function loadUsers() {
  const list = document.getElementById("userList");
  list.innerHTML = `<div class="loading">در حال بارگذاری...</div>`;
  document.getElementById("detailView").classList.add("hidden");
  document.getElementById("listView").classList.remove("hidden");

  const range = jalaliRange(selectedYear, selectedMonth);
  const now = new Date();
  const jNow = jalaali.toJalaali(now.getFullYear(), now.getMonth() + 1, now.getDate());
  let completedDays = range.days;
  if (selectedYear === jNow.jy && selectedMonth === jNow.jm) {
    completedDays = Math.max(0, jNow.jd - 1);
  }

  let boardEnd = range.end;
  if (selectedYear === jNow.jy && selectedMonth === jNow.jm && completedDays > 0) {
    const g = jalaali.toGregorian(selectedYear, selectedMonth, completedDays);
    boardEnd = isoDate(new Date(Date.UTC(g.gy, g.gm - 1, g.gd)));
  }

  try {
    const [boardRes, profilesRes] = await Promise.all([
      db.rpc("get_monthly_leaderboard", { p_start: range.start, p_end: boardEnd }),
      db.from("profiles").select("id, display_name, is_admin")
    ]);

    const board = boardRes.data || [];
    const profiles = profilesRes.data || [];
    const byId = Object.fromEntries(profiles.map(p => [p.id, p]));

    // merge all profiles with board scores
    const scoreMap = Object.fromEntries(board.map(b => [b.user_id, b]));
    usersCache = profiles.map(p => {
      const b = scoreMap[p.id];
      const total = b ? Number(b.total_score) || 0 : 0;
      const avg = completedDays > 0 ? total / completedDays : 0;
      return {
        id: p.id,
        display_name: p.display_name || "کاربر",
        is_admin: !!p.is_admin,
        total,
        avg: Math.round(avg * 100) / 100,
        completedDays
      };
    }).sort((a, b) => b.avg - a.avg || b.total - a.total);

    if (!usersCache.length) {
      list.innerHTML = `<div class="empty">کاربری نیست</div>`;
      return;
    }

    list.innerHTML = usersCache.map(u => `
      <button class="user-row" data-id="${u.id}">
        ${avatarHtml(u.display_name)}
        <div class="user-meta">
          <div class="user-name">${u.display_name}${u.is_admin ? " · admin" : ""}</div>
          <div class="user-sub">مجموع ${scoreText(u.total)} · میانگین ${scoreText(u.avg)}</div>
        </div>
        <div class="user-score">${scoreText(u.avg)}</div>
      </button>
    `).join("");

    list.querySelectorAll(".user-row").forEach(btn => {
      btn.onclick = () => openUser(btn.dataset.id);
    });
  } catch (e) {
    list.innerHTML = `<div class="empty">خطا: ${e.message}</div>`;
  }
}

async function openUser(userId) {
  let u = usersCache.find(x => x.id === userId);
  if (!u) {
    // از لینک گزارش ممکن است در لیست رتبه نباشد
    try {
      const pr = await db.from("profiles").select("id, display_name, is_admin").eq("id", userId).maybeSingle();
      if (pr.data) {
        u = { id: pr.data.id, display_name: pr.data.display_name || "کاربر", is_admin: !!pr.data.is_admin, total: 0, avg: 0 };
        usersCache.push(u);
      }
    } catch (e) {}
  }
  if (!u) {
    const box = document.getElementById("detailContent");
    document.getElementById("listView").classList.add("hidden");
    document.getElementById("detailView").classList.remove("hidden");
    if (box) box.innerHTML = `<div class="empty">کاربر پیدا نشد</div>`;
    return;
  }

  document.getElementById("listView").classList.add("hidden");
  document.getElementById("detailView").classList.remove("hidden");
  const box = document.getElementById("detailContent");
  box.innerHTML = `<div class="loading">در حال بارگذاری آمار ${u.display_name}...</div>`;

  const range = jalaliRange(selectedYear, selectedMonth);
  const daysInMonth = range.days;

  try {
    const [logsRes, exRes, mtRes, penRes] = await Promise.all([
      db.from("daily_logs").select("item_type, score, log_date, value").eq("user_id", userId).gte("log_date", range.start).lte("log_date", range.end),
      db.from("exercise_logs").select("score, log_date, total_km, weight_kg, aerobic_minutes, running_km").eq("user_id", userId).gte("log_date", range.start).lte("log_date", range.end),
      db.from("mountain_trips").select("trip_date").eq("user_id", userId).gte("trip_date", range.start).lte("trip_date", range.end),
      db.from("daily_penalties").select("score, log_date").eq("user_id", userId).gte("log_date", range.start).lte("log_date", range.end)
    ]);

    if (logsRes.error) throw logsRes.error;
    if (exRes.error) throw exRes.error;

    const logs = logsRes.data || [];
    const ex = exRes.data || [];
    const mt = mtRes.data || [];
    const pens = (!penRes.error && penRes.data) ? penRes.data : [];

    // Daily totals + breakdown for modal
    const dayMap = {};
    const dayBreakdown = {};
    for (let d = 1; d <= daysInMonth; d++) {
      const g = jalaali.toGregorian(selectedYear, selectedMonth, d);
      const iso = isoDate(new Date(Date.UTC(g.gy, g.gm - 1, g.gd)));
      dayMap[iso] = 0;
      dayBreakdown[iso] = [];
    }
    logs.forEach(r => {
      if (dayMap[r.log_date] !== undefined) {
        dayMap[r.log_date] += Number(r.score) || 0;
        dayBreakdown[r.log_date].push({
          type: r.item_type,
          label: HABIT_LABELS[r.item_type] || r.item_type,
          score: Number(r.score) || 0
        });
      }
    });
    ex.forEach(r => {
      if (dayMap[r.log_date] !== undefined) {
        dayMap[r.log_date] += Number(r.score) || 0;
        dayBreakdown[r.log_date].push({
          type: "exercise",
          label: HABIT_LABELS.exercise || "🏃 ورزش",
          score: Number(r.score) || 0
        });
      }
    });
    pens.forEach(r => {
      if (dayMap[r.log_date] !== undefined) {
        dayMap[r.log_date] += Number(r.score) || 0;
        dayBreakdown[r.log_date].push({
          type: "penalty",
          label: "⚠️ جریمه",
          score: Number(r.score) || 0
        });
      }
    });

    const daily = Object.keys(dayMap).sort().map(date => {
      const items = dayBreakdown[date] || [];
      const hasDisc = items.some(it => it.type === "discipline");
      const hasOther = items.some(it => it.type !== "discipline");
      let status = "missed";
      if (hasOther || hasDisc) {
        status = hasDisc ? "timely" : "late";
      }
      // فقط روزهای آینده را missed نکن — بی‌رنگ‌تر؟ برای سادگی missed فقط گذشته بدون ثبت
      const todayISO = isoDate(new Date());
      if (date > todayISO) status = "future";
      return { date, score: dayMap[date], items, status };
    });
    dayDetailsCache = {};
    daily.forEach(d => { dayDetailsCache[d.date] = d; });
    detailUserName = u.display_name || "کاربر";

    const maxAbs = Math.max(...daily.map(d => Math.abs(d.score)), 1);
    let bestDay = null, bestScore = -Infinity;
    daily.forEach(d => {
      if (d.score > bestScore) { bestScore = d.score; bestDay = d.date; }
    });
    if (bestScore <= 0) bestDay = null;

    const dense = daysInMonth >= 30;
    const chartHtml = `<div class="chart-wrap"><div class="chart ${dense ? "dense" : ""}" id="adminChart">` +
      daily.map(d => {
        const sc = d.score;
        const status = d.status || "missed";
        const h = status === "missed" ? 8 : status === "future" ? 3 : (Math.abs(sc) < 0.001 ? 4 : Math.max(4, (Math.abs(sc) / maxAbs) * 110));
        const [y, m, day] = d.date.split("-").map(Number);
        const j = jalaali.toJalaali(y, m, day);
        const isBest = bestDay === d.date && status !== "missed";
        const showLabel = !dense || j.jd === 1 || j.jd === daysInMonth || j.jd % 2 === 0 || isBest;
        const statusFa = status === "timely" ? "به‌موقع" : status === "late" ? "با تأخیر" : "بدون ثبت";
        const tip = `${fa(j.jd)} ${J_MONTHS[selectedMonth - 1]}: ${scoreText(sc)} · ${statusFa}`;
        return `<div class="bar-wrap ${isBest ? "best" : ""} ${status === "missed" ? "missed" : ""}" data-date="${d.date}" title="${tip}">
          <div class="bar ${status}" style="height:${h}px"></div>
          <div class="bar-label">${showLabel ? fa(j.jd) : ""}</div>
        </div>`;
      }).join("") + `</div></div>`;

    const totalScore = logs.reduce((s, r) => s + (Number(r.score) || 0), 0)
      + ex.reduce((s, r) => s + (Number(r.score) || 0), 0)
      + pens.reduce((s, r) => s + (Number(r.score) || 0), 0);
    const totalKm = ex.reduce((s, r) => s + (Number(r.total_km) || 0), 0);
    const activeDays = new Set([
      ...logs.map(r => r.log_date),
      ...ex.map(r => r.log_date)
    ]).size;

    const habitMap = {};
    logs.forEach(r => {
      if (!habitMap[r.item_type]) habitMap[r.item_type] = { count: 0, total: 0 };
      habitMap[r.item_type].count++;
      habitMap[r.item_type].total += Number(r.score) || 0;
    });
    if (ex.length) {
      habitMap.exercise = {
        count: ex.length,
        total: ex.reduce((s, r) => s + (Number(r.score) || 0), 0)
      };
    }

    const order = ["water","sleep","instagram","sun","solitude","reading","sugar","dinner","exercise"];
    const habitRows = order.filter(k => habitMap[k]).map(k => {
      const h = habitMap[k];
      const days = h.count || 0;
      const total = Number(h.total) || 0;
      const avg = days ? total / days : 0;
      const maxP = HABIT_MAX[k] != null ? HABIT_MAX[k] : 2;
      const denom = days * maxP;
      let pct = denom > 0 ? (total / denom) * 100 : 0;
      if (pct < 0) pct = 0;
      if (pct > 100) pct = 100;
      const tier = pct >= 75 ? "hi" : pct <= 25 ? "lo" : "mid";
      return { k, days, total, avg, maxP, pct, tier };
    }).sort((a, b) => b.pct - a.pct);

    const habitsHtml = habitRows.length
      ? habitRows.map(r => {
          const pctFa = scoreText(Math.round(r.pct * 10) / 10);
          return `<div class="habit-item" data-pct="${r.pct.toFixed(1)}">
        <div class="habit-row" role="button" tabindex="0" aria-expanded="false">
          <div class="habit-name">${HABIT_LABELS[r.k] || r.k}</div>
          <div class="habit-pct ${r.tier}" data-pct-val="${r.pct}">۰٪</div>
          <div class="habit-chevron">‹</div>
        </div>
        <div class="habit-bar-track"><div class="habit-bar-fill ${r.tier}" data-w="${r.pct}"></div></div>
        <div class="habit-detail">
          <div class="habit-detail-grid">
            <div>روزهای ثبت‌شده: <b>${fa(r.days)}</b></div>
            <div>سقف هر روز: <b>${scoreText(r.maxP)}</b></div>
            <div>مجموع امتیاز: <b>${scoreText(r.total)}</b></div>
            <div>میانگین روزانه: <b>${scoreText(Math.round(r.avg * 100) / 100)}</b></div>
            <div class="habit-detail-formula">درصد موفقیت = ${scoreText(r.total)} ÷ (${fa(r.days)} × ${scoreText(r.maxP)}) = <b>${pctFa}٪</b></div>
          </div>
        </div>
      </div>`;
        }).join("")
      : `<div class="empty">عادتی ثبت نشده</div>`;

    box.innerHTML = `
      <div class="card">
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px">
          ${avatarHtml(u.display_name)}
          <div>
            <div class="card-title" style="margin:0">${u.display_name}</div>
            <div class="card-sub" style="margin:0">جزئیات ماه انتخاب‌شده</div>
          </div>
        </div>
        <div class="summary">
          <div class="stat"><div class="stat-label">امتیاز کل</div><div class="stat-value ${totalScore>0?"pos":totalScore<0?"neg":""}">${scoreText(totalScore)}</div></div>
          <div class="stat"><div class="stat-label">روز فعال</div><div class="stat-value">${fa(activeDays)}</div></div>
          <div class="stat"><div class="stat-label">کیلومتر</div><div class="stat-value">${scoreText(Math.round(totalKm*100)/100)}</div></div>
          <div class="stat"><div class="stat-label">کوه</div><div class="stat-value">${fa(mt.length)} / ۳</div></div>
        </div>
      </div>
      <div class="card">
        <div class="card-title">نمودار روزانه</div>
        <div class="card-sub">امتیاز هر روز · ${fa(daysInMonth)} روز ماه${dense ? " · فشرده" : ""}</div>
        ${chartHtml}
      </div>
      <div class="card">
        <div class="card-title">عادت‌ها</div>
        <div class="card-sub">درصد موفقیت · برای جزئیات روی هر ردیف بزن</div>
        ${habitsHtml}
      </div>
    `;

    box.querySelectorAll(".bar-wrap[data-date]").forEach(el => {
      el.addEventListener("click", () => openDayModal(el.dataset.date));
    });
    box.querySelectorAll(".habit-item .habit-row").forEach(row => {
      row.addEventListener("click", () => {
        const item = row.closest(".habit-item");
        if (!item) return;
        item.classList.toggle("open");
        row.setAttribute("aria-expanded", item.classList.contains("open") ? "true" : "false");
      });
    });
    animateAdminHabitBars(box);
  } catch (e) {
    box.innerHTML = `<div class="empty">خطا: ${e.message}<br><small>اگر RLS ادمین را ندادی، آمار دیگران خوانده نمی‌شود.</small></div>`;
  }
}


function animateAdminHabitBars(root) {
  if (!root) return;
  const items = root.querySelectorAll(".habit-item");
  if (!items.length) return;

  function runItem(item, idx) {
    if (item.dataset.animated === "1") return;
    item.dataset.animated = "1";
    const fill = item.querySelector(".habit-bar-fill");
    const pctEl = item.querySelector(".habit-pct");
    if (!fill) return;
    const target = Math.max(0, Math.min(100, Number(fill.dataset.w) || 0));
    fill.style.transform = "scaleX(0)";
    if (pctEl) pctEl.textContent = "۰٪";
    const delay = idx * 80;
    setTimeout(() => {
      const dur = 950 + target * 4;
      const t0 = performance.now();
      let burstDone = false;
      function easeOutCubic(x) { return 1 - Math.pow(1 - x, 3); }
      function spawnBurst(track, color) {
        const rect = track.getBoundingClientRect();
        const originX = rect.width * (1 - target / 100);
        const originY = rect.height / 2;
        const n = 12 + Math.floor(target / 12);
        for (let i = 0; i < n; i++) {
          const sp = document.createElement("span");
          sp.className = "habit-spark";
          const angle = Math.PI * 0.15 + Math.random() * Math.PI * 0.7;
          const speed = 1.2 + Math.random() * 3.2;
          let vx = -Math.cos(angle) * speed * (0.7 + Math.random());
          let vy = Math.sin(angle) * speed * (0.55 + Math.random());
          let x = originX, y = originY, life = 1;
          sp.style.left = x + "px";
          sp.style.top = y + "px";
          sp.style.background = color;
          sp.style.color = color;
          track.appendChild(sp);
          const g = 0.12 + Math.random() * 0.08;
          const drag = 0.985;
          function stepP() {
            vx *= drag;
            vy = vy * drag + g;
            x += vx; y += vy;
            life -= 0.02 + Math.random() * 0.01;
            sp.style.left = x + "px";
            sp.style.top = y + "px";
            sp.style.opacity = String(Math.max(0, life));
            sp.style.transform = "scale(" + (0.5 + life * 0.7) + ")";
            if (life > 0 && y < rect.height + 48) requestAnimationFrame(stepP);
            else sp.remove();
          }
          requestAnimationFrame(stepP);
        }
      }
      function frame(now) {
        const tt = Math.min(1, (now - t0) / dur);
        const e = easeOutCubic(tt);
        const cur = target * e;
        fill.style.transform = "scaleX(" + (cur / 100) + ")";
        if (pctEl) pctEl.textContent = (Math.round(cur * 10) / 10).toLocaleString("fa-IR") + "٪";
        if (tt >= 1 && !burstDone) {
          burstDone = true;
          const track = fill.parentElement;
          const tier = fill.classList.contains("hi") ? "#00ff9d" :
            fill.classList.contains("lo") ? "#ff4d6d" : "#ffc857";
          if (target >= 1) spawnBurst(track, tier);
        }
        if (tt < 1) requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    }, delay);
  }

  items.forEach(it => {
    delete it.dataset.animated;
    const fill = it.querySelector(".habit-bar-fill");
    if (fill) fill.style.transform = "scaleX(0)";
  });

  if (!("IntersectionObserver" in window)) {
    items.forEach((it, idx) => runItem(it, idx));
    return;
  }
  const io = new IntersectionObserver((entries) => {
    entries.forEach(en => {
      if (!en.isIntersecting) return;
      const item = en.target;
      runItem(item, Number(item.dataset.animIdx || 0));
      io.unobserve(item);
    });
  }, { threshold: 0.35, rootMargin: "0px 0px -8% 0px" });
  items.forEach((it, idx) => {
    it.dataset.animIdx = String(idx);
    io.observe(it);
  });
}

function openDayModal(isoDateStr) {
  const data = dayDetailsCache[isoDateStr];
  if (!data) return;
  const [y, m, d] = isoDateStr.split("-").map(Number);
  const j = jalaali.toJalaali(y, m, d);
  const dateLabel = fa(j.jd) + " " + J_MONTHS[j.jm - 1] + " " + fa(j.jy);
  const total = Number(data.score) || 0;
  const items = data.items || [];
  let rows = items.length
    ? items.map(it => {
        const sc = Number(it.score) || 0;
        const cls = sc > 0 ? "pos" : sc < 0 ? "neg" : "";
        return `<div class="day-modal-row">
          <div class="day-modal-row-name">${it.label}</div>
          <div class="day-modal-row-val ${cls}">${scoreText(sc)}</div>
        </div>`;
      }).join("")
    : `<div class="empty" style="padding:16px">ثبتی برای این روز نیست</div>`;

  const overlay = document.createElement("div");
  overlay.className = "day-modal-overlay";
  overlay.innerHTML = `
    <div class="day-modal" role="dialog">
      <div class="day-modal-header">
        <div>
          <div class="day-modal-title">${detailUserName}</div>
          <div class="day-modal-sub">${dateLabel}</div>
        </div>
        <button type="button" class="day-modal-close" aria-label="بستن">✕</button>
      </div>
      <div class="day-modal-total">
        <div class="day-modal-total-label">امتیاز روز</div>
        <div class="day-modal-total-value ${total>0?"pos":total<0?"neg":""}" style="color:${total>0?"var(--positive)":total<0?"var(--negative)":"var(--text)"}">${scoreText(total)}</div>
      </div>
      <div class="day-modal-list">${rows}</div>
    </div>`;
  const close = () => overlay.remove();
  overlay.addEventListener("click", e => { if (e.target === overlay) close(); });
  overlay.querySelector(".day-modal-close").onclick = close;
  document.body.appendChild(overlay);
}

async function loadKmFactors() {
  const msg = document.getElementById("settingsMsg");
  try {
    const { data, error } = await db.from("app_settings")
      .select("key, value")
      .in("key", ["km_factor_male", "km_factor_female"]);
    if (error) throw error;
    const map = {};
    (data || []).forEach(r => { map[r.key] = Number(r.value); });

      msg.className = "settings-msg err";

}

async function saveKmFactors() {
  const msg = document.getElementById("settingsMsg");
  const male = Number(document.getElementById("factorMale").value);
  const female = Number(document.getElementById("factorFemale").value);
  if (!(male > 0) || !(female > 0)) {
    msg.textContent = "ضرایب باید عدد مثبت باشند";
    msg.className = "settings-msg err";
    return;
  }
  msg.textContent = "در حال ذخیره...";
  msg.className = "settings-msg";
  try {
    const uid = currentUser?.id || null;
    const rows = [
      { key: "km_factor_male", value: male, updated_at: new Date().toISOString(), updated_by: uid },
      { key: "km_factor_female", value: female, updated_at: new Date().toISOString(), updated_by: uid }
    ];
    const { error } = await db.from("app_settings").upsert(rows, { onConflict: "key" });
    if (error) throw error;
    msg.textContent = "ذخیره شد ✓";
    msg.className = "settings-msg ok";
  } catch (e) {
    msg.textContent = "خطا: " + (e.message || e);
    msg.className = "settings-msg err";
  }
}


async function loadWeeklyWord() {
  const msg = document.getElementById("weeklyWordMsg");
  const ta = document.getElementById("weeklyWordInput");
  if (!ta) return;
  try {
    const { data, error } = await db.from("site_messages")
      .select("key, body")
      .eq("key", "coach_weekly_word")
      .maybeSingle();
    if (error) throw error;
    if (data && typeof data.body === "string") ta.value = data.body;
  } catch (e) {
    if (msg) {
      msg.textContent = "خواندن سخن هفته: " + (e.message || e);
      msg.className = "settings-msg err";
    }
  }
}

async function saveWeeklyWord() {
  const msg = document.getElementById("weeklyWordMsg");
  const ta = document.getElementById("weeklyWordInput");
  if (!ta) return;
  const body = (ta.value || "").trim();
  if (!body) {
    msg.textContent = "متن سخن هفته را وارد کن";
    msg.className = "settings-msg err";
    return;
  }
  msg.textContent = "در حال ذخیره...";
  msg.className = "settings-msg";
  try {
    const { error } = await db.from("site_messages").upsert(
      {
        key: "coach_weekly_word",
        body: body,
        updated_at: new Date().toISOString()
      },
      { onConflict: "key" }
    );
    if (error) throw error;
    msg.textContent = "ذخیره شد ✓";
    msg.className = "settings-msg ok";
    if (typeof window.hqlReloadCoachWord === "function") {
      try { window.hqlReloadCoachWord(); } catch (_) {}
    }
  } catch (e) {
    msg.textContent = "خطا: " + (e.message || e);
    msg.className = "settings-msg err";
  }
}


init();
