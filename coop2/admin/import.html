<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<script>
(function(){
  try {
    var t = localStorage.getItem('mpna_theme') || 'dark';
    if (t !== 'dark' && t !== 'light') t = 'dark';
    document.documentElement.setAttribute('data-theme', t);
  } catch(e) {
    document.documentElement.setAttribute('data-theme', 'dark');
  }
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ایمپورت اکسل | تعاونی مسکن مپنا هوایی</title>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" />
<link rel="stylesheet" href="css/variables.css" />
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/layout.css" />
<link rel="stylesheet" href="css/pages.css" />
<link rel="stylesheet" href="css/import.css" />
<link rel="stylesheet" href="css/responsive.css" />
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
  <div id="appHeader"></div>

  <main class="container page">
    <header class="page-head">
      <span class="page-icon">📥</span>
      <div>
        <h1>ایمپورت هوشمند اکسل</h1>
        <p class="muted">فایل اکسل خود را بارگذاری کنید؛ سیستم به‌طور خودکار با دیتابیس مقایسه و مغایرت‌ها را گزارش می‌کند.</p>
      </div>
    </header>

    <section class="panel import-step" id="stepUpload" data-step="1">
      <header class="panel-head">
        <h2>۱. بارگذاری فایل</h2>
        <span class="badge">xlsx / xls</span>
      </header>
      <div class="dropzone" id="dropzone" tabindex="0">
        <input type="file" id="fileInput" accept=".xlsx,.xls" hidden />
        <div class="dropzone-inner">
          <div class="dropzone-icon">📄</div>
          <div class="dropzone-title">فایل اکسل را اینجا رها کنید</div>
          <div class="dropzone-sub">یا کلیک کنید تا انتخاب کنید</div>
          <div class="dropzone-hint">شیت‌های موردنیاز: Members، Payments، Obligations</div>
        </div>
      </div>
      <div id="uploadMsg" class="auth-msg"></div>
    </section>

    <section class="panel import-step" id="stepPreview" data-step="2" hidden>
      <header class="panel-head">
        <h2>۲. تحلیل و مقایسه</h2>
        <span class="badge" id="previewBadge">—</span>
      </header>

      <div class="diff-summary" id="diffSummary"></div>

      <nav class="tabs" id="diffTabs">
        <button class="tab active" data-tab="members">اعضا</button>
        <button class="tab" data-tab="payments">پرداخت‌ها</button>
        <button class="tab" data-tab="obligations">تعهدات</button>
      </nav>

      <div class="tab-panels" id="diffPanels"></div>

      <div class="form-actions import-actions">
        <button class="btn btn-ghost" id="cancelImport">انصراف</button>
        <button class="btn btn-primary" id="applyImport">
          <span class="btn-text">اعمال تغییرات</span>
          <span class="spinner" hidden></span>
        </button>
      </div>
      <div id="applyMsg" class="auth-msg"></div>
    </section>

    <section class="panel import-step" id="stepResult" data-step="3" hidden>
      <header class="panel-head"><h2>۳. نتیجه عملیات</h2></header>
      <div id="resultBody"></div>
    </section>
  </main>

  <div id="appFooter"></div>
  <script src="js/debug.js" defer></script>
  <script type="module" src="js/admin-import.js"></script>
</body>
</html>
