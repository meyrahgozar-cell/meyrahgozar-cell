<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<script>
(function(){
  try {
    var t = localStorage.getItem('mpna_theme') || 'dark';
    if (t !== 'dark' && t !== 'light') t = 'dark';
    document.documentElement.setAttribute('data-theme', t);
  } catch(e) {
    document.documentElement.setAttribute('data-theme', 'dark');
  }
  window.__mpna = window.__mpna || { errors: [], moduleFlags: {}, start: Date.now() };
  window.addEventListener('error', function(e){
    window.__mpna.errors.push({ type:'error', message: e.message || String(e.error), source:(e.filename||'').split('/').pop(), line:e.lineno, time: Date.now()-window.__mpna.start });
  });
  window.addEventListener('unhandledrejection', function(e){
    var r = e.reason; var m = (r && (r.stack || r.message)) || String(r);
    window.__mpna.errors.push({ type:'promise', message:m, time: Date.now()-window.__mpna.start });
  });
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>درخواست و پیشنهاد | تعاونی مسکن مپنا هوایی</title>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" />
<link rel="stylesheet" href="css/variables.css" />
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/layout.css" />
<link rel="stylesheet" href="css/pages.css" />
<link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <div id="appHeader"></div>
  <main class="container page narrow">
    <header class="page-head">
      <span class="page-icon">✉️</span>
      <div>
        <h1>درخواست و پیشنهاد</h1>
        <p class="muted">لطفا درخواست و پیشنهاد خود را ارسال فرمایید.</p>
      </div>
    </header>

    <form id="suggestionForm" class="panel form-panel">
      <label class="field" for="suggestionText">
        <span>متن پیام</span>
        <textarea id="suggestionText" class="suggestion-textarea"
                  rows="10" maxlength="5000" placeholder="متن خود را اینجا بنویسید…" required></textarea>
        <small class="hint"><span id="charCount">0</span> / ۵۰۰۰</small>
      </label>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary" id="sendBtn">
          <span class="btn-text">ارسال</span>
          <span class="spinner" hidden></span>
        </button>
        <button type="reset" class="btn btn-ghost">پاک کردن</button>
      </div>

      <div id="suggMsg" class="auth-msg" role="alert"></div>
    </form>
  </main>
  <div id="appFooter"></div>

  <script>
  (function(){
    function wire(){
      var btns = document.querySelectorAll('[data-theme-toggle]');
      for (var i = 0; i < btns.length; i++) {
        (function(b){
          if (b.__wired) return;
          b.__wired = true;
          b.addEventListener('click', function(ev){
            ev.preventDefault();
            var cur = document.documentElement.getAttribute('data-theme') || 'dark';
            var next = cur === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            try { localStorage.setItem('mpna_theme', next); } catch(e){}
          });
        })(btns[i]);
      }
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', wire);
    else wire();
    var mo = new MutationObserver(wire);
    document.addEventListener('DOMContentLoaded', function(){
      mo.observe(document.body, { childList: true, subtree: true });
    });
  })();
  </script>

  <script src="js/debug.js" defer></script>
  <script type="module" src="js/suggestions.js"></script>
</body>
</html>
