        async function saveBmiProfile() {
            const msg = document.getElementById("bmiMsg");
            const h = Number(document.getElementById("bmiHeight").value);
            const ageRaw = document.getElementById("bmiAge").value;
            const age = ageRaw === "" ? null : Number(ageRaw);
            if (!(h >= 100 && h <= 250)) {
                if (msg) { msg.textContent = "قد را بین ۱۰۰ تا ۲۵۰ سانتی‌متر وارد کن"; msg.className = "bmi-msg err"; }
                return;
            }
            if (age != null && (!(age >= 10 && age <= 120) || !Number.isInteger(age))) {
                if (msg) { msg.textContent = "سن را بین ۱۰ تا ۱۲۰ وارد کن"; msg.className = "bmi-msg err"; }
                return;
            }
            if (msg) { msg.textContent = "در حال ذخیره..."; msg.className = "bmi-msg"; }
            try {
                const patch = { height_cm: h, updated_at: new Date().toISOString() };
                if (age != null) patch.age_years = age;
                const { error } = await db.from("profiles").update(patch).eq("id", currentUser.id);
                if (error) throw error;
                const prev = bmiDataByUser[String(currentUser.id)] || {};
                bmiDataByUser[String(currentUser.id)] = {
                    height_cm: h,
                    age_years: age != null ? age : (prev.age_years != null ? prev.age_years : null),
                    weight_kg: prev.weight_kg != null ? prev.weight_kg : null
                };
                if (msg) { msg.textContent = "ذخیره شد ✓"; msg.className = "bmi-msg ok"; }
                setTimeout(() => {
                    closeBmiEditor();
                    loadReport();
                }, 450);
            } catch (e) {
                if (msg) { msg.textContent = "خطا: " + (e.message || e); msg.className = "bmi-msg err"; }
            }
        }


        async function loadReport() {
            const seq = ++reportLoadSeq;

            if (typeof renderSkeleton === "function") {
                renderSkeleton();
            } else {
                const c = document.getElementById("content");
                if (c) c.innerHTML = `<div class="loading">در حال بارگذاری...</div>`;
            }

            const range = jalaliRange(selectedYear, selectedMonth);

            try {
                const [statsRes, boardRes, logsRes, exRes, kmRes, userKmRes, mtRes] = await Promise.all([
                    db.rpc("get_my_month_report", { p_start: range.start, p_end: range.end }),
                    db.rpc("get_monthly_leaderboard", { p_start: range.start, p_end: range.end }),
                    db.from("daily_logs")
                    .select("item_type, score, log_date")
                    .eq("user_id", currentUser.id)
                    .gte("log_date", range.start)
                    .lte("log_date", range.end),
                    db.from("exercise_logs")
                    .select("score, log_date, total_km, aerobic_equivalent_km, running_km, weight_kg")
                    .eq("user_id", currentUser.id)
                    .gte("log_date", range.start)
                    .lte("log_date", range.end),
                    db.rpc("get_month_km_stats", { p_start: range.start, p_end: range.end }),
                    db.rpc("get_month_user_km", { p_start: range.start, p_end: range.end }),
                    db.from("mountain_trips")
                    .select("trip_date")
                    .eq("user_id", currentUser.id)
                    .gte("trip_date", range.start)
                    .lte("trip_date", range.end)
                ]);

                if (statsRes.error) throw statsRes.error;

                const stats = statsRes.data || {
                    total_score: 0,
                    avg_score: 0,
                    best_day: null,
                    best_score: 0,
                    active_days: 0,
                    daily: []
                };

                const now = new Date();
                const jNow = jalaali.toJalaali(now.getFullYear(), now.getMonth() + 1, now.getDate());
                const daysInMonth = jalaali.jalaaliMonthLength(selectedYear, selectedMonth);
                const isCurrentMonth = selectedYear === jNow.jy && selectedMonth === jNow.jm;
                const isFutureMonth = selectedYear > jNow.jy || (selectedYear === jNow.jy && selectedMonth > jNow.jm);

                let completedDays;
                if (isCurrentMonth) {
                    completedDays = Math.max(0, jNow.jd - 1);
                } else if (isFutureMonth) {
                    completedDays = 0;
                } else {
                    completedDays = daysInMonth;
                }

                let boardData = boardRes.data || [];
                let rankCompletedDays = completedDays;

                if (rankMode === "week") {
                    ensureSelectedWeek();
                    const wr = selectedWeekRange();
                    rankCompletedDays = wr.completedDays;
                    if (rankCompletedDays <= 0) {
                        boardData = [];
                    } else {
                        const boardWeek = await db.rpc("get_monthly_leaderboard", {
                            p_start: wr.start,
                            p_end: wr.endCompleted
                        });
                        if (!boardWeek.error) boardData = boardWeek.data || [];
                        else boardData = [];
                    }
                } else if (isCurrentMonth && completedDays > 0) {
                    const endCompleted = (() => {
                        const g = jalaali.toGregorian(selectedYear, selectedMonth, completedDays);
                        return isoDate(new Date(Date.UTC(g.gy, g.gm - 1, g.gd)));
                    })();
                    const boardCompleted = await db.rpc("get_monthly_leaderboard", {
                        p_start: range.start,
                        p_end: endCompleted
                    });
                    if (!boardCompleted.error) boardData = boardCompleted.data || [];
                } else if (isCurrentMonth && completedDays === 0) {
                    boardData = [];
                }

                const todayISO = isoDate(now);
                let todayActive = new Set();
                let weekIncludesToday = false;
                if (rankMode === "week") {
                    const wrNow = selectedWeekRange();
                    weekIncludesToday = todayISO >= wrNow.start && todayISO <= wrNow.endFri;
                }
                if ((rankMode === "month" && isCurrentMonth) || (rankMode === "week" && weekIncludesToday)) {
                    try {
                        const act = await db.rpc("get_today_active_users", { p_today: todayISO });
                        if (!act.error && Array.isArray(act.data)) {
                            act.data.forEach(id => todayActive.add(id));
                        } else if (!act.error && act.data) {
                            const arr = typeof act.data === "string" ? JSON.parse(act.data) : act.data;
                            (arr || []).forEach(id => todayActive.add(id));
                        }
                    } catch (e) {}
                }

                // فرمول یکسان ماه و هفته: avg = (sum scores in range / completedDays) + todayBonus
                let leaderboard = boardData.map(u => {
                    const totalScore = Number(u.total_score) || 0;
                    const bonus = (todayActive.has(u.user_id) || todayActive.has(String(u.user_id))) ? 1 : 0;
                    const daysDiv = (typeof rankCompletedDays === "number" ? rankCompletedDays : completedDays);
                    const baseAvg = daysDiv > 0 ? (totalScore / daysDiv) : 0;
                    const avg = Math.round((baseAvg + bonus) * 100) / 100;
                    return { ...u, avg, bonus, completedDays: daysDiv, totalScore };
                });

                if (isCurrentMonth && todayActive.size) {
                    const onBoard = new Set(leaderboard.map(u => String(u.user_id)));
                    const missing = [...todayActive].filter(id => !onBoard.has(String(id)));
                    if (missing.length) {
                        let nameMap = {};
                        try {
                            const pr = await db.from("profiles").select("id, display_name").in("id", missing);
                            (pr.data || []).forEach(p => {
                                nameMap[p.id] = p.display_name;
                                nameMap[String(p.id)] = p.display_name;
                            });
                        } catch (e) {}
                        missing.forEach(uid => {
                            leaderboard.push({
                                user_id: uid,
                                display_name: nameMap[uid] || nameMap[String(uid)] || "کاربر",
                                total_score: 0,
                                totalScore: 0,
                                avg: 1,
                                bonus: 1,
                                completedDays
                            });
                        });
                    }
                }

                const needNames = leaderboard.filter(u => !u.display_name || u.display_name === "کاربر");
                if (needNames.length) {
                    try {
                        const ids = needNames.map(u => u.user_id);
                        const pr = await db.from("profiles").select("id, display_name").in("id", ids);
                        const map = {};
                        (pr.data || []).forEach(p => {
                            if (p.display_name) {
                                map[p.id] = p.display_name;
                                map[String(p.id)] = p.display_name;
                            }
                        });
                        leaderboard.forEach(u => {
                            const n = map[u.user_id] || map[String(u.user_id)];
                            if (n) u.display_name = n;
                        });
                    } catch (e) {}
                }
                leaderboard.sort((a, b) => b.avg - a.avg);

                // بازه کیلومتر: در حالت هفته فقط از شنبه تا امروز (نه کل ماه)
                let kmStart = range.start;
                let kmEnd = range.end;
                if (rankMode === "week") {
                    const wrKm = selectedWeekRange();
                    kmStart = wrKm.start;
                    kmEnd = wrKm.end;
                }

                try {
                    const kmUsersRes = await db.rpc("get_month_user_km", {
                        p_start: kmStart,
                        p_end: kmEnd
                    });
                    if (!kmUsersRes.error && kmUsersRes.data) {
                        const kmMap = {};
                        (Array.isArray(kmUsersRes.data) ? kmUsersRes.data : []).forEach(row => {
                            const id = row.user_id;
                            kmMap[id] = Number(row.total_km) || 0;
                            kmMap[String(id)] = Number(row.total_km) || 0;
                        });
                        leaderboard.forEach(u => {
                            u.km = kmMap[u.user_id] || kmMap[String(u.user_id)] || 0;
                        });
                    }
                } catch (e) {}

                try {
                    const calUsersRes = await db.rpc("get_month_user_calories", {
                        p_start: kmStart,
                        p_end: kmEnd
                    });
                    if (!calUsersRes.error && calUsersRes.data) {
                        const calMap = {};
                        (Array.isArray(calUsersRes.data) ? calUsersRes.data : []).forEach(row => {
                            const id = row.user_id;
                            const v = Number(row.total_calories) || 0;
                            calMap[id] = v;
                            calMap[String(id)] = v;
                        });
                        leaderboard.forEach(u => {
                            u.cal = calMap[u.user_id] || calMap[String(u.user_id)] || 0;
                        });
                    }
                } catch (e) {}

                const habitMap = {};
                (logsRes.data || []).forEach(r => {
                    if (!habitMap[r.item_type]) habitMap[r.item_type] = { count: 0, total: 0 };
                    habitMap[r.item_type].count++;
                    habitMap[r.item_type].total += Number(r.score) || 0;
                });

                if (exRes.data && exRes.data.length) {
                    habitMap.exercise = {
                        count: exRes.data.length,
                        total: exRes.data.reduce((s, r) => s + (Number(r.score) || 0), 0)
                    };
                }

                const mtList = (mtRes && !mtRes.error && mtRes.data) ? mtRes.data : [];
                habitMap.mountain = {
                    count: mtList.length,
                    total: mtList.length
                };
                if (!habitMap.discipline) {
                    habitMap.discipline = { count: 0, total: 0 };
                }

                // کیلومتر من و جامعه: فیلتر به همان بازه (هفته یا ماه)
                const exInRange = (exRes.data || []).filter(r => {
                    const d = r.log_date;
                    return d >= kmStart && d <= kmEnd;
                });
                const myKm = exInRange.reduce((s, r) => s + (Number(r.total_km) || 0), 0);

                let communityKm = 0;
                let activePeople = 0;
                try {
                    const kmStatsRes = (rankMode === "week")
                        ? await db.rpc("get_month_km_stats", { p_start: kmStart, p_end: kmEnd })
                        : kmRes;
                    const kmStats = kmStatsRes && !kmStatsRes.error ? (kmStatsRes.data || {}) : {};
                    communityKm = Number(kmStats.total_km) || 0;
                    activePeople = Number(kmStats.active_users) || 0;
                } catch (e) {
                    const kmStats = kmRes && !kmRes.error ? (kmRes.data || {}) : {};
                    communityKm = Number(kmStats.total_km) || 0;
                    activePeople = Number(kmStats.active_users) || 0;
                }

                const kmByUser = {};
                if (userKmRes && !userKmRes.error && Array.isArray(userKmRes.data)) {
                    userKmRes.data.forEach(row => {
                        kmByUser[row.user_id] = Number(row.total_km) || 0;
                        kmByUser[String(row.user_id)] = Number(row.total_km) || 0;
                    });
                }
                leaderboard.forEach(u => {
                    if (u.km != null && !Number.isNaN(Number(u.km))) {
                        u.month_km = Number(u.km) || 0;
                    } else {
                        u.month_km = kmByUser[u.user_id] || kmByUser[String(u.user_id)] || 0;
                    }
                    u.month_cal = Number(u.cal) || 0;
                });

                if (rankBy === "km") {
                    leaderboard.sort((a, b) => (Number(b.month_km) || 0) - (Number(a.month_km) || 0));
                } else if (rankBy === "cal") {
                    leaderboard.sort((a, b) => (Number(b.month_cal) || 0) - (Number(a.month_cal) || 0));
                } else {
                    leaderboard.sort((a, b) => (Number(b.avg) || 0) - (Number(a.avg) || 0));
                }

                try {
                    const ids = leaderboard.map(u => u.user_id).filter(Boolean);
                    if (currentUser && currentUser.id) ids.push(currentUser.id);
                    await loadBmiDataForUsers(ids);
                    leaderboard.forEach(u => {
                        const b = bmiDataByUser[String(u.user_id)] || {};
                        u.height_cm = b.height_cm;
                        u.age_years = b.age_years;
                        u.weight_kg = b.weight_kg;
                        u.bmi = calcBmi(b.weight_kg, b.height_cm);
                    });
                } catch (e) {}

                const weightByDay = {};
                (exRes.data || []).forEach(e => {
                    if (e.log_date && e.weight_kg != null) {
                        weightByDay[e.log_date] = Number(e.weight_kg);
                    }
                });

                const dayStatus = {};
                const daysInM = jalaali.jalaaliMonthLength(selectedYear, selectedMonth);
                for (let d = 1; d <= daysInM; d++) {
                    const g = jalaali.toGregorian(selectedYear, selectedMonth, d);
                    const iso = isoDate(new Date(Date.UTC(g.gy, g.gm - 1, g.gd)));
                    dayStatus[iso] = { score: 0, hasDisc: false, hasOther: false };
                }
                (logsRes.data || []).forEach(row => {
                    if (!dayStatus[row.log_date]) return;
                    dayStatus[row.log_date].score += Number(row.score) || 0;
                    if (row.item_type === "discipline") dayStatus[row.log_date].hasDisc = true;
                    else dayStatus[row.log_date].hasOther = true;
                });
                (exRes.data || []).forEach(row => {
                    if (!dayStatus[row.log_date]) return;
                    dayStatus[row.log_date].score += Number(row.score) || 0;
                    dayStatus[row.log_date].hasOther = true;
                });
                const todayIsoForStatus = isoDate(new Date());
                Object.keys(dayStatus).forEach(iso => {
                    const s = dayStatus[iso];
                    if (iso > todayIsoForStatus) s.status = "future";
                    else if (s.hasOther || s.hasDisc) s.status = s.hasDisc ? "timely" : "late";
                    else s.status = "missed";
                });
                if (seq !== reportLoadSeq) return;
                renderReport(stats, habitMap, leaderboard, { myKm, communityKm, activePeople }, dayStatus, weightByDay);
            } catch (err) {
                const content = document.getElementById("content");
                content.innerHTML = `
              <div class="empty error-box">
                <div class="empty-icon">⚠️</div>
                <div>خطا در دریافت گزارش</div>
                <small>${(err && err.message) ? err.message : ""}</small>
                <button class="retry-btn" id="retryBtn">تلاش دوباره</button>
              </div>`;
                const retryBtn = document.getElementById("retryBtn");
                if (retryBtn) retryBtn.onclick = loadReport;
            }
        }

        function avatarSrc(name) {
            if (!name) return null;
            return "images/" + encodeURIComponent(String(name).trim()) + ".png";
        }

        function avatarHtml(name, kind) {
            const cls = kind === "podium" ? "podium-avatar" : "rank-avatar";
            const fb = kind === "podium" ? "podium-avatar-fallback" : "rank-avatar-fallback";
            const letter = (name && name.trim()[0]) ? name.trim()[0] : "?";
            const src = avatarSrc(name);
            if (!src) return `<div class="${fb}">${letter}</div>`;
            return `<img class="${cls}" src="${src}" alt="" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'"><div class="${fb}" style="display:none">${letter}</div>`;
        }

        function renderReport(stats, habitMap, leaderboard, kmInfo = {}, dayStatus = {}, weightByDay = {}) {
            const content = document.getElementById("content");

            const total = Number(stats.total_score) || 0;
            const avg = Number(stats.avg_score) || 0;
            const best = Number(stats.best_score) || 0;
            const active = Number(stats.active_days) || 0;
            const daily = stats.daily || [];

            let bestNote = "—";
            if (stats.best_day) {
                const [y, m, d] = stats.best_day.split("-").map(Number);
                const j = jalaali.toJalaali(y, m, d);
                bestNote = fa(j.jd) + " " + J_MONTHS[j.jm - 1];
            }

            const maxAbs = Math.max(...daily.map(d => Math.abs(Number(d.score) || 0)), 1);
            const statusKeys = Object.keys(dayStatus || {}).sort();
            const chartDays = statusKeys.length ? statusKeys : (daily || []).map(d => d.date);
            const scoreByDate = {};
            (daily || []).forEach(d => { scoreByDate[d.date] = Number(d.score) || 0; });
            statusKeys.forEach(iso => {
                if (scoreByDate[iso] === undefined && dayStatus[iso])
                    scoreByDate[iso] = Number(dayStatus[iso].score) || 0;
            });
            const allScores = chartDays.map(iso => Math.abs(scoreByDate[iso] || 0));
            const maxAbs2 = Math.max(...allScores, 1);
            const dense = chartDays.length >= 30;

            let chartHtml = "";
            if (chartDays.length === 0) {
                chartHtml = `<div class="empty"><div class="empty-icon">📊</div>هنوز داده‌ای برای این ماه ثبت نشده</div>`;
            } else {
                chartHtml =
                    `<div class="chart-wrap"><div class="chart ${dense ? "dense" : ""}" id="dailyChart">` +
                    chartDays.map(iso => {
                        const sc = scoreByDate[iso] || 0;
                        const st = (dayStatus[iso] && dayStatus[iso].status) || (sc ? "late" : "missed");
                        const h = st === "missed" ? 8 : st === "future" ? 3 : (Math.abs(sc) < 0.001 ? 4 : Math.max(4, (
                            Math.abs(sc) / maxAbs2) * 110));
                        const [y, m, day] = iso.split("-").map(Number);
                        const j = jalaali.toJalaali(y, m, day);
                        const isBest = stats.best_day === iso && st !== "missed" && st !== "future";
                        const statusFa = st === "timely" ? "به‌موقع" : st === "late" ? "با تأخیر" : st === "future" ?
                            "آینده" : "بدون ثبت";
                        const tip =
                            `${fa(j.jd)} ${J_MONTHS[selectedMonth - 1]}: ${scoreText(sc)} · ${statusFa}`;
                        const showLabel = !dense || j.jd === 1 || j.jd === chartDays.length || j.jd % 2 === 0 || isBest;
                        return `
                  <div class="bar-wrap ${isBest ? "best" : ""} ${st === "missed" ? "missed" : ""}" data-tip="${tip}">
                    <div class="bar ${st}" data-h="${h}" style="height:${h}px"></div>
                    <div class="bar-label">${isBest ? "★ " : ""}${showLabel ? fa(j.jd) : ""}</div>
                  </div>`;
                    }).join("") +
                    `</div><div class="chart-tip" id="chartTip"></div></div>`;
            }

            // میانگین و تعداد افراد فعال برای معیار فعلی
            let metricActive = [];
            let metricAvg = 0;
            let metricUnit = "";
            let metricLabel = "";
            if (rankBy === "km") {
                metricActive = leaderboard.filter(u => (Number(u.month_km) || 0) > 0);
                metricAvg = metricActive.length
                    ? metricActive.reduce((s, u) => s + (Number(u.month_km) || 0), 0) / metricActive.length
                    : 0;
                metricUnit = "km";
                metricLabel = "میانگین کیلومتر افراد فعال";
            } else if (rankBy === "cal") {
                metricActive = leaderboard.filter(u => (Number(u.month_cal) || 0) > 0);
                metricAvg = metricActive.length
                    ? metricActive.reduce((s, u) => s + (Number(u.month_cal) || 0), 0) / metricActive.length
                    : 0;
                metricUnit = "kcal";
                metricLabel = "میانگین کالری افراد فعال";
            } else {
                metricActive = leaderboard.filter(u => (Number(u.avg) || 0) > 0 || (Number(u.totalScore != null ? u.totalScore : u.total_score) || 0) > 0);
                metricAvg = metricActive.length
                    ? metricActive.reduce((s, u) => s + (Number(u.avg) || 0), 0) / metricActive.length
                    : 0;
                metricUnit = "";
                metricLabel = "میانگین امتیاز افراد فعال";
            }
            const metricActiveIds = new Set(metricActive.map(u => String(u.user_id)));
            const metricActiveCount = metricActive.length;
            const metricAvgText = rankBy === "km"
                ? scoreText(Math.round(metricAvg * 100) / 100) + " km"
                : rankBy === "cal"
                ? scoreText(Math.round(metricAvg)) + " kcal"
                : scoreText(Math.round(metricAvg * 100) / 100);

            const top3 = leaderboard.slice(0, 3);
            const rest = leaderboard.slice(3);

            let podiumHtml = "";
            if (top3.length === 0) {
                podiumHtml = `<div class="empty"><div class="empty-icon">🏆</div>هنوز رتبه‌بندی‌ای وجود ندارد</div>`;
            } else {
                let order, placeMap, medalMap;
                if (top3.length >= 3) {
                    order = [top3[1], top3[0], top3[2]];
                    placeMap = ["second", "first", "third"];
                    medalMap = ["🥈", "🥇", "🥉"];
                } else if (top3.length === 2) {
                    order = [top3[1], top3[0]];
                    placeMap = ["second", "first"];
                    medalMap = ["🥈", "🥇"];
                } else {
                    order = [top3[0]];
                    placeMap = ["first"];
                    medalMap = ["🥇"];
                }

                podiumHtml = `<div class="podium">` + order.map((u, i) => {
                    const place = placeMap[i];
                    const medal = medalMap[i];
                    const name = u.display_name || "کاربر";
                    const sc = u.avg != null ? u.avg : 0;
                    const num = place === "first" ? "۱" : place === "second" ? "۲" : "۳";
                    const uid = u.user_id || "";
                    const adminBtn = isAdmin && uid ?
                        `<a class="admin-user-btn" href="admin.html?u=${encodeURIComponent(uid)}" title="جزئیات ادمین" onclick="event.stopPropagation()">🛡️</a>` :
                        "";
                    return `
                    <div class="podium-place ${place}">
                      <div class="podium-medal">${medal}</div>
                      <div class="profile-hit" data-uid="${uid}" data-name="${name}">
                      ${avatarHtml(name, "podium")}
                      <div class="podium-name">${name}</div>
                      <div style="margin:4px 0 2px">${bmiChipHtml(u.bmi, currentUser && String(uid) === String(currentUser.id))}</div>
                      </div>
                      <div class="podium-score">${rankBy === "km"
                        ? ((Number(u.month_km)||0) > 0
                            ? `<span class="km-ltr" dir="ltr"><span class="km-num">${scoreText(Math.round((Number(u.month_km)||0)*10)/10)}</span><span class="km-unit">km</span></span>`
                            : "—")
                        : rankBy === "cal"
                        ? ((Number(u.month_cal)||0) > 0
                            ? `<span class="km-ltr" dir="ltr"><span class="km-num">${scoreText(Math.round(Number(u.month_cal)||0))}</span><span class="km-unit">kcal</span></span>`
                            : "—")
                        : scoreText(sc)}</div>
                      <div class="podium-km km-glow ${(Number(u.month_km)||0) > 0 || (Number(u.month_cal)||0) > 0 ? "" : "zero"}">${rankBy === "km"
                        ? `امتیاز ${scoreText(sc)}`
                        : rankBy === "cal"
                        ? `امتیاز ${scoreText(sc)}`
                        : ((Number(u.month_km)||0) > 0
                            ? `<span class="km-ltr" dir="ltr"><span class="km-num">${scoreText(Math.round((Number(u.month_km)||0)*10)/10)}</span><span class="km-unit">km</span></span>`
                            : `<span class="km-ltr zero" dir="ltr"><span class="km-num">—</span><span class="km-unit">km</span></span>`)}</div>
                      <div class="podium-bar">${num}</div>
                      ${adminBtn}
                    </div>`;
                }).join("") + `</div>`;

                if (rest.length) {
                    podiumHtml += `<div class="ranking-list">` + rest.map((u, i) => {
                        const totalScore = Number(u.totalScore != null ? u.totalScore : u.total_score) || 0;

        function animateHabitBars() {
            const root = document.getElementById("content");
            if (!root) return;
            const items = root.querySelectorAll(".habit-item");
            if (!items.length) return;

            // شروع فقط وقتی وارد دید می‌شوند
            const runItem = (item, idx) => {
                if (item.dataset.animated === "1") return;
                item.dataset.animated = "1";
                const fill = item.querySelector(".habit-bar-fill");
                const pctEl = item.querySelector(".habit-pct");
                if (!fill) return;
                const target = Math.max(0, Math.min(100, Number(fill.dataset.w) || 0));
                fill.style.transform = "scaleX(0)";
                if (pctEl) pctEl.textContent = "۰٪";

                const delay = idx * 80;
                setTimeout(() => {
                    const dur = 950 + target * 4;
                    const t0 = performance.now();
                    let burstDone = false;

                    function easeOutCubic(t) {
                        return 1 - Math.pow(1 - t, 3);
                    }

                    function spawnBurst(track, color) {
                        const rect = track.getBoundingClientRect();
                        // در RTL انتهای نوار پرشده سمت چپ است (scale از راست)
                        const originX = rect.width * (1 - target / 100);
                        const originY = rect.height / 2;
                        const n = 12 + Math.floor(target / 12);
                        for (let i = 0; i < n; i++) {
                            const sp = document.createElement("span");
                            sp.className = "habit-spark";
                            // پخش به سمت چپ/بیرون در جهت RTL
                            const angle = Math.PI * 0.15 + Math.random() * Math.PI * 0.7;
                            const speed = 1.2 + Math.random() * 3.2;
                            let vx = -Math.cos(angle) * speed * (0.7 + Math.random());
                            let vy = Math.sin(angle) * speed * (0.55 + Math.random());
                            let x = originX;
                            let y = originY;
                            let life = 1;
                            sp.style.left = x + "px";
                            sp.style.top = y + "px";
                            sp.style.background = color;
                            sp.style.color = color;
                            track.appendChild(sp);
                            const g = 0.12 + Math.random() * 0.08;
                            const drag = 0.985;
                            function stepP() {
                                vx *= drag;
                                vy = vy * drag + g;
                                x += vx;
                                y += vy;
                                life -= 0.02 + Math.random() * 0.01;
                                sp.style.left = x + "px";
                                sp.style.top = y + "px";
                                sp.style.opacity = String(Math.max(0, life));
                                sp.style.transform = `scale(${0.5 + life * 0.7})`;
                                if (life > 0 && y < rect.height + 48) requestAnimationFrame(stepP);
                                else sp.remove();
                            }
                            requestAnimationFrame(stepP);
                        }
                    }

                    function frame(now) {
                        const t = Math.min(1, (now - t0) / dur);
                        const e = easeOutCubic(t);
                        const cur = target * e;
                        fill.style.transform = "scaleX(" + (cur / 100) + ")";
                        if (pctEl) {
                            const n = Math.round(cur * 10) / 10;
                            pctEl.textContent = n.toLocaleString("fa-IR") + "٪";
                        }
                        if (t >= 1 && !burstDone) {
                            burstDone = true;
                            const track = fill.parentElement;
                            const tier = fill.classList.contains("hi") ? "#00ff9d" :
                                fill.classList.contains("lo") ? "#ff4d6d" : "#ffc857";
                            if (target >= 1) spawnBurst(track, tier);
                        }
                        if (t < 1) requestAnimationFrame(frame);
                    }
                    requestAnimationFrame(frame);
                }, delay);
            };

            // ریست
            items.forEach(it => {
                delete it.dataset.animated;
                const fill = it.querySelector(".habit-bar-fill");
                if (fill) fill.style.transform = "scaleX(0)";
            });

            if (!("IntersectionObserver" in window)) {
                items.forEach((it, idx) => runItem(it, idx));
                return;
            }

            const io = new IntersectionObserver((entries) => {
                entries.forEach(en => {
                    if (!en.isIntersecting) return;
                    const item = en.target;
                    const idx = Number(item.dataset.animIdx || 0);
                    runItem(item, idx);
                    io.unobserve(item);
                });
            }, { threshold: 0.35, rootMargin: "0px 0px -8% 0px" });

            items.forEach((it, idx) => {
                it.dataset.animIdx = String(idx);
                io.observe(it);
            });
        }

        // ---- Interactions ----
        function initInteractions() {
            const content = document.getElementById("content");

            content.addEventListener("click", (e) => {
                const bar = e.target.closest(".bar-wrap");

                        tip.style.bottom = (wrapRect.bottom - barRect.top + 8) + "px";
                        tip.classList.add("show");

                        tip._hideTimer = setTimeout(() => tip.classList.remove("show"), 1800);

                const bmiChip = e.target.closest(".bmi-chip");
                if (bmiChip) {
                    e.preventDefault();

                    const row = bmiChip.closest(".rank-item, .podium-place");

                        item.classList.toggle("open");

                    }
                    return;
                }

                const rankRow = e.target.closest(".rank-row");
                const profileHit = e.target.closest(".profile-hit");
                if (profileHit) {
                    e.stopPropagation();
                    // ادمین: رفتن به جزئیات همان کاربر در پنل ادمین
                    if (isAdmin) {
                        const uid = profileHit.dataset.uid;
                        if (uid) {
                            location.href = "admin.html?u=" + encodeURIComponent(uid);
                        }
                    }
                    return;
                }
                if (rankRow) {
                    const item = rankRow.closest(".rank-item");
                    if (item) item.classList.toggle("open");
                    return;
                }
            });

            let sx = 0,
                sy = 0,
                tracking = false;
            content.addEventListener("touchstart", (e) => {
                if (e.touches.length !== 1) return;
                const target = e.target;
                const strip = target.closest?.(".weight-strip");
                if (strip) return;
                sx = e.touches[0].clientX;
                sy = e.touches[0].clientY;
                tracking = true;
            }, { passive: true });
            content.addEventListener("touchend", (e) => {
                if (!tracking) return;
                tracking = false;
                const t = e.changedTouches[0];
                const dx = t.clientX - sx;
                const dy = t.clientY - sy;
                if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.6) {
                    changeMonth(dx < 0 ? 1 : -1);
                }
            }, { passive: true });
        }

        function changeMonth(delta) {
            let m = selectedMonth + delta,
                y = selectedYear;
            if (m < 1) { m = 12;
                y -= 1; }
            if (m > 12) { m = 1;
                y += 1; }
            if (y < START_YEAR) return;
            const now = new Date();
            const j = jalaali.toJalaali(now.getFullYear(), now.getMonth() + 1, now.getDate());
            if (y > j.jy || (y === j.jy && m > j.jm)) return;
            selectedYear = y;
            selectedMonth = m;
            selectedWeekNum = null; // هفته مناسب ماه جدید
            document.getElementById("yearSelect").value = String(y);
            document.getElementById("monthSelect").value = String(m);
            updateReportChrome();
            loadReport();
        }

        initInteractions();
    </script>
  <script src="nav.js"></script>

<div class="wchart-modal hidden" id="wchartModal" aria-hidden="true">
  <div class="wchart-sheet" role="dialog" aria-label="نمودار وزن">
    <div class="wchart-sheet-head">
      <h3>نمودار وزن</h3>
      <button type="button" class="icon-btn" id="wchartClose" aria-label="بستن">✕</button>
    </div>
    <div class="wchart-tabs">
      <button type="button" class="wchart-tab active" data-wmode="month" id="wTabMonth">ماهانه</button>
      <button type="button" class="wchart-tab" data-wmode="year" id="wTabYear">سالانه</button>
    </div>
    <div class="wchart-stage" id="wchartStage">
      <canvas id="wchartCanvas"></canvas>
      <div class="wchart-tip" id="wchartTip"></div>
      <div class="wchart-empty hidden" id="wchartEmpty">وزنی ثبت نشده</div>
    </div>
    <div class="wchart-legend" id="wchartLegend"></div>
  </div>
</div>
