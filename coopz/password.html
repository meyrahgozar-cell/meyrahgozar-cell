<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="color-scheme" content="dark light" />
<meta name="theme-color" content="#1b2236" />
<title>تغییر رمز عبور | تعاونی مسکن مپنا هوایی</title>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
<script>try{var t=localStorage.getItem('mpna_theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="stylesheet" href="css/variables.css" />
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/icons.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/layout.css" />
<link rel="stylesheet" href="css/pages.css" />
<link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <div id="appHeader"></div>
  <main class="container page narrow">
    <header class="page-head">
      <span class="tile"><i class="i i-lock" aria-hidden="true"></i></span>
      <div>
        <h1>تغییر رمز عبور</h1>
        <p class="muted">رمز فعلی را وارد کنید و رمز جدید را تنظیم کنید</p>
      </div>
    </header>

    <section class="panel form-panel">
      <form id="passForm" autocomplete="off">
        <label class="field">
          <span>رمز فعلی</span>
          <div class="input-wrap">
            <input id="currentPass" type="password" required minlength="1" placeholder="رمز فعلی" />
          </div>
        </label>
        <label class="field">
          <span>رمز جدید</span>
          <div class="input-wrap">
            <input id="newPass" type="password" required minlength="4" placeholder="حداقل ۴ کاراکتر" />
          </div>
        </label>
        <label class="field">
          <span>تکرار رمز جدید</span>
          <div class="input-wrap">
            <input id="confirmPass" type="password" required minlength="4" placeholder="تکرار رمز جدید" />
          </div>
        </label>
        <div class="form-actions">
          <button class="btn btn-primary" type="submit" id="passBtn">
            <span class="btn-text">ذخیره رمز جدید</span>
            <span class="spinner" hidden></span>
          </button>
        </div>
        <div id="passMsg" class="auth-msg" role="alert"></div>
      </form>
    </section>
  </main>
  <div id="appFooter"></div>
  <script type="module" src="js/password.js"></script>
</body>
</html>
