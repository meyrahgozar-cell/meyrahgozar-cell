<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="color-scheme" content="dark light" />
<meta name="theme-color" content="#1b2236" />
<title>بازیابی رمز عبور | تعاونی مسکن مپنا هوایی</title>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
<script>try{var t=localStorage.getItem('mpna_theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="stylesheet" href="css/variables.css" />
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/icons.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/layout.css" />
<link rel="stylesheet" href="css/pages.css" />
<link rel="stylesheet" href="css/responsive.css" />
</head>
<body class="auth-body">
  <div class="auth-bg"></div>
  <button class="theme-toggle auth-theme-toggle" data-theme-toggle type="button" aria-label="تغییر تم">
    <i class="i theme-icon" aria-hidden="true"></i>
  </button>

  <main class="auth-shell">
    <section class="auth-card" aria-labelledby="fpTitle">
      <header class="auth-head">
        <div class="auth-logo"><img src="assets/logo.svg" alt="لوگو" /></div>
        <h1 id="fpTitle">بازیابی رمز عبور</h1>
        <p class="auth-sub">کد ملی و ایمیل ثبت‌شده را وارد کنید</p>
      </header>

      <form id="fpForm" class="auth-form" autocomplete="off" novalidate>
        <div class="field">
          <label for="fpNationalId">کد ملی</label>
          <div class="input-wrap">
            <input id="fpNationalId" type="text" inputmode="numeric"
                   pattern="\d{10}" maxlength="10" placeholder="۱۰ رقم کد ملی" required />
            <i class="i i-id-card input-icon" aria-hidden="true"></i>
          </div>
        </div>

        <div class="field">
          <label for="fpEmail">ایمیل</label>
          <div class="input-wrap">
            <input id="fpEmail" type="email" inputmode="email" autocomplete="email"
                   placeholder="name@example.com" required />
            <i class="i i-mail input-icon" aria-hidden="true"></i>
          </div>
          <small class="hint">همان ایمیلی که در پرونده عضویت ثبت شده</small>
        </div>

        <div class="field">
          <label for="fpNewPass">رمز جدید</label>
          <div class="input-wrap">
            <input id="fpNewPass" type="password" minlength="4" placeholder="حداقل ۴ کاراکتر" required />
            <button type="button" class="pass-toggle" data-toggle-for="fpNewPass" aria-label="نمایش رمز"></button>
          </div>
        </div>

        <div class="field">
          <label for="fpConfirm">تکرار رمز جدید</label>
          <div class="input-wrap">
            <input id="fpConfirm" type="password" minlength="4" placeholder="تکرار رمز جدید" required />
            <button type="button" class="pass-toggle" data-toggle-for="fpConfirm" aria-label="نمایش رمز"></button>
          </div>
        </div>

        <div id="fpMsg" class="auth-msg" role="alert"></div>

        <button type="submit" class="btn btn-primary btn-block" id="fpBtn">
          <span class="btn-text">تنظیم رمز جدید</span>
          <span class="spinner" hidden></span>
        </button>

        <p class="auth-forgot">
          <a href="index.html">بازگشت به ورود</a>
        </p>
      </form>

      <footer class="auth-foot">
        <p class="tiny">پشتیبانی: <a href="mailto:Mani.alir1990@gmail.com">Mani.alir1990@gmail.com</a></p>
      </footer>
    </section>

    <aside class="auth-side" aria-hidden="true">
      <div class="auth-side-inner">
        <h2>بازیابی امن</h2>
        <p>برای تأیید هویت، کد ملی و ایمیل ثبت‌شده در پرونده باید مطابقت داشته باشند.</p>
      </div>
    </aside>
  </main>

  <script type="module" src="js/forgot-password.js"></script>
</body>
</html>
