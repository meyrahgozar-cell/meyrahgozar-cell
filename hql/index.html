      --surface-2: #171e2b;

        opacity: 0;

        transform:

       TOAST
       ========================================================= */

      position: fixed;

</head>

let authMode = "login";

/* =========================================================

   ========================================================= */

const $ = id =>
  document.getElementById(id);


function faNumber(value) {

  return String(value)
    .replace(
      /[0-9]/g,
      digit =>
        "۰۱۲۳۴۵۶۷۸۹"[digit]
    );

}


function formatScore(value) {

  const number =
    Number(value || 0);

  let result;

  if (Number.isInteger(number)) {

    result =
      String(number);

  } else {

    result =
      number
        .toFixed(2)
        .replace(/0+$/, "")
        .replace(/\.$/, "");

  }

  return faNumber(result);

}


function todayInIran() {

  return new Date()
    .toLocaleDateString(
      "en-CA",
      {
        timeZone: "Asia/Tehran"
      }
    );

}


function showToast(message) {

  const toast =
    $("toast");

  toast.textContent =
    message;

  toast.classList.add("show");

  clearTimeout(
    window.toastTimer
  );

  window.toastTimer =
    setTimeout(
      () =>
        toast.classList.remove("show"),
      2200
    );

}


function showFloatingScore(
  score,
  x,
  y
) {

  if (!score) return;

  const element =
    document.createElement("div");

  element.className =
    "floating-score";

  element.textContent =
    (score > 0 ? "+" : "") +
    formatScore(score);

  element.style.left =
    `${x}px`;

  element.style.top =
    `${y}px`;

  element.style.color =
    score > 0
      ? "var(--positive)"
      : "var(--negative)";

  document.body.appendChild(
    element
  );

  setTimeout(
    () => element.remove(),
    900
  );

}



/* =========================================================
   AUTH TABS
   ========================================================= */

function setAuthMode(mode) {

  authMode = mode;

  $("loginTab")
    .classList
    .toggle(
      "active",
      mode === "login"
    );

  $("signupTab")
    .classList
    .toggle(
      "active",
      mode === "signup"
    );

  $("nameGroup")
    .classList
    .toggle(
      "hidden",
      mode !== "signup"
    );

  $("authSubmit").textContent =
    mode === "signup"
      ? "ساخت حساب"
      : "ورود";

  $("authError").textContent =
    "";

}


$("loginTab").onclick =
  () =>

$("signupTab").onclick =
  () =>

/* =========================================================

   ========================================================= */

$("authForm").addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    const email =
      $("emailInput")
        .value
        .trim();


    const password =
      $("passwordInput")
        .value;


    const displayName =
      $("nameInput")
        .value
        .trim();


    const errorElement =
      $("authError");


    const submitButton =
      $("authSubmit");


    errorElement.textContent =
      "";

    submitButton.disabled =
      true;

    submitButton.textContent =
      "در حال پردازش…";


    try {

      let result;


      if (authMode === "signup") {

        if (!displayName) {

          throw new Error(
            "نام نمایشی را وارد کن."
          );

        }


        result =
          await supabaseClient.auth.signUp({

            email,

            password,

            options: {

              data: {

                display_name:
                  displayName

              }

            }

          });

      } else {

        result =
          await supabaseClient.auth
            .signInWithPassword({

              email,

              password

            });

      }


      if (result.error) {

        throw result.error;

      }


      if (result.data.session) {

        await enterApplication(
          result.data.session.user
        );

      } else {

        showToast(
          "حساب ساخته شد. اگر وارد نشدی، تنظیم تأیید ایمیل Supabase را بررسی کن."
        );

      }


    } catch (error) {

      console.error(error);

      errorElement.textContent =
        translateAuthError(
          error.message
        );

    } finally {

      submitButton.disabled =
        false;

      submitButton.textContent =
        authMode === "signup"
          ? "ساخت حساب"
          : "ورود";

    }

  }
);



function translateAuthError(
  message
) {

  const translations = {

    "Invalid login credentials":
      "ایمیل یا رمز عبور اشتباه است.",

    "User already registered":
      "این ایمیل قبلاً ثبت‌نام شده است.",

    "Password should be at least 6 characters.":
      "رمز عبور باید حداقل ۶ کاراکتر باشد."

  };


  return (
    translations[message] ||
    message ||
    "خطایی رخ داد."
  );

}



/* =========================================================
   ENTER APPLICATION
   ========================================================= */

async function enterApplication(
  user
) {

  $("authView")
    .classList
    .add("hidden");


  $("appView")
    .classList
    .remove("hidden");


  const {
    data: profile
  } =
    await supabase
      .from("profiles")
      .select(
        "display_name, theme_preference"
      )
      .eq("id", user.id)
      .maybeSingle();


  currentTheme =
    profile?.theme_preference ||
    "dark";


  applyTheme();


  renderItems();


  await loadToday();


  subscribeToRealtime(
    user.id
  );

}



/* =========================================================
   THEME
   ========================================================= */

function applyTheme() {

  document.documentElement
    .dataset
    .theme =
    currentTheme;


  $("themeButton")
    .textContent =
    currentTheme === "dark"
      ? "☀"
      : "☾";

}


async function getDisplayName() {

  const {
    data: {
      user
    }
  } =
    await supabaseClient.auth
      .getUser();


  if (!user) {

    return "کاربر";

  }


  const {
    data
  } =
    await supabase
      .from("profiles")
      .select("display_name")
      .eq("id", user.id)
      .single();


  return (
    data?.display_name ||
    "کاربر"
  );

}


$("themeButton").onclick =
  async () => {

    currentTheme =
      currentTheme === "dark"
        ? "light"
        : "dark";


    applyTheme();


    const {
      error
    } =
      await supabaseClient.rpc(
        "update_my_profile",
        {
          p_display_name:
            await getDisplayName(),

          p_theme_preference:
            currentTheme
        }
      );


    if (error) {

      console.error(error);

      showToast(
        "ذخیره پوسته انجام نشد."
      );

    }

  };



/* =========================================================
   USER MENU
   ========================================================= */

$("userButton").onclick =
  () =>
    $("userMenu")
      .classList
      .toggle("hidden");


document.addEventListener(
  "click",
  event => {

    if (
      !$("userMenu")
        .contains(event.target) &&
      event.target !==
        $("userButton")
    ) {

      $("userMenu")
        .classList
        .add("hidden");

    }

  }
);


$("logoutButton").onclick =
  async () => {

    await supabaseClient.auth
      .signOut();

  };


$("reportButton").onclick =
  () => {

    window.location.href =
      "report.html";

  };



/* =========================================================
   RENDER ITEMS
   ========================================================= */

function renderItems() {

  const grid =
    $("itemsGrid");

  grid.innerHTML =
    "";


  ITEMS.forEach(item => {

    const card =
      document.createElement(
        "article"
      );

    card.className =
      "item-card";

    card.dataset.type =
      item.type;


    card.innerHTML = `

      <div class="item-header">

        <div>

          <div class="item-title">

            <span class="item-icon">
              ${item.icon}
            </span>

            <span>
              ${item.title}
            </span>

          </div>

          <div class="item-description">
            ${item.description}
          </div>

        </div>

        <div
          class="item-score"
          data-score
        ></div>

      </div>

    `;


    if (item.options) {

      const options =
        document.createElement(
          "div"
        );

      options.className =
        "options";


      item.options.forEach(
        ([label, value]) => {

          const button =
            document.createElement(
              "button"
            );

          button.type =
            "button";

          button.className =
            "option";

          button.dataset.value =
            value;

          button.textContent =
            label;


          button.onclick =
            event =>
              saveItem(
                item.type,
                Number(value),
                event
              );


          options.appendChild(
            button
          );

        }
      );


      card.appendChild(
        options
      );

    }



    if (item.input) {

      const row =
        document.createElement(
          "div"
        );

      row.className =
        "field-row";


      row.innerHTML = `

        <input
          class="input item-input"
          type="number"
          min="0"
          step="1"
          placeholder="${item.placeholder}"
        >

        <button
          class="primary-button save-input"
          type="button"
        >
          ثبت
        </button>

      `;


      row.querySelector(
        ".save-input"
      ).onclick =
        event => {

          const value =
            Number(
              row.querySelector(
                ".item-input"
              ).value
            );


          if (
            !Number.isFinite(value) ||
            value < 0
          ) {

            showToast(
              "یک عدد معتبر وارد کن."
            );

            return;

          }


          saveItem(
            item.type,
            value,
            event
          );

        };


      card.appendChild(
        row
      );

    }



    if (item.time) {

      const row =
        document.createElement(
          "div"
        );

      row.className =
        "field-row";


      row.innerHTML = `

        <input
          class="input item-time"
          type="time"
        >

        <button
          class="primary-button save-time"
          type="button"
        >
          ثبت
        </button>

      `;


      row.querySelector(
        ".save-time"
      ).onclick =
        event => {

          const time =
            row.querySelector(
              ".item-time"
            ).value;


          if (!time) {

            showToast(
              "ساعت را انتخاب کن."
            );

            return;

          }


          const [
            hours,
            minutes
          ] =
            time
              .split(":")
              .map(Number);


          saveItem(
            item.type,
            hours * 60 + minutes,
            event
          );

        };


      card.appendChild(
        row
      );

    }


    grid.appendChild(
      card
    );

  });

}



/* =========================================================
   UPDATE ITEM CARD
   ========================================================= */

function updateItemCard(
  type,
  log
) {

  const card =
    document.querySelector(
      `[data-type="${type}"]`
    );


  if (!card) return;


  const score =
    card.querySelector(
      "[data-score]"
    );


  score.textContent =
    log
      ? (
          Number(log.score) > 0
            ? "+"
            : ""
        ) +
        formatScore(log.score)
      : "";


  card
    .querySelectorAll(".option")
    .forEach(button => {

      button.classList.toggle(
        "selected",
        !!log &&
        Number(button.dataset.value) ===
          Number(log.value)
      );

    });


  const numberInput =
    card.querySelector(
      ".item-input"
    );


  if (
    numberInput &&
    log
  ) {

    numberInput.value =
      log.value;

  }


  const timeInput =
    card.querySelector(
      ".item-time"
    );


  if (
    timeInput &&
    log
  ) {

    const totalMinutes =
      Number(log.value);


    const hours =
      String(
        Math.floor(
          totalMinutes / 60
        )
      ).padStart(2,"0");


    const minutes =
      String(
        totalMinutes % 60
      ).padStart(2,"0");


    timeInput.value =
      `${hours}:${minutes}`;

  }

}



/* =========================================================
   SAVE ITEM
   ========================================================= */

async function saveItem(
  type,
  value,
  event
) {

  const previous =
    todayLogs.get(type);


  const {
    data,
    error
  } =
    await supabaseClient.rpc(
      "save_daily_log",
      {
        p_item_type:
          type,

        p_value:
          value
      }
    );


  if (error) {

    console.error(error);

    showToast(
      error.message ||
      "ثبت انجام نشد."
    );

    return;

  }


  todayLogs.set(
    type,
    data
  );


  updateItemCard(
    type,
    data
  );


  const oldScore =
    Number(
      previous?.score || 0
    );


  const newScore =
    Number(
      data?.score || 0
    );


  showFloatingScore(
    newScore - oldScore,
    event.clientX,
    event.clientY
  );


  await loadToday();

}



/* =========================================================
   LOAD TODAY
   ========================================================= */

async function loadToday() {

  const {
    data,
    error
  } =
    await supabase
      .from("daily_logs")
      .select("*")
      .eq(
        "log_date",
        todayInIran()
      );


  if (error) {

    console.error(error);

    showToast(
      "دریافت اطلاعات امروز انجام نشد."
    );

    return;

  }


  todayLogs =
    new Map(
      (data || [])
        .filter(
          log =>
            log.item_type !==
            "morning_fill"
        )
        .map(
          log =>
            [
              log.item_type,
              log
            ]
        )
    );


  ITEMS.forEach(
    item =>
      updateItemCard(
        item.type,
        todayLogs.get(
          item.type
        )
      )
  );


  const {
    data: summary,
    error: summaryError
  } =
    await supabaseClient.rpc(
      "get_today_summary"
    );


  if (summaryError) {

    console.error(
      summaryError
    );

    return;

  }


  const result =
    Array.isArray(summary)
      ? summary[0]
      : summary;


  if (!result) return;


  $("scoreValue")
    .textContent =
    formatScore(
      result.total_score
    );


  $("completedText")
    .textContent =
    `${faNumber(
      result.items_completed
    )} آیتم از ۱۰`;


  const percentage =
    Math.max(
      0,
      Math.min(
        100,
        Number(
          result.total_score || 0
        ) / 29 * 100
      )
    );


  $("progressBar")
    .style
    .width =
    `${percentage}%`;


  $("currentStreak")
    .textContent =
    `🔥 ${faNumber(
      result.current_streak || 0
    )} روز`;


  $("longestStreak")
    .textContent =
    `${faNumber(
      result.longest_streak || 0
    )} روز`;

}



/* =========================================================
   REALTIME
   ========================================================= */

function subscribeToRealtime(
  userId
) {

  if (realtimeChannel) {

    supabaseClient.removeChannel(
      realtimeChannel
    );

  }


  realtimeChannel =
    supabase
      .channel(
        "daily-logs-" +
        userId
      )
      .on(
        "postgres_changes",
        {
          event: "*",

          schema: "public",

          table: "daily_logs",

          filter:
            "user_id=eq." +
            userId
        },

        () =>
          loadToday()
      )
      .subscribe();

}



/* =========================================================
   AUTH SESSION
   ========================================================= */

supabaseClient.auth
  .getSession()
  .then(
    async ({
      data: {
        session
      }
    }) => {

      if (session) {

        await enterApplication(
          session.user
        );

      }

    }
  );


supabaseClient.auth
  .onAuthStateChange(
    async (
      event,
      session
    ) => {

      if (
        event ===
        "SIGNED_OUT"
      ) {

        if (
          realtimeChannel
        ) {

          supabaseClient.removeChannel(
            realtimeChannel
          );

          realtimeChannel =
            null;

        }


        $("appView")
          .classList
          .add("hidden");


        $("authView")
          .classList
          .remove("hidden");


        setAuthMode(
          "login"
        );

      }

    }
  );


</script>
