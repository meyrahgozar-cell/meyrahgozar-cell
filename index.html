<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<link rel="icon" type="image/png" href="images/favicon.png">
<link rel="apple-touch-icon" href="images/favicon.png">
<title>HQL | زندگی با کیفیت</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/jalaali-js@1.2.8/dist/jalaali.min.js"></script>

<style>
:root {
  --bg: #05060a;
  --card: #0d1019;
  --card2: #131722;
  --border: rgba(180, 100, 255, 0.18);
  --text: #f0f2ff;
  --muted: #8b92b0;
  --neon: #b44cff;
  --neon2: #00f0ff;
  --positive: #00ff9d;
  --negative: #ff4d6d;
  --glow: 0 0 18px rgba(180, 76, 255, 0.3);
  --radius: 16px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  min-height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: "Vazirmatn", sans-serif;
  -webkit-font-smoothing: antialiased;
}

body {
  background:
    radial-gradient(ellipse 80% 50% at 20% -10%, rgba(180, 76, 255, 0.12), transparent),
    radial-gradient(ellipse 60% 40% at 90% 10%, rgba(0, 240, 255, 0.06), transparent),
    var(--bg);
  min-height: 100vh;
}

button, input { font: inherit; color: inherit; }
button { cursor: pointer; border: none; background: none; }
.hidden { display: none !important; }

/* AUTH */
.auth-page {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 20px;
}

.auth-card {
  width: min(400px, 100%);
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 22px;
  padding: 28px 24px;
  box-shadow: var(--glow), 0 20px 50px rgba(0,0,0,0.45);
}

.logo {
  font-size: 30px;
  font-weight: 800;
  background: linear-gradient(90deg, #b44cff, #00f0ff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 4px;
}

.subtitle { color: var(--muted); font-size: 13px; margin-bottom: 24px; }

.tabs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 5px;
  background: var(--card2);
  padding: 4px;
  border-radius: 12px;
  margin-bottom: 18px;
  border: 1px solid var(--border);
}

.tab {
  height: 40px;
  border-radius: 9px;
  color: var(--muted);
  font-weight: 600;
  font-size: 14px;
}

.tab.active {
  background: linear-gradient(135deg, rgba(180,76,255,0.28), rgba(0,240,255,0.12));
  color: var(--text);
}

.form { display: grid; gap: 10px; }
.label { font-size: 12px; color: var(--muted); }

.input {
  width: 100%;
  height: 46px;
  padding: 0 14px;
  border-radius: 11px;
  border: 1px solid var(--border);
  background: var(--card2);
  outline: none;
}

.input:focus {
  border-color: var(--neon);
  box-shadow: 0 0 0 2px rgba(180,76,255,0.15);
}

.btn-primary {
  height: 48px;
  border-radius: 12px;
  background: linear-gradient(135deg, #b44cff, #7b2fff);
  color: #fff;
  font-weight: 700;
  margin-top: 6px;
  box-shadow: 0 0 20px rgba(180,76,255,0.35);
}

.btn-primary:disabled { opacity: 0.55; }
.error { color: var(--negative); font-size: 13px; text-align: center; min-height: 18px; }

/* APP */
.app {
  max-width: 680px;
  margin: 0 auto;
  padding: 12px 12px 90px;
}

.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}

.brand {
  font-size: 20px;
  font-weight: 800;
  background: linear-gradient(90deg, #b44cff, #00f0ff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.header-actions { display: flex; gap: 7px; position: relative; }

.icon-btn {
  width: 40px;
  height: 40px;
  border-radius: 11px;
  background: var(--card);
  border: 1px solid var(--border);
  display: grid;
  place-items: center;
  font-size: 16px;
}

.menu {
  position: absolute;
  top: 48px;
  left: 0;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 6px;
  min-width: 140px;
  z-index: 60;
  box-shadow: var(--glow);
}

.menu button {
  width: 100%;
  text-align: right;
  padding: 11px 12px;
  border-radius: 9px;
  font-size: 13px;
}

.menu button:hover { background: rgba(180,76,255,0.12); }

/* STICKY SCORE */
.score-sticky {
  position: sticky;
  top: 0;
  z-index: 40;
  background: var(--bg);
  padding: 8px 0 10px;
  margin: 0 -4px;
}

.score-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 16px 18px;
  box-shadow: var(--glow);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.score-main { text-align: center; flex: 1; }
.score-label { font-size: 11px; color: var(--muted); margin-bottom: 2px; }

.score-value {
  font-size: 42px;
  font-weight: 800;
  line-height: 1;
  letter-spacing: -1px;
}

.score-value.positive { color: var(--positive); text-shadow: 0 0 16px rgba(0,255,157,0.35); }
.score-value.negative { color: var(--negative); text-shadow: 0 0 16px rgba(255,77,109,0.35); }

.score-meta {
  display: flex;
  flex-direction: column;
  gap: 5px;
  font-size: 12px;
  color: var(--muted);
  text-align: left;
}

/* COMPACT CALENDAR */
.cal-wrap {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  margin-bottom: 12px;
  overflow: hidden;
}

.cal-toggle {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 11px 14px;
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  gap: 10px;
}

.cal-toggle:hover { background: rgba(180,76,255,0.06); }

.cal-toggle-left {
  display: flex;
  align-items: center;
  gap: 8px;
}

.cal-date-label {
  color: var(--neon2);
  font-weight: 700;
}

.cal-chevron {
  font-size: 12px;
  color: var(--muted);
  transition: transform 0.2s;
}

.cal-wrap.open .cal-chevron {
  transform: rotate(180deg);
}

.cal-body {
  display: none;
  padding: 0 10px 12px;
  border-top: 1px solid var(--border);
}

.cal-wrap.open .cal-body {
  display: block;
}

.cal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 4px 8px;
}

.cal-title {
  font-weight: 700;
  font-size: 13px;
}

.cal-nav {
  display: flex;
  gap: 4px;
}

.cal-nav button {
  width: 30px;
  height: 30px;
  border-radius: 8px;
  background: var(--card2);
  border: 1px solid var(--border);
  font-size: 14px;
}

.weekdays {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 2px;
  margin-bottom: 4px;
  text-align: center;
  font-size: 10px;
  color: var(--muted);
}

.days {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 3px;
}

.day {
  aspect-ratio: 1;
  border-radius: 8px;
  display: grid;
  place-items: center;
  font-size: 12px;
  font-weight: 600;
  background: transparent;
  border: 1px solid transparent;
  color: var(--text);
  transition: 0.1s;
}

.day:hover:not(.empty):not(.future) {
  border-color: var(--border);
  background: var(--card2);
}

.day.today {
  border-color: var(--neon2);
  color: var(--neon2);
}

.day.selected {
  background: linear-gradient(135deg, rgba(180,76,255,0.4), rgba(0,240,255,0.18));
  border-color: var(--neon);
  box-shadow: 0 0 10px rgba(180,76,255,0.25);
  color: #fff;
}

.day.empty { visibility: hidden; }
.day.future { opacity: 0.28; pointer-events: none; }

.streaks {
  display: flex;
  gap: 8px;
  justify-content: center;
  margin: 8px 0 12px;
  font-size: 12px;
  color: var(--muted);
}

.streaks span {
  background: var(--card2);
  padding: 5px 11px;
  border-radius: 16px;
  border: 1px solid var(--border);
}

/* ITEMS */
.items {
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
}
@media (min-width: 640px) {
  .items {
    grid-template-columns: 1fr 1fr;
  }
  .item[data-full] {
    grid-column: 1 / -1;
  }
}

.item {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
  transition: border-color 0.15s, box-shadow 0.15s, transform 0.15s;
}
.item:active {
  transform: scale(0.995);
}
.item:hover {
  border-color: rgba(180,76,255,0.35);
  box-shadow: 0 0 16px rgba(180,76,255,0.1);
}

.item-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 10px;
}

.item-name {
  font-weight: 700;
  font-size: 14px;
  display: flex;
  align-items: center;
  gap: 7px;
}

.item-desc { font-size: 11px; color: var(--muted); margin-top: 2px; }

.item-score {
  font-weight: 700;
  font-size: 14px;
  min-width: 36px;
  text-align: left;
}

.item-score.positive { color: var(--positive); }
.item-score.negative { color: var(--negative); }

.options {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 7px;
}
.options .opt {
  text-align: center;
  width: 100%;
}
@media (max-width: 380px) {
  .options { grid-template-columns: 1fr; }
}

.opt {
  padding: 7px 12px;
  border-radius: 9px;
  background: var(--card2);
  border: 1px solid var(--border);
  font-size: 12px;
}

.opt.active {
  border-color: var(--neon);
  background: rgba(180,76,255,0.18);
  color: var(--neon2);
}

.input-row { display: flex; gap: 7px; }

.input-row input, .time-input {
  flex: 1;
  height: 40px;
  padding: 0 12px;
  border-radius: 9px;
  border: 1px solid var(--border);
  background: var(--card2);
  outline: none;
  color-scheme: dark;
}

.input-row input:focus, .time-input:focus {
  border-color: var(--neon);
}

.small-primary {
  height: 40px;
  padding: 0 16px;
  border-radius: 9px;
  background: linear-gradient(135deg, #b44cff, #7b2fff);
  color: #fff;
  font-weight: 600;
  font-size: 12px;
  white-space: nowrap;
}

.exercise-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 10px;
}
.exercise-grid > div:last-child {
  grid-column: 1 / -1;
}

.exercise-grid label {
  font-size: 11px;
  color: var(--muted);
  display: block;
  margin-bottom: 3px;
}

.exercise-stats {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  font-size: 11px;
  color: var(--muted);
  margin-bottom: 10px;
}

.exercise-stats b { color: var(--neon2); }

.mountain-status {
  margin-top: 8px;
  font-size: 11px;
  color: var(--muted);
  text-align: center;
}

/* Toast */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(70px);
  background: var(--card);
  border: 1px solid var(--border);
  padding: 11px 18px;
  border-radius: 12px;
  font-size: 13px;
  box-shadow: var(--glow);
  z-index: 100;
  opacity: 0;
  transition: 0.25s;
  pointer-events: none;
}

.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

.float-score {
  position: fixed;
  font-weight: 800;
  font-size: 17px;
  pointer-events: none;
  z-index: 200;
  animation: floatUp 0.85s ease-out forwards;
}

@keyframes floatUp {
  0% { opacity: 1; transform: translateY(0); }
  100% { opacity: 0; transform: translateY(-45px); }
}

@media (max-width: 640px) {
  .app { padding: 10px 10px 80px; }
  .score-value { font-size: 36px; }
  .score-card { padding: 14px 12px; gap: 8px; }
  .score-meta { font-size: 11px; }
  .exercise-grid { grid-template-columns: 1fr; }
  .item { padding: 12px; border-radius: 14px; }
  .item-name { font-size: 13px; }
  .item-desc { font-size: 11px; }
  .options { gap: 6px; }
  .opt { padding: 8px 11px; font-size: 12px; text-align: center; }
  .cal-toggle { padding: 10px 12px; font-size: 13px; }
  .streaks { flex-wrap: wrap; gap: 6px; }
  .streaks span { font-size: 11px; padding: 5px 10px; }
  .header { margin-bottom: 10px; }
  .brand { font-size: 18px; }
  .icon-btn { width: 38px; height: 38px; }
}

@media (max-width: 380px) {
  .score-value { font-size: 32px; }
  .summary { /* n/a on index */ }
}

/* Score fill animation */
.score-bar-track {
  width: 100%;
  height: 6px;
  background: var(--card2);
  border-radius: 99px;
  margin-top: 12px;
  overflow: hidden;
  border: 1px solid var(--border);
}
.score-bar-fill {
  height: 100%;
  width: 0%;
  border-radius: 99px;
  background: linear-gradient(90deg, #b44cff, #00f0ff);
  box-shadow: 0 0 12px rgba(180, 76, 255, 0.5);
  transition: width 0.9s cubic-bezier(0.22, 1, 0.36, 1);
}
.score-bar-fill.positive {
  background: linear-gradient(90deg, #00c878, #00ff9d);
  box-shadow: 0 0 12px rgba(0, 255, 157, 0.4);
}
.score-bar-fill.negative {
  background: linear-gradient(90deg, #ff4d6d, #ff8a9a);
  box-shadow: 0 0 12px rgba(255, 77, 109, 0.4);
}
.score-value {
  transition: none;
}


.theme-btn {
  padding: 0;
  overflow: hidden;
  position: relative;
  background: #fff;
  border: 1px solid rgba(180, 100, 255, 0.28);
  box-shadow:
    0 0 10px rgba(180, 76, 255, 0.12);
}
.theme-btn::before {
  content: none;
}
.theme-icon {
  width: 20px;
  height: 20px;
  object-fit: contain;
  border-radius: 5px;
  display: block;
  position: relative;
  z-index: 1;
  background: #fff;
  filter: none;
  opacity: 1;
  transition: transform 0.25s ease, box-shadow 0.25s ease;
}
.theme-btn:hover {
  border-color: rgba(0, 240, 255, 0.4);
  box-shadow: 0 0 14px rgba(180, 76, 255, 0.22);
}
.theme-btn:hover .theme-icon {
  transform: scale(1.06);
}
.theme-btn:active .theme-icon {
  transform: scale(0.94);
}


/* Yesterday nav + day context banner */
.day-nav-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
}
.day-nav-row .cal-panel {
  flex: 1;
  margin-bottom: 0;
}
.btn-yesterday {
  flex-shrink: 0;
  height: 42px;
  padding: 0 12px;
  border-radius: 12px;
  font-size: 12px;
  font-weight: 700;
  white-space: nowrap;
  border: 1px solid rgba(255, 193, 77, 0.45);
  background: linear-gradient(145deg, rgba(255, 193, 77, 0.18), rgba(232, 149, 10, 0.08));
  color: #ffc14d;
  box-shadow: 0 0 12px rgba(255, 180, 50, 0.25);
  transition: 0.2s;
}
.btn-yesterday:hover {
  box-shadow: 0 0 18px rgba(255, 193, 77, 0.45);
  border-color: rgba(255, 193, 77, 0.7);
}
.btn-yesterday:active { transform: scale(0.97); }
.btn-today {
  flex-shrink: 0;
  height: 42px;
  padding: 0 12px;
  border-radius: 12px;
  font-size: 12px;
  font-weight: 700;
  white-space: nowrap;
  border: 1px solid rgba(0, 240, 200, 0.45);
  background: linear-gradient(145deg, rgba(0, 240, 180, 0.16), rgba(0, 180, 255, 0.1));
  color: #b8fff0;
  box-shadow: 0 0 12px rgba(0, 220, 200, 0.28);
  animation: todayGlow 2.2s ease-in-out infinite;
  transition: 0.2s;
}
.btn-today:hover {
  border-color: rgba(0, 255, 220, 0.7);
  box-shadow: 0 0 20px rgba(0, 240, 200, 0.45);
}
.btn-today:active { transform: scale(0.97); }
.btn-today.hidden { display: none; }
@keyframes todayGlow {
  0%, 100% { box-shadow: 0 0 10px rgba(0, 220, 200, 0.22); }
  50% { box-shadow: 0 0 18px rgba(0, 255, 220, 0.42); }
}
.btn-yesterday.hidden { display: none; }

.day-context {
  display: none;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
  padding: 8px 12px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 600;
  line-height: 1.35;
}
.day-context.show { display: flex; }

.day-context.yesterday {
  color: #ffe0a0;
  border: 1px solid rgba(255, 193, 77, 0.5);
  background: linear-gradient(90deg, rgba(255, 193, 77, 0.14), rgba(255, 140, 40, 0.06));
  box-shadow: 0 0 14px rgba(255, 180, 50, 0.3);
  animation: amberPulse 2.2s ease-in-out infinite;
}
.day-context.yesterday .dc-dot {
  width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
  background: #ffc14d;
  box-shadow: 0 0 8px #ffc14d, 0 0 16px rgba(255, 193, 77, 0.6);
  animation: amberDot 1.6s ease-in-out infinite;
}
@keyframes amberPulse {
  0%, 100% { box-shadow: 0 0 10px rgba(255, 180, 50, 0.25); }
  50% { box-shadow: 0 0 20px rgba(255, 193, 77, 0.5); }
}
@keyframes amberDot {
  0%, 100% { opacity: 0.7; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.25); }
}

.day-context.past {
  color: #ffb0c0;
  border: 1px solid rgba(255, 80, 120, 0.45);
  background: linear-gradient(90deg, rgba(255, 80, 120, 0.16), rgba(180, 40, 80, 0.08));
  box-shadow: 0 0 12px rgba(255, 77, 109, 0.25);
  animation: roseGlow 2.4s ease-in-out infinite;
}
.day-context.past .dc-dot {
  width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
  background: #ff6b8a;
  box-shadow: 0 0 8px #ff4d6d;
}
@keyframes roseGlow {
  0%, 100% { box-shadow: 0 0 8px rgba(255, 77, 109, 0.2); }
  50% { box-shadow: 0 0 16px rgba(255, 100, 130, 0.4); }
}


.badges-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
  margin: 0 0 14px;
  min-height: 36px;
}
.badge-chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 6px 10px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
  border: 1px solid rgba(180, 100, 255, 0.35);
  background: linear-gradient(145deg, rgba(180,76,255,0.15), rgba(0,240,255,0.06));
  color: var(--text);
  box-shadow: 0 0 10px rgba(180, 76, 255, 0.2);
  transition: transform 0.15s, box-shadow 0.15s;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
.badge-chip:hover, .badge-chip:active {
  transform: scale(1.05);
  box-shadow: 0 0 16px rgba(180, 76, 255, 0.4);
}
.badge-chip.week1 { border-color: rgba(0,255,157,0.4); box-shadow: 0 0 10px rgba(0,255,157,0.25); }
.badge-chip.week2 { border-color: rgba(0,240,255,0.45); box-shadow: 0 0 12px rgba(0,240,255,0.3); }
.badge-chip.week3 { border-color: rgba(255,215,0,0.5); box-shadow: 0 0 14px rgba(255,215,0,0.35); }
.badge-chip.month { border-color: rgba(255,105,180,0.45); box-shadow: 0 0 12px rgba(255,105,180,0.3); }
.badge-chip.locked {
  opacity: 0.35;
  filter: grayscale(0.8);
  box-shadow: none;
  border-color: var(--border);
}
.badge-modal-overlay {
  position: fixed; inset: 0; z-index: 10000;
  background: rgba(5,6,10,0.8);
  backdrop-filter: blur(8px);
  display: flex; align-items: center; justify-content: center;
  padding: 16px;
}
.badge-modal {
  width: 100%; max-width: 360px;
  background: linear-gradient(160deg, #141828, #0a0d16);
  border: 1px solid rgba(180,100,255,0.5);
  border-radius: 18px;
  padding: 22px 18px 18px;
  box-shadow: 0 0 32px rgba(180,76,255,0.35);
  text-align: center;
}

<script>
const SUPABASE_URL = "https://zlvsmjhwyzfdecfyhxal.supabase.co";
const SUPABASE_KEY = "sb_publishable_dwpPjAJGmMQbwXdqLeeQ4Q_CSEca0cm";

const db = window.__hqlDb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
});
window.db = db;

let mode = "login";
let selectedDate = null;
let todayDate = null;
let viewYear = null;
let viewMonth = null;
let userGender = null;
let kmFactorMale = 1;
let kmFactorFemale = 1.15;
let currentUser = null;
let todayLogs = new Map();
let exerciseLog = null;
let mountainTrips = [];
let latePenalty = 0;
let calOpen = false;

const J_MONTHS = ["فروردین","اردیبهشت","خرداد","تیر","مرداد","شهریور","مهر","آبان","آذر","دی","بهمن","اسفند"];

const ITEMS = [
  { type:"water", icon:"💧", title:"مصرف آب", desc:"فقط آب", options:[["۱–۲ لیوان",2],["۲–۴ لیوان",4],["۴–۶ لیوان",6],["۶–۸ لیوان",8]] },
  { type:"sleep", icon:"🌙", title:"زمان خواب دیشب", desc:"چه ساعتی؟", time:true },
  { type:"instagram", icon:"📱", title:"اینستاگرام زیر ۱۰ دقیقه", desc:"امروز", options:[["بله",1],["خیر",0]] },
  { type:"sun", icon:"☀️", title:"۱۰ دقیقه آفتاب", desc:"امروز", options:[["بله",1],["خیر",0]] },
  { type:"solitude", icon:"🧘", title:"۱۰ دقیقه خلوت", desc:"امروز", options:[["بله",1],["خیر",0]] },
  { type:"reading", icon:"📖", title:"مطالعه کتاب", desc:"تعداد صفحه", input:true, placeholder:"مثلاً ۱۲" },
  { type:"sugar", icon:"🍬", title:"قند مصنوعی", desc:"امروز", options:[["مصرف نشد",1],["مصرف شد",0]] },
  { type:"dinner", icon:"🍽️", title:"زمان شام", desc:"چه ساعتی؟", time:true }
];

function fa(v){ return String(v).replace(/\d/g,d=>"۰۱۲۳۴۵۶۷۸۹"[d]); }
function scoreText(v){
  const n=Number(v||0);
  let s=Number.isInteger(n)?String(n):n.toFixed(2).replace(/0+$/,"").replace(/\.$/,"");
  return fa(s);
}
function showToast(t){
  const e=document.getElementById("toast");
  e.textContent=t; e.classList.add("show");
  clearTimeout(window.__t);
  window.__t=setTimeout(()=>e.classList.remove("show"),2400);
}
function floatingScore(score,x,y){
  if(!score)return;
  const e=document.createElement("div");
  e.className="float-score";
  e.textContent=(score>0?"+":"")+scoreText(score);
  e.style.left=x+"px"; e.style.top=y+"px";
  e.style.color=score>0?"var(--positive)":"var(--negative)";
  document.body.appendChild(e);
  setTimeout(()=>e.remove(),850);
}
function isoDate(d){ return d.toISOString().slice(0,10); }
function parseISO(s){ const[y,m,d]=s.split("-").map(Number); return new Date(Date.UTC(y,m-1,d)); }
function toMinutes(t){ if(!t)return null; const[h,m]=t.split(":").map(Number); return h*60+m; }
function minutesToTime(mins){
  if(mins==null)return"";
  const h=Math.floor(mins/60)%24, m=mins%60;
  return String(h).padStart(2,"0")+":"+String(m).padStart(2,"0");
}
function monthRangeISO(iso){
  // Shamsi (Jalali) month range — not Gregorian
  const [y,m,d] = iso.split("-").map(Number);
  const j = jalaali.toJalaali(y, m, d);
  const days = jalaali.jalaaliMonthLength(j.jy, j.jm);
  const startG = jalaali.toGregorian(j.jy, j.jm, 1);
  const endG = jalaali.toGregorian(j.jy, j.jm, days);
  return {
    start: isoDate(new Date(Date.UTC(startG.gy, startG.gm - 1, startG.gd))),
    end: isoDate(new Date(Date.UTC(endG.gy, endG.gm - 1, endG.gd)))
  };
}
function jalaliLabel(iso){
  const[y,m,d]=iso.split("-").map(Number);
  const j=jalaali.toJalaali(y,m,d);
  return fa(j.jd)+" "+J_MONTHS[j.jm-1];
}

/* ===== SCORING ===== */
function calculateScore(type,value){
  value=Number(value);
  switch(type){
    case"water":
      // value from options: 2, 4, 6, 8
      if(value<=0) return 0;
      if(value<=2) return 0.5;   // ۱–۲ لیوان
      if(value<=4) return 0.6;   // ۲–۴ لیوان
      if(value<=6) return 0.7;   // ۴–۶ لیوان
      return 1.5;                // ۶–۸ لیوان
    case"sleep":
      // minutes from 00:00
      // قبل ۱۱ (<23:00) → +2
      // قبل ۱۲ (23:00–23:59) → +0.5
      // بعد ۱۲ (00:00–05:59) → -0.5
      if(value>=0 && value<360) return -0.5;      // بعد نیمه‌شب
      if(value>=1380 && value<1440) return 0.5;  // ۲۳:۰۰–۲۳:۵۹
      if(value<1380) return 2;                    // قبل از ۲۳:۰۰
      return -0.5;
    case"instagram": return value===1?1.5:0;
    case"sun": return value===1?1.5:0;
    case"solitude": return value===1?1.5:0;
    case"reading":
      if(value<=0) return 0;
      if(value===1) return 0.5;  // ۱ صفحه
      return 1;                  // بیشتر
    case"sugar": return value===1?2:-.5;
    case"dinner":
      if(value<1140) return 2;
      if(value<=1260) return 0.75;
      return 0;
    default: return 0;
  }
}
function genderKmFactor(){
  if(userGender==="female") return Number(kmFactorFemale)||1.15;
  if(userGender==="male") return Number(kmFactorMale)||1;
  return 1;
}
function exerciseCalc(w,a,r){
  const aerobicKm=(w/60)*0.08*a;
  const totalKm=aerobicKm+r;
  const factor=genderKmFactor();
  const caloriesRaw=totalKm*w;
  const calories=caloriesRaw*factor;
  const score=calories<100?0:calories<300?1:calories<=600?3:5;
  return{aerobicKm,totalKm,calories,caloriesRaw,factor,score};
}
async function loadGenderAndKmFactors(){
  if(!currentUser) return;
  try {
    const prof = await db.from("profiles").select("gender").eq("id", currentUser.id).maybeSingle();
    if (prof.data && prof.data.gender) userGender = prof.data.gender;
  } catch (e) { console.warn("gender", e); }
  try {
    const sett = await db.from("app_settings").select("key, value").in("key", ["km_factor_male","km_factor_female"]);
    (sett.data || []).forEach(r => {
      if (r.key === "km_factor_male") kmFactorMale = Number(r.value) || 1;
      if (r.key === "km_factor_female") kmFactorFemale = Number(r.value) || 1.15;
    });
  } catch (e) { console.warn("app_settings", e); }
}

/* ===== AUTH ===== */
function setMode(m){
  mode=m;
  document.getElementById("loginTab").classList.toggle("active",m==="login");
  document.getElementById("signupTab").classList.toggle("active",m==="signup");
  document.getElementById("nameBox").classList.toggle("hidden",m!=="signup");
  document.getElementById("authBtn").textContent=m==="signup"?"ساخت حساب":"ورود";
  document.getElementById("authError").textContent="";
  const gf=document.getElementById("signupFemale"); if(gf&&m!=="signup") gf.checked=false;
}
document.getElementById("loginTab").onclick=()=>setMode("login");
document.getElementById("signupTab").onclick=()=>setMode("signup");

document.getElementById("authForm").onsubmit=async e=>{
  e.preventDefault();
  const btn=document.getElementById("authBtn");
  const err=document.getElementById("authError");
  const email=document.getElementById("email").value.trim();

        try { await db.from("profiles").update({ gender }).eq("id", r.data.user.id); } catch (e) {}

    }else{
      r=await db.auth.signInWithPassword({email,password});

  }catch(x){
    const map={"Invalid login credentials":"ایمیل یا رمز اشتباه است.","User already registered":"این ایمیل قبلاً ثبت شده.","Password should be at least 6 characters.":"رمز حداقل ۶ کاراکتر."};
    err.textContent=map[x.message]||x.message;

/* ===== CALENDAR TOGGLE ===== */
document.getElementById("calToggle").onclick=()=>{
  calOpen=!calOpen;
  document.getElementById("calWrap").classList.toggle("open",calOpen);
};


function prevDayISO(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  const dt = new Date(Date.UTC(y, m - 1, d));
  dt.setUTCDate(dt.getUTCDate() - 1);
  return isoDate(dt);
}
function updateDayContext() {
  const el = document.getElementById("dayContext");
  const tx = document.getElementById("dayContextText");
  const btnY = document.getElementById("btnYesterday");
  if (!el || !tx) return;

  const lag = daysBetweenISO(selectedDate, todayDate);
  // lag 0 = today, 1 = yesterday, >1 = older past, <0 = future

  const btnT = document.getElementById("btnToday");
  if (btnY) {
    const yest = prevDayISO(todayDate);
    btnY.classList.toggle("hidden", selectedDate === yest);
  }
  if (btnT) {
    // وقتی روی امروز نیستی، دکمه برگشت به امروز
    btnT.classList.toggle("hidden", selectedDate === todayDate);
  }

  el.classList.remove("show", "yesterday", "past");
  if (lag === 1) {
    el.classList.add("show", "yesterday");
    tx.textContent = "در حال پر کردن روز قبل · ارفاق نظم هنوز فعاله";
  } else if (lag > 1) {
    el.classList.add("show", "past");
    tx.textContent = "روز دیگری غیر از امروز · برای این روز امتیاز نظم تعلق نمی‌گیرد";
  } else if (lag < 0) {
    el.classList.add("show", "past");
    tx.textContent = "روز آینده — هنوز قابل ثبت نیست";
  }
  // today: no banner
}

function updateCalLabel(){
  const label=selectedDate===todayDate ? "امروز" : jalaliLabel(selectedDate);
  document.getElementById("calDateLabel").textContent=label;
  updateDayContext();
}

/* ===== SHAMSI CALENDAR ===== */
function renderCalendar(){
  document.getElementById("calTitle").textContent=J_MONTHS[viewMonth-1]+" "+fa(viewYear);

  const g=jalaali.toGregorian(viewYear,viewMonth,1);
  const first=new Date(Date.UTC(g.gy,g.gm-1,g.gd));
  let startOffset=(first.getUTCDay()+1)%7;

  const daysInMonth=jalaali.jalaaliMonthLength(viewYear,viewMonth);
  const container=document.getElementById("calDays");
  container.innerHTML="";

  for(let i=0;i<startOffset;i++){
    const e=document.createElement("div");
    e.className="day empty";
    container.appendChild(e);
  }

  for(let d=1;d<=daysInMonth;d++){
    const btn=document.createElement("button");
    btn.className="day";
    btn.textContent=fa(d);

    const gDay=jalaali.toGregorian(viewYear,viewMonth,d);
    const iso=isoDate(new Date(Date.UTC(gDay.gy,gDay.gm-1,gDay.gd)));

    if(iso===todayDate) btn.classList.add("today");
    if(iso===selectedDate) btn.classList.add("selected");
    if(iso>todayDate) btn.classList.add("future");

    btn.onclick=()=>{
      if(iso>todayDate) return;
      selectedDate=iso;
      updateCalLabel();
      loadDayData();
      renderCalendar();
      // auto collapse after select
      calOpen=false;
      document.getElementById("calWrap").classList.remove("open");
    };
    container.appendChild(btn);
  }
}

document.getElementById("prevMonth").onclick=e=>{
  e.stopPropagation();
  viewMonth--;
  if(viewMonth<1){ viewMonth=12; viewYear--; }
  renderCalendar();
};
document.getElementById("nextMonth").onclick=e=>{
  e.stopPropagation();
  viewMonth++;
  if(viewMonth>12){ viewMonth=1; viewYear++; }
  renderCalendar();
};

/* ===== RENDER ITEMS ===== */
function renderItems(){
  const c=document.getElementById("items");
  c.innerHTML="";

  ITEMS.forEach(item=>{
    const card=document.createElement("article");
    card.className="item";
    const log=todayLogs.get(item.type);
    const sc=log?Number(log.score):0;

    let body="";
    if(item.options){
      body=`<div class="options">${item.options.map(([label,val])=>{
        const active=log&&Number(log.value)===val?"active":"";
        return `<button class="opt ${active}" data-val="${val}">${label}</button>`;
      }).join("")}</div>`;
    }else if(item.time){
      const t=log?minutesToTime(Number(log.value)):"";
      body=`<input type="time" class="time-input" value="${t}">`;
    }else if(item.input){
      const v=log?log.value:"";
      body=`<div class="input-row">
        <input type="number" inputmode="numeric" placeholder="${item.placeholder||""}" value="${v||""}">
        <button class="small-primary save-btn">ثبت</button>
      </div>`;
    }

    card.innerHTML=`
      <div class="item-top">
        <div>
          <div class="item-name"><span>${item.icon}</span>${item.title}</div>
          <div class="item-desc">${item.desc}</div>
        </div>
        <div class="item-score ${sc>0?"positive":sc<0?"negative":""}">${sc?(sc>0?"+":"")+scoreText(sc):""}</div>
      </div>${body}`;
    c.appendChild(card);

    if(item.options){
      card.querySelectorAll(".opt").forEach(btn=>{
        btn.onclick=e=>saveDailyLog(item.type,Number(btn.dataset.val),e);
      });
    }else if(item.time){
      const inp=card.querySelector("input");
      inp.onchange=e=>{
        const mins=toMinutes(inp.value);
        if(mins!=null) saveDailyLog(item.type,mins,e);
      };
    }else if(item.input){
      const inp=card.querySelector("input");
      card.querySelector(".save-btn").onclick=e=>{
        const val=Number(inp.value);
        if(isNaN(val)||val<0) return showToast("عدد معتبر وارد کن.");
        saveDailyLog(item.type,val,e);
      };
    }
  });

  renderExercise(c);
  renderMountain(c);
}

function renderExercise(c){

  card.className="item";
  card.dataset.full="1";
  const w=exerciseLog?.weight_kg??"";
  const a=exerciseLog?.aerobic_minutes??"";
  const r=exerciseLog?.running_km??"";
  const sc=exerciseLog?Number(exerciseLog.score):0;

  card.innerHTML=`
    <div class="item-top">
      <div>
        <div class="item-name"><span>🏃</span>ورزش</div>
        <div class="item-desc">وزن + هوازی + دویدن</div>
      </div>
      <div class="item-score ${sc>0?"positive":""}" id="exScore">${sc?"+"+scoreText(sc):""}</div>
    </div>
    <div class="exercise-grid">
      <div><label>وزن (کیلو)</label><input type="number" step="0.1" id="exW" class="time-input" value="${w}" placeholder="۷۲"></div>
      <div><label>هوازی (دقیقه)</label><input type="number" id="exA" class="time-input" value="${a}" placeholder="۰"></div>
      <div><label>دویدن (کیلومتر)</label><input type="number" step="0.1" id="exR" class="time-input" value="${r}" placeholder="۰"></div>
    </div>
    <div class="exercise-stats" id="exPreview"></div>
    <button class="small-primary" style="width:100%" id="saveEx">ثبت ورزش</button>`;
  c.appendChild(card);

  const preview=()=>{
    const ww=Number(document.getElementById("exW").value);
    const aa=Number(document.getElementById("exA").value)||0;
    const rr=Number(document.getElementById("exR").value)||0;
    if(!ww||ww<=0){ document.getElementById("exPreview").innerHTML=""; return; }
    const x=exerciseCalc(ww,aa,rr);
    document.getElementById("exPreview").innerHTML=
      `<span>معادل: <b>${fa(x.aerobicKm.toFixed(2))} km</b></span>
       <span>کل: <b>${fa(x.totalKm.toFixed(2))} km</b></span>

function shamsiWeekKey(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  const j = jalaali.toJalaali(y, m, d);
  // شنبه = شروع هفته شمسی تقریبی: day of week from gregorian
  const dt = new Date(Date.UTC(y, m - 1, d));
  // JS: 0=Sun ... 6=Sat. ایرانی: شنبه شروع → shift
  const dow = dt.getUTCDay(); // 0 Sun
  // days since Saturday: Sat=6 → 0, Sun=0 → 1, ... Fri=5 → 6
  const sinceSat = (dow + 1) % 7;
  const start = new Date(dt);
  start.setUTCDate(start.getUTCDate() - sinceSat);
  return start.toISOString().slice(0, 10);
}

async function updateBadges() {
  const row = document.getElementById("badgesRow");
  if (!row || !currentUser) return;

  try {
    const [logs, ex] = await Promise.all([
      db.from("daily_logs").select("log_date, score").eq("user_id", currentUser.id),
      db.from("exercise_logs").select("log_date, score").eq("user_id", currentUser.id)
    ]);

    const dayScore = {};
    (logs.data || []).forEach(r => {
      if (!r.log_date) return;
      dayScore[r.log_date] = (dayScore[r.log_date] || 0) + (Number(r.score) || 0);
    });
    (ex.data || []).forEach(r => {
      if (!r.log_date) return;
      dayScore[r.log_date] = (dayScore[r.log_date] || 0) + (Number(r.score) || 0);
    });

    // weeks: map weekStart → { sum, days: Set }
    const weeks = {};
    Object.keys(dayScore).forEach(iso => {
      const wk = shamsiWeekKey(iso);
      if (!weeks[wk]) weeks[wk] = { sum: 0, n: 0 };
      weeks[wk].sum += dayScore[iso];
      weeks[wk].n += 1;
    });

    const isGoodWeek = (w) => w && w.n >= 5 && (w.sum / w.n) >= 7;

    // consecutive good weeks ending at most recent week that has data or current week
    const weekStarts = Object.keys(weeks).sort();
    // build timeline of last ~12 week starts from today backwards
    const timeline = [];
    let cur = shamsiWeekKey(todayDate);
    for (let i = 0; i < 16; i++) {
      timeline.push(cur);
      // prev week = cur - 7 days
      const [y, m, d] = cur.split("-").map(Number);
      const dt = new Date(Date.UTC(y, m - 1, d));
      dt.setUTCDate(dt.getUTCDate() - 7);
      cur = dt.toISOString().slice(0, 10);
    }

    let streakWeeks = 0;
    for (const wk of timeline) {
      if (isGoodWeek(weeks[wk])) streakWeeks++;
      else {
        // allow current incomplete week to skip if not good yet
        if (wk === shamsiWeekKey(todayDate) && !isGoodWeek(weeks[wk])) continue;
        break;
      }
    }

    const earned = {
      w1: streakWeeks >= 1,
      w2: streakWeeks >= 2,
      w3: streakWeeks >= 3,
      m1: false,
      m2: false
    };

    // current shamsi month
    const jNow = jalaali.toJalaali(new Date().getFullYear(), new Date().getMonth() + 1, new Date().getDate());
    const monthDays = jalaali.jalaaliMonthLength(jNow.jy, jNow.jm);
    let mSum = 0, mN = 0;
    for (let d = 1; d <= monthDays; d++) {
      const g = jalaali.toGregorian(jNow.jy, jNow.jm, d);
      const iso = isoDate(new Date(Date.UTC(g.gy, g.gm - 1, g.gd)));
      if (iso > todayDate) break;
      if (dayScore[iso] !== undefined) {
        mSum += dayScore[iso];
        mN++;
      }
    }
    const mAvg = mN ? mSum / mN : 0;
    earned.m1 = mN >= 15 && mAvg >= 7;
    earned.m2 = mN >= 20 && mAvg >= 10;

    const order = ["w1", "w2", "w3", "m1", "m2"];
    row.innerHTML = order.map(id => {
      const b = BADGE_DEFS[id];
      const on = earned[id];
      return `<button type="button" class="badge-chip ${b.cls} ${on ? "" : "locked"}" data-badge="${id}">
        <span>${b.emoji}</span><span>${b.title}</span>
      </button>`;
    }).join("");

    row.querySelectorAll("[data-badge]").forEach(btn => {
      btn.onclick = () => showBadgeModal(btn.dataset.badge, earned[btn.dataset.badge]);
    });
  } catch (e) {
    console.warn("updateBadges", e);
  }
}

async function updateStreaks() {
  if (!currentUser) return;
  const elC = document.getElementById("streakCurrent");
  const elB = document.getElementById("streakBest");
  if (!elC || !elB) return;

  try {
    const [logs, ex, mt] = await Promise.all([
      db.from("daily_logs").select("log_date").eq("user_id", currentUser.id),
      db.from("exercise_logs").select("log_date").eq("user_id", currentUser.id),
      db.from("mountain_trips").select("trip_date").eq("user_id", currentUser.id)
    ]);

    const days = new Set();
    (logs.data || []).forEach(r => { if (r.log_date) days.add(r.log_date); });
    (ex.data || []).forEach(r => { if (r.log_date) days.add(r.log_date); });
    (mt.data || []).forEach(r => { if (r.trip_date) days.add(r.trip_date); });

    // تداوم فعلی: از امروز (یا اگر امروز خالی است از دیروز) به عقب
    let current = 0;
    let cursor = todayDate;
    if (!days.has(cursor)) cursor = prevDayISO(cursor);
    while (days.has(cursor)) {
      current++;
      cursor = prevDayISO(cursor);
    }

    // بهترین تداوم: بلندترین زنجیره متوالی
    const sorted = [...days].sort();
    let best = 0, run = 0, prev = null;
    for (const day of sorted) {
      if (prev && daysBetweenISO(prev, day) === 1) run++;
      else run = 1;
      if (run > best) best = run;
      prev = day;
    }

    elC.textContent = fa(current);
    elB.textContent = fa(best);
  } catch (e) {
    console.warn("updateStreaks", e);
  }
}

function animateScore(el, target){
  const start = Number(el.dataset.val || 0);
  const end = Number(target) || 0;
  el.dataset.val = end;
  const dur = 700;
  const t0 = performance.now();
  function frame(now){
    const p = Math.min(1, (now - t0) / dur);
    // easeOutCubic
    const e = 1 - Math.pow(1 - p, 3);
    const cur = start + (end - start) * e;
    el.textContent = scoreText(Math.round(cur * 100) / 100);
    if(p < 1) requestAnimationFrame(frame);
    else el.textContent = scoreText(end);
  }
  requestAnimationFrame(frame);
}

function updateScoreUI(){
  let total=0, count=0;
  todayLogs.forEach((l, type)=>{
    total+=Number(l.score)||0;
    if(type!=="discipline") count++;
  });
  if(exerciseLog){ total+=Number(exerciseLog.score)||0; count++; }

  const mBonus=mountainTrips.length>=3?1:0;
  total+=mBonus;
  total+=Number(latePenalty)||0;

  const el=document.getElementById("score");
  el.classList.toggle("positive",total>0);
  el.classList.toggle("negative",total<0);
  animateScore(el, total);
  const bar=document.getElementById("scoreBar");
  if(bar){
    // max theoretical ~20; map to bar width
    const pct=Math.min(100, Math.max(0, (Math.abs(total)/20)*100));
    bar.classList.remove("positive","negative");
    if(total>0) bar.classList.add("positive");
    else if(total<0) bar.classList.add("negative");
    // reset then fill for animation
    bar.style.width="0%";
    requestAnimationFrame(()=>{
      requestAnimationFrame(()=>{ bar.style.width=pct+"%"; });
    });
  }

  document.getElementById("itemsCount").textContent=fa(count)+" از ۱۰ آیتم";

  const discEl=document.getElementById("disciplineBadge");
  if(discEl){
    const has=todayLogs.has("discipline")&&Number(todayLogs.get("discipline")?.score)>0;
    discEl.textContent=has?"نظم +۱":"";
    discEl.style.color=has?"var(--positive)":"";
    discEl.style.fontSize="12px";
    discEl.style.fontWeight="700";
  }
  document.getElementById("latePenalty").textContent=latePenalty?`جریمه: ${scoreText(latePenalty)}`:"";
  document.getElementById("mountainBonus").textContent=mBonus?`سهم کوه: +${scoreText(mBonus)}`:"";
}

/* ===== نظم (مراجعه به‌موقع) — ارفاق یک‌روزه =====
   امتیاز +۱ برای روز D اگر دادهٔ آن روز در خودِ روز D یا روز D+1 ثبت شود.
   دیرتر از یک روز → بدون امتیاز نظم.
*/
function daysBetweenISO(a, b) {
  // a, b: YYYY-MM-DD → تعداد روز تقویمی (b - a)
  const [ay, am, ad] = a.split("-").map(Number);
  const [by, bm, bd] = b.split("-").map(Number);
  const ua = Date.UTC(ay, am - 1, ad);
  const ub = Date.UTC(by, bm - 1, bd);
  return Math.round((ub - ua) / 86400000);
}
function isTimelyLog(logDate) {
  if (!logDate || !todayDate) return false;
  if (logDate > todayDate) return false;
  const lag = daysBetweenISO(logDate, todayDate); // 0 = همان روز، 1 = فردا برای دیروز
  return lag === 0 || lag === 1;
}
async function ensureDisciplineBonus(logDate) {
  if (!isTimelyLog(logDate)) return null;
  // اگر از قبل ثبت شده، دست نزن
  if (logDate === selectedDate && todayLogs.has("discipline")) {
    const existing = todayLogs.get("discipline");
    if (Number(existing?.score) > 0) return existing;
  }
  try {
    const q = await db.rpc("save_daily_log", {
      p_log_date: logDate,
      p_item_type: "discipline",
      p_value: 1,
      p_score: 1
    });
    if (q.error) return null;
    if (logDate === selectedDate && q.data) {
      todayLogs.set("discipline", q.data);
    }
    return q.data;
  } catch (e) {
    return null;
  }
}

async function saveDailyLog(type,value,e){

async function resolveSession() {
  for (let i = 0; i < 15; i++) {
    try {
      const res = await db.auth.getSession();
      if (res.data && res.data.session && res.data.session.user) return res.data.session;
    } catch (e) { console.warn(e); }
    await new Promise(r => setTimeout(r, 80));
  }
  try {
    const gu = await db.auth.getUser();
    if (gu.data && gu.data.user) {
      const res = await db.auth.getSession();
      if (res.data && res.data.session) return res.data.session;
      return { user: gu.data.user };
    }
  } catch (e) { console.warn("getUser", e); }
  return null;
}

db.auth.onAuthStateChange(async (event, session) => {
  if (event === "INITIAL_SESSION") {
    __authInit = true;
    if (session && session.user) {
      try { await openApp(session.user); } catch (e) { console.warn(e); }
    } else if (!__appOpened) {
      showAuthShell();
    }
    return;
  }
  if (session && session.user && (event === "SIGNED_IN" || event === "TOKEN_REFRESHED")) {
    if (event === "TOKEN_REFRESHED" && __appOpened) return;
    try { await openApp(session.user); } catch (e) { console.warn(e); }
    return;
  }
  if (event === "SIGNED_OUT") {
    __appOpened = false;
    currentUser = null;
    showAuthShell();
    try {
      if (typeof hqlNavSetAdmin === "function") hqlNavSetAdmin(false);
      setMode("login");
    } catch (_) {}
  }
});

(async function bootSession() {
  try {
    const session = await resolveSession();
    if (session && session.user && !__appOpened) {
      await openApp(session.user);
      return;
    }
  } catch (e) {
    console.warn("bootSession", e);
  }
  if (!__appOpened && !__authInit) {
    await new Promise(r => setTimeout(r, 500));
  }
  if (!__appOpened) {
    const session = await resolveSession();
