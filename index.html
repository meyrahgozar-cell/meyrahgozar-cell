<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<link rel="icon" type="image/png" href="images/favicon.png">
<link rel="apple-touch-icon" href="images/favicon.png">
<title>HQL | زندگی با کیفیت</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/jalaali-js@1.2.8/dist/jalaali.min.js"></script>

<style>
:root {
  --bg: #05060a;
  --card: #0d1019;
  --card2: #131722;
  --border: rgba(180, 100, 255, 0.18);
  --text: #f0f2ff;
  --muted: #8b92b0;
  --neon: #b44cff;
  --neon2: #00f0ff;
  --positive: #00ff9d;
  --negative: #ff4d6d;
  --glow: 0 0 18px rgba(180, 76, 255, 0.3);
  --radius: 16px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  min-height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: "Vazirmatn", sans-serif;
  -webkit-font-smoothing: antialiased;
}

body {
  background:
    radial-gradient(ellipse 80% 50% at 20% -10%, rgba(180, 76, 255, 0.12), transparent),
    radial-gradient(ellipse 60% 40% at 90% 10%, rgba(0, 240, 255, 0.06), transparent),
    var(--bg);
  min-height: 100vh;
}

button, input { font: inherit; color: inherit; }
button { cursor: pointer; border: none; background: none; }
.hidden { display: none !important; }

/* AUTH */
.auth-page {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 20px;
}

.auth-card {
  width: min(400px, 100%);
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 22px;
  padding: 28px 24px;
  box-shadow: var(--glow), 0 20px 50px rgba(0,0,0,0.45);
}

.logo {
  font-size: 30px;
  font-weight: 800;
  background: linear-gradient(90deg, #b44cff, #00f0ff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 4px;
}

.subtitle { color: var(--muted); font-size: 13px; margin-bottom: 24px; }

.tabs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 5px;
  background: var(--card2);
  padding: 4px;
  border-radius: 12px;
  margin-bottom: 18px;
  border: 1px solid var(--border);
}

.tab {
  height: 40px;
  border-radius: 9px;
  color: var(--muted);
  font-weight: 600;
  font-size: 14px;
}

.tab.active {
  background: linear-gradient(135deg, rgba(180,76,255,0.28), rgba(0,240,255,0.12));
  color: var(--text);
}

.form { display: grid; gap: 10px; }
.label { font-size: 12px; color: var(--muted); }

.input {
  width: 100%;
  height: 46px;
  padding: 0 14px;
  border-radius: 11px;
  border: 1px solid var(--border);
  background: var(--card2);
  outline: none;
}

.input:focus {
  border-color: var(--neon);
  box-shadow: 0 0 0 2px rgba(180,76,255,0.15);
}

.btn-primary {
  height: 48px;
  border-radius: 12px;
  background: linear-gradient(135deg, #b44cff, #7b2fff);
  color: #fff;
  font-weight: 700;
  margin-top: 6px;
  box-shadow: 0 0 20px rgba(180,76,255,0.35);
}

.btn-primary:disabled { opacity: 0.55; }
.error { color: var(--negative); font-size: 13px; text-align: center; min-height: 18px; }

/* APP */
.app {
  max-width: 680px;
  margin: 0 auto;
  padding: 12px 12px 90px;
}

.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}

.brand {
  font-size: 20px;
  font-weight: 800;
  background: linear-gradient(90deg, #b44cff, #00f0ff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.header-actions { display: flex; gap: 7px; position: relative; }

.icon-btn {
  width: 40px;
  height: 40px;
  border-radius: 11px;
  background: var(--card);
  border: 1px solid var(--border);
  display: grid;
  place-items: center;
  font-size: 16px;
}

.menu {
  position: absolute;
  top: 48px;
  left: 0;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 6px;
  min-width: 140px;
  z-index: 60;
  box-shadow: var(--glow);
}

.menu button {
  width: 100%;
  text-align: right;
  padding: 11px 12px;
  border-radius: 9px;
  font-size: 13px;
}

.menu button:hover { background: rgba(180,76,255,0.12); }

/* STICKY SCORE */
.score-sticky {
  position: sticky;
  top: 0;
  z-index: 40;
  background: var(--bg);
  padding: 8px 0 10px;
  margin: 0 -4px;
}

.score-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 16px 18px;
  box-shadow: var(--glow);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.score-main { text-align: center; flex: 1; }
.score-label { font-size: 11px; color: var(--muted); margin-bottom: 2px; }

.score-value {
  font-size: 42px;
  font-weight: 800;
  line-height: 1;
  letter-spacing: -1px;
}

.score-value.positive { color: var(--positive); text-shadow: 0 0 16px rgba(0,255,157,0.35); }
.score-value.negative { color: var(--negative); text-shadow: 0 0 16px rgba(255,77,109,0.35); }

.score-meta {
  display: flex;
  flex-direction: column;
  gap: 5px;
  font-size: 12px;
  color: var(--muted);
  text-align: left;
}

/* COMPACT CALENDAR */
.cal-wrap {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  margin-bottom: 12px;
  overflow: hidden;
}

.cal-toggle {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 11px 14px;
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  gap: 10px;
}

.cal-toggle:hover { background: rgba(180,76,255,0.06); }

.cal-toggle-left {
  display: flex;
  align-items: center;
  gap: 8px;
}

.cal-date-label {
  color: var(--neon2);
  font-weight: 700;
}

.cal-chevron {
  font-size: 12px;
  color: var(--muted);
  transition: transform 0.2s;
}

.cal-wrap.open .cal-chevron {
  transform: rotate(180deg);
}

.cal-body {
  display: none;
  padding: 0 10px 12px;
  border-top: 1px solid var(--border);
}

.cal-wrap.open .cal-body {
  display: block;
}

.cal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 4px 8px;
}

.cal-title {
  font-weight: 700;
  font-size: 13px;
}

.cal-nav {
  display: flex;
  gap: 4px;
}

.cal-nav button {
  width: 30px;
  height: 30px;
  border-radius: 8px;
  background: var(--card2);
  border: 1px solid var(--border);
  font-size: 14px;
}

.weekdays {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 2px;
  margin-bottom: 4px;
  text-align: center;
  font-size: 10px;
  color: var(--muted);
}

.days {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 3px;
}

.day {
  aspect-ratio: 1;
  border-radius: 8px;
  display: grid;
  place-items: center;
  font-size: 12px;
  font-weight: 600;
  background: transparent;
  border: 1px solid transparent;
  color: var(--text);
  transition: 0.1s;
}

.day:hover:not(.empty):not(.future) {
  border-color: var(--border);
  background: var(--card2);
}

.day.today {
  border-color: var(--neon2);
  color: var(--neon2);
}

.day.selected {
  background: linear-gradient(135deg, rgba(180,76,255,0.4), rgba(0,240,255,0.18));
  border-color: var(--neon);
  box-shadow: 0 0 10px rgba(180,76,255,0.25);
  color: #fff;
}

.day.empty { visibility: hidden; }
.day.future { opacity: 0.28; pointer-events: none; }

.streaks {
  display: flex;
  gap: 8px;
  justify-content: center;
  margin: 8px 0 12px;
  font-size: 12px;
  color: var(--muted);
}

.streaks span {
  background: var(--card2);
  padding: 5px 11px;
  border-radius: 16px;
  border: 1px solid var(--border);
}

/* ITEMS */
.items {
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
}
@media (min-width: 640px) {
  .items {
    grid-template-columns: 1fr 1fr;
  }
  .item[data-full] {
    grid-column: 1 / -1;
  }
}

.item {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
  transition: border-color 0.15s, box-shadow 0.15s, transform 0.15s;
}
.item:active {
  transform: scale(0.995);
}
.item:hover {
  border-color: rgba(180,76,255,0.35);
  box-shadow: 0 0 16px rgba(180,76,255,0.1);
}

.item-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 10px;
}

.item-name {
  font-weight: 700;
  font-size: 14px;
  display: flex;
  align-items: center;
  gap: 7px;
}

.item-desc { font-size: 11px; color: var(--muted); margin-top: 2px; }

.item-score {
  font-weight: 700;
  font-size: 14px;
  min-width: 36px;
  text-align: left;
}

.item-score.positive { color: var(--positive); }
.item-score.negative { color: var(--negative); }

.options {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 7px;
}
.options .opt {
  text-align: center;
  width: 100%;
}
@media (max-width: 380px) {
  .options { grid-template-columns: 1fr; }
}

.opt {
  padding: 7px 12px;
  border-radius: 9px;
  background: var(--card2);
  border: 1px solid var(--border);
  font-size: 12px;
}

.opt.active {
  border-color: var(--neon);
  background: rgba(180,76,255,0.18);
  color: var(--neon2);
}

.input-row { display: flex; gap: 7px; }

.input-row input, .time-input {
  flex: 1;
  height: 40px;
  padding: 0 12px;
  border-radius: 9px;
  border: 1px solid var(--border);
  background: var(--card2);
  outline: none;
  color-scheme: dark;
}

.input-row input:focus, .time-input:focus {
  border-color: var(--neon);
}

.small-primary {
  height: 40px;
  padding: 0 16px;
  border-radius: 9px;
  background: linear-gradient(135deg, #b44cff, #7b2fff);
  color: #fff;
  font-weight: 600;
  font-size: 12px;
  white-space: nowrap;
}

.exercise-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 10px;
}
.exercise-grid > div:last-child {
  grid-column: 1 / -1;
}

.exercise-grid label {
  font-size: 11px;
  color: var(--muted);
  display: block;
  margin-bottom: 3px;
}

.exercise-stats {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  font-size: 11px;
  color: var(--muted);
  margin-bottom: 10px;
}

.exercise-stats b { color: var(--neon2); }

.mountain-status {
  margin-top: 8px;
  font-size: 11px;
  color: var(--muted);
  text-align: center;
}

/* Toast */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(70px);
  background: var(--card);
  border: 1px solid var(--border);
  padding: 11px 18px;
  border-radius: 12px;
  font-size: 13px;
  box-shadow: var(--glow);
  z-index: 100;
  opacity: 0;
  transition: 0.25s;
  pointer-events: none;
}

.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

.float-score {
  position: fixed;
  font-weight: 800;
  font-size: 17px;
  pointer-events: none;
  z-index: 200;
  animation: floatUp 0.85s ease-out forwards;
}

@keyframes floatUp {
  0% { opacity: 1; transform: translateY(0); }
  100% { opacity: 0; transform: translateY(-45px); }
}

@media (max-width: 640px) {
  .app { padding: 10px 10px 80px; }
  .score-value { font-size: 36px; }
  .score-card { padding: 14px 12px; gap: 8px; }
  .score-meta { font-size: 11px; }
  .exercise-grid { grid-template-columns: 1fr; }
  .item { padding: 12px; border-radius: 14px; }
  .item-name { font-size: 13px; }
  .item-desc { font-size: 11px; }
  .options { gap: 6px; }
  .opt { padding: 8px 11px; font-size: 12px; text-align: center; }
  .cal-toggle { padding: 10px 12px; font-size: 13px; }
  .streaks { flex-wrap: wrap; gap: 6px; }
  .streaks span { font-size: 11px; padding: 5px 10px; }
  .header { margin-bottom: 10px; }
  .brand { font-size: 18px; }
  .icon-btn { width: 38px; height: 38px; }
}

@media (max-width: 380px) {
  .score-value { font-size: 32px; }
  .summary { /* n/a on index */ }
}

/* Score fill animation */
.score-bar-track {
  width: 100%;
  height: 6px;
  background: var(--card2);
  border-radius: 99px;
  margin-top: 12px;
  overflow: hidden;
  border: 1px solid var(--border);
}
.score-bar-fill {
  height: 100%;
  width: 0%;
  border-radius: 99px;
  background: linear-gradient(90deg, #b44cff, #00f0ff);
  box-shadow: 0 0 12px rgba(180, 76, 255, 0.5);
  transition: width 0.9s cubic-bezier(0.22, 1, 0.36, 1);
}
.score-bar-fill.positive {
  background: linear-gradient(90deg, #00c878, #00ff9d);
  box-shadow: 0 0 12px rgba(0, 255, 157, 0.4);
}
.score-bar-fill.negative {
  background: linear-gradient(90deg, #ff4d6d, #ff8a9a);
  box-shadow: 0 0 12px rgba(255, 77, 109, 0.4);
}
.score-value {
  transition: none;
}


.theme-btn {
  padding: 0;
  overflow: hidden;
  position: relative;
  background: #fff;
  border: 1px solid rgba(180, 100, 255, 0.28);
  box-shadow:
    0 0 10px rgba(180, 76, 255, 0.12);
}
.theme-btn::before {
  content: none;
}
.theme-icon {
  width: 20px;
  height: 20px;
  object-fit: contain;
  border-radius: 5px;
  display: block;
  position: relative;
  z-index: 1;
  background: #fff;
  filter: none;
  opacity: 1;
  transition: transform 0.25s ease, box-shadow 0.25s ease;
}
.theme-btn:hover {
  border-color: rgba(0, 240, 255, 0.4);
  box-shadow: 0 0 14px rgba(180, 76, 255, 0.22);
}
.theme-btn:hover .theme-icon {
  transform: scale(1.06);
}
.theme-btn:active .theme-icon {
  transform: scale(0.94);
}

</style>
</head>
<body>

<!-- AUTH -->
<div id="authPage" class="auth-page">
  <div class="auth-card">
    <div class="logo">HQL</div>
    <div class="subtitle">زندگی با کیفیت • هر روز یک قدم بهتر</div>
    <div class="tabs">
      <button class="tab active" id="loginTab">ورود</button>
      <button class="tab" id="signupTab">ثبت‌نام</button>
    </div>
    <form class="form" id="authForm">
      <div id="nameBox" class="hidden">
        <div class="label">نام نمایشی</div>
        <input class="input" id="displayName" placeholder="مثلاً میراح" autocomplete="name">
      </div>
      <div class="label">ایمیل</div>
      <input class="input" id="email" type="email" placeholder="you@example.com" autocomplete="email" required>
      <div class="label">رمز عبور</div>
      <input class="input" id="password" type="password" placeholder="حداقل ۶ کاراکتر" autocomplete="current-password" required>
      <div class="error" id="authError"></div>
      <button type="submit" class="btn-primary" id="authBtn">ورود</button>
    </form>
  </div>
</div>

<!-- APP -->
<div id="app" class="app hidden">
  <header class="header">
    <div class="brand">HQL</div>
    <div class="header-actions">
      <button class="icon-btn hidden" id="adminButton" title="ادمین">🛡️</button>
      <button class="icon-btn" id="reportButton" title="گزارش">📊</button>
      <button class="icon-btn theme-btn" id="themeButton" title="تم" aria-label="تم">
        <img src="images/favicon.png" alt="" class="theme-icon" width="22" height="22">
      </button>
      <button class="icon-btn" id="userButton" title="کاربر">👤</button>
      <div id="menu" class="menu hidden">
        <button id="logoutButton">خروج</button>
      </div>
    </div>
  </header>

  <!-- STICKY SCORE -->
  <div class="score-sticky">
    <section class="score-card">
      <div class="score-row-inner" style="display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%">
        <div class="score-main">
          <div class="score-label">امتیاز روز</div>
          <div id="score" class="score-value">۰</div>
        </div>
        <div class="score-meta">
          <div id="itemsCount">۰ از ۱۰ آیتم</div>
          <div id="latePenalty"></div>
          <div id="mountainBonus"></div>
        </div>
      </div>
      <div class="score-bar-track">
        <div id="scoreBar" class="score-bar-fill"></div>
      </div>
    </section>
  </div>

  <!-- COMPACT COLLAPSIBLE CALENDAR -->
  <div class="cal-wrap" id="calWrap">
    <button class="cal-toggle" id="calToggle">
      <div class="cal-toggle-left">
        <span>📅</span>
        <span class="cal-date-label" id="calDateLabel">امروز</span>
      </div>
      <span class="cal-chevron">▼</span>
    </button>
    <div class="cal-body">
      <div class="cal-header">
        <div class="cal-nav">
          <button id="prevMonth">‹</button>
        </div>
        <div class="cal-title" id="calTitle">—</div>
        <div class="cal-nav">
          <button id="nextMonth">›</button>
        </div>
      </div>
      <div class="weekdays">
        <div>ش</div><div>ی</div><div>د</div><div>س</div><div>چ</div><div>پ</div><div>ج</div>
      </div>
      <div class="days" id="calDays"></div>
    </div>
  </div>

  <div class="streaks">
    <span>🔥 تداوم: <b id="streakCurrent">۰</b> روز</span>
    <span>🏆 بهترین: <b id="streakBest">۰</b> روز</span>
  </div>

  <div class="items" id="items"></div>
</div>

<div id="toast" class="toast"></div>

<script>
const SUPABASE_URL = "https://zlvsmjhwyzfdecfyhxal.supabase.co";
const SUPABASE_KEY = "sb_publishable_dwpPjAJGmMQbwXdqLeeQ4Q_CSEca0cm";

const ITEMS = [
  { type:"water", icon:"💧", title:"مصرف آب", desc:"فقط آب", options:[["۱–۲ لیوان",2],["۲–۴ لیوان",4],["۴–۶ لیوان",6],["۶–۸ لیوان",8]] },
  { type:"sleep", icon:"🌙", title:"زمان خواب دیشب", desc:"چه ساعتی؟", time:true },

  { type:"solitude", icon:"🧘", title:"۱۰ دقیقه خلوت", desc:"امروز", options:[["بله",1],["خیر",0]] },

  { type:"dinner", icon:"🍽️", title:"زمان شام", desc:"چه ساعتی؟", time:true }
];

function fa(v){ return String(v).replace(/\d/g,d=>"۰۱۲۳۴۵۶۷۸۹"[d]); }
function scoreText(v){
  const n=Number(v||0);
  let s=Number.isInteger(n)?String(n):n.toFixed(2).replace(/0+$/,"").replace(/\.$/,"");
  return fa(s);
}
function showToast(t){
  const e=document.getElementById("toast");
  e.textContent=t; e.classList.add("show");
  clearTimeout(window.__t);
  window.__t=setTimeout(()=>e.classList.remove("show"),2400);
}
function floatingScore(score,x,y){
  if(!score)return;
  const e=document.createElement("div");
  e.className="float-score";
  e.textContent=(score>0?"+":"")+scoreText(score);
  e.style.left=x+"px"; e.style.top=y+"px";
  e.style.color=score>0?"var(--positive)":"var(--negative)";
  document.body.appendChild(e);
  setTimeout(()=>e.remove(),850);
}
function isoDate(d){ return d.toISOString().slice(0,10); }
function parseISO(s){ const[y,m,d]=s.split("-").map(Number); return new Date(Date.UTC(y,m-1,d)); }
function toMinutes(t){ if(!t)return null; const[h,m]=t.split(":").map(Number); return h*60+m; }
function minutesToTime(mins){
  if(mins==null)return"";
  const h=Math.floor(mins/60)%24, m=mins%60;
  return String(h).padStart(2,"0")+":"+String(m).padStart(2,"0");
}
function monthRangeISO(iso){
  // Shamsi (Jalali) month range — not Gregorian
  const [y,m,d] = iso.split("-").map(Number);
  const j = jalaali.toJalaali(y, m, d);
  const days = jalaali.jalaaliMonthLength(j.jy, j.jm);
  const startG = jalaali.toGregorian(j.jy, j.jm, 1);
  const endG = jalaali.toGregorian(j.jy, j.jm, days);
  return {
    start: isoDate(new Date(Date.UTC(startG.gy, startG.gm - 1, startG.gd))),
    end: isoDate(new Date(Date.UTC(endG.gy, endG.gm - 1, endG.gd)))
  };
}
function jalaliLabel(iso){
  const[y,m,d]=iso.split("-").map(Number);
  const j=jalaali.toJalaali(y,m,d);
  return fa(j.jd)+" "+J_MONTHS[j.jm-1];
}

/* ===== SCORING ===== */
function calculateScore(type,value){
  value=Number(value);
  switch(type){
    case"water":
      // value from options: 2, 4, 6, 8
      if(value<=0) return 0;
      if(value<=2) return 0.5;   // ۱–۲ لیوان
      if(value<=4) return 0.6;   // ۲–۴ لیوان
      if(value<=6) return 0.7;   // ۴–۶ لیوان
      return 1.5;                // ۶–۸ لیوان
    case"sleep":
      // minutes from 00:00
      // قبل ۱۱ (<23:00) → +2
      // قبل ۱۲ (23:00–23:59) → +0.5
      // بعد ۱۲ (00:00–05:59) → -0.5
      if(value>=0 && value<360) return -0.5;      // بعد نیمه‌شب
      if(value>=1380 && value<1440) return 0.5;  // ۲۳:۰۰–۲۳:۵۹
      if(value<1380) return 2;                    // قبل از ۲۳:۰۰
      return -0.5;
    case"instagram": return value===1?1.5:0;
    case"sun": return value===1?1.5:0;
    case"solitude": return value===1?1.5:0;
    case"reading":
      if(value<=0) return 0;
      if(value===1) return 0.5;  // ۱ صفحه
      return 1;                  // بیشتر
    case"sugar": return value===1?2:-.5;
    case"dinner":
      if(value<1140) return 2;
      if(value<=1260) return 0.75;
      return 0;
    default: return 0;
  }
}
function exerciseCalc(w,a,r){
  const aerobicKm=(w/60)*0.08*a;
  const totalKm=aerobicKm+r;
  const calories=totalKm*w;
  const score=calories<100?0:calories<300?1:calories<=600?3:5;
  return{aerobicKm,totalKm,calories,score};
}

/* ===== AUTH ===== */
function setMode(m){
  mode=m;
  document.getElementById("loginTab").classList.toggle("active",m==="login");
  document.getElementById("signupTab").classList.toggle("active",m==="signup");
  document.getElementById("nameBox").classList.toggle("hidden",m!=="signup");
  document.getElementById("authBtn").textContent=m==="signup"?"ساخت حساب":"ورود";
  document.getElementById("authError").textContent="";
}
document.getElementById("loginTab").onclick=()=>setMode("login");
document.getElementById("signupTab").onclick=()=>setMode("signup");

document.getElementById("authForm").onsubmit=async e=>{
  e.preventDefault();
  const btn=document.getElementById("authBtn");
  const err=document.getElementById("authError");
  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value;
  const name=document.getElementById("displayName").value.trim();
  btn.disabled=true; err.textContent="";
  try{
    let r;
    if(mode==="signup"){
      if(!name) throw new Error("نام نمایشی را وارد کن.");
      r=await db.auth.signUp({email,password,options:{data:{display_name:name}}});
    }else{
      r=await db.auth.signInWithPassword({email,password});
    }
    if(r.error) throw r.error;
    if(r.data.session) await openApp(r.data.session.user);
    else showToast("حساب ساخته شد.");
  }catch(x){
    const map={"Invalid login credentials":"ایمیل یا رمز اشتباه است.","User already registered":"این ایمیل قبلاً ثبت شده.","Password should be at least 6 characters.":"رمز حداقل ۶ کاراکتر."};
    err.textContent=map[x.message]||x.message;
  }finally{ btn.disabled=false; }
};

/* ===== CALENDAR TOGGLE ===== */
document.getElementById("calToggle").onclick=()=>{
  calOpen=!calOpen;
  document.getElementById("calWrap").classList.toggle("open",calOpen);
};

function updateCalLabel(){
  const label=selectedDate===todayDate ? "امروز" : jalaliLabel(selectedDate);
  document.getElementById("calDateLabel").textContent=label;
}

/* ===== SHAMSI CALENDAR ===== */
function renderCalendar(){
  document.getElementById("calTitle").textContent=J_MONTHS[viewMonth-1]+" "+fa(viewYear);

  const g=jalaali.toGregorian(viewYear,viewMonth,1);
  const first=new Date(Date.UTC(g.gy,g.gm-1,g.gd));
  let startOffset=(first.getUTCDay()+1)%7;

  const daysInMonth=jalaali.jalaaliMonthLength(viewYear,viewMonth);
  const container=document.getElementById("calDays");
  container.innerHTML="";

  for(let i=0;i<startOffset;i++){
    const e=document.createElement("div");
    e.className="day empty";
    container.appendChild(e);
  }

  for(let d=1;d<=daysInMonth;d++){
    const btn=document.createElement("button");
    btn.className="day";
    btn.textContent=fa(d);

    const gDay=jalaali.toGregorian(viewYear,viewMonth,d);
    const iso=isoDate(new Date(Date.UTC(gDay.gy,gDay.gm-1,gDay.gd)));

    if(iso===todayDate) btn.classList.add("today");
    if(iso===selectedDate) btn.classList.add("selected");
    if(iso>todayDate) btn.classList.add("future");

    btn.onclick=()=>{
      if(iso>todayDate) return;
      selectedDate=iso;
      updateCalLabel();
      loadDayData();
      renderCalendar();
      // auto collapse after select
      calOpen=false;
      document.getElementById("calWrap").classList.remove("open");
    };
    container.appendChild(btn);
  }
}

document.getElementById("prevMonth").onclick=e=>{
  e.stopPropagation();
  viewMonth--;
  if(viewMonth<1){ viewMonth=12; viewYear--; }
  renderCalendar();
};
document.getElementById("nextMonth").onclick=e=>{
  e.stopPropagation();
  viewMonth++;
  if(viewMonth>12){ viewMonth=1; viewYear++; }
  renderCalendar();
};

/* ===== RENDER ITEMS ===== */
function renderItems(){
  const c=document.getElementById("items");
  c.innerHTML="";

  ITEMS.forEach(item=>{
    const card=document.createElement("article");
    card.className="item";
    const log=todayLogs.get(item.type);
    const sc=log?Number(log.score):0;

    let body="";
    if(item.options){
      body=`<div class="options">${item.options.map(([label,val])=>{
        const active=log&&Number(log.value)===val?"active":"";
        return `<button class="opt ${active}" data-val="${val}">${label}</button>`;
      }).join("")}</div>`;
    }else if(item.time){
      const t=log?minutesToTime(Number(log.value)):"";
      body=`<input type="time" class="time-input" value="${t}">`;
    }else if(item.input){
      const v=log?log.value:"";
      body=`<div class="input-row">
        <input type="number" inputmode="numeric" placeholder="${item.placeholder||""}" value="${v||""}">
        <button class="small-primary save-btn">ثبت</button>
      </div>`;
    }

    card.innerHTML=`
      <div class="item-top">
        <div>
          <div class="item-name"><span>${item.icon}</span>${item.title}</div>
          <div class="item-desc">${item.desc}</div>
        </div>
        <div class="item-score ${sc>0?"positive":sc<0?"negative":""}">${sc?(sc>0?"+":"")+scoreText(sc):""}</div>
      </div>${body}`;
    c.appendChild(card);

    if(item.options){
      card.querySelectorAll(".opt").forEach(btn=>{
        btn.onclick=e=>saveDailyLog(item.type,Number(btn.dataset.val),e);
      });
    }else if(item.time){
      const inp=card.querySelector("input");
      inp.onchange=e=>{
        const mins=toMinutes(inp.value);
        if(mins!=null) saveDailyLog(item.type,mins,e);
      };
    }else if(item.input){
      const inp=card.querySelector("input");
      card.querySelector(".save-btn").onclick=e=>{
        const val=Number(inp.value);
        if(isNaN(val)||val<0) return showToast("عدد معتبر وارد کن.");
        saveDailyLog(item.type,val,e);
      };
    }
  });

  renderExercise(c);
  renderMountain(c);
}

function renderExercise(c){
  const card=document.createElement("article");
  card.className="item";
  card.dataset.full="1";
  const w=exerciseLog?.weight_kg??"";
  const a=exerciseLog?.aerobic_minutes??"";
  const r=exerciseLog?.running_km??"";
  const sc=exerciseLog?Number(exerciseLog.score):0;

  card.innerHTML=`
    <div class="item-top">
      <div>
        <div class="item-name"><span>🏃</span>ورزش</div>
        <div class="item-desc">وزن + هوازی + دویدن</div>
      </div>
      <div class="item-score ${sc>0?"positive":""}" id="exScore">${sc?"+"+scoreText(sc):""}</div>
    </div>
    <div class="exercise-grid">
      <div><label>وزن (کیلو)</label><input type="number" step="0.1" id="exW" class="time-input" value="${w}" placeholder="۷۲"></div>
      <div><label>هوازی (دقیقه)</label><input type="number" id="exA" class="time-input" value="${a}" placeholder="۰"></div>
      <div><label>دویدن (کیلومتر)</label><input type="number" step="0.1" id="exR" class="time-input" value="${r}" placeholder="۰"></div>
    </div>
    <div class="exercise-stats" id="exPreview"></div>
    <button class="small-primary" style="width:100%" id="saveEx">ثبت ورزش</button>`;
  c.appendChild(card);

  const preview=()=>{
    const ww=Number(document.getElementById("exW").value);
    const aa=Number(document.getElementById("exA").value)||0;
    const rr=Number(document.getElementById("exR").value)||0;
    if(!ww||ww<=0){ document.getElementById("exPreview").innerHTML=""; return; }
    const x=exerciseCalc(ww,aa,rr);
    document.getElementById("exPreview").innerHTML=
      `<span>معادل: <b>${fa(x.aerobicKm.toFixed(2))} km</b></span>
       <span>کل: <b>${fa(x.totalKm.toFixed(2))} km</b></span>
       <span>کالری: <b>${fa(Math.round(x.calories))}</b></span>`;
  };
  ["exW","exA","exR"].forEach(id=>document.getElementById(id).oninput=preview);
  preview();
  document.getElementById("saveEx").onclick=saveExercise;
}

function renderMountain(c){
  const card=document.createElement("article");
  card.className="item";
  card.dataset.full="1";
  const count=mountainTrips.length;
  const hasToday=mountainTrips.some(t=>t.trip_date===selectedDate);

  card.innerHTML=`
    <div class="item-top">
      <div>
        <div class="item-name"><span>⛰️</span>کوهنوردی</div>
        <div class="item-desc">حداکثر ۳ بار در ماه</div>
      </div>
      <div class="item-score positive">${count?"+"+scoreText(count>=3?1:0):""}</div>
    </div>
    <button class="small-primary" style="width:100%" id="saveMt" ${hasToday?"disabled":""}>
      ${hasToday?"امروز ثبت شده":"امروز رفتم"}
    </button>
    <div class="mountain-status">این ماه ${fa(count)} از ۳ بار</div>`;
  c.appendChild(card);
  document.getElementById("saveMt").onclick=saveMountain;
}

/* ===== DATA ===== */
async function loadDayData(){
  if(!currentUser||!selectedDate) return;

  const [logs,ex,mt,pen]=await Promise.all([
    db.from("daily_logs").select("*").eq("user_id",currentUser.id).eq("log_date",selectedDate),
    db.from("exercise_logs").select("*").eq("user_id",currentUser.id).eq("log_date",selectedDate).maybeSingle(),
    db.from("mountain_trips").select("id,trip_date").eq("user_id",currentUser.id)
      .gte("trip_date",monthRangeISO(selectedDate).start)
      .lte("trip_date",monthRangeISO(selectedDate).end),
    db.from("daily_penalties").select("score").eq("user_id",currentUser.id).eq("log_date",selectedDate).maybeSingle()
  ]);

  todayLogs=new Map((logs.data||[]).map(r=>[r.item_type,r]));
  exerciseLog=ex.data||null;
  mountainTrips=mt.data||[];
  latePenalty=pen.data?.score||0;

  updateScoreUI();
  renderItems();
}


function animateScore(el, target){
  const start = Number(el.dataset.val || 0);
  const end = Number(target) || 0;
  el.dataset.val = end;
  const dur = 700;
  const t0 = performance.now();
  function frame(now){
    const p = Math.min(1, (now - t0) / dur);
    // easeOutCubic
    const e = 1 - Math.pow(1 - p, 3);
    const cur = start + (end - start) * e;
    el.textContent = scoreText(Math.round(cur * 100) / 100);
    if(p < 1) requestAnimationFrame(frame);
    else el.textContent = scoreText(end);
  }
  requestAnimationFrame(frame);
}

function updateScoreUI(){
  let total=0, count=0;
  todayLogs.forEach(l=>{ total+=Number(l.score)||0; count++; });
  if(exerciseLog){ total+=Number(exerciseLog.score)||0; count++; }

  const mBonus=mountainTrips.length>=3?1:0;
  total+=mBonus;
  total+=Number(latePenalty)||0;

  const el=document.getElementById("score");
  el.classList.toggle("positive",total>0);
  el.classList.toggle("negative",total<0);
  animateScore(el, total);
  const bar=document.getElementById("scoreBar");
  if(bar){
    // max theoretical ~20; map to bar width
    const pct=Math.min(100, Math.max(0, (Math.abs(total)/20)*100));
    bar.classList.remove("positive","negative");
    if(total>0) bar.classList.add("positive");
    else if(total<0) bar.classList.add("negative");
    // reset then fill for animation
    bar.style.width="0%";
    requestAnimationFrame(()=>{
      requestAnimationFrame(()=>{ bar.style.width=pct+"%"; });
    });
  }

  document.getElementById("itemsCount").textContent=fa(count)+" از ۱۰ آیتم";
  document.getElementById("latePenalty").textContent=latePenalty?`جریمه: ${scoreText(latePenalty)}`:"";
  document.getElementById("mountainBonus").textContent=mBonus?`سهم کوه: +${scoreText(mBonus)}`:"";
}

/* ===== SAVE ===== */
async function saveDailyLog(type,value,e){
  const score=calculateScore(type,value);
  const old=Number(todayLogs.get(type)?.score||0);
  const q=await db.rpc("save_daily_log",{
    p_log_date:selectedDate, p_item_type:type, p_value:value, p_score:score
  });
  if(q.error) return showToast("خطا: "+q.error.message);
  todayLogs.set(type,q.data);
  updateScoreUI();
  renderItems();
  if(e) floatingScore(score-old,e.clientX,e.clientY);
  showToast("ثبت شد ✓");
}

async function saveExercise(e){
  const w=Number(document.getElementById("exW").value);
  const a=Number(document.getElementById("exA").value)||0;
  const r=Number(document.getElementById("exR").value)||0;
  if(!w||w<=0) return showToast("وزن معتبر وارد کن.");
  const x=exerciseCalc(w,a,r);
  const old=Number(exerciseLog?.score||0);
  const q=await db.rpc("save_exercise_log",{
    p_log_date:selectedDate, p_weight_kg:w, p_aerobic_minutes:a, p_running_km:r
  });
  if(q.error) return showToast("خطا: "+q.error.message);
  exerciseLog=q.data;
  updateScoreUI();
  renderItems();
  floatingScore(x.score-old,e.clientX,e.clientY);
  showToast("ورزش ثبت شد ✓");
}

async function saveMountain(){
  if(selectedDate>todayDate) return showToast("آینده هنوز نرسیده.");
  const range=monthRangeISO(selectedDate);
  const q=await db.rpc("save_mountain_trip",{
    p_trip_date:selectedDate, p_month_start:range.start, p_month_end:range.end
  });
  if(q.error) return showToast(q.error.message);
  await loadDayData();
  showToast("کوهنوردی ثبت شد ✓");
}

/* ===== OPEN ===== */
async function openApp(user){
  currentUser=user;
  const now=new Date();
  todayDate=isoDate(now);
  selectedDate=todayDate;

  const j=jalaali.toJalaali(now.getFullYear(),now.getMonth()+1,now.getDate());
  viewYear=j.jy;
  viewMonth=j.jm;

  document.getElementById("authPage").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");

  updateCalLabel();
  renderCalendar();
  await loadDayData();
  try {
    const pr = await db.from("profiles").select("is_admin").eq("id", currentUser.id).maybeSingle();
    const adminBtn = document.getElementById("adminButton");
    if (adminBtn && pr.data && pr.data.is_admin) adminBtn.classList.remove("hidden");
    else if (adminBtn) adminBtn.classList.add("hidden");
  } catch (e) {}
}

db.auth.onAuthStateChange(async(event,session)=>{
  if(session&&(event==="SIGNED_IN"||event==="INITIAL_SESSION")) await openApp(session.user);
  if(event==="SIGNED_OUT"){
    document.getElementById("app").classList.add("hidden");
    document.getElementById("authPage").classList.remove("hidden");
    setMode("login");
  }
});

(async()=>{
  const r=await db.auth.getSession();
  if(r.data.session) await openApp(r.data.session.user);
})();
