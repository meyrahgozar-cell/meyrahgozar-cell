<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>HQL · تغذیه</title>
  <link rel="icon" href="images/favicon.png" type="image/png" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/jalaali-js@1.2.7/dist/jalaali.min.js"></script>
  <style>
    :root {
      --bg: #05060a;
      --card: #0d1019;
      --card2: #131722;
      --border: rgba(180, 100, 255, 0.18);
      --text: #f0f2ff;
      --muted: #8b92b0;
      --neon: #b44cff;
      --neon2: #00f0ff;
      --glow: 0 0 18px rgba(180, 76, 255, 0.3);
      --radius: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; background: var(--bg); color: var(--text); font-family: "Vazirmatn", "Tahoma", system-ui, sans-serif; }
    body {
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(180, 76, 255, 0.18), transparent),
        radial-gradient(ellipse 60% 40% at 100% 50%, rgba(0, 240, 255, 0.06), transparent);
    }
    .page { max-width: 680px; margin: 0 auto; padding: 12px 12px 100px; }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 12px;
    }
    .header .brand { flex: 0 0 auto; }
    .header .header-actions { flex: 0 0 auto; }
    .brand {
      font-size: 20px; font-weight: 800;
      background: linear-gradient(90deg, #b44cff, #00f0ff);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .page-label { font-size: 12px; font-weight: 700; color: var(--muted); white-space: nowrap; }
    .hidden { display: none !important; }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 14px; margin-bottom: 12px; box-shadow: var(--glow);
    }
    .card-title { font-size: 14px; font-weight: 800; margin-bottom: 10px; }

    /* calendar — same spirit as index */
    .cal-wrap {
      background: var(--card); border: 1px solid var(--border); border-radius: 14px;
      margin-bottom: 12px; overflow: hidden;
    }
    .day-context {
      display: none; align-items: center; gap: 8px; margin-bottom: 0;
      padding: 8px 12px; font-size: 11px; font-weight: 600; line-height: 1.35;
      border-bottom: 1px solid var(--border);
    }
    .day-context.show { display: flex; }
    .day-context.yesterday {
      color: #ffe0a0; background: linear-gradient(90deg, rgba(255,193,77,0.12), transparent);
    }
    .day-context.past {
      color: #ffb4c0; background: linear-gradient(90deg, rgba(255,77,109,0.1), transparent);
    }
    .dc-dot {
      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
      background: currentColor; box-shadow: 0 0 8px currentColor;
    }
    .day-nav-row {
      display: flex; align-items: center; gap: 8px; padding: 8px 10px 0;
    }
    .btn-yesterday, .btn-today {
      flex-shrink: 0; height: 42px; padding: 0 12px; border-radius: 12px;
      font-size: 12px; font-weight: 700; white-space: nowrap; cursor: pointer; font: inherit;
    }
    .btn-yesterday {
      border: 1px solid rgba(255, 193, 77, 0.45);
      background: linear-gradient(145deg, rgba(255, 193, 77, 0.2), rgba(255, 140, 50, 0.08));
      color: #ffe0a0;
    }
    .btn-today {
      border: 1px solid rgba(0, 240, 255, 0.4);
      background: linear-gradient(145deg, rgba(0, 240, 255, 0.15), rgba(180, 76, 255, 0.1));
      color: var(--neon2);
    }
    .cal-toggle {
      width: 100%; display: flex; align-items: center; justify-content: space-between;
      padding: 11px 14px; font-size: 14px; font-weight: 600; color: var(--text);
      gap: 10px; background: transparent; border: none; cursor: pointer; font: inherit;
    }
    .cal-toggle-left { display: flex; align-items: center; gap: 8px; }
    .cal-date-label { color: var(--neon2); font-weight: 700; }
    .cal-chevron { font-size: 12px; color: var(--muted); transition: transform 0.2s; }
    .cal-wrap.open .cal-chevron { transform: rotate(180deg); }
    .cal-body { display: none; padding: 0 10px 12px; border-top: 1px solid var(--border); }
    .cal-wrap.open .cal-body { display: block; }
    .cal-header {
      display: flex; align-items: center; justify-content: space-between; padding: 10px 4px 8px;
    }
    .cal-title { font-weight: 700; font-size: 13px; }
    .cal-nav button {
      width: 30px; height: 30px; border-radius: 8px; background: var(--card2);
      border: 1px solid var(--border); font-size: 14px; color: var(--text); cursor: pointer;
    }
    .weekdays {
      display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; margin-bottom: 4px;
      text-align: center; font-size: 10px; color: var(--muted);
    }
    .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
    .day {
      aspect-ratio: 1; border-radius: 8px; display: grid; place-items: center;
      font-size: 12px; font-weight: 600; background: transparent;
      border: 1px solid transparent; color: var(--text); cursor: pointer; font: inherit;
    }
    .day:hover:not(.empty):not(.future) { border-color: var(--border); background: var(--card2); }
    .day.today { border-color: var(--neon2); color: var(--neon2); }
    .day.selected {
      background: linear-gradient(135deg, rgba(180,76,255,0.4), rgba(0,240,255,0.18));
      border-color: var(--neon); box-shadow: 0 0 10px rgba(180,76,255,0.25); color: #fff;
    }
    .day.empty { visibility: hidden; }
    .day.future { opacity: 0.28; pointer-events: none; }

    .totals {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
      position: sticky; top: 0; z-index: 20; padding: 4px 0 12px;
      background: linear-gradient(180deg, var(--bg) 70%, transparent);
    }
    .tot {
      background: var(--card); border: 1px solid var(--border); border-radius: 14px;
      padding: 10px 8px; text-align: center;
    }
    .tot-val {
      font-size: 18px; font-weight: 800; color: var(--neon2);
      text-shadow: 0 0 12px rgba(0, 240, 255, 0.35); direction: ltr;
    }
    .tot-lbl { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .search-box {
      width: 100%; height: 44px; border-radius: 12px; border: 1px solid var(--border);
      background: var(--card2); color: var(--text); padding: 0 12px; font: inherit; font-size: 14px;
      margin-bottom: 10px;
    }
    .search-box:focus {
      outline: none; border-color: rgba(0, 240, 255, 0.45);
      box-shadow: 0 0 14px rgba(0, 240, 255, 0.15);
    }
    .row { display: flex; gap: 8px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
    .row input[type="number"] {
      width: 100px; height: 42px; border-radius: 12px; border: 1px solid var(--border);
      background: var(--card2); color: var(--text); padding: 0 10px; font: inherit; direction: ltr;
    }
    .btn {
      height: 42px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--border);
      background: var(--card2); color: var(--text); font: inherit; font-weight: 700; cursor: pointer;
    }
    .btn.primary {
      background: linear-gradient(135deg, rgba(180, 76, 255, 0.45), rgba(0, 240, 255, 0.25));
      border-color: rgba(180, 76, 255, 0.45); box-shadow: 0 0 16px rgba(180, 76, 255, 0.25);
    }
    .btn:disabled { opacity: 0.4; cursor: default; }
    .preview { font-size: 12px; color: var(--muted); margin-top: 8px; line-height: 1.5; }
    .preview strong { color: var(--text); }
    .log-list { display: flex; flex-direction: column; gap: 8px; }
    .log-row {
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
      padding: 10px 12px; border-radius: 12px; background: var(--card2);
      border: 1px solid var(--border); font-size: 13px;
    }
    .log-row .n { font-weight: 700; }
    .log-row .s { font-size: 11px; color: var(--muted); direction: ltr; }
    .log-row button {
      border: none; background: transparent; color: #ff4d6d; font-size: 16px; cursor: pointer; padding: 4px;
    }
    .empty { text-align: center; color: var(--muted); font-size: 13px; padding: 16px; }
    .toast {
      position: fixed; top: 58px; left: 50%; transform: translateX(-50%);
      max-width: min(340px, calc(100% - 24px)); padding: 10px 16px; border-radius: 14px;
      background: rgba(20, 22, 36, 0.85); border: 1px solid rgba(255,255,255,0.25);
      backdrop-filter: blur(12px); z-index: 10050; opacity: 0; transition: 0.25s;
      pointer-events: none; font-size: 13px; font-weight: 600;
    }
    .toast.show { opacity: 1; }
  

    .balance-card {
      background: linear-gradient(160deg, rgba(255,255,255,0.08), rgba(20,16,30,0.5));
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 16px;
      padding: 12px 14px;
      margin-bottom: 12px;
      backdrop-filter: blur(12px) saturate(1.3);
      -webkit-backdrop-filter: blur(12px) saturate(1.3);
    }
    .balance-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 6px;
      font-size: 12px;
      color: var(--muted);
    }
    .balance-val {
      font-size: 22px;
      font-weight: 800;
      direction: ltr;
      text-align: center;
      padding: 6px 0 2px;
      transition: color 0.35s ease, text-shadow 0.35s ease;
    }
    .balance-val.deficit {
      /* عدد منفی */
      color: #ff4d4d;
      background: linear-gradient(180deg, rgba(255, 80, 40, 0.2), rgba(120, 10, 0, 0.15));
      border-radius: 12px;
      text-shadow:
        0 0 12px rgba(255, 40, 0, 0.85),
        0 0 28px rgba(255, 80, 0, 0.55),
        0 0 48px rgba(255, 0, 0, 0.3);
      box-shadow:
        inset 0 1px 0 rgba(255, 200, 150, 0.25),
        0 0 20px rgba(255, 40, 0, 0.25);
      -webkit-background-clip: padding-box;
      filter: contrast(1.05);
    }
    .balance-val.surplus {
      color: #00ff9d;
      text-shadow: 0 0 16px rgba(0, 255, 157, 0.45);
    }
    .balance-val.neutral {
      color: #ffc14d;
      text-shadow: 0 0 14px rgba(255, 193, 77, 0.35);
    }
    .balance-hint { font-size: 11px; color: var(--muted); text-align: center; margin-top: 4px; }

    .card {
      background: linear-gradient(165deg, rgba(255,255,255,0.07), rgba(13,16,25,0.85));
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

  

    .food-scroll-shell {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.16);
      min-height: 120px;
      background: rgba(8, 10, 18, 0.25);
    }
    .food-neon-bg {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      display: grid;
      place-items: center;
      overflow: hidden;
    }
    .food-neon-hql {
      font-size: clamp(48px, 18vw, 88px);
      font-weight: 900;
      letter-spacing: 0.12em;
      color: rgba(200, 220, 255, 0.12);
      text-shadow:
        0 0 8px rgba(0, 240, 255, 0.15),
        0 0 24px rgba(180, 76, 255, 0.12);
      transform: translateZ(0);
      transition: text-shadow 0.12s linear, color 0.12s linear, opacity 0.12s linear;
      opacity: 0.35;
      user-select: none;
      will-change: text-shadow, opacity;
    }
    .food-list {
      position: relative;
      z-index: 1;
      max-height: 260px;
      overflow-y: auto;
      scrollbar-width: none;
      display: flex;
      flex-direction: column;
      gap: 7px;
      padding: 10px;
      -webkit-overflow-scrolling: touch;
    }
    .food-list::-webkit-scrollbar { display: none; }
    .food-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 9px 12px;
      border-radius: 14px;
      cursor: pointer;
      text-align: right;
      font: inherit;
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      background: linear-gradient(
        160deg,
        rgba(255, 255, 255, 0.28) 0%,
        rgba(255, 255, 255, 0.08) 42%,
        rgba(255, 255, 255, 0.03) 100%
      ) !important;
      border: 1px solid rgba(255, 255, 255, 0.42) !important;
      backdrop-filter: blur(28px) saturate(1.7) !important;
      -webkit-backdrop-filter: blur(28px) saturate(1.7) !important;
      box-shadow:
        0 4px 20px rgba(0, 0, 0, 0.15),
        inset 0 1px 0 rgba(255, 255, 255, 0.55),
        inset 0 -1px 0 rgba(255, 255, 255, 0.08);
    }
    .food-item .food-name { font-size: 12px; }
    .food-item .meta {
      font-size: 10px;
      color: var(--muted);
      direction: ltr;
      text-align: left;
      opacity: 0.9;
    }
    .food-item.selected, .food-item:active {
      border-color: rgba(200, 170, 255, 0.7) !important;
      background: linear-gradient(
        160deg,
        rgba(255, 255, 255, 0.34) 0%,
        rgba(180, 100, 255, 0.14) 50%,
        rgba(255, 255, 255, 0.05) 100%
      ) !important;
      box-shadow:
        0 0 20px rgba(180, 76, 255, 0.28),
        inset 0 1px 0 rgba(255, 255, 255, 0.6);
    }

  </style>
</head>
<body>
  <div class="page" id="app">
    <header class="header">
      <div class="brand">HQL</div>
      <div class="header-actions">
        <span class="page-label">تغذیه</span>
      </div>
    </header>

    <div class="cal-wrap" id="calWrap">
      <div id="dayContext" class="day-context" aria-live="polite">
        <span class="dc-dot"></span>
        <span id="dayContextText"></span>
      </div>
      <div class="day-nav-row">
        <button type="button" class="btn-yesterday" id="btnYesterday" title="رفتن به دیروز">دیروز ←</button>
        <button type="button" class="btn-today hidden" id="btnToday" title="برگشت به امروز">امروز →</button>
        <div style="flex:1;min-width:0">
          <button type="button" class="cal-toggle" id="calToggle">
            <div class="cal-toggle-left">
              <span>📅</span>
              <span class="cal-date-label" id="calDateLabel">امروز</span>
            </div>
            <span class="cal-chevron">▼</span>
          </button>
        </div>
      </div>
      <div class="cal-body">
        <div class="cal-header">
          <div class="cal-nav"><button type="button" id="prevMonth">‹</button></div>
          <div class="cal-title" id="calTitle">—</div>
          <div class="cal-nav"><button type="button" id="nextMonth">›</button></div>
        </div>
        <div class="weekdays">
          <div>ش</div><div>ی</div><div>د</div><div>س</div><div>چ</div><div>پ</div><div>ج</div>
        </div>
        <div class="days" id="calDays"></div>
      </div>
    </div>

    <div class="totals" id="totals">
      <div class="tot"><div class="tot-val" id="tCal">0</div><div class="tot-lbl">کالری</div></div>
      <div class="tot"><div class="tot-val" id="tFat">0</div><div class="tot-lbl">چربی g</div></div>
      <div class="tot"><div class="tot-val" id="tCarb">0</div><div class="tot-lbl">کربوهیدرات g</div></div>
    </div>

    <div class="balance-card" id="balanceCard">
      <div class="balance-top">
        <span>برآورد نیاز روز</span>
        <span id="baseCalLabel" style="direction:ltr">—</span>
      </div>
      <div class="balance-val neutral" id="balanceVal">—</div>
      <div class="balance-hint" id="balanceHint">با وزن و مشخصات حساب می‌شود</div>
    </div>

    <div class="card">
      <div class="card-title">افزودن خوراک</div>
      <input type="search" class="search-box" id="foodSearch" placeholder="جستجوی نام خوراک..." autocomplete="off" />
      <div class="food-scroll-shell" id="foodScrollShell">
        <div class="food-neon-bg" aria-hidden="true">
          <div class="food-neon-hql" id="foodNeonHql">HQL</div>
        </div>
        <div class="food-list" id="foodList"><div class="empty">در حال بارگذاری فهرست...</div></div>
      </div>
      <div class="row">
        <input type="number" id="grams" min="1" step="1" value="100" title="گرم" />
        <span style="font-size:12px;color:var(--muted)">گرم</span>
        <button type="button" class="btn primary" id="addBtn" disabled>ثبت</button>
      </div>
      <div class="preview" id="preview">خوراک را انتخاب کن</div>
    </div>

    <div class="card">
      <div class="card-title">ثبت‌های این روز</div>
      <div class="log-list" id="logList"><div class="empty">هنوز چیزی ثبت نشده</div></div>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    const SUPABASE_URL = "https://zlvsmjhwyzfdecfyhxal.supabase.co";
    const SUPABASE_KEY = "sb_publishable_dwpPjAJGmMQbwXdqLeeQ4Q_CSEca0cm";
    const db = window.__hqlDb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
    });
    window.db = db;

    const J_MONTHS = ["فروردین","اردیبهشت","خرداد","تیر","مرداد","شهریور","مهر","آبان","آذر","دی","بهمن","اسفند"];
    let currentUser = null;
    let foods = [];
    let foodFreq = {}; // شخصی
    let foodGlobal = {}; // سراسری از همه کاربران
    let selected = null;
    let todayDate = null;
    let selectedDate = null;
    let viewYear = null;
    let viewMonth = null;
    let calOpen = false;
    let userGender = null;
    let userWeight = null;
    let dayIntakeCal = 0;
    let dailyBaseCal = null;

    function fa(n) {
      return String(n).replace(/\d/g, d => "۰۱۲۳۴۵۶۷۸۹"[d]);
    }
    function isoDate(d) {
      return d.toISOString().slice(0, 10);
    }
    function showToast(t) {
      const el = document.getElementById("toast");
      el.textContent = t;
      el.classList.add("show");
      clearTimeout(el._h);
      el._h = setTimeout(() => el.classList.remove("show"), 2200);
    }
    function num(v) {
      const n = Number(v);
      return Number.isFinite(n) ? n : 0;
    }
    function jalaliLabel(iso) {
      const [y, m, d] = iso.split("-").map(Number);
      const j = jalaali.toJalaali(y, m, d);
      return fa(j.jd) + " " + J_MONTHS[j.jm - 1];
    }
    function prevDayISO(iso) {
      const [y, m, d] = iso.split("-").map(Number);
      const dt = new Date(Date.UTC(y, m - 1, d));
      dt.setUTCDate(dt.getUTCDate() - 1);
      return isoDate(dt);
    }
    function daysBetweenISO(a, b) {
      const [ay, am, ad] = a.split("-").map(Number);
      const [by, bm, bd] = b.split("-").map(Number);
      const da = Date.UTC(ay, am - 1, ad);
      const db_ = Date.UTC(by, bm - 1, bd);
      return Math.round((db_ - da) / 86400000);
    }

    function updateDayContext() {
      const el = document.getElementById("dayContext");
      const tx = document.getElementById("dayContextText");
      const btnY = document.getElementById("btnYesterday");
      const btnT = document.getElementById("btnToday");
      if (!el || !tx) return;
      const lag = daysBetweenISO(selectedDate, todayDate);
      if (btnY) {
        const yest = prevDayISO(todayDate);
        btnY.classList.toggle("hidden", selectedDate === yest);
      }
      if (btnT) btnT.classList.toggle("hidden", selectedDate === todayDate);

      el.classList.remove("show", "yesterday", "past");
      if (lag === 0) {
        tx.textContent = "";
        return;
      }
      if (lag === 1) {
        el.classList.add("show", "yesterday");
        tx.textContent = "در حال پر کردن روز قبل هستید";
        return;
      }
      if (lag > 1) {
        el.classList.add("show", "past");
        tx.textContent = "روز دیگری غیر از امروز · " + jalaliLabel(selectedDate);
      }
    }

    function updateCalLabel() {
      const label = selectedDate === todayDate ? "امروز" : jalaliLabel(selectedDate);
      document.getElementById("calDateLabel").textContent = label;
      updateDayContext();
    }

    function renderCalendar() {
      document.getElementById("calTitle").textContent = J_MONTHS[viewMonth - 1] + " " + fa(viewYear);
      const g = jalaali.toGregorian(viewYear, viewMonth, 1);
      const first = new Date(Date.UTC(g.gy, g.gm - 1, g.gd));
      const startOffset = (first.getUTCDay() + 1) % 7;
      const daysInMonth = jalaali.jalaaliMonthLength(viewYear, viewMonth);
      const container = document.getElementById("calDays");
      container.innerHTML = "";
      for (let i = 0; i < startOffset; i++) {
        const e = document.createElement("div");
        e.className = "day empty";
        container.appendChild(e);
      }
      for (let d = 1; d <= daysInMonth; d++) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "day";
        btn.textContent = fa(d);
        const gDay = jalaali.toGregorian(viewYear, viewMonth, d);
        const iso = isoDate(new Date(Date.UTC(gDay.gy, gDay.gm - 1, gDay.gd)));
        if (iso === todayDate) btn.classList.add("today");
        if (iso === selectedDate) btn.classList.add("selected");
        if (iso > todayDate) btn.classList.add("future");
        btn.onclick = () => {
          if (iso > todayDate) return;
          selectedDate = iso;
          updateCalLabel();
          renderCalendar();
          loadLogs();
          calOpen = false;
          document.getElementById("calWrap").classList.remove("open");
        };
        container.appendChild(btn);
      }
    }

    
    /** برآورد تقریبی نیاز روز از وزن و جنسیت (فعالیت معمولی، نه پزشکی) */
    function estimateDailyNeed(weightKg, gender) {
      const w = Number(weightKg);
      if (!w || w < 30 || w > 250) return null;
      // تقریبی سبک: مرد ≈ ۳۰، زن ≈ ۲۸ کیلوکالری بر کیلوگرم
      const k = gender === "female" ? 28 : gender === "male" ? 30 : 29;
      return Math.round(w * k);
    }

    async function loadBodyProfile() {
      userGender = null;
      userWeight = null;
      dailyBaseCal = null;
      if (!currentUser) return;
      try {
        const pr = await db.from("profiles").select("gender").eq("id", currentUser.id).maybeSingle();
        if (pr.data && pr.data.gender) userGender = String(pr.data.gender).toLowerCase();
      } catch (e) {}

      // آخرین وزن ثبت‌شده — چند نام ستون رایج
      try {
        const wt = await db.from("user_weights")
          .select("*")
          .eq("user_id", currentUser.id)
          .order("log_date", { ascending: false })
          .limit(1);
        if (!wt.error && wt.data && wt.data.length) {
          const row = wt.data[0];
          userWeight = Number(row.weight ?? row.weight_kg ?? row.value ?? row.kg) || null;
        }
      } catch (e) {}

      // اگر جدول وزن خالی بود، از آخرین exercise_logs
      if (userWeight == null) {
        try {
          const ex = await db.from("exercise_logs")
            .select("weight_kg, log_date")
            .eq("user_id", currentUser.id)
            .not("weight_kg", "is", null)
            .order("log_date", { ascending: false })
            .limit(1);
          if (!ex.error && ex.data && ex.data.length) {
            userWeight = Number(ex.data[0].weight_kg) || null;
          }
        } catch (e) {}
      }

      dailyBaseCal = estimateDailyNeed(userWeight, userGender);
      updateBalanceUI();
    }

    function updateBalanceUI() {
      const baseEl = document.getElementById("baseCalLabel");
      const valEl = document.getElementById("balanceVal");
      const hintEl = document.getElementById("balanceHint");
      if (!baseEl || !valEl) return;

      if (dailyBaseCal == null) {
        baseEl.textContent = "—";
        valEl.textContent = "—";
        valEl.className = "balance-val neutral";
        if (hintEl) hintEl.textContent = "وزنی ثبت نشده — در خانه وزن را وارد کن";
        return;
      }
      baseEl.textContent = dailyBaseCal + " kcal";
      if (baseEl && userWeight) {
        baseEl.title = "بر اساس وزن " + userWeight + " kg";
      }
      // تراز = دریافتی − برآورد ؛ منفی = کمتر خورده (سبز) ، مثبت = بیشتر (قرمز/کهربایی)
      const delta = Math.round((dayIntakeCal - dailyBaseCal) * 10) / 10;
      const sign = delta > 0 ? "+" : "";
      valEl.textContent = sign + delta;
      valEl.classList.remove("deficit", "surplus", "neutral");
      if (delta < 0) {
        valEl.classList.add("deficit");
        if (hintEl) hintEl.textContent = "کمتر از برآورد روز";
      } else if (delta > 0) {
        valEl.classList.add("surplus");
        if (hintEl) hintEl.textContent = "بیشتر از برآورد روز";
      } else {
        valEl.classList.add("neutral");
        if (hintEl) hintEl.textContent = "نزدیک برآورد روز";
      }
    }

    // آتش فقط پشت اسکرولر غذا
    function bindFoodListFire() {
      const list = document.getElementById("foodList");
      const neon = document.getElementById("foodNeonHql");
      if (!list || !neon) return;
      let lastY = list.scrollTop;
      let lastT = performance.now();
      let heat = 0;
      let idleTimer = null;
      function apply() {
        const h = Math.max(0, Math.min(1, heat));
        const a = 0.28 + h * 0.72;
        neon.style.opacity = String(a);
        neon.style.color = "rgba(210, 230, 255, " + (0.1 + h * 0.35) + ")";
        const c1 = 0.12 + h * 0.75;
        const c2 = 0.1 + h * 0.65;
        neon.style.textShadow =
          "0 0 " + (6 + h * 14) + "px rgba(0, 240, 255, " + c1 + ")," +
          "0 0 " + (18 + h * 36) + "px rgba(0, 240, 255, " + (c1 * 0.7) + ")," +
          "0 0 " + (28 + h * 50) + "px rgba(180, 76, 255, " + c2 + ")," +
          "0 0 " + (40 + h * 70) + "px rgba(180, 76, 255, " + (c2 * 0.55) + ")";
      }
      function cool() {
        heat *= 0.86;
        if (heat < 0.04) heat = 0;
        apply();
        if (heat > 0) idleTimer = setTimeout(cool, 70);
      }
      list.addEventListener("scroll", () => {
        const now = performance.now();
        const y = list.scrollTop;
        const dt = Math.max(12, now - lastT);
        const speed = Math.abs(y - lastY) / dt * 16;
        lastY = y;
        lastT = now;
        const target = Math.min(1, speed / 1.6);
        heat = Math.max(heat * 0.65, target);
        apply();
        clearTimeout(idleTimer);
        idleTimer = setTimeout(cool, 90);
      }, { passive: true });
      apply();
    }

    function scale(food, grams) {
      const k = num(grams) / 100;
      return {
        calories: Math.round(num(food.Calories) * k * 10) / 10,
        fat: Math.round(num(food.Fat) * k * 10) / 10,
        protein: Math.round(num(food.Protein) * k * 10) / 10,
        carbs: Math.round(num(food.Carbs) * k * 10) / 10,
        fiber: Math.round(num(food.Fiber) * k * 10) / 10,
        sugar: food.Sugar == null ? null : Math.round(num(food.Sugar) * k * 10) / 10
      };
    }

    function updatePreview() {
      const pv = document.getElementById("preview");
      const btn = document.getElementById("addBtn");
      if (!selected) {
        pv.textContent = "خوراک را انتخاب کن";
        btn.disabled = true;
        return;
      }
      const g = num(document.getElementById("grams").value) || 100;
      const s = scale(selected, g);
      pv.innerHTML = `<strong>${selected.Persian_Name}</strong> · ${fa(g)}g → کالری <strong>${s.calories}</strong> · چربی <strong>${s.fat}</strong> · کربو <strong>${s.carbs}</strong>`;
      btn.disabled = false;
    }

    function normFa(s) {
      return String(s || "")
        .replace(/\u0643/g, "\u06a9") // ك -> ک
        .replace(/\u0649/g, "\u06cc") // ى -> ی
        .replace(/\u064a/g, "\u06cc") // ي -> ی
        .replace(/\u0629/g, "\u0647") // ة -> ه
        .replace(/\u200c/g, "") // ZWNJ
        .trim()
        .toLowerCase();
    }
    
    function foodKey(f) {
      return String((f && (f.Persian_Name || f.Name_En)) || "").trim();
    }
    function personalFreq(f) {
      const k = foodKey(f);
      return foodFreq[k] || foodFreq[normFa(k)] || 0;
    }
    function globalFreq(f) {
      const k = foodKey(f);
      return foodGlobal[k] || foodGlobal[normFa(k)] || 0;
    }
    /** شخصی اول، بعد محبوب همه، بعد نام */
    function sortFoodsSmart(list) {
      return list.slice().sort((a, b) => {
        const pa = personalFreq(a), pb = personalFreq(b);
        if (pb !== pa) return pb - pa;
        const ga = globalFreq(a), gb = globalFreq(b);
        if (gb !== ga) return gb - ga;
        return foodKey(a).localeCompare(foodKey(b), "fa");
      });
    }
    async function loadFoodFreq() {
      foodFreq = {};
      foodGlobal = {};
      if (!currentUser) return;
      try {
        const { data } = await db.from("food_logs")
          .select("food_name")
          .eq("user_id", currentUser.id)
          .limit(2000);
        (data || []).forEach(r => {
          const n = String(r.food_name || "").trim();
          if (!n) return;
          foodFreq[n] = (foodFreq[n] || 0) + 1;
          foodFreq[normFa(n)] = (foodFreq[normFa(n)] || 0) + 1;
        });
      } catch (e) {}
      try {
        const { data: pop, error } = await db.rpc("get_popular_foods", { p_limit: 80 });
        if (!error && Array.isArray(pop)) {
          pop.forEach(r => {
            const n = String(r.food_name || "").trim();
            if (!n) return;
            const c = Number(r.use_count) || 0;
            foodGlobal[n] = c;
            foodGlobal[normFa(n)] = c;
          });
        }
      } catch (e) {}
    }
    function bumpFreq(name) {
      const n = String(name || "").trim();
      if (!n) return;
      foodFreq[n] = (foodFreq[n] || 0) + 1;
      foodFreq[normFa(n)] = (foodFreq[normFa(n)] || 0) + 1;
      foodGlobal[n] = (foodGlobal[n] || 0) + 1;
      foodGlobal[normFa(n)] = (foodGlobal[normFa(n)] || 0) + 1;
    }
    function renderFoodList(q) {
      const box = document.getElementById("foodList");
      const query = normFa(q);
      let list;
      if (query) {
        list = foods.filter(f => {
          const p = normFa(f.Persian_Name);
          const e = normFa(f.Name_En);
          return p.includes(query) || e.includes(query);
        });
        list = sortFoodsSmart(list).slice(0, 35);
      } else {
        // فقط خوراک‌های آشنا: اول شخصی، بعد محبوب همه — نه اول فایل JSON
        const personal = foods.filter(f => personalFreq(f) > 0);
        const globalOnly = foods.filter(f => personalFreq(f) === 0 && globalFreq(f) > 0);
        if (personal.length || globalOnly.length) {
          list = sortFoodsSmart(personal.concat(globalOnly)).slice(0, 28);
        } else {
          // کاربر جدید و هنوز محبوبیت سراسری نیست: چند نمونهٔ کوتاه نده — راهنما
          list = [];
        }
      }
      if (!list.length) {
        box.innerHTML = query
          ? `<div class="empty">موردی پیدا نشد</div>`
          : `<div class="empty">نام خوراک را بنویس تا پیدا شود<br/><span style="opacity:.75;font-size:11px">با استفادهٔ جمعی، پرتکرارها اینجا می‌آیند</span></div>`;
        return;
      }
      box.innerHTML = list.map(f => {
        const name = f.Persian_Name || f.Name_En || "—";
        const cal = num(f.Calories);
        const sel = selected && selected.Persian_Name === f.Persian_Name ? " selected" : "";
        const idx = foods.indexOf(f);
        return `<button type="button" class="food-item${sel}" data-i="${idx}">
          <span class="food-name">${name}</span>
          <span class="meta">${cal} kcal/100g</span>
        </button>`;
      }).join("");
      box.querySelectorAll(".food-item").forEach(btn => {
        btn.onclick = () => {
          selected = foods[+btn.dataset.i];
          renderFoodList(document.getElementById("foodSearch").value);
          updatePreview();
        };
      });
    }

    async function loadFoods() {
      try {
        const res = await fetch("foods.json", { cache: "no-store" });
        if (!res.ok) throw new Error("foods.json");
        const raw = await res.json();
        foods = Array.isArray(raw) ? raw : [];
        if (!foods.length) {
          document.getElementById("foodList").innerHTML = `<div class="empty">فهرست foods.json خالی است</div>`;
          return;
        }
        renderFoodList(document.getElementById("foodSearch").value || "");
      } catch (e) {
        document.getElementById("foodList").innerHTML =
          `<div class="empty">بارگذاری foods.json ناموفق بود — فایل را کنار food.html بگذار</div>`;
      }
    }

    async function loadLogs() {
      if (!currentUser || !selectedDate) return;
      const { data, error } = await db.from("food_logs")
        .select("*")
        .eq("user_id", currentUser.id)
        .eq("log_date", selectedDate)
        .order("created_at", { ascending: false });
      const box = document.getElementById("logList");
      if (error) {
        box.innerHTML = `<div class="empty">خطا در خواندن لاگ</div>`;
        return;
      }
      const rows = data || [];
      let cal = 0, fat = 0, carb = 0;
      rows.forEach(r => {
        cal += num(r.calories);
        fat += num(r.fat);
        carb += num(r.carbs);
      });
      dayIntakeCal = Math.round(cal * 10) / 10;
      document.getElementById("tCal").textContent = String(dayIntakeCal);
      document.getElementById("tFat").textContent = String(Math.round(fat * 10) / 10);
      document.getElementById("tCarb").textContent = String(Math.round(carb * 10) / 10);
      updateBalanceUI();

      if (!rows.length) {
        box.innerHTML = `<div class="empty">هنوز چیزی ثبت نشده</div>`;
        return;
      }
      box.innerHTML = rows.map(r => `
        <div class="log-row" data-id="${r.id}">
          <div>
            <div class="n">${r.food_name}</div>
            <div class="s">${num(r.grams)}g · ${num(r.calories)} kcal · F ${num(r.fat)} · C ${num(r.carbs)}</div>
          </div>
          <button type="button" data-del="${r.id}" title="حذف">✕</button>
        </div>
      `).join("");
      box.querySelectorAll("[data-del]").forEach(btn => {
        btn.onclick = async () => {
          await db.from("food_logs").delete().eq("id", btn.getAttribute("data-del")).eq("user_id", currentUser.id);
          loadLogs();
        };
      });
    }

    async function addLog() {
      if (!currentUser || !selected || !selectedDate) return;
      const g = num(document.getElementById("grams").value) || 100;
      const s = scale(selected, g);
      const { error } = await db.from("food_logs").insert({
        user_id: currentUser.id,
        log_date: selectedDate,
        food_name: selected.Persian_Name || selected.Name_En,
        grams: g,
        calories: s.calories,
        fat: s.fat,
        protein: s.protein,
        carbs: s.carbs,
        fiber: s.fiber,
        sugar: s.sugar
      });
      if (error) {
        showToast("خطا: " + (error.message || "ثبت نشد"));
        return;
      }
      showToast("ثبت شد");
      bumpFreq(selected.Persian_Name || selected.Name_En);
      selected = null;
      document.getElementById("grams").value = 100;
      renderFoodList(document.getElementById("foodSearch").value);
      updatePreview();
      loadLogs();
    }

    async function boot() {
      const now = new Date();
      todayDate = isoDate(now);
      selectedDate = todayDate;
      const j = jalaali.toJalaali(now.getFullYear(), now.getMonth() + 1, now.getDate());
      viewYear = j.jy;
      viewMonth = j.jm;

      let session = null;
      for (let i = 0; i < 12; i++) {
        const r = await db.auth.getSession();
        session = r.data && r.data.session;
        if (session) break;
        await new Promise(res => setTimeout(res, 80));
      }
      if (!session || !session.user) {
        location.href = "index.html";
        return;
      }
      currentUser = session.user;

      document.getElementById("calToggle").onclick = () => {
        calOpen = !calOpen;
        document.getElementById("calWrap").classList.toggle("open", calOpen);
      };
      document.getElementById("prevMonth").onclick = e => {
        e.stopPropagation();
        viewMonth--;
        if (viewMonth < 1) { viewMonth = 12; viewYear--; }
        renderCalendar();
      };
      document.getElementById("nextMonth").onclick = e => {
        e.stopPropagation();
        viewMonth++;
        if (viewMonth > 12) { viewMonth = 1; viewYear++; }
        renderCalendar();
      };
      document.getElementById("btnYesterday").onclick = () => {
        selectedDate = prevDayISO(todayDate);
        const [y, m, d] = selectedDate.split("-").map(Number);
        const jj = jalaali.toJalaali(y, m, d);
        viewYear = jj.jy; viewMonth = jj.jm;
        updateCalLabel();
        renderCalendar();
        loadLogs();
      };
      document.getElementById("btnToday").onclick = () => {
        selectedDate = todayDate;
        const jj = jalaali.toJalaali(now.getFullYear(), now.getMonth() + 1, now.getDate());
        viewYear = jj.jy; viewMonth = jj.jm;
        updateCalLabel();
        renderCalendar();
        loadLogs();
      };

      document.getElementById("foodSearch").oninput = e => renderFoodList(e.target.value);
      document.getElementById("grams").oninput = updatePreview;
      document.getElementById("addBtn").onclick = addLog;

      updateCalLabel();
      renderCalendar();
      await loadBodyProfile();
      await loadFoodFreq();
      await loadFoods();
      await loadLogs();
    }

    boot();
  </script>
  <script src="nav.js"></script>
</body>
